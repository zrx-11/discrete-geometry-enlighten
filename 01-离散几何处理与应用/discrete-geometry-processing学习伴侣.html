<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>《离散几何处理与应用》点化学习</title>
<style>
:root{
  --bg:#f7f7f8; --panel:#ffffff; --text:#1f2328; --muted:#6b7280;
  --accent:#2563eb; --accent-soft:#dbeafe; --border:#e5e7eb;
  --ok:#16a34a; --bad:#dc2626; --code-bg:#f3f4f6;
}
[data-theme="dark"]{
  --bg:#111318; --panel:#1a1d24; --text:#e5e7eb; --muted:#9ca3af;
  --accent:#60a5fa; --accent-soft:#1e3a5f; --border:#2d333d;
  --ok:#4ade80; --bad:#f87171; --code-bg:#20242c;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);line-height:1.7;font-size:15px}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
.layout{display:flex;min-height:100vh}
.sidebar{width:290px;flex:none;background:var(--panel);border-right:1px solid var(--border);
  padding:14px;position:sticky;top:0;height:100vh;overflow-y:auto}
.sidebar h1{font-size:17px;margin:2px 0 2px}
.sidebar .sub{font-size:12px;color:var(--muted);margin-bottom:10px}
#q{width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);margin-bottom:10px}
.nav-sec{font-size:12px;color:var(--muted);margin:12px 0 4px;text-transform:uppercase;letter-spacing:.4px}
.nav-item{display:block;padding:5px 10px;border-radius:6px;color:var(--text);font-size:14px}
.nav-item:hover{background:var(--accent-soft);text-decoration:none}
.nav-item.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav-item .done{float:right;color:var(--ok);font-size:12px}
#nav-toggle{display:none}
.main{flex:1;min-width:0;padding:28px 40px 80px;max-width:920px}
.page h1{font-size:26px;border-bottom:2px solid var(--border);padding-bottom:8px;margin-top:0}
.page h2{font-size:20px;margin-top:26px}
.page h3{font-size:17px;margin-top:22px}
.page table{border-collapse:collapse;width:100%;margin:12px 0;font-size:14px}
.page th,.page td{border:1px solid var(--border);padding:6px 10px;text-align:left}
.page th{background:var(--code-bg)}
.page code{background:var(--code-bg);padding:2px 5px;border-radius:4px;font-size:.9em}
.page pre{background:var(--code-bg);padding:12px;border-radius:8px;overflow-x:auto;font-size:13px}
.page pre code{background:none;padding:0}
.page blockquote{border-left:4px solid var(--accent);margin:12px 0;padding:6px 14px;background:var(--accent-soft);border-radius:0 6px 6px 0}
.page blockquote blockquote{border-color:var(--muted)}
.page img{max-width:100%}
.mermaid{background:var(--code-bg);padding:14px;border-radius:8px;overflow-x:auto;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;white-space:pre;color:var(--muted)}
.mermaid-hint{font-size:12px;color:var(--muted);margin:4px 0 14px}
svg{max-width:100%;height:auto}
.quiz-item{border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin:14px 0;background:var(--panel)}
.quiz-q{margin:0 0 8px;font-weight:500}
.quiz-opts label{display:block;padding:4px 0;cursor:pointer}
.quiz-blank{width:60%;padding:6px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text)}
.quiz-check{margin-top:10px;padding:6px 16px;border:none;border-radius:6px;background:var(--accent);color:#fff;cursor:pointer}
.quiz-feedback{margin-left:12px;font-size:13px}
.fb-ok{color:var(--ok)}.fb-bad{color:var(--bad)}
.quiz-explain{margin-top:8px;font-size:13px;color:var(--muted);border-top:1px dashed var(--border);padding-top:6px}
.flashcard{perspective:1200px;margin:24px auto;max-width:520px;cursor:pointer;user-select:none}
.fc-inner{position:relative;width:100%;height:240px;transform-style:preserve-3d;transition:transform .5s}
.flashcard.flip .fc-inner{transform:rotateY(180deg)}
.fc-front,.fc-back{position:absolute;inset:0;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;
  padding:22px;border-radius:14px;border:1px solid var(--border);background:var(--panel);font-size:16px;text-align:center}
.fc-back{transform:rotateY(180deg);background:var(--accent-soft);color:var(--text)}
.card-controls{display:flex;gap:14px;align-items:center;margin:12px 0;flex-wrap:wrap}
.card-actions{display:flex;gap:12px;justify-content:center}
.card-actions button{padding:8px 22px;border:none;border-radius:8px;cursor:pointer;font-size:14px}
#card-known-btn{background:var(--ok);color:#fff}
#card-again-btn{background:var(--bad);color:#fff}
.card-counts{color:var(--muted);font-size:13px}
.path-step{margin:8px 0;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--panel)}
.path-step.passed{border-color:var(--ok)}
#glossary-filter{width:100%;max-width:380px;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);margin-bottom:10px}
#glossary-list li{padding:6px 0;border-bottom:1px dashed var(--border)}
.glossary-ref{color:var(--muted);font-size:12px}
.search-hit{margin:10px 0}
.topbar{position:sticky;top:0;background:var(--bg);padding:8px 0;display:flex;justify-content:flex-end;z-index:10}
#theme-btn{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:8px;padding:5px 12px;cursor:pointer;white-space:nowrap}
#progress-bar{height:5px;background:var(--border);border-radius:3px;margin:8px 0;overflow:hidden}
#progress-bar>div{height:100%;width:0;background:var(--accent);transition:width .3s}
.empty{color:var(--muted);padding:20px 0}
@media print{.sidebar,.topbar,.quiz-actions,.card-actions,.card-controls{display:none!important}.main{max-width:none;padding:0}}
@media (max-width:760px){.sidebar{width:100%;height:auto;position:static;padding:10px 14px}
  #nav{display:none}.sidebar.open #nav{display:block}
  #nav-toggle{display:block;width:100%;padding:8px 10px;margin:4px 0;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:14px;text-align:left;cursor:pointer}
  .layout{flex-direction:column}.main{padding:16px}}
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <h1>《离散几何处理与应用》点化学习</h1>
    <div class="sub">从数学基础到 3D 打印与机器人：九章逐层拆到零基础能读</div>
    <div id="progress-bar"><div id="progress-fill"></div></div>
    <div class="sub" id="progress-label">进度 0%</div>
    <input id="q" type="search" placeholder="搜索章节 / 概念 / 术语 / 全文…">
    <nav id="nav"></nav>
  </aside>
  <main class="main">
    <div class="topbar"><button id="theme-btn">🌙 深色</button></div>
    <div id="view" class="page"></div>
  </main>
</div>
<script>
const DATA = {"manifest": {"slug": "discrete-geometry-processing", "title": "《离散几何处理与应用》点化学习", "subtitle": "从数学基础到 3D 打印与机器人：九章逐层拆到零基础能读", "book": {"title": "离散几何处理与应用", "author": "鲍虎军、黄劲、刘利刚", "source": ["离散几何处理与应用 (鲍虎军, 黄劲, 刘利刚) (扫描版, 351 页, 2020-11)"]}, "audience": "零基础（需高中向量与导数；前置缺口已补讲）", "goal": "系统掌握三角网格上的离散微分几何、重建、参数化、重网格化、形变与模拟，并能判断真实任务该选哪条技术路线", "learningPath": [{"step": "01", "title": "几何处理的数学基础", "chapterIds": ["ch01"], "checkpoint": "ch01 自测 ≥ 3/4，能写出余切权重表达式"}, {"step": "02", "title": "点云曲面重建与光顺", "chapterIds": ["ch02"], "checkpoint": "能讲清 ICP 两步交替为什么单调下降"}, {"step": "03", "title": "参数化与多分辨率表示", "chapterIds": ["ch03"], "checkpoint": "能解释参数化为什么翻转、QEM 误差怎么累加"}, {"step": "04", "title": "网格模型的重网格化", "chapterIds": ["ch04"], "checkpoint": "能画出方向场奇异点与 3/5 价顶点的对应"}, {"step": "05", "title": "三维形状分析", "chapterIds": ["ch05"], "checkpoint": "能说出 HKS 为什么等距不变"}, {"step": "06", "title": "网格曲面的形变", "chapterIds": ["ch06"], "checkpoint": "能写出梯度域形变的最小二乘形式"}, {"step": "07", "title": "弹性运动模拟", "chapterIds": ["ch07"], "checkpoint": "能解释 PBD 与隐式积分的关系"}, {"step": "08", "title": "基于机器学习的几何处理", "chapterIds": ["ch08"], "checkpoint": "能说出 PointNet 为什么能容忍点序"}, {"step": "09", "title": "新型几何处理应用", "chapterIds": ["ch09"], "checkpoint": "能列出 3D 打印的三类几何约束"}, {"step": "10", "title": "综合检验", "chapterIds": ["mix"], "checkpoint": "完成最终检验项目并给出技术报告"}], "chapters": [{"id": "ch01", "title": "第 1 章：几何处理的数学基础", "file": "chapters/ch01-数学基础.md", "difficulty": 1}, {"id": "ch02", "title": "第 2 章：点云曲面重建和光顺", "file": "chapters/ch02-重建与光顺.md", "difficulty": 2}, {"id": "ch03", "title": "第 3 章：网格曲面的参数化和多分辨率表示", "file": "chapters/ch03-参数化与多分辨率.md", "difficulty": 2}, {"id": "ch04", "title": "第 4 章：网格模型的重网格化", "file": "chapters/ch04-重网格化.md", "difficulty": 3}, {"id": "ch05", "title": "第 5 章：三维形状分析", "file": "chapters/ch05-形状分析.md", "difficulty": 2}, {"id": "ch06", "title": "第 6 章：网格曲面的形变", "file": "chapters/ch06-曲面形变.md", "difficulty": 2}, {"id": "ch07", "title": "第 7 章：弹性运动模拟", "file": "chapters/ch07-弹性模拟.md", "difficulty": 3}, {"id": "ch08", "title": "第 8 章：基于机器学习的几何处理", "file": "chapters/ch08-机器学习几何.md", "difficulty": 3}, {"id": "ch09", "title": "第 9 章：新型几何处理应用", "file": "chapters/ch09-新型应用.md", "difficulty": 1}, {"id": "mix", "title": "综合测验与最终检验", "file": "quiz.md", "difficulty": 2}], "concepts": [{"id": "c01", "title": "离散 Laplace 算子与余切权重", "file": "concepts/discrete-laplace.md", "chapterIds": ["ch01", "ch02", "ch03", "ch05", "ch06", "ch07"]}, {"id": "c02", "title": "离散高斯曲率与角度亏欠", "file": "concepts/gauss-curvature.md", "chapterIds": ["ch01", "ch04", "ch05"]}, {"id": "c03", "title": "样条家族：从三次样条到 NURBS", "file": "concepts/splines.md", "chapterIds": ["ch01", "ch03"]}, {"id": "c04", "title": "点云配准与 ICP", "file": "concepts/icp-registration.md", "chapterIds": ["ch02", "ch09"]}, {"id": "c05", "title": "Voronoi / Delaunay 与 Crust 系列重建", "file": "concepts/voronoi-crust.md", "chapterIds": ["ch01", "ch02"]}, {"id": "c06", "title": "Poisson 曲面重建", "file": "concepts/poisson-reconstruction.md", "chapterIds": ["ch02", "ch06", "ch07"]}, {"id": "c07", "title": "参数化：调和、共形与防翻转", "file": "concepts/parameterization.md", "chapterIds": ["ch03", "ch04"]}, {"id": "c08", "title": "QEM 简化与渐进网格", "file": "concepts/qem-progressive-mesh.md", "chapterIds": ["ch03"]}, {"id": "c09", "title": "方向场、周期跳跃与奇异点", "file": "concepts/cross-field.md", "chapterIds": ["ch04"]}, {"id": "c10", "title": "标架场与六面体重网格化", "file": "concepts/frame-field-hex.md", "chapterIds": ["ch04"]}, {"id": "c11", "title": "形状描述子与谱签名（HKS / WKS）", "file": "concepts/shape-descriptor.md", "chapterIds": ["ch05", "ch08"]}, {"id": "c12", "title": "网格分割与归一化割", "file": "concepts/mesh-segmentation.md", "chapterIds": ["ch05", "ch09"]}, {"id": "c13", "title": "蒙皮：LBS、DQS 与骨骼学习", "file": "concepts/skinning-lbs.md", "chapterIds": ["ch06"]}, {"id": "c14", "title": "梯度域形变与 ARAP", "file": "concepts/gradient-domain-arap.md", "chapterIds": ["ch06", "ch07"]}, {"id": "c15", "title": "弹性模拟：隐式积分、PBD 与子空间", "file": "concepts/elastic-simulation.md", "chapterIds": ["ch07"]}, {"id": "c16", "title": "稀疏、低秩与深度几何学习", "file": "concepts/sparse-and-deep.md", "chapterIds": ["ch08"]}], "glossary": [{"term": "离散化（Discretization）", "def": "把连续的曲面、微分、积分换成有限个点和面能表达、能计算的一整套做法", "chapterId": "ch01"}, {"term": "多边形网格曲面", "def": "顶点表记坐标、面片表记\"哪几个顶点连成一个面\"，拼出的分片平面曲面", "chapterId": "ch01"}, {"term": "顶点表 / 面片表", "def": "顶点表是一串坐标，面片表是一串顶点编号的组合", "chapterId": "ch01"}, {"term": "流形网格", "def": "每个顶点的邻域都像一小块平盘，没有自交、没有多余薄片的网格", "chapterId": "ch01"}, {"term": "亏格（genus）", "def": "曲面上\"洞\"的个数，甜甜圈是 1，球是 0", "chapterId": "ch01"}, {"term": "隐式曲面", "def": "用\"函数值等于零\"的点集来描述的曲面，没有顶点和面片", "chapterId": "ch01"}, {"term": "符号距离场（SDF）", "def": "空间每一点记录\"到曲面多远\"和\"在里还是在外\"", "chapterId": "ch01"}, {"term": "等值面", "def": "函数取值相同的点连成的面，SDF 的零等值面就是曲面本身", "chapterId": "ch01"}, {"term": "参数曲面", "def": "用两个参数 (u,v) 把一张平面片\"贴\"到空间曲面上", "chapterId": "ch01"}, {"term": "三次样条", "def": "分段的三次多项式，接缝处一阶、二阶导数都连续", "chapterId": "ch01"}, {"term": "自然边界条件", "def": "样条首末两端二阶导数取零的约定", "chapterId": "ch01"}, {"term": "埃尔米特样条", "def": "除了点，还给每点的切方向，因此能局部修改", "chapterId": "ch01"}, {"term": "Bézier 曲线", "def": "把控制点按 Bernstein 权重做加权平均得到的曲线", "chapterId": "ch01"}, {"term": "de Casteljau 算法", "def": "反复取两点中点来画 Bézier 曲线的数值方法", "chapterId": "ch01"}, {"term": "B-样条", "def": "Bézier 的局部版：改一个控制点只影响附近几段", "chapterId": "ch01"}, {"term": "有理样条（NURBS）", "def": "给控制点加权重再平均，能精确画出圆和圆锥", "chapterId": "ch01"}, {"term": "第一基本形式", "def": "曲面上的\"尺子\"，用来量切向长度和夹角", "chapterId": "ch01"}, {"term": "第二基本形式", "def": "曲面上的\"弯曲计\"，用来量沿法向弯了多少", "chapterId": "ch01"}, {"term": "主曲率", "def": "一点上沿两个互相垂直方向的最大、最小弯曲程度", "chapterId": "ch01"}, {"term": "高斯曲率", "def": "两个主曲率的乘积，反映\"像球还是像马鞍\"", "chapterId": "ch01"}, {"term": "平均曲率", "def": "两个主曲率的一半之和，反映\"整体鼓还是塌\"", "chapterId": "ch01"}, {"term": "脐点", "def": "两个主曲率相等的点，局部像球面", "chapterId": "ch01"}, {"term": "离散 Laplace 算子", "def": "把\"本点与邻居的加权平均之差\"写成矩阵，逐顶点计算", "chapterId": "ch01"}, {"term": "余切权重", "def": "用边所对角的余切给这条边加权，是离散 Laplace 的标准权重", "chapterId": "ch01"}, {"term": "角度亏欠", "def": "顶点一圈三角形的内角和与 2π 的差，即离散高斯曲率", "chapterId": "ch01"}, {"term": "离散高斯-博内定理", "def": "全网格角度亏欠求和 = 2π × 欧拉示性数", "chapterId": "ch01"}, {"term": "Hausdorff 距离", "def": "两个点集各自的\"最不像\"程度取大者，用来衡量两条曲面差多少", "chapterId": "ch01"}, {"term": "Voronoi 图", "def": "每个点分到一块\"离它最近\"的地盘", "chapterId": "ch01"}, {"term": "Delaunay 三角剖分", "def": "Voronoi 图的对偶：地盘相邻的点连成三角形", "chapterId": "ch01"}, {"term": "网格求交裁剪", "def": "让两个网格的三角形两两求交、切开、重新连边", "chapterId": "ch01"}, {"term": "无约束优化", "def": "只让目标函数变小，不加任何限制", "chapterId": "ch01"}, {"term": "牛顿法", "def": "用二阶导数（Hessian）直接跳到二次近似的最小点", "chapterId": "ch01"}, {"term": "带约束优化", "def": "在等式/不等式限制下找最优", "chapterId": "ch01"}, {"term": "KKT 条件", "def": "带约束问题最优解的\"必要条件\"，含互补松弛", "chapterId": "ch01"}, {"term": "点云配准", "def": "求一个变换把两片点云对齐", "chapterId": "ch02"}, {"term": "ICP", "def": "交替做\"找最近点对\"和\"解最优变换\"直到不再改善", "chapterId": "ch02"}, {"term": "刚性变换", "def": "只有旋转和平移，形状不变", "chapterId": "ch02"}, {"term": "非刚性配准", "def": "允许目标发生形变的配准", "chapterId": "ch02"}, {"term": "Crust 算法", "def": "借 Voronoi 顶点扩张采样集，再从 Delaunay 里挑出曲面三角形", "chapterId": "ch02"}, {"term": "极点（pole）", "def": "某采样点所在 Voronoi 单元里，离它最远、位于曲面两侧的两个顶点", "chapterId": "ch02"}, {"term": "Power Crust", "def": "用带权 Voronoi 处理采样不均匀的 Crust 变体", "chapterId": "ch02"}, {"term": "Cocone 算法", "def": "用锥形条件筛三角形，保证输出是流形", "chapterId": "ch02"}, {"term": "径向基函数（RBF）", "def": "以每个采样点为中心放一个\"钟形\"函数，叠加起来拟合曲面", "chapterId": "ch02"}, {"term": "Poisson 曲面重建", "def": "解 Poisson 方程，让指示函数的梯度等于采样法向场", "chapterId": "ch02"}, {"term": "Marching Cubes", "def": "在体素格上按符号变化挖出三角形，得到等值面", "chapterId": "ch02"}, {"term": "曲面光顺", "def": "抹掉高频噪声、保留大形状的操作", "chapterId": "ch02"}, {"term": "双边滤波", "def": "只有距离近、法向也接近的邻居才参与平均", "chapterId": "ch02"}, {"term": "参数化", "def": "给曲面上每个点一个平面坐标 (u,v)", "chapterId": "ch03"}, {"term": "调和映射", "def": "让参数化坐标满足拉普拉斯方程（离散下即坐标是邻居的加权平均）", "chapterId": "ch03"}, {"term": "共形 / 保角", "def": "只保角度不保面积；反过来叫保面积", "chapterId": "ch03"}, {"term": "翻转（flip）", "def": "摊平后三角形绕向反转或重叠", : "ch06"}, {"term": "变形图（cage / 体图）", "def": "包住模型的低模控制网格，用来传递形变", "chapterId": "ch06"}, {"term": "ARAP", "def": "让每个三角形尽量只旋转不拉伸的形状保持能量", "chapterId": "ch06"}, {"term": "局部-全局迭代", "def": "先固定旋转求位置、再固定位置求旋转，交替下降", "chapterId": "ch06"}, {"term": "子空间形变", "def": "只在少数基向量张成的空间里求未知量，以速度换精度", "chapterId": "ch06"}, {"term": "弹性运动模拟", "def": "按力与加速度的物理方程推进形状随时间变化", "chapterId": "ch07"}, {"term": "隐式积分", "def": "用后一时刻的力反推位移，大时间步也稳定", "chapterId": "ch07"}, {"term": "子空间降维", "def": "只用最低频的少量振动模态表示运动", "chapterId": "ch07"}, {"term": "PBD / 投影动力学", "def": "先预测位置，再把约束\"投影\"回满足约束的集合", "chapterId": "ch07"}, {"term": "碰撞检测", "def": "判断哪些三角形对相交", "chapterId": "ch07"}, {"term": "层次包围盒（BVH）", "def": "用一层层盒子把不可能相交的三角形成批排除", "chapterId": "ch07"}, {"term": "旋转-应变分解", "def": "把形变拆成旋转部分和拉伸部分，分别控制", "chapterId": "ch07"}, {"term": "稀疏编码", "def": "用字典里少数几个\"原子\"的加权和表示信号", "chapterId": "ch08"}, {"term": "字典学习", "def": "连\"原子\"本身也从数据里学出来", "chapterId": "ch08"}, {"term": "L1 正则", "def": "加一项\"系数绝对值之和\"的惩罚，逼出稀疏解", "chapterId": "ch08"}, {"term": "低秩优化", "def": "要求矩阵秩尽量小，等价于要求信息高度重复", "chapterId": "ch08"}, {"term": "压缩感知", "def": "信号本身稀疏时，少量测量即可恢复", "chapterId": "ch08"}, {"term": "PointNet", "def": "逐点提特征、再池化成全局向量的点云网络", "chapterId": "ch08"}, {"term": "流形卷积", "def": "在曲面上按测地距离聚合邻居，而不是按平面网格", "chapterId": "ch08"}, {"term": "生成模型（VAE/GAN）", "def": "学数据分布，并能采样出新的形状", "chapterId": "ch08"}, {"term": "重定向行走", "def": "用视觉增益、转向、传送让人在有限空间里以为走了很远", "chapterId": "ch09"}, {"term": "场景映射", "def": "把虚拟大场景\"折叠\"进真实小场地", "chapterId": "ch09"}, {"term": "可打印性", "def": "能支撑、能闭合、强度够、装得进打印空间", "chapterId": "ch09"}, {"term": "切片与路径规划", "def": "把模型切成一层层轮廓并规划打印头轨迹", "chapterId": "ch09"}], "patterns": {"file": "patterns.md"}, "cheatsheet": {"file": "cheatsheet.md"}, "quizzes": [{"id": "q01", "chapterId": "ch01", "type": "single", "question": "一个闭合球面网格的离散高斯曲率（角度亏欠）总和是多少？", "options": ["0", "2π", "4π", "与剖分密度成正比"], "answer": 2, "explain": "离散高斯-博内定理给出总和 = 2πχ，球面 χ = V − E + F = 2，因此 4π，与剖分无关。"}, {"id": "q02", "chapterId": "ch01", "type": "single", "question": "哪种表示能够精确表达一个圆？", "options": ["三次样条", "B-样条", "有理样条 NURBS", "均匀 B 样条"], "answer": 2, "explain": "非有理多项式样条只能逼近圆锥曲线；有理样条分子分母同为多项式，可精确表示圆、椭圆，并在投影变换下保持形式。"}, {"id": "q03", "chapterId": "ch01", "type": "blank", "question": "某顶点有 3 个邻居，每条边的余切权重和为 1.2，混合面积 A_i = 0.4。则离散 Laplace 前的系数 1/(2A_i) 为＿＿，Δx_i 等于该系数乘以＿＿。", "options": [], "answer": "1.25；Σ_j (x_j − x_i)", "explain": "1/(2×0.4) = 1.25；整个算子为 1.25 × 1.2 × Σ(x_j − x_i) = 1.5Σ(x_j − x_i)。"}, {"id": "q04", "chapterId": "ch01", "type": "blank", "question": "为什么三次样条\"C² 连续\"却\"不局部\"？", "options": [], "answer": "系数由覆盖全部控制点的线性系统联立求出，改一个控制点会改变方程组右端项，所有段都要重解。", "explain": "局部性取决于\"每段是否只依赖自己的数据\"。埃尔米特样条每段只由两个端点位置与切向决定，才真正局部。"}, {"id": "q05", "chapterId": "ch02", "type": "single", "question": "ICP 每轮迭代包含哪两步？", "options": ["特征提取与分类", "找最近点对应与解闭式最优变换", "三角化与抽等值面", "估法向与双边滤波"], "answer": 1, "explain": "ICP 的核心是\"对应—求解\"交替；它只是交替下降，因此只保证局部最优。"}, {"id": "q06", "chapterId": "ch02", "type": "single", "question": "Poisson 重建求解的方程是？", "options": ["∇f = 0", "Δf = ∇·V", "f 等于距离场", "∇×V = 0"], "answer": 1, "explain": "由\"求 f 使 ∇f ≈ V\"的最小二乘正规方程得到；左边是 Laplace，右边是法向场的散度。"}, {"id": "q07", "chapterId": "ch02", "type": "blank", "question": "Delaunay 三角剖分的\"最小角最大化\"性质带来的实际好处是＿＿；而显式重建方法最怕＿＿和＿＿。", "options": [], "answer": "三角形更接近正三角形、网格质量好，离散算子不会因钝角出现负权重；噪声；采样缺失（导致不水密）", "explain": "质量与算子稳定性直接相关；显式方法依赖精确的 Delaunay 结构，噪声与缺失会改变结构或留下无约束区域。"}, {"id": "q08", "chapterId": "ch02", "type": "blank", "question": "双边滤波为什么能保住棱线？", "options": [], "answer": "值域核按法向差异降权，跨棱邻居法向差别大，权重趋于零，几乎不参与平均。", "explain": "空间核决定\"看多远\"，值域核决定\"谁能参与\"。二者相乘后，跨棱平滑被自动抑制。"}, {"id": "q09", "chapterId": "ch03", "type": "single", "question": "Tutte 定理保证参数化不翻转的条件是？", "options": ["权重全为正、边界映射到凸多边形", "网格是闭合的", "使用余切权重", "三角形都接近等边"], "answer": 0, "explain": "闭合曲面还需先切开；余切权重可能为负，反而破坏前提。"}, {"id": "q10", "chapterId": "ch03", "type": "single", "question": "QEM 决定坍缩哪条边的依据是？", "options": ["边最长", "相邻三角形面积最大", "坍缩后到相关平面族的距离平方和最小", "顶点度数最高"], "answer": 2, "explain": "二次型可累加，坍缩后 Q = Q_i + Q_j，误差取该二次型的最小值。"}, {"id": "q11", "chapterId": "ch03", "type": "blank", "question": "Edgebreaker 用 5 个符号编码网格拓扑，其中 C 表示＿＿，S 表示＿＿。", "options": [], "answer": "进入一个未访问的三角形；遇到分叉、需要压栈记录", "explain": "L/R 表示左右转向、E 表示结束分支；5 个符号即可编码任意连通网格拓扑。"}, {"id": "q12", "chapterId": "ch03", "type": "blank", "question": "为什么参数化的扭曲能量很难优化？给出两个原因。", "options": [], "answer": "能量高度非凸（含奇异值、比值、障碍项），存在大量局部极小；防翻转约束使可行域边界附近能量趋无穷，步长必须很小。", "explain": "这也是为何工程上先用 Tutte 给初值、或用渐进参考三角形把大跳分解成小步。"}, {"id": "q13", "chapterId": "ch04", "type": "single", "question": "四边形全局参数化要求相邻片的坐标变换属于？", "options": ["任意仿射变换", "90° 整数倍旋转 + 整数平移", "仅平移", "相似变换"], "answer": 1, "explain": "只有这样才能保证公共边界上的整数格点重合，四边形顶点对齐。"}, {"id": "q14", "chapterId": "ch04", "type": "single", "question": "用 (cos 4θ, sin 4θ) 表示方向场的目的是？", "options": ["把方向归一化", "利用周期性消掉整数跳跃变量", "把向量场变成标量场", "限制角度范围"], "answer": 1, "explain": "旋转 90° 对应 θ 加 π/2，乘 4 后加 2π，三角函数值不变，于是 4 个等价方向被压成一个点。"}, {"id": "q15", "chapterId": "ch04", "type": "blank", "question": "四边形网格中 3 价顶点指数为＿＿，5 价顶点指数为＿＿；球面上指数之和为＿＿。", "options": [], "answer": "+1/4；−1/4；2", "explain": "index = (4 − n)/4，Poincaré-Hopf 要求 Σindex = χ，球面 χ = 2，因此至少 8 个 3 价顶点。"}, {"id": "q16", "chapterId": "ch04", "type": "blank", "question": "Morse-Smale 法为什么能产生四边形块？", "options": [], "answer": "标量场的一个鞍点有两条上行流线和两条下行流线，构成四条边界，围出一块四边形区域。", "explain": "控制质量靠设计 ψ 的特征向量（对齐棱线）与二阶导数条件（避免关键点退化）。"}, {"id": "q17", "chapterId": "ch05", "type": "single", "question": "HKS 的等距不变性来自？", "options": ["它使用了法向", "它只依赖 Laplace 的特征值/特征向量，而它们由内在度量决定", "它对坐标做了归一化", "它用了曲率"], "answer": 1, "explain": "热扩散只依赖沿曲面的距离，弯曲纸面不改变签名；代价是分不开镜像。"}, {"id": "q18", "chapterId": "ch05", "type": "single", "question": "Ncut 相比\"最小切口\"多了什么？", "options": ["体积约束", "用 assoc 归一化，惩罚过小的块", "深度网络", "固定块数"], "answer": 1, "explain": "分母是块与全图的连接量，切下小碎片会因分母小而得分高，从而被抑制。"}, {"id": "q19", "chapterId": "ch05", "type": "blank", "question": "HKS 在 t 很小时主要由＿＿决定，在 t 很大时趋于＿＿。", "options": [], "answer": "局部几何（高阶模态、细节）；常数（只剩最低频模态）", "explain": "这也是为什么必须用整条曲线（多个 t）当特征，单点值没有区分度。"}, {"id": "q20", "chapterId": "ch05", "type": "blank", "question": "D2 形状分布为什么对旋转不敏感，又丢了什么？", "options": [], "answer": "它统计采样点对的距离分布，距离在旋转下不变；但它不记录距离出现在哪个位置、哪个方向，空间分布信息全丢。", "explain": "所以 D2 适合粗筛，不适合精细匹配。"}, {"id": "q21", "chapterId": "ch06", "type": "single", "question": "LBS 糖纸收缩的根本原因是？", "options": ["权重没归一化", "对\"变换后的位置\"做线性平均，而非对旋转做插值", "骨骼数量太少", "网格分辨率不足"], "answer": 1, "explain": "两个 90° 差异的旋转，位置中点会落到关节内侧，长度缩为 0.707 倍；DQS 插值旋转以减轻此现象。"}, {"id": "q22", "chapterId": "ch06", "type": "single", "question": "梯度域形变最终求解的是？", "options": ["∇×u = 0", "L v' = b（离散 Poisson）", "特征值问题", "v' = Σ w_j R_j v"], "answer": 1, "explain": "把\"保微分\"写成最小二乘，正规方程即 Laplace 矩阵乘新坐标等于目标微分项。"}, {"id": "q23", "chapterId": "ch06", "type": "blank", "question": "ARAP 的局部步固定＿＿、求＿＿；全局步固定＿＿、解＿＿线性系统。", "options": [], "answer": "顶点位置；每个三角形的最优旋转（SVD 解 Procrustes）；所有旋转；稀疏", "explain": "交替进行，能量单调下降，可能停在局部极小。"}, {"id": "q24", "chapterId": "ch06", "type": "blank", "question": "为什么\"直接令 ∇f = u\"常常无解，必须先做 Helmholtz 分解？", "options": [], "answer": "任意向量场含旋转（无散）和调和分量，而梯度场必然无旋；只有先取出无旋部分（等价于解 ∇²φ = ∇·u）才存在 f。", "explain": "这一步同时解释了梯度域方法为什么稳。"}, {"id": "q25", "chapterId": "ch07", "type": "single", "question": "显式积分的时间步上限主要由什么决定？", "options": ["总质量", "系统最高振动频率", "外力大小", "顶点数量"], "answer": 1, "explain": "稳定条件 h ≤ 2/ω_max；网格越细 ω_max 越高，步长必须越小。"}, {"id": "q26", "chapterId": "ch07", "type": "single", "question": "投影动力学每步的线性系统有什么特点？", "options": ["每步重新分解", "左边矩阵恒定，可预分解，每步只回代", "是非线性系统", "是特征值问题"], "answer": 1, "explain": "左边只与网格和权重有关，与当前位置无关。"}, {"id": "q27", "chapterId": "ch07", "type": "blank", "question": "子空间模拟把未知量从＿＿个降到＿＿个；它在＿＿与＿＿两类场景下会失效。", "options": [], "answer": "3N；K；大幅非线性形变；局部尖锐碰撞", "explain": "前者使线性化基失效，后者需要被截断的高频模态。"}, {"id": "q28", "chapterId": "ch07", "type": "blank", "question": "为什么\"网格加密会让弹簧质点模型变硬\"？", "options": [], "answer": "刚度定义在边上，边变短后同样的绝对位移对应更大的相对伸长，等效刚度上升，最高频也上升。", "explain": "要跨分辨率一致，需按边长重标定刚度，或改用有限元的连续介质参数。"}, {"id": "q29", "chapterId": "ch08", "type": "single", "question": "L1 正则产生稀疏解的直接原因是？", "options": ["它是凸函数", "等值线有尖角，最优点易落在坐标轴上", "梯度更大", "等价于 L0"], "answer": 1, "explain": "菱形等值线与数据项椭圆相切处常在尖角；L2 的圆形等值线不会。"}, {"id": "q30", "chapterId": "ch08", "type": "single", "question": "PointNet 对输入顺序不敏感靠的是？", "options": ["卷积", "循环网络", "逐点 MLP + 对称池化（最大池化）", "图拉普拉斯"], "answer": 2, "explain": "最大值与顺序无关；旋转则另靠 T-Net 学变换近似抵消。"}, {"id": "q31", "chapterId": "ch08", "type": "blank", "question": "低秩正朝向方法依赖的观察是：人造模型摆正时，其在三个坐标平面上的投影矩阵具有＿＿；可优化的替代目标是＿＿。", "options": [], "answer": "更低的秩（行高度相关）；核范数（奇异值之和）", "explain": "秩的凸松弛让问题可解，且完全不需要训练数据。"}, {"id": "q32", "chapterId": "ch08", "type": "blank", "question": "为什么几何信号比图像信号更难稀疏表达？", "options": [], "answer": "图像定义在规则格点上，有局部紧支撑的正交基；几何定义在不规则流形上，Laplace 特征向量是全局支撑的，无法表示局部细节。", "explain": "因此需要局部字典、冗余字典 + L1，或让网络学基。"}, {"id": "q33", "chapterId": "ch09", "type": "single", "question": "重定向行走中人对哪类增益最敏感？", "options": ["平移增益", "旋转增益", "视场角增益", "时间增益"], "answer": 1, "explain": "前庭系统对旋转极敏感，旋转增益的可容忍区间远窄于平移。"}, {"id": "q34", "chapterId": "ch09", "type": "single", "question": "3D 打印中\"悬垂面\"的判定依据是？", "options": ["面积大小", "法向与竖直方向夹角（相对水平面倾角小于约 45°）", "顶点数量", "曲率符号"], "answer": 1, "explain": "超过约 45° 的悬垂下方无材料支撑，必须加支撑结构。"}, {"id": "q35", "chapterId": "ch09", "type": "blank", "question": "机器人自主扫描把\"自由区域\"与\"未知区域\"的交界称为＿＿；用势场规划时通常把＿＿当作势源。", "options": [], "answer": "边界（frontier）；未知区域", "explain": "沿势的梯度移动，机器人会被\"吸\"向信息量最大的地方。"}, {"id": "q36", "chapterId": "ch09", "type": "blank", "question": "为什么\"联合分割与识别\"比\"先分割再识别\"更稳？", "options": [], "answer": "分割边界在噪声/遮挡下不可靠，而整块的分类似然提供全局语义约束；合并相邻块若提升整体似然则合并，等于用语义修正边界。", "explain": "两个子问题互相依赖时，联合求解优于流水线。"}, {"id": "q37", "chapterId": "mix", "type": "single", "question": "下列哪一项**不需要**求解全局稀疏线性系统？", "options": ["调和参数化", "梯度域形变", "Poisson 重建", "QEM 边坍缩的选边"], "answer": 3, "explain": "QEM 的选边是优先队列 + 局部 3×3 求解；前三者都要解全局稀疏系统。"}, {"id": "q38", "chapterId": "mix", "type": "single", "question": "第 1 章的离散 Laplace 算子在第 5 章被用来做什么？", "options": ["计算 Hausdorff 距离", "构造 HKS 与谱聚类（Ncut）", "生成四边形网格", "处理碰撞"], "answer": 1, "explain": "谱方法都需要 Laplace 的特征值/特征向量；Hausdorff 依赖距离，四边形化依赖方向场，碰撞依赖约束。"}, {"id": "q39", "chapterId": "mix", "type": "blank", "question": "从数学结构上看，第 6 章的梯度域形变、第 7 章的投影动力学、第 2 章的 Poisson 重建都共享同一个模式：先构造＿＿，再解＿＿。", "options": [], "answer": "局部微分/梯度目标；全局 Poisson（或 Laplace）方程", "explain": "这就是\"局部-全局\"模式在全书的三次复用。"}, {"id": "q40", "chapterId": "mix", "type": "blank", "question": "为什么\"四边形化球面不可能没有奇异点\"？请用指数与欧拉示性数说明。", "options": [], "answer": "index = (4 − n)/4，只有 4 价顶点指数为 0；Poincaré-Hopf 要求闭合曲面 Σindex = χ，球面 χ = 2，因此必须有非零指数的顶点（如 8 个 3 价，或等价组合）。", "explain": "这说明奇异点是拓扑必然，不是算法缺陷。"}, {"id": "q41", "chapterId": "mix", "type": "blank", "question": "给定一份带噪声、有遮挡缺失的文物扫描点云，请给出处理流程并说明每一步的理由。", "options": [], "answer": "① 配准（多视角拼接）：用特征粗配准 + ICP 精修，避免局部最优；② 去噪/法向估计：先做局部拟合（MLS）或法向双边滤波，为后续提供可靠法向；③ 隐式重建（筛选 Poisson）：梯度拟合对噪声稳、能补出封闭面，八叉树 + 多重网格保证可解；④ 光顺（保特征的 Taubin 或法向滤波）修残留噪声；⑤ 重网格化（如需仿真）。若缺失区域关键，需人工补洞或标明不可信区域。", "explain": "评分要点是\"为什么不用显式重建（怕噪声缺失）\"和\"重建后再光顺的顺序不能反\"。"}, {"id": "q42", "chapterId": "mix", "type": "blank", "question": "如果你要在移动端实时编辑一个 5 万顶点的网格（拖拽骨架 + 保体积），会选择哪些技术组合？说明取舍。", "options": [], "answer": "子空间形变（低频模态或样本 PCA 作基）承担自由度降维；能量用 ARAP 或梯度域（保局部细节），并加体积约束/内部体图防塌陷；交互帧用预分解的常量矩阵（投影动力学式）加速；离线预处理特征分解与矩阵分解。取舍：牺牲极端形变精度与局部尖锐细节，换取毫秒级响应；若需要精确接触或大幅非线性，则退回完整非线性求解。", "explain": "评分要点是识别\"自由度、能量、求解器\"三层各自的降本手段，并说明代价。"}], "flashcards": [{"id": "f01", "chapterId": "ch01", "front": "离散高斯曲率怎么算？", "back": "K_i = 2π − Σθ_i（顶点一圈三角形的内角和），只依赖角度，不需要拟合曲面。", "tags": ["曲率", "离散算子"]}, {"id": "f02", "chapterId": "ch01", "front": "余切权重里的两个角是哪两个？", "back": "边 (i, j) 两侧各一个对着这条边的角，分别记为 α、β；权重 w = cot α + cot β。", "tags": ["Laplace", "余切"]}, {"id": "f03", "chapterId": "ch01", "front": "为什么 B-样条比 Bézier 更适合交互设计？", "back": "B-样条基函数局部支撑，改一个控制点只影响相邻几段；Bézier 是全局的，改一点整条曲线都变。", "tags": ["样条", "局部性"]}, {"id": "f04", "chapterId": "ch01", "front": "NURBS 能精确表示圆的两个原因？", "back": "① 属于有理函数空间，可写成分式多项式；② 有理形式在投影变换下仍是有理形式，投影不变。", "tags": ["样条", "NURBS"]}, {"id": "f05", "chapterId": "ch01", "front": "带约束优化的 KKT 条件在说什么？", "back": "在最优且约束起作用处，目标梯度必须落在约束梯度的正锥内（∇f = Σλ_i∇g_i，λ_i ≥ 0），同时在可行域内。", "tags": ["优化", "KKT"]}, {"id": "f06", "chapterId": "ch02", "front": "ICP 为什么只到局部最优？", "back": "最近点对应随变换改变，目标函数在对应切换处不连续且非凸，误差下降到某个自洽的错误配对上就停住。", "tags": ["配准", "ICP"]}, {"id": "f07", "chapterId": "ch02", "front": "刚性配准的闭式解三步是什么？", "back": "① 求两边质心并平移；② 对协方差矩阵做 SVD，R = V Uᵀ（det 为负则修一列）；③ t = ȳ − R x̄。", "tags": ["配准", "Procrustes"]}, {"id": "f08", "chapterId": "ch02", "front": "Crust 里的\"极点\"是什么，有什么用？", "back": "顶点 Voronoi 单元里离该点最远的两个 Voronoi 顶点；极点方向近似曲面法向，用于筛掉斜穿表面的三角形。", "tags": ["重建", "Delaunay"]}, {"id": "f09", "chapterId": "ch02", "front": "Poisson 重建为什么不需要估距离？", "back": "它拟合的是梯度（法向场），梯度对常数偏移不敏感；不需要知道\"离曲面多远\"。", "tags": ["重建", "Poisson"]}, {"id": "f10", "chapterId": "ch02", "front": "Taubin 光顺为什么能既平滑又不收缩？", "back": "把正负两个缩放因子交替使用，单个因子的收缩被另一个抵消，整体体积近似保持。", "tags": ["光顺"]}, {"id": "f11", "chapterId": "ch03", "front": "Tutte 定理的两个前提？", "back": "网格是拓扑圆盘（闭合的需先切开）；映射边界落在凸多边形上且权重全为正。", "tags": ["参数化", "Tutte"]}, {"id": "f12", "chapterId": "ch03", "front": "ASAP 的\"局部-全局\"两步各做什么？", "back": "固定坐标时逐三角形算最接近的相似变换（SVD 取平均奇异值）；固定相似变换时解稀疏最小二乘求坐标。", "tags": ["参数化", "ASAP"]}, {"id": "f13", "chapterId": "ch03", "front": "QEM 的误差为什么可以累加？", "back": "每个顶点存的是\"到若干平面的距离平方和\"的二次型，坍缩后新顶点的二次型就是两个旧二次型相加。", "tags": ["简化", "QEM"]}, {"id": "f14", "chapterId": "ch03", "front": "渐进网格相对多套 LOD 的优势？", "back": "只存粗网格加一串可逆的分裂记录，任意精度连续可调，且每条记录带误差，可按预算停止。", "tags": ["多分辨率"]}, {"id": "f15", "chapterId": "ch03", "front": "Edgebreaker 的 5 个符号是哪些？", "back": "C（进入新三角形）、L（左转）、R（右转）、E（分支结束）、S（分叉需压栈）。", "tags": ["压缩", "拓扑编码"]}, {"id": "f16", "chapterId": "ch04", "front": "为什么用 (cos 4θ, sin 4θ) 表示方向场？", "back": "4 个等价方向的 θ 相差 π/2，乘 4 后相差 2π，三角函数值相同，于是整数跳跃变量自动消失。", "tags": ["方向场"]}, {"id": "f17", "chapterId": "ch04", "front": "四边形网格奇异点的指数公式？", "back": "index = (4 − n)/4；3 价 +1/4、5 价 −1/4、4 价 0。", "tags": ["奇异点"]}, {"id": "f18", "chapterId": "ch04", "front": "球面四边形网格至少要几个 3 价顶点？", "back": "8 个（8 × 1/4 = 2 = χ），或等价的指数组合。", "tags": ["奇异点", "拓扑"]}, {"id": "f19", "chapterId": "ch04", "front": "三维标架的对称性有多少种，怎么处理？", "back": "立方体旋转群 24 种等价表示；用球面调和（l=0 与 l=4）编码成 9 维向量，在 R⁹ 里做光顺。", "tags": ["标架场", "六面体"]}, {"id": "f20", "chapterId": "ch04", "front": "为什么整数约束要\"逐步取整\"而不能一次取完？", "back": "一次取整会把远离整数的分量硬拉过去，产生大量奇异点、场极不光顺；逐步固定最接近整数的再优化其余，结果更优。", "tags": ["优化", "整数约束"]}, {"id": "f21", "chapterId": "ch05", "front": "HKS 的物理含义？", "back": "在 x 放单位热量，t 时刻 x 处剩余热量 = Σ exp(−λ_i t) φ_i(x)²。", "tags": ["描述子", "HKS"]}, {"id": "f22", "chapterId": "ch05", "front": "HKS 的等距不变性带来什么好处与局限？", "back": "好处是不同姿势/弯曲下同一部位签名一致；局限是分不开镜像（左右手）、也分不开凸起与凹陷。", "tags": ["描述子"]}, {"id": "f23", "chapterId": "ch05", "front": "Ncut 为什么不会切出一个很小的碎片？", "back": "分母 assoc 是块与全图的连接量；碎片的分母极小，比值反而很大，被目标函数惩罚。", "tags": ["分割", "谱方法"]}, {"id": "f24", "chapterId": "ch05", "front": "Spin Image 对什么最敏感？", "back": "法向。它以法向为轴建立柱坐标，法向估错整个图就歪，因此要先做可靠的法向估计。", "tags": ["描述子", "局部特征"]}, {"id": "f25", "chapterId": "ch05", "front": "Ncut 最终化成一个什么数学问题？", "back": "广义特征值问题 (D − W)x = λ D x，取第二小特征向量，按符号二分。", "tags": ["分割", "拉普拉斯"]}, {"id": "f26", "chapterId": "ch06", "front": "LBS 的糖纸收缩数值是多少？", "back": "权重 0.5/0.5、旋转 90°，关节距离由 r 缩为 0.707r；180° 时缩为 0（完全塌陷）。", "tags": ["蒙皮", "LBS"]}, {"id": "f27", "chapterId": "ch06", "front": "DQS 用什么替代位置插值？", "back": "对偶四元数（旋转 + 平移）的归一化线性插值，再作用到顶点；插值\"运动\"而非\"位置\"。", "tags": ["蒙皮", "DQS"]}, {"id": "f28", "chapterId": "ch06", "front": "梯度域形变的最终方程？", "back": "(LᵀL + λI_C) v' = Lᵀ(Tδ) + λp，即离散 Poisson 的最小二乘形式。", "tags": ["形变", "Poisson"]}, {"id": "f29", "chapterId": "ch06", "front": "ARAP 的局部步为什么是 SVD？", "back": "求使 |E − R S| 最小的旋转，等价于最大化 tr(Rᵀ E Sᵀ)，解为 R = V Uᵀ（Procrustes）。", "tags": ["形变", "ARAP"]}, {"id": "f30", "chapterId": "ch06", "front": "体图（cage）在梯度域编辑里解决什么问题？", "back": "内部填充点让形变有体积感、防塌陷；外部覆盖点约束外部空间不被拉变形；两者共同防自交。", "tags": ["形变", "体图"]}, {"id": "f31", "chapterId": "ch07", "front": "显式积分的稳定条件？", "back": "h ≤ 2/ω_max；k = 100、m = 0.01 时 ω = 100，h ≤ 0.02 s。", "tags": ["模拟", "积分"]}, {"id": "f32", "chapterId": "ch07", "front": "PBD 的三个循环步骤？", "back": "预测位置（速度积分）→ 投影约束（迭代修正位置）→ 反推速度（(x_new − x_old)/h）。", "tags": ["模拟", "PBD"]}, {"id": "f33", "chapterId": "ch07", "front": "投影动力学为什么快？", "back": "把内力写成局部投影之和，隐式方程左边 (M/h² + ΣwSᵀS) 恒定，预分解一次，每步只回代。", "tags": ["模拟", "投影动力学"]}, {"id": "f34", "chapterId": "ch07", "front": "Cubature 在做什么？", "back": "只算少量\"代表单元\"的内力，用训练数据拟合使其整体误差最小，把单元级计算降一个数量级。", "tags": ["模拟", "加速"]}, {"id": "f35", "chapterId": "ch07", "front": "自碰撞为什么必须先排除相邻三角形？", "back": "相邻三角形天然接触/共边，不排除会被判成碰撞，布料会\"粘住\"自己。", "tags": ["碰撞"]}, {"id": "f36", "chapterId": "ch08", "front": "L1 为什么产生稀疏解？", "back": "L1 的等值线是菱形（有尖角），与数据项的椭圆相切处多半落在坐标轴上，某些分量恰好为 0。", "tags": ["稀疏", "优化"]}, {"id": "f37", "chapterId": "ch08", "front": "低秩正朝向靠什么观察？", "back": "人造模型摆正时在三个坐标平面上的投影矩阵行高度相关（秩低）；优化核范数即可求旋转，无需训练数据。", "tags": ["低秩", "正朝向"]}, {"id": "f38", "chapterId": "ch08", "front": "PointNet 的置换不变性来自哪里？", "back": "逐点 MLP + 全局最大池化；最大值与输入顺序无关。", "tags": ["深度学习", "PointNet"]}, {"id": "f39", "chapterId": "ch08", "front": "把三角形特征排成 30×20 假图像喂 CNN 的问题在哪？", "back": "排列与拓扑邻接无关、矩阵形状是人工定的，换顺序结果就变，并非真正尊重曲面结构。", "tags": ["深度学习", "CNN"]}, {"id": "f40", "chapterId": "ch08", "front": "几何信号为什么难找稀疏基？", "back": "定义域是不规则流形，Laplace 特征向量全局支撑，无法像图像小波那样提供局部紧支撑基。", "tags": ["稀疏", "几何信号"]}, {"id": "f41", "chapterId": "ch09", "front": "重定向行走的三类增益？", "back": "平移增益、旋转增益、传送（或门户/重新定向）。", "tags": ["VR", "重定向"]}, {"id": "f42", "chapterId": "ch09", "front": "场景映射的五项约束？", "back": "保形、局部等距、边界约束、避障、多用户一致。", "tags": ["VR", "场景映射"]}, {"id": "f43", "chapterId": "ch09", "front": "3D 打印的四类几何约束？", "back": "切片与路径（含支撑 45°）、中空与壁厚、强度、站立/旋转稳定；外加分解装配与装箱。", "tags": ["3D打印"]}, {"id": "f44", "chapterId": "ch09", "front": "机器人为什么选\"边界\"作为探索目标？", "back": "边界是自由区域与未知区域的交界，去那里最可能带来新信息，探索效率最高。", "tags": ["机器人", "探索"]}, {"id": "f45", "chapterId": "ch09", "front": "联合分割识别的合并准则？", "back": "反复尝试合并相邻块，若合并后整块的分类似然更高则合并，直到再合并不提升为止。", "tags": ["机器人", "场景理解"]}], "companion": "discrete-geometry-processing学习伴侣.html"}, "pages": {"ch01": {"html": "<h1>第 1 章：几何处理的数学基础<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：6 小时 | <strong>前置<\/strong>：向量点积叉积、矩阵与线性方程组、偏导数、基本的求最小值经验\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说清多边形网格、隐式曲面、参数曲面三种表示各自&quot;存了什么、丢了什么&quot;，并判断一个具体任务该用哪种。\n<\/li><li>\n写出三次样条、埃尔米特样条、Bézier、B-样条、有理样条的区别（谁连续、谁局部、谁能精确画圆）。\n<\/li><li>\n从&quot;这个点比邻居平均高出多少&quot;出发，写出离散 Laplace 算子的余切权重公式，并算出一个顶点的具体数值。\n<\/li><li>\n说明为什么把角度亏欠当离散高斯曲率，以及角度亏欠求和为什么只能是 2π 的整数倍。\n<\/li><li>\n判断一个优化问题该用线搜索、牛顿、拟牛顿还是带约束的 KKT/投影方法。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>连续几何在计算机里只能被采样，因此所有&quot;微分、积分、距离、最优化&quot;都必须先改写成<strong>只依赖顶点坐标和邻接关系的离散公式<\/strong>；这套改写就是本书的算子层，后面八章都在消费它。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 0：三件必须先有的工具<\/h3>\n<p><strong>向量<\/strong>：一根有方向和长度的箭头，本书用 (x, y, z) 三个数字记它。<\/p>\n<p><strong>点积<\/strong>：a·b = ax bx + ay by + az bz，结果是<strong>一个数<\/strong>，含义是&quot;a 在 b 上投影的长度 × b 的长度&quot;。用它算夹角：cos θ = a·b / (|a||b|)。余切（cot）就是 cos/sin，等于&quot;邻边除以对边&quot;，30° 的余切约 1.732——记住这个数，本章后面算算子要用。<\/p>\n<p><strong>叉积<\/strong>：a×b 结果是<strong>一个向量<\/strong>，垂直于 a 和 b 张成的平面，长度等于平行四边形面积。三角形 (p0, p1, p2) 的单位法向就是：<\/p>\n<pre><code>n = (p1 − p0) × (p2 − p0) / |(p1 − p0) × (p2 − p0)|<\/code><\/pre>\n<p>叉积长度的一半正好是三角形面积，所以网格每个三角形的面积不用另算。<\/p>\n<p><strong>偏导数<\/strong>：把其他变量当常数、只对一个变量求导。∂f/∂x 就是&quot;只动 x 时 f 变多快&quot;。<\/p>\n<p><strong>梯度 ∇f<\/strong>：把所有偏导装成一个向量 (∂f/∂x, ∂f/∂y, ∂f/∂z)。它的方向是函数<strong>上升最快<\/strong>的方向，长度是上升速率。所以要让函数变小，就往 −∇f 走。<\/p>\n<h3>概念 1：三种曲面表示，各存了什么<\/h3>\n<p><strong>多边形网格曲面<\/strong>（难度：基础）。用两个表描述：<strong>顶点表<\/strong>记坐标，一行一个顶点；<strong>面片表<\/strong>记&quot;哪几个顶点围成一个面&quot;，一行一个面。加上<strong>边表<\/strong>（哪两个顶点相连）就是完整拓扑。<\/p>\n<p>为什么必须单独记拓扑？因为坐标只是位置，&quot;谁和谁相邻&quot;是另一份信息。同一堆顶点，连法不同就是不同形状：可以是球，也可以是一团自交的乱面。<\/p>\n<p>如果每个顶点的邻域摊平后都像一小块圆盘、网格没有自交也没有多余薄片，这个网格叫<strong>流形网格<\/strong>。流形是绝大多数算法的隐含前提：Laplace 算子、参数化、形变都要求&quot;每个顶点周围是一圈有序的三角形&quot;。<\/p>\n<p><strong>亏格<\/strong>数曲面上洞的个数：球是 0，甜甜圈是 1，双环把手是 2。亏格不是画出来的细节，它是拓扑不变量——你怎么揉都不能把甜甜圈揉成球而不撕开。<\/p>\n<p><strong>隐式曲面<\/strong>（难度：基础）。不存点，存一个函数 f(x, y, z)，曲面就是 f = 0 的那些点。最常用的是<strong>符号距离场<\/strong>（SDF）：每个点记&quot;到曲面的距离&quot;，外加一个符号表示在内部还是外部。它的好处是内外判定只要看符号、求交只要比较值；坏处是&quot;曲面上有哪些点&quot;要靠 Marching Cubes 这类算法挖出来，精度受格子分辨率限制。<\/p>\n<p><strong>参数曲面<\/strong>（难度：基础）。用两个参数 (u, v) 把一张平面片贴到空间里：S(u, v) = (x(u, v), y(u, v), z(u, v))。好处是曲面上的运算可以退化成平面上的运算（比如纹理坐标天然就是 (u, v)）；坏处是复杂拓扑贴不上一张平面片，必须切成多片。<\/p>\n<p>三者不是竞争关系，而是流水线上的不同工位：扫描仪给点云 → 重建算法给网格（第 2 章）或 SDF → 参数化把网格摊成 (u, v)（第 3 章）→ 设计软件里用样条（本节后面）做精确造型。<\/p>\n<h3>概念 2：样条家族——从&quot;分段多项式&quot;到&quot;能精确画圆&quot;<\/h3>\n<p>先说一个动机。用一条高次多项式去穿过 100 个点，会出现剧烈振荡（龙格现象）；用 100 段直线去连，又会有折角。<strong>样条<\/strong>的思路是：用很多段<strong>低次<\/strong>多项式拼接，并强迫接缝处足够光滑。<\/p>\n<p><strong>三次样条<\/strong>（难度：进阶）。每两个相邻控制点之间放一段三次多项式 p(u) = a u³ + b u² + c u + d，要求接缝处函数值、一阶导、二阶导都连续（即 C² 连续）。设共有 n+1 个控制点、n 段曲线，每段 4 个未知系数，共 4n 个未知数。约束来自两处：每段两端要穿过自己的两个控制点（2n 个方程），每个内部接缝要求一阶、二阶导相等（2(n−1) 个方程）。加起来 4n−2 个方程，比未知数少 2 个，所以还要补两个<strong>边界条件<\/strong>。最常见的是自然边界条件：首末两点二阶导取 0。<\/p>\n<p>它的毛病是<strong>不局部<\/strong>：所有段的系数由一个整体线性系统联立求解，动一个控制点，整条曲线都得重算。<\/p>\n<p><strong>埃尔米特（Hermite）样条<\/strong>（难度：进阶）。在控制点上额外给出切向量（斜率），每段曲线只由它自己的两个端点位置和两个切向决定：<\/p>\n<pre><code>p(u) = p_k h00(u) + p_{k+1} h01(u) + d_k h10(u) + d_{k+1} h11(u)\nh00 = 2u³ − 3u² + 1,  h01 = −2u³ + 3u²\nh10 = u³ − 2u² + u,   h11 = u³ − u²      （0 ≤ u ≤ 1）<\/code><\/pre>\n<p>因为完全局部，改一段不影响别段。代价是斜率先得知道——对交互设计不友好。<\/p>\n<p><strong>Bézier 曲线<\/strong>（难度：进阶）。给定 m+1 个控制点，曲线是它们的加权平均：<\/p>\n<pre><code>p(u) = Σ_{k=0}^{m} p_k B_{k,m}(u),   0 ≤ u ≤ 1\nB_{k,m}(u) = C(m,k) u^k (1−u)^{m−k}<\/code><\/pre>\n<p>权重 B 叫<strong>伯恩斯坦多项式<\/strong>，所有 B 加起来恒等于 1（所以曲线一定落在控制点的凸包里，这叫<strong>凸包性<\/strong>）。u=0 时只有 B_{0,m}=1，曲线正好从 p_0 出发；u=1 时落在 p_m。也就是说曲线<strong>端点插值、其余点只&quot;吸引&quot;不穿过<\/strong>。<\/p>\n<p>数值上不直接算高次幂，用<strong>de Casteljau 算法<\/strong>：反复把相邻控制点按 u : (1−u) 的比例取分点，取 m 轮，最后剩下的那一点就是曲线上的点。3 个控制点、u=0.5 时，依次取中点两次，得到的正是三角形中线中点——这一步可以手算验证。<\/p>\n<p><strong>B-样条<\/strong>（难度：进阶）。Bézier 的局部版。控制点权重改成&quot;只在局部非零&quot;的基函数，于是改一个控制点只影响相邻几段；代价是不再插值端点，曲线被&quot;拉&quot;在控制点附近。<\/p>\n<p><strong>有理样条（NURBS）<\/strong>（难度：高难）。给每个控制点加一个权重 w_k，再归一化：<\/p>\n<pre><code>p(u) = Σ w_k p_k B_{k,m}(u) / Σ w_k B_{k,m}(u)<\/code><\/pre>\n<p>权重越大，曲线越靠近那个控制点；所有权重取 1 时退回普通 B-样条。它有两个别的样条给不了的能力：<strong>精确表示圆和椭圆<\/strong>（普通多项式样条只能逼近，永远差一点），以及在<strong>投影变换下保持不变<\/strong>（因为分子分母同阶，投影后仍是有理形式）。这就是为什么工业 CAD 标准是 NURBS 而不是 B-样条。<\/p>\n<h3>概念 3：曲面上到底&quot;弯了多少&quot;——微分几何量与离散化<\/h3>\n<p><strong>第一基本形式<\/strong>（难度：进阶）。它是曲面上的尺子。记两个切向偏导 S_u、S_v，则<\/p>\n<pre><code>E = S_u·S_u,  F = S_u·S_v,  G = S_v·S_v<\/code><\/pre>\n<p>曲面上一条参数曲线的长度就是 ∫√(E du² + 2F du dv + G dv²)。E、F、G 就是全部&quot;度量信息&quot;：知道它们，就能算长度、角度、面积。<\/p>\n<p><strong>第二基本形式<\/strong>（难度：高难）。它是弯曲计。记单位法向 n，则<\/p>\n<pre><code>L = S_uu·n,  M = S_uv·n,  N = S_vv·n<\/code><\/pre>\n<p>直观上：第一基本形式问&quot;沿切向走多远&quot;，第二基本形式问&quot;走的时候偏离切平面多少&quot;。<\/p>\n<p><strong>主曲率<\/strong>（难度：基础）。在一点上，沿不同切方向弯曲程度不同。使法曲率取最大和最小的两个方向互相垂直，对应的曲率 k1、k2 就是主曲率。它们的组合给出两个最有用的量：<\/p>\n<pre><code>高斯曲率  K = k1 · k2      （乘起来：球面为正，马鞍为负，柱面为 0）\n平均曲率  H = (k1 + k2) / 2<\/code><\/pre>\n<p>欧拉定理说，任一方向的法曲率满足 κ(θ) = k1 cos²θ + k2 sin²θ，所以平均曲率确实是所有方向法曲率的平均。<\/p>\n<p>为什么这两个量重要？因为<strong>极小曲面<\/strong>（肥皂膜）就是 H = 0 的曲面，而 K 决定局部形状类型（球面片 K &gt; 0，马鞍 K &lt; 0，可展面 K = 0）。第 2 章的光顺、第 6 章的形变能量，写的都是 H 或 K 的离散版本。<\/p>\n<p><strong>离散 Laplace 算子<\/strong>（难度：进阶）。连续情形下，Laplace 量 Δx 衡量&quot;这一点和周围平均差多少&quot;。在网格上取顶点 i 的一环邻域（所有直接相连的顶点 j），标准做法是：<\/p>\n<pre><code>Δx_i = (1 / (2 A_i)) Σ_j (cot α_ij + cot β_ij) (x_j − x_i)<\/code><\/pre>\n<p>其中 A_i 是顶点 i 的<strong>混合面积<\/strong>（一圈三角形面积的加权和），α_ij、β_ij 是边 (i, j) 两侧正对着这条边的两个角（<strong>余切权重<\/strong>）。<\/p>\n<p>为什么是余切？一句话：要让这个离散算子在&quot;把网格细分得更密&quot;时收敛到真正的连续 Laplace，权重必须等于这条边两侧角的余切之和——这是从三角形上的分片线性函数的积分直接算出来的结果，不是凑出来的经验公式。代价是：钝角（大于 90°）的余切是负数，所以钝角三角形会让权重变负，网格质量差时算子会失稳。这解释了为什么第 3、4 章要死死盯着三角形质量。<\/p>\n<p>它的一个变形是<strong>平均曲率法向算子<\/strong>：<\/p>\n<pre><code>H(x_i) = (1 / (4 A_i)) Σ_j (cot α_ij + cot β_ij)(x_j − x_i)<\/code><\/pre>\n<p>方向就是法向，长度是平均曲率。第 2 章的光顺就是反复沿这个方向挪一点点。<\/p>\n<p><strong>角度亏欠<\/strong>（难度：进阶）。绕着顶点 i 一圈三角形的内角和记为 Σθ，则<\/p>\n<pre><code>K_i = 2π − Σθ_i<\/code><\/pre>\n<p>这个差叫角度亏欠，直接当离散高斯曲率用。为什么合理？平面上绕一点一圈角度和正好 2π，亏欠为 0；球面上绕一点一圈角度和不足 2π（球面&quot;多出来&quot;的面积要靠这个亏欠补上），所以亏欠为正；马鞍处角度和超过 2π，亏欠为负。符号与连续高斯曲率一致，这是它被采用的根本理由。<\/p>\n<p><strong>离散高斯-博内定理<\/strong>（难度：进阶）。把全网格所有顶点的角度亏欠加起来：<\/p>\n<pre><code>Σ_i K_i = 2π χ,   χ = V − E + F（欧拉示性数）<\/code><\/pre>\n<p>球面 χ = 2，所以总亏欠恒为 4π，不管你把球剖成多少个三角形。这是一个&quot;无论怎么离散都成立&quot;的拓扑恒等式，也是判断网格有没有多余洞、有没有丢面的硬指标：算出来的总亏欠不是 2πχ，就说明拓扑坏了。<\/p>\n<h3>概念 4：算两个曲面差多少——Hausdorff 距离与求交<\/h3>\n<p><strong>Hausdorff 距离<\/strong>（难度：进阶）。定义是双向的&quot;最坏情况&quot;：<\/p>\n<pre><code>d_H(A, B) = max( sup_{a∈A} inf_{b∈B} |a − b| ,  sup_{b∈B} inf_{a∈A} |a − b| )<\/code><\/pre>\n<p>翻译：A 上每个点到 B 的最近距离里取最大，B 到 A 同样取最大，两者取大。它衡量的是&quot;最不像的地方差多远&quot;，不是平均误差——这正是重建质量评估要的：平均误差可以很小，但局部破一个洞就是不能用。<\/p>\n<p>精确算很贵，实用做法是按三角形估上下界：三角形 A 到网格 B 的距离，下界用 A 的顶点到 B 的最近距离，上界用顶点距离加三角形尺寸修正，于是得到全局上下界，可用来做保守判断。<\/p>\n<p><strong>网格求交裁剪<\/strong>（难度：高难）。两个网格做布尔运算（并、交、差）的底层操作：找出所有相交的三角形对、算出交线段、沿交线把三角形切开、再把碎片重新连成闭合网格。它真正的难点不在几何求交，而在<strong>数值鲁棒性<\/strong>：浮点误差会让本应共面的两个三角形一会被判相交一会判不相交，结果是网格出现裂缝或非流形边。第 9 章的 3D 打印、第 7 章的碰撞处理都绕不开它。<\/p>\n<h3>概念 5：怎么把&quot;最小化某个能量&quot;真的算出来<\/h3>\n<p>几何处理的绝大多数问题最后都写成 min_x f(x)。<\/p>\n<p><strong>无约束优化<\/strong>（难度：基础）。核心是<strong>线搜索<\/strong>：每次先定一个下降方向 p_k，再定沿这个方向走多远（步长 α_k）。下降方向的标准形式：<\/p>\n<pre><code>p_k = −B_k⁻¹ ∇f(x_k)<\/code><\/pre>\n<p>B_k 取单位矩阵就是<strong>最速下降法<\/strong>（沿负梯度走，稳但慢，接近最优时会来回锯齿）；取 Hessian ∇²f 就是<strong>牛顿法<\/strong>（用二阶信息一步跳到二次近似的最小点，快但要算 Hessian 且要求它正定，否则方向可能不下降）；取 Hessian 的近似（用梯度差更新）就是<strong>拟牛顿法<\/strong>（BFGS/L-BFGS），在两者之间取平衡，是网格优化里最常用的默认选项。<\/p>\n<p>步长不能乱取，否则&quot;方向对但仍可能上升&quot;。<strong>Wolfe 准则<\/strong>给两个条件：一是函数值要下降够多（Armijo 条件），二是新点的斜率要明显变缓（曲率条件），防止步子太小。<\/p>\n<p><strong>带约束优化<\/strong>（难度：高难）。几何问题常带约束：顶点不能跑到模型外（边界约束）、体积不能变（等式约束）、三角形不能翻（不等式约束）。<\/p>\n<p>等式约束的标准工具是拉格朗日乘子：把约束乘上乘子加进目标，最优解处目标梯度与约束梯度平行。不等式约束再加上<strong>互补松弛<\/strong>：约束要么不起作用（乘子为 0），要么正好压在边界上（约束值为 0），二者必居其一。这三条合起来就是 <strong>KKT 条件<\/strong>，它是&quot;最优的必要条件&quot;，也是很多求解器的收敛判据。<\/p>\n<p>工程上最常遇到的是<strong>带边界约束的二次规划<\/strong>：<\/p>\n<pre><code>min ½ xᵀA x − bᵀx   subject to  x ≥ l<\/code><\/pre>\n<p>它就是&quot;每个顶点有自己的活动范围&quot;的形变/碰撞问题。书里给的典型解法 MPRGP（改进的投影梯度法）思路很朴素：把梯度分成&quot;还在可行域内部、可以自由走&quot;的部分和&quot;已经顶到边界、必须截断&quot;的部分，只沿自由部分下降，必要时用共轭梯度加速。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[三种曲面表示&lt;br/&gt;网格 / 隐式 / 参数] --&gt; B[离散算子层]\n    B --&gt; B1[离散 Laplace&lt;br/&gt;余切权重]\n    B --&gt; B2[角度亏欠&lt;br/&gt;离散高斯曲率]\n    B --&gt; B3[Hausdorff 距离&lt;br/&gt;网格求交]\n    B --&gt; B4[优化器&lt;br/&gt;线搜索 / 牛顿 / KKT]\n    B1 --&gt; C1[第2章 光顺与重建]\n    B1 --&gt; C2[第3章 参数化]\n    B1 --&gt; C3[第6章 形变]\n    B2 --&gt; C4[第5章 形状分析]\n    B3 --&gt; C5[第7章 碰撞 / 第9章 打印]\n    B4 --&gt; C1\n    B4 --&gt; C3<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：图中所有箭头都从&quot;表示&quot;流向&quot;算子&quot;再流向具体章节。看这张图要抓住一点——本书后面每一章的能量函数里出现的 Laplace、曲率、距离、优化器，都出自本章；如果某章读不懂，八成是这里某个算子没吃透。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：把网格想成一张渔网。顶点是网结，三角形是网眼。第一基本形式是&quot;网眼有多大、线有多长&quot;，第二基本形式是&quot;网面拱起来多少&quot;。往网结上轻轻一拉，网眼跟着变形——这就是离散 Laplace 在做事。<strong>类比失效的边界<\/strong>：渔网只能有四边形网眼且不能自交，而真实网格允许任意多边形、允许复杂拓扑（多个洞），也能容忍局部退化。<\/p>\n<p><strong>实例（可手算）<\/strong>：取一个正四面体的四个顶点，边长为 1，全是等边三角形（每个角 60°）。<\/p>\n<ul><li>\n每个顶点周围有 3 个三角形，内角和 Σθ = 3 × 60° = 180° = π。\n<\/li><li>\n角度亏欠 K_i = 2π − π = π ≈ 3.1416。\n<\/li><li>\n四个顶点总亏欠 = 4π，与 2πχ 对照：四面体 V=4、E=6、F=4，χ = 4 − 6 + 4 = 2，2πχ = 4π。对得上。\n<\/ul>\n<p>再算余切权重：等边三角形每个角 60°，cot 60° = 0.5774。某条边两侧各有一个 60° 角，所以权重 w = 0.5774 + 0.5774 = 1.1547。若该顶点有 3 个邻居、混合面积取每个三角形面积的 1/3（等边三角形面积 = √3/4 ≈ 0.4330），则 A_i ≈ 0.4330，于是<\/p>\n<pre><code>Δx_i = (1 / (2 × 0.4330)) × 1.1547 × Σ_j (x_j − x_i) ≈ 1.333 × Σ_j (x_j − x_i)<\/code><\/pre>\n<p>对你的球面网格，Σ_j(x_j − x_i) 会指向内部（邻居平均在&quot;里面&quot;），所以 Δx_i 指向内——这就是为什么光顺时 x ← x + εΔx 会把形状往内收缩一点点（第 2 章会看到收敛面）。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;网格越密就一定越准&quot;<\/strong>——实际上精度取决于算子是否<strong>收敛<\/strong>到连续量。余切 Laplace 在网格质量差（大量钝角三角形）时，权重变负，加密反而放大误差；均匀、近等边的网格才是前提。\n<\/li><li>\n<strong>别以为&quot;样条比网格高级，所以样条更准&quot;<\/strong>——两次都错在对象不同。样条擅长用少量参数表达光滑形状，但对带精细细节、复杂拓扑的形状表达力不足；网格擅长任意拓扑与细节，但不光滑。这也是全书反复要在两者间转换的原因。\n<\/li><li>\n<strong>别以为&quot;高斯曲率可以为任意实数，所以角度亏欠也可以&quot;<\/strong>——离散角度亏欠的值受拓扑约束：全网格求和只能是 2π 的整数倍。单个顶点的亏欠可以很负，但总和固定。算出来不对，说明网格拓扑错了。\n<\/li><li>\n<strong>别以为&quot;牛顿法一定比最速下降快&quot;<\/strong>——牛顿步要求 Hessian 正定。形变能量在接近翻转的三角形附近 Hessian 会不定，此时牛顿方向可能<strong>上升<\/strong>；所以工程实现都加&quot;是否下降&quot;的检查并回退。\n<\/li><li>\n<strong>别以为&quot;带约束优化加上惩罚项就够了&quot;<\/strong>——罚函数法把约束变成大惩罚，精度受罚系数限制，且系数太大导致病态。真正保证可行的是投影法或 KKT 类方法，这也是 MPRGP 那类算法存在的原因。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n（单选）一个球面网格的离散高斯曲率（角度亏欠）之和应该是多少？\n<p>A. 0　B. 2π　C. 4π　D. 取决于剖分密度 <strong>答案<\/strong>：C。<strong>解析<\/strong>：球面 χ = 2（V−E+F = 2），由离散高斯-博内定理，总亏欠 = 2πχ = 4π，与剖分密度无关。<\/p>\n<\/ol>\n<ol><li>\n（单选）下列哪种表示<strong>能精确<\/strong>表示一个圆？\n<p>A. 三次样条　B. B-样条　C. 有理样条（NURBS）　D. Bézier 曲线 <strong>答案<\/strong>：C。<strong>解析<\/strong>：多项式的非有理样条只能逼近圆锥曲线；有理样条分子分母同为多项式，能精确表达圆、椭圆，并在投影变换下保持形式。<\/p>\n<\/ol>\n<ol><li>\n（填空）一个顶点有 3 个邻居，每条边的余切权重和为 1.2，混合面积 A_i = 0.4，则离散 Laplace 前面的系数 1/(2A_i) 等于 ＿＿，整个 Δx_i 等于 ＿＿ × Σ_j(x_j − x_i)。\n<p><strong>答案<\/strong>：1.25；1.5。<strong>解析<\/strong>：1/(2×0.4) = 1.25；再乘 1.2 得 1.5。<\/p>\n<\/ol>\n<ol><li>\n（简答）为什么三次样条虽然 C² 连续，却&quot;缺乏局部控制能力&quot;？\n<p><strong>答案要点<\/strong>：因为求系数要联立一个覆盖全部控制点的线性系统，改一个控制点会改变整个方程组的右端项，因此所有段的系数都要重解（相当于整条曲线重算）。对比埃尔米特样条，每段只由自己两个端点的位置与切向决定，才能局部修改。<\/p>\n<\/ol>\n<ol><li>\n（简答）说明 Wolfe 准则中的两个条件各自防的是什么问题。\n<p><strong>答案要点<\/strong>：Armijo 条件（函数值下降够多）防&quot;步子太小、几乎不动&quot;的伪收敛；曲率条件（新点斜率明显变缓）防&quot;步子太大、越过谷底又爬上来&quot;。两个条件一起，才能保证线搜索既真的下降又不会白走。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n三种表示：网格存拓扑、隐式存函数、参数存 (u, v)；选择看&quot;要不要任意拓扑&quot;&quot;要不要内外判定&quot;&quot;要不要精确造型&quot;。\n<\/li><li>\n样条谱系一句话：三次样条 C² 但全局；埃尔米特局部但要切向；Bézier 凸包但全局；B-样条局部但不插端点；NURBS 能精确画圆且投影不变。\n<\/li><li>\n离散算子两个招牌：Δx_i 用余切权重（钝角会变负）、K_i 用角度亏欠（总和只能是 2πχ）。\n<\/ul>", "kind": "chapter", "title": "第 1 章：几何处理的数学基础"}, "ch02": {"html": "<h1>第 2 章：点云曲面重建和光顺<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：8 小时 | <strong>前置<\/strong>：第 1 章的 Voronoi/Delaunay、Hausdorff 距离、最小二乘；向量叉积\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说清点云配准为什么必须&quot;找对应点&quot;和&quot;解变换&quot;交替做，并解释 ICP 为什么只会收敛到局部最优。\n<\/li><li>\n区分显式重建（Crust/Cocone 一类）与隐式重建（SDF/RBF/Poisson）的适用场景：什么数据该用哪一类。\n<\/li><li>\n解释 Poisson 重建在做什么（求一个函数，使它的梯度等于采样法向场），以及为什么它比单纯拟合距离更稳。\n<\/li><li>\n说出曲面光顺里&quot;顶点位置光顺&quot;和&quot;法向光顺&quot;的区别，以及双边滤波为什么能保特征。\n<\/li><li>\n给出一份带噪声、带缺失的扫描点云的处理方案并说明理由。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>重建的本质是<strong>把&quot;曲面在哪&quot;这个问题的答案从&quot;点&quot;变成&quot;函数&quot;<\/strong>：显式方法直接连三角形，隐式方法先求一个覆盖全空间的场再挖等值面；而无论哪种，都得先让点云与目标对齐、并把噪声压下去。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：点云配准——先把两片点云摆到一起<\/h3>\n<p>扫描一件文物，通常要转着扫好几圈，每次得到一个局部点云。要把它们拼成完整模型，第一步是<strong>配准<\/strong>：求一个变换，把源点云摆到目标点云的坐标系里。<\/p>\n<p><strong>刚性配准<\/strong>（难度：基础）。只允许旋转加平移，不允许拉伸。数学上就是求 R（3×3 旋转）和 t（平移向量），使<\/p>\n<pre><code>min_{R,t}  Σ_i | R x_i + t − y_i |²<\/code><\/pre>\n<p>其中 x_i 是源点，y_i 是它在目标点云里的对应点。这个式子有闭式解：先把两片点云的质心移到原点，再求使&quot;交叉协方差矩阵&quot;最优的旋转（用 SVD 或单位四元数都行），最后把质心平移回去。<strong>关键难点不是解这个方程，而是&quot;y_i 是谁&quot;<\/strong>——点云没有顶点编号，对应关系本身未知。<\/p>\n<p><strong>ICP（迭代最近点）<\/strong>（难度：进阶）。解法就是交替两件事：<\/p>\n<ol><li>\n用当前变换把源点云变换过去，为每个点找目标点云里<strong>最近<\/strong>的点当对应点；\n<\/li><li>\n固定这批对应点，解上面那个闭式最小二乘，得到新变换。\n<\/ol>\n<p>再重复，直到误差变化小于阈值。书里明确指出：<strong>ICP 只能保证在欧氏度量下单调收敛到局部最小<\/strong>，不保证全局最优。原因很直白：第一步&quot;找最近点&quot;在错误的变换下会配错，配错的对应点又把变换拉向错误方向，于是卡在局部坑里。工程上的补救是先用特征（FPFH 之类）做粗配准给出初值，再上 ICP 精修；或者用随机采样一致性（RANSAC）反复抽三对点、算变换、用一致程度打分，选最好的初值。<\/p>\n<p>点云稀疏时还有个改进（Chen 等）：不用&quot;点到点&quot;距离，而用&quot;源点沿法向投到目标曲面的交点&quot;作为对应，度量改成点到切平面的距离，收敛更快。<\/p>\n<p><strong>非刚性配准<\/strong>（难度：高难）。人体、软组织、表情扫描这类数据不能只用刚体变换。三种典型路线：<\/p>\n<ul><li>\n<strong>薄板样条（TPS）<\/strong>：把形变写成一个&quot;弯曲能量最小&quot;的插值函数。薄板能量 ʃʃ[(∂²f/∂x²)² + 2(∂²f/∂x∂y)² + (∂²f/∂y²)²] 衡量函数弯得有多厉害，能量最小意味着&quot;用最不弯的方式把对应点拉过去&quot;。它适合做全局平滑的大形变。\n<\/li><li>\n<strong>带锚点的非刚性配准<\/strong>：少量人工指定的对应点当锚点，约束整体不被拉歪，再用形变场拟合其余点。书里给了三阶段权重安排（先只按锚点预变形、再加配准误差项、最后降锚点权重微调），本质是&quot;先粗对齐、再让数据说话&quot;。\n<\/li><li>\n<strong>拟刚体变形<\/strong>：把模型切成若干块，每块只允许近似刚体运动，块与块之间的连接处允许少量拉伸。这样既能贴合大幅动作，又不会把局部形状揉烂——这就是后面第 6 章 ARAP 思想的前身。\n<\/ul>\n<h3>概念 2：显式重建——直接连三角形<\/h3>\n<p>先复习两个基本对象（第 1 章提过，这里要用）：<\/p>\n<ul><li>\n<strong>Voronoi 图<\/strong>：给每个采样点分一块地盘，地盘内的任意位置离这个点最近。\n<\/li><li>\n<strong>Delaunay 三角剖分<\/strong>：Voronoi 的对偶图——地盘相邻的采样点之间连边，形成三角剖分。\n<\/ul>\n<p>Delaunay 有几条必须记住的性质：二维下剖分唯一（除非四点共圆）；三角形外接圆内不含其它采样点；结果满足<strong>最小角最大化<\/strong>（三角形尽量接近正三角形）。最后一条是它在网格生成里不可替代的原因。<\/p>\n<p><strong>Crust 算法<\/strong>（难度：高难）。思路是&quot;用 Voronoi 顶点当帮手&quot;。二维情形：把采样点集 P 的 Voronoi 顶点也加进去，得到 P ∪ V 的 Delaunay 剖分；只保留两端点都来自 P 的边，这些边组成 Crust。直观解释：Voronoi 顶点位于&quot;两个采样点地盘的交界&quot;，也就是曲面中轴附近；把它们加入后，中轴附近的边会被&quot;抢走&quot;，剩下的边就贴着曲面。<\/p>\n<p>三维要难一些：对每个采样点 p，它所在 Voronoi 单元里离它最远的两个顶点（分居曲面两侧）叫<strong>极点<\/strong> p⁺、p⁻。算法步骤是：算 Voronoi 图；对不在凸包上的 p 取最远 Voronoi 顶点作为 p⁺ 方向；对在凸包上的 p 用相邻三角形外法向平均作为 p⁺；再取与 p⁺ 点积为负且最远的作为 p⁻；最后把极点加入采样集重算 Delaunay，只保留三个顶点都属于原始点集的三角形。<\/p>\n<p>再加一步<strong>法向滤波<\/strong>：极点向量 (p⁺ − p) 近似垂直于曲面，若某个三角形的法向与对应极点向量差太多，就丢掉。递归删掉&quot;锐边&quot;相邻的三角形，剩下的就是重建曲面。<\/p>\n<p><strong>Power Crust<\/strong>（难度：高难）：用带权 Voronoi（Power 图）处理采样密度不均匀的情况，每个点带一个半径，等于它到最近邻距离的一部分。<strong>Cocone<\/strong>（难度：高难）：用&quot;锥形条件&quot;筛三角形——三角形的对偶 Voronoi 边必须落在一个以极点方向为轴的窄锥内，这样能保证输出是流形、且法向收敛。<\/p>\n<p>这类方法（统称 Delaunay 基重建）有理论保证：采样足够密、噪声足够小时，重建结果与真实曲面同胚。代价是三维 Delaunay 三角化的复杂度高、实现难，而且<strong>怕噪声、怕缺失<\/strong>——一点噪声就让 Delaunay 结构改变，一个扫描盲区就让输出不封闭（不水密）。所以它们适合&quot;高质量、高密度、低噪声&quot;的点云。<\/p>\n<h3>概念 3：隐式重建——先求场，再挖面<\/h3>\n<p>隐式重建不直接连面，而是先构造一个定义在全空间的函数 f，让 f = 0 正好是曲面，然后用 Marching Cubes 之类的方法把零等值面挖成三角形。<\/p>\n<p><strong>符号距离场（SDF）+ 移动最小二乘<\/strong>（难度：进阶）。最直接的想法：f(x) = 到最近采样点的距离，符号由法向定。但这样 f 在每个采样点处是尖的（不可导），且对法向噪声极敏感。改进是<strong>移动最小二乘法（MLS）<\/strong>：在查询点 x 附近取一圈邻居，局部拟合一个平面或二次曲面，用拟合值当 f(x)。书里写作<\/p>\n<pre><code>f̂_x = argmin_f Σ_i θ(|x − p_i|) (f(p_i) − g_i)²<\/code><\/pre>\n<p>θ 是随距离衰减的权重。MLS 把&quot;符号敏感&quot;的问题缓和了（局部平均），是目前点云处理的基础工具（PCL 里的标配）。<\/p>\n<p><strong>径向基函数（RBF）<\/strong>（难度：高难）。把 f 写成一组&quot;钟形&quot;函数的叠加：<\/p>\n<pre><code>f(x) = G(x) + Σ_i λ_i φ(|x − p_i|)<\/code><\/pre>\n<p>G 是低次多项式（保证精度），φ 是径向对称的基（常用 φ(r) = r³ 或 r² log r）。未知系数 λ_i 由插值条件定：曲面采样点处 f = 0，再在法向方向上取偏移点让 f 等于偏移量。φ 是全局支撑的，所以解的是一个<strong>稠密<\/strong>线性系统——点数上万就难算，通常要 Fast Multipole 加速。<\/p>\n<p><strong>Poisson 重建<\/strong>（难度：高难）。这是隐式重建里工程上最成功的一个。核心观察：如果 f 是&quot;内部为 1、外部为 0&quot;的指示函数，那么它的梯度 ∇f 在曲面处是一个指向内法向的&quot;脉冲场&quot;——也就是采样法向场。所以反过来：<strong>已知法向场 V，求 f 使 ∇f ≈ V<\/strong>。<\/p>\n<p>∇f = V 是一个超定问题（三个分量方程对一个未知函数），最小二乘解正好是 Poisson 方程：<\/p>\n<pre><code>Δf = ∇·V<\/code><\/pre>\n<p>左边是 Laplace 算子，右边是法向场的散度。做法是：把法向场 V 用八叉树的节点基函数（每个节点一个平滑的&quot;盒式滤波&quot;函数）表示，得到稀疏的散度向量；解一个稀疏线性系统（可以用多重网格，因为八叉树的层次天然对应多尺度）；最后对 f 取某个等值（通常用采样点的平均值）做 Marching Cubes。<\/p>\n<p>它比 SDF 稳的原因很实在：<strong>它拟合的是梯度，不是数值<\/strong>。梯度对常数偏移不敏感，所以不需要知道&quot;离曲面多远&quot;这种容易估错的量；它把所有采样点当成一个整体求一个全局一致解，噪声被平均掉。它也有代价：过度平滑细节、把薄结构糊掉，且对法向估计错误非常敏感（法向错了梯度就错了）。后来的&quot;筛选 Poisson&quot;（Screened Poisson）加了一个&quot;解要靠近采样点&quot;的项，才把细节找回来。<\/p>\n<p><strong>多层单元剖分（MPU）<\/strong>（难度：高难）。把空间切成八叉树小格，每格用三类局部函数之一拟合：一般光滑部分用二元二次多项式、边缘用两片二次曲面拼接、拐角用三片。适合超大点集和带尖锐特征的模型，缺点是对噪声不友好。<\/p>\n<h3>概念 4：曲面光顺——把噪声压下去但别把特征磨平<\/h3>\n<p>扫描数据必然带高频抖动。光顺（smoothing）的目标是：把抖动去掉，但边缘、尖角、棱线要留下。<\/p>\n<p><strong>顶点位置光顺<\/strong>（难度：基础）。最简单的做法直接用第 1 章的离散 Laplace：<\/p>\n<pre><code>x_i ← x_i + ε Δx_i,   ε 取很小（例如 0.001—0.01）<\/code><\/pre>\n<p>这叫<strong>显式 Laplacian 光顺<\/strong>，等价于热传导：噪声（高频）衰减快，大形状（低频）衰减慢。它的两个问题：一是网格整体向内收缩（Laplace 方向指向内部，见第 1 章的例子）；二是步长稍大就爆炸。修法是<strong>Taubin 光顺<\/strong>：交替做一次正向（λ 倍）和一次反向（μ 倍，μ 为负且绝对值更大），让收缩和膨胀抵消，只留高频衰减。<\/p>\n<p><strong>法向光顺<\/strong>（难度：进阶）。不动顶点位置，只修正每个面/顶点的法向，再用新法向重建位置。好处是保体积、保特征更自然。做法核心是<strong>双边滤波<\/strong>：对某个面片 f，取其邻域 N(f) 内的面片 g，加权平均它们的法向：<\/p>\n<pre><code>n̂_f = (1/W) Σ_{g∈N(f)} w_s(|c_f − c_g|) · w_r(|n_f − n_g|) · n_g<\/code><\/pre>\n<p>w_s 是空间核（离得近权重大），w_r 是值域核（法向差别小的权重大）。两项一乘，<strong>跨过棱线时法向差别大，值域权重趋于 0，于是另一侧的三角形几乎不参与平均<\/strong>——这就是&quot;保特征&quot;的机制。图像上的双边滤波同理：颜色差别大的像素不互相平滑，所以边缘留住。<\/p>\n<p><strong>数据驱动的法向滤波<\/strong>（难度：高难）。手工核函数的参数（σ_s、σ_r）不好定，于是把&quot;某个面片及其若干次双边滤波结果&quot;拼成一个描述子（FEND，面法向滤波描述子），送进神经网络，让网络输出滤波后的法向。本质是把&quot;该平滑多少&quot;这个判断从人手交给数据。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[原始点云] --&gt; B[配准&lt;br/&gt;刚性 ICP / 非刚性 TPS]\n    B --&gt; C{数据质量}\n    C --&gt;|高密度 低噪声| D[显式重建&lt;br/&gt;Crust / Power Crust / Cocone]\n    C --&gt;|有噪声 有缺失| E[隐式重建&lt;br/&gt;SDF-MLS / RBF / Poisson]\n    D --&gt; F[网格曲面]\n    E --&gt; F\n    F --&gt; G[光顺&lt;br/&gt;顶点 Laplacian / 法向双边 / FEND]\n    G --&gt; H[可用于后续章节的网格]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：图里的分叉点是&quot;数据质量&quot;，这是全章最重要的决策。看这张图要记住：显式方法给理论保证但要干净数据，隐式方法能容噪声但会过平滑；光顺永远放在最后一步，因为它会改变几何，先光顺再配准会破坏对应关系。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：显式重建像&quot;沿着人群的外轮廓把相邻的人用绳子连起来&quot;——必须先看清谁挨着谁，人群一乱（噪声）绳子就乱连。隐式重建像&quot;用雾气把整个人群包起来，再按等浓度面切出形状&quot;——即使有人站位错乱，雾的形状整体还是对的；代价是细节被雾糊掉。<strong>失效边界<\/strong>：雾不能太浓（过度平滑会吃掉薄壁和手指这类细结构），也不能太稀（噪声就重新显形）。<\/p>\n<p><strong>实例（可手算的 ICP）<\/strong>：设目标点云是三点 (0,0)、(2,0)、(0,2)；源点云是把它们绕原点旋转 30° 得到的 (0,0)、(1.732,1)、( −1,1.732)。已知&quot;编号对应&quot;时，闭式解给出的旋转正好是 30°，残差为 0。但如果初值是旋转 0°，第一次&quot;找最近点&quot;会把源点 (1.732, 1) 配到目标 (2, 0)（距离 ≈ 1.03，比配到 (0,2) 的 1.9 小），解出的旋转约 24°；下一轮对应点不变，旋转被拉到 30°。这说明两件事：对应关系在小旋转下会被逐步纠正（单调收敛），而初值偏差大时就会配错并卡住（局部最优）。<\/p>\n<p><strong>实例（双边滤波保特征）<\/strong>：设某面片法向为 (0,0,1)，邻居里有一半法向 (0,0,1)、一半法向 (1,0,0)（代表一个 90° 棱）。若 σ_r 取 0.1，则跨棱邻居的 w_r = exp(−|差|²/(2×0.1²)) = exp(−50) ≈ 0，完全不参与；若 σ_r 取 1.0，则 w_r = exp(−0.5) ≈ 0.61，跨棱邻居参与一半权重，棱就被磨圆了。<strong>这就是 σ_r 必须按模型的棱角尺度来定的原因。<\/strong><\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;ICP 一定能找到全局最优&quot;<\/strong>——实际上它只是交替下降，每步都下降但不保证到全局最小。这就是所有工业流程都要先做粗配准（特征匹配/RANSAC）给初值的原因。\n<\/li><li>\n<strong>别以为&quot;点云越密，重建一定越好&quot;<\/strong>——实际上显式方法的理论保证要求&quot;采样密度相对于特征尺寸足够高&quot;，即<strong>局部特征尺度<\/strong>采样定理。一个薄壁结构上点再密，若跨壁两侧的点混在一起，Delaunay 会把两壁连成一片，结果是实心块而不是薄壳。\n<\/li><li>\n<strong>别以为&quot;Poisson 重建比 Crust 先进，所以一律用 Poisson&quot;<\/strong>——实际上 Poisson 拟合梯度，天然会平滑掉小于八叉树最细层的细节，且对法向噪声敏感；数据干净、要求拓扑精确时，Cocone 一类仍更可靠。\n<\/li><li>\n<strong>别以为&quot;隐式重建的输出天然是水密的&quot;<\/strong>——实际上只有采样覆盖完整时才是。扫描盲区会让场在缺口处没有约束，Marching Cubes 会补出一层&quot;假面&quot;，或者干脆留洞。\n<\/li><li>\n<strong>别以为&quot;光顺只是去噪，不改形状&quot;<\/strong>——实际上 Laplacian 光顺一定收缩（因为 Δx 指向内部），大曲率区域收缩更明显。做尺寸敏感的应用（如 3D 打印配合）时必须用体积保持或 Taubin 类方法。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n（单选）ICP 的每一次迭代包含哪两步？\n<p>A. 求特征 + 分类　B. 找最近点对应 + 解闭式最优变换　C. 三角化 + 抽等值面　D. 估法向 + 双边滤波 <strong>答案<\/strong>：B。<strong>解析<\/strong>：ICP 的核心就是&quot;对应—求解&quot;交替；特征与分类属于学习型方法，三角化属于重建，双边滤波属于光顺。<\/p>\n<\/ol>\n<ol><li>\n（单选）Poisson 重建求解的方程是？\n<p>A. ∇f = 0　B. Δf = ∇·V　C. f = 距离场　D. ∇×V = 0 <strong>答案<\/strong>：B。<strong>解析<\/strong>：由&quot;求 f 使 ∇f ≈ V&quot;的最小二乘正规方程得到 Δf = ∇·V，左边 Laplace、右边法向场散度。<\/p>\n<\/ol>\n<ol><li>\n（填空）Delaunay 三角剖分满足&quot;最小角最大化&quot;，含义是＿＿＿＿；它带来的实际好处是＿＿＿＿。\n<p><strong>答案<\/strong>：在所有可能的三角剖分中，让最小内角尽可能大；三角形更接近正三角形，网格质量好，离散算子（如余切 Laplace）不会因钝角出现负权重。<\/p>\n<\/ol>\n<ol><li>\n（简答）为什么显式重建方法&quot;怕噪声、怕缺失&quot;？\n<p><strong>答案要点<\/strong>：显式方法依赖 Delaunay 结构判断&quot;哪些三角形该留&quot;，而 Delaunay 由采样点的精确位置决定；噪声会改变点位置从而改变剖分结构，导致筛掉的三角形错位；缺失会让局部没有采样，重建结果不封闭、不水密。隐式方法把约束摊到全空间的场上，单点噪声被平均，所以更稳。<\/p>\n<\/ol>\n<ol><li>\n（简答）双边滤波里&quot;空间核&quot;和&quot;值域核&quot;分别起什么作用？去掉其中一个会怎样？\n<p><strong>答案要点<\/strong>：空间核限制平滑的邻域范围（远处的面片不参与），保证局部性；值域核按法向差异降权，使跨棱的面片不互相平均，从而保特征。去掉值域核就退化成普通高斯/邻域平均，棱被磨圆；去掉空间核则全模型互相影响，等于全局平均，形状会被拉平。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n配准永远在&quot;对应&quot;与&quot;变换&quot;之间交替；ICP 是局部方法，初值靠粗配准。\n<\/li><li>\n显式重建（Crust/Power Crust/Cocone）要干净数据，给理论保证；隐式重建（MLS/RBF/Poisson）能容噪声，代价是过平滑。\n<\/li><li>\nPoisson 重建的关键词是&quot;梯度拟合&quot;：解 Δf = ∇·V，八叉树基函数让系统稀疏可解。\n<\/li><li>\n光顺的两条路线：动位置（Laplacian/Taubin，会收缩）与动法向（双边/FEND，更保特征）。\n<\/ul>", "kind": "chapter", "title": "第 2 章：点云曲面重建和光顺"}, "ch03": {"html": "<h1>第 3 章：网格曲面的参数化和多分辨率表示<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：8 小时 | <strong>前置<\/strong>：第 1 章的离散 Laplace 与余切权重、第 2 章的网格质量概念；矩阵最小二乘\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说清参数化要满足什么条件，以及&quot;无翻转&quot;为什么必须专门处理。\n<\/li><li>\n写出调和参数化的最小二乘形式，并解释为什么固定边界后它一定有唯一解。\n<\/li><li>\n说明保角与保面积为什么不能同时做到，ASAP 与 MIPS 各自在优化什么。\n<\/li><li>\n用 QEM 判断一条边该不该坍缩，并说明渐进网格如何把简化过程存成可逆记录。\n<\/li><li>\n说出三角带和 Edgebreaker 各压缩了哪部分冗余，压缩比大致来自哪里。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>参数化是&quot;把曲面摊平&quot;——它把三维形状变成一张二维图，代价是必然产生扭曲；整个第 3 章的技巧，都在<strong>选择让哪种扭曲小一点、并保证摊平后不翻面<\/strong>。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：为什么要把曲面摊平<\/h3>\n<p>两件真实需求：贴纹理需要每个顶点有 (u, v) 坐标（GPU 按二维坐标采样图片）；传输和绘制需要更少的数据量（简化与压缩）。这三件事（参数化、多分辨率、压缩）看起来无关，其实都在回答同一个问题：<strong>这个网格里哪些信息是必要的、哪些是冗余的<\/strong>。<\/p>\n<h3>概念 2：参数化——摊平，但不能翻面<\/h3>\n<p><strong>参数化<\/strong>（难度：进阶）就是给每个顶点算一个平面坐标 (u_i, v_i)，要求这个映射是<strong>一一对应<\/strong>的（同胚）：不重叠、不撕裂、不翻面。<\/p>\n<p><strong>调和参数化<\/strong>（难度：进阶）。思路是让内部顶点在平面上的位置等于其邻居的平均——这正是第 1 章的离散 Laplace 取零：<\/p>\n<pre><code>Δu_i = 0,  Δv_i = 0  （对所有内部顶点）<\/code><\/pre>\n<p>用余切权重展开就是<\/p>\n<pre><code>Σ_j w_ij (u_j − u_i) = 0,   w_ij = cot α_ij + cot β_ij<\/code><\/pre>\n<p>边界顶点的坐标是已知量（比如把边界固定在一个圆或正方形上），于是这变成一个线性方程组：内部顶点的 u（和 v）是未知量，边界是已知项。写成矩阵形式 A x = b，A 是对称正定（在合适权重下）的稀疏矩阵，所以解存在且唯一。<\/p>\n<p><strong>Tutte 定理<\/strong>（难度：进阶）是这一步的理论靠山：如果网格同胚于圆盘、边界映射到<strong>凸<\/strong>多边形上、且所有权重为<strong>正<\/strong>，那么这个调和映射一定是双射（不重叠、不翻转）。这条定理解释了为什么参数化总从&quot;Tutte 嵌入&quot;起步——它是唯一有保证的起点。<\/p>\n<p>但它有代价：余切权重可以为负（钝角三角形），一旦出现负权重，Tutte 的保证就失效；而且固定成圆形边界会带来巨大的<strong>面积扭曲<\/strong>（圆盘被压成圆，中间被挤、边缘被拉）。<\/p>\n<p><strong>保角与保面积<\/strong>（难度：高难）。理想的摊平应该&quot;既不改变角度也不改变面积&quot;，但高斯告诉我们：曲面摊到平面不可能等距（除非它本来就是可展面，比如柱面、锥面）。所以只能二选一或折中：<\/p>\n<ul><li>\n<strong>保角（共形）<\/strong>：每个三角形在平面上保持原角度，形状像但大小变。数学条件是映射的 Jacobian 矩阵是两个奇异值相等的相似变换。\n<\/li><li>\n<strong>保面积<\/strong>：每个三角形面积不变，形状被剪歪。\n<\/ul>\n<p>实际纹理贴图更在意保角（角度失真看起来像拉伸，最刺眼），所以主流是 LSCM、ARAP、ASAP 这些&quot;尽量保角&quot;的能量。<\/p>\n<p><strong>ASAP<\/strong>（难度：高难）。它的能量写成<\/p>\n<pre><code>E = Σ_t A_t | J_t − Z_t |²_F     （F 为 Frobenius 范数）<\/code><\/pre>\n<p>其中 J_t 是三角形 t 的 Jacobian（从三维局部坐标到二维的参数化线性变换），Z_t 是&quot;与 J_t 最接近的相似变换&quot;：把 J_t 做奇异值分解 J = U Σ Vᵀ，取 σ̄ = (σ1 + σ2)/2，则 Z = U σ̄ I Vᵀ。于是它惩罚的是&quot;每个三角形偏离相似变换的量&quot;，也就是纯粹的<strong>形状扭曲<\/strong>，不惩罚大小。求解是交替的：固定 Z 解最小二乘求顶点坐标，再固定坐标对每个三角形重算 Z——这就是后面第 6 章 ARAP 的局部-全局迭代，套路完全一样。<\/p>\n<p><strong>MIPS 能量<\/strong>（难度：高难）用的是&quot;两个奇异值的比&quot; σ1/σ2，比值等于 1 才最优，无穷大表示退化（三角形被压成线）。它的优点是<strong>自带防翻转<\/strong>：翻转时带符号面积为负，能量趋于无穷，所以优化过程不会跨过翻转状态。<\/p>\n<p><strong>局部防翻转参数化<\/strong>（难度：高难）。真正工业级的需求是&quot;给我一些固定点（比如特征点必须落在纹理指定位置），其余尽量平顺，且不许翻转&quot;。做法分两类：<\/p>\n<ol><li>\n<strong>显式约束优化<\/strong>：把&quot;三角形有向面积 &gt; 0&quot;直接当约束（内点法/障碍函数法），能支持任意形变能量，但问题非凸，容易停在局部解。\n<\/li><li>\n<strong>能量自带障碍<\/strong>：用 MIPS 或伸缩能量，翻转时能量爆炸，优化自然避开。实现简单，但收敛慢、需要好的初值（通常先用 Tutte 起步）。\n<\/ol>\n<p><strong>多片参数化<\/strong>（难度：进阶）。复杂拓扑（多个洞）摊不成一整片平面，必须先切开（cut）成若干同胚于圆盘的片，各自摊平，再在接缝处对齐。切缝的选择直接影响扭曲：要沿曲率大的地方切（比如把圆柱沿母线切），切口会藏在视觉不敏感处。<\/p>\n<p><strong>渐进参数化<\/strong>（难度：高难）。从 Tutte 起步的扭曲往往很大，而扭曲能量高度非凸。渐进参数化的做法很巧：<strong>不用原始网格作为参考<\/strong>，而是构造一串中间&quot;参考三角形&quot;，让当前参数化结果与这串参考之间的仿射变换扭曲有界、同时逐步靠近原网格。等于把一个大跳变成了很多小步，从而避免一开始就在能量很高的地方打转。<\/p>\n<h3>概念 3：简化与多分辨率——少画几个三角形也不变样<\/h3>\n<p><strong>QEM（二次误差度量）<\/strong>（难度：进阶）。简化最常用的操作是<strong>边坍缩<\/strong>：把一条边的两个端点合并成一个，删掉退化的三角形。问题是怎么选边。QEM 给每个顶点维护一个二次型：<\/p>\n<pre><code>Q_i(x) = xᵀ A_i x + 2 b_iᵀ x + c_i = Σ_{planes p ∈ P(i)} (n_pᵀ x + d_p)²<\/code><\/pre>\n<p>含义是&quot;点 x 到与该顶点相关的所有平面的距离平方和&quot;。把边 (i, j) 坍缩到一个新位置 x̄ 时，误差近似为 (Q_i + Q_j)(x̄)，而 x̄ 的最优位置由 ∇(Q_i + Q_j) = 0 解出（一个 3×3 线性系统，可预先把 4×4 的齐次矩阵 Q 相加）。于是选边的规则就是：<strong>算每条边坍缩后的最小误差，选最小的那条<\/strong>，用优先队列维护。<\/p>\n<p>它的好处是把&quot;形状变化&quot;量化成了一个可累加的二次型：坍缩后的新顶点继承 Q_i + Q_j，后续误差自动包含历史损失。这就是为什么 QEM 几十年都是默认方案。<\/p>\n<p><strong>多分辨率表示<\/strong>（难度：进阶）。两种做法：<\/p>\n<ul><li>\n<strong>离散多分辨率<\/strong>：预先生成几套不同精度的模型，绘制时按需切换。问题是切换会&quot;跳&quot;（同一位置三角形配置完全不同），观感突变。\n<\/li><li>\n<strong>连续多分辨率（渐进网格 PM）<\/strong>：只存最粗的模型 + 一串<strong>顶点分裂<\/strong>记录（每条记录包含新顶点位置和受影响的三角形）。想看精细就逐个做分裂，想粗就合并。这样任意精度都能构造出来，切换平滑。\n<\/ul>\n<p>书里特别指出：渐进网格的价值不是&quot;省存储&quot;，而是<strong>任意分辨率都可重建 + 误差可控<\/strong>。分解（粗化）和重建（细化）是同一套操作的正反两向。<\/p>\n<h3>概念 4：压缩编码——冗余到底在哪<\/h3>\n<p><strong>三角带<\/strong>（难度：基础）。网格里每个三角形存 3 个顶点索引，相邻三角形共享一条边，于是每新增一个三角形其实只需要 1 个新顶点。<strong>三角带（triangle strip）<\/strong>就是按&quot;每加一个顶点生成一个新三角形&quot;的顺序排列，平均每三角形约 1 个索引，压缩比接近 3:1。交替左右绕向能一直连下去（锯齿带）。<\/p>\n<p><strong>广义三角带<\/strong>（难度：进阶）。真实网格的三角形无法排成一条长带（有分支、有孔洞）。广义三角带用几个控制字来维护顶点缓存：<\/p>\n<ul><li>\n<strong>Restart<\/strong>：结束当前带，另起一条；\n<\/li><li>\n<strong>Reset Reverse<\/strong>：翻转三角形绕向；\n<\/li><li>\n另外还有&quot;只用一个新顶点&quot;、&quot;复用缓存里第 n 个顶点&quot;之类的指令。\n<\/ul>\n<p>配合一个 16 项的顶点缓存（LRU），大多数网格能做到接近理论的 0.5—1 索引/三角形。这就是 GPU 里 index buffer 优化的基本原理（微软的 Direct3D 与后来的 meshoptimizer 都是这个思路）。<\/p>\n<p><strong>单网格压缩（Edgebreaker）<\/strong>（难度：高难）。拓扑编码的经典：沿着网格的边做一个&quot;深度优先&quot;遍历，每经过一个三角形，用一个符号记录它的第三种情况：<\/p>\n<ul><li>\n<strong>C<\/strong>：下一个三角形还没访问过，继续深入；\n<\/li><li>\n<strong>L / R<\/strong>：左边或右边的邻居已访问，转向；\n<\/li><li>\n<strong>S<\/strong>：遇到分叉（自相交的边界），需要记录一个&quot;栈&quot;位置；\n<\/li><li>\n<strong>E<\/strong>：走到尽头，结束一个连通分支。\n<\/ul>\n<p>只用 5 个符号（约 2 bit/三角形）就能编码任意连通网格的<strong>拓扑<\/strong>，几何（顶点坐标）再单独量化压缩。理论下界约 3.24 bit/顶点，Edgebreaker 在 4—5 bit/顶点量级，是目前最简洁的方案之一。<\/p>\n<p><strong>渐进压缩与序列编码<\/strong>（难度：高难）。把&quot;渐进网格&quot;和&quot;熵编码&quot;结合起来：先传最粗模型，再逐层传细化记录，接收端可以随时停止解码得到一个可用模型。<strong>渐进式森林分裂<\/strong>是处理大网格并行的方案：把网格切成树的形状，各子树独立编码、独立解码，从而支持流式加载和随机访问。<strong>网格序列压缩<\/strong>则针对动画序列（顶点数不变、每帧位置变化），利用帧间相关性做预测编码。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[输入网格] --&gt; B[参数化&lt;br/&gt;摊到平面]\n    A --&gt; C[简化&lt;br/&gt;边坍缩 QEM]\n    A --&gt; D[压缩编码&lt;br/&gt;拓扑 + 几何]\n    B --&gt; B1[Tutte 起步&lt;br/&gt;有保证但扭曲大]\n    B1 --&gt; B2[能量优化&lt;br/&gt;ASAP/MIPS/ARAP]\n    B2 --&gt; B3[防翻转&lt;br/&gt;约束或障碍]\n    C --&gt; C1[渐进网格 PM&lt;br/&gt;可逆坍缩序列]\n    C1 --&gt; C2[连续多分辨率&lt;br/&gt;任意精度重建]\n    D --&gt; D1[三角带&lt;br/&gt;省索引]\n    D --&gt; D2[Edgebreaker&lt;br/&gt;省拓扑]\n    D2 --&gt; D3[渐进/序列编码&lt;br/&gt;流式传输]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：三条分支分别对应&quot;平面化&quot;&quot;变少&quot;&quot;变短&quot;。要抓的联系是：参数化的产物（(u, v) 坐标）是压缩与纹理的前提；简化的产物（坍缩序列）是多分辨率传输的前提；两者最终在第 4 章汇合——重网格化其实就是&quot;用更好的参数化 + 更好的采样重排一遍&quot;。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：把网格摊平像给橘子剥皮后压平。皮一定得撕开几道口子（切缝），压平后有些地方被拉长（靠近切口处），有些地方被挤出皱纹（中间）。想让它尽量平整，就要选好从哪儿撕。<strong>失效边界<\/strong>：橘子皮是近似可展的（球面只能近似摊平），而复杂模型上还会有&quot;必须在三维里才能表达的部分&quot;（比如薄壁两面的贴合），这时切缝再多也无法完全避免重叠。<\/p>\n<p><strong>实例（可算的调和参数化）<\/strong>：取一个正方形网格，4 个角点是边界，内部只有一个中心顶点，四条边中点也在边界上。中心顶点与四个角点相连。设所有权重为 1（等权 Laplacian），4 个角点固定在 (0,0)、(1,0)、(1,1)、(0,1)。<\/p>\n<p>中心顶点的方程是 4u_c − (0 + 1 + 1 + 0) = 0，得 u_c = 0.5；同理 v_c = 0.5。于是中心落在正方形正中——这正是&quot;等权平均&quot;的几何含义：位置等于邻居的平均。如果改用余切权重，且四个角对应的三角形形状不同，中心会被拉向角更尖的一侧。这就是余切权重&quot;更符合连续几何&quot;的直观体现。<\/p>\n<p><strong>实例（QEM 判一条边）<\/strong>：一个平面上的正方形网格（z = 0），所有顶点都在同一平面。某条边坍缩后的误差是 0（因为新点仍在平面上，到所有平面距离仍为 0）。这解释了为什么平面区域的简化会先被压平得很厉害——误差为零的边可以无限坍缩，直到没有平面区域可删。相反，两个法向差别很大的面（比如 90° 的角）上，某个坍缩点的误差约等于&quot;它偏离两个面各多远&quot;的平方和，数值上明显大于 0，于是优先队列会最后才动它。<strong>这就是&quot;平面先被简化、特征被保留&quot;的机制。<\/strong><\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;参数化就是投影&quot;<\/strong>——实际上投影（比如沿 z 方向压到 xy 平面）在有回折的曲面上会产生重叠，不是双射。参数化要求拓扑上的一一对应，必须解一个全局方程，而不是逐点投影。\n<\/li><li>\n<strong>别以为&quot;保角和保面积可以同时优化到零扭曲&quot;<\/strong>——实际上只有可展曲面能做到等距。一般曲面必须接受某种扭曲，选择标准取决于应用：纹理看重保角，测量/统计看重保面积。\n<\/li><li>\n<strong>别以为&quot;Tutte 参数化一定不翻转&quot;<\/strong>——实际上定理的前提是&quot;边界凸 + 权重全为正&quot;。余切权重在钝角处为负，直接用就会翻。工程上要么用正权重（比如均匀权重或重心权重），要么换成带障碍的能量。\n<\/li><li>\n<strong>别以为&quot;简化就是把顶点删掉，删得越多越好&quot;<\/strong>——实际上删点必须更新拓扑和误差，且要维护特征（边界、锐边）。QEM 之所以成功，是因为误差可累加、可选位置最优；随手删点会很快毁掉形状。\n<\/li><li>\n<strong>别以为&quot;压缩就是 zip&quot;<\/strong>——实际上网格压缩是&quot;去掉结构冗余&quot;：三角带去掉重复索引，Edgebreaker 去掉拓扑描述，几何量化去掉坐标精度。通用的熵编码只是最后一步贴补。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n（单选）Tutte 定理保证参数化不翻转的条件是？\n<p>A. 权重全为正且边界映射到凸多边形　B. 网格是闭合的　C. 使用余切权重　D. 三角形都接近正三角形 <strong>答案<\/strong>：A。<strong>解析<\/strong>：Tutte 定理要求边界为凸且权重为正；闭合网格、余切权重、等边性都不是该定理的条件（闭合曲面本身还得先切开）。<\/p>\n<\/ol>\n<ol><li>\n（单选）QEM 选边的依据是？\n<p>A. 边最长　B. 边所在三角形面积最大　C. 坍缩后到相关平面距离平方和最小　D. 顶点度数最高 <strong>答案<\/strong>：C。<strong>解析<\/strong>：QEM 用二次型度量&quot;新顶点到原平面族的距离平方和&quot;，选误差最小的边坍缩。<\/p>\n<\/ol>\n<ol><li>\n（填空）Edgebreaker 用 5 个符号编码拓扑，其中 C 表示＿＿，S 表示＿＿。\n<p><strong>答案<\/strong>：继续深入到一个未访问的三角形；遇到分叉、需要压栈记录。<\/p>\n<\/ol>\n<ol><li>\n（简答）为什么参数化的扭曲能量普遍很难优化？给出两个原因。\n<p><strong>答案要点<\/strong>：一是能量高度非线性且非凸（含奇异值、比值等），存在大量局部极小；二是防翻转要靠障碍或约束，可行域边界附近能量趋无穷，优化步长必须很小。这也解释了为什么工程上都先用 Tutte 给初值、或用渐进参考三角形把大跳分解成小步。<\/p>\n<\/ol>\n<ol><li>\n（简答）连续多分辨率表示相比&quot;预生成几套模型&quot;的优势是什么？\n<p><strong>答案要点<\/strong>：它保存的是可逆的细化/粗化记录，因此可以在任意分辨率重建（不局限于预设的几档），误差可量化控制；切换时是连续变化，不会出现三角形配置突变造成的视觉跳变。代价是需要维护层次结构与依赖关系。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n参数化三件套：Tutte 起步（凸边界+正权重）→ 能量优化（ASAP 保角、MIPS 防翻转）→ 切缝与多片。\n<\/li><li>\n简化的核心是误差能否累加，QEM 用二次型做到这一点，渐进网格把它存成可逆序列。\n<\/li><li>\n压缩分两层：拓扑（Edgebreaker，约 2 bit/三角形）与几何（量化 + 预测），三角带省的是索引冗余。\n<\/ul>", "kind": "chapter", "title": "第 3 章：网格曲面的参数化和多分辨率表示"}, "ch04": {"html": "<h1>第 4 章：网格模型的重网格化<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：6 小时 | <strong>前置<\/strong>：第 3 章的参数化与切缝；第 1 章的带约束优化；向量场的基本概念\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说清重网格化与简化、与参数化的区别，并列出至少四类&quot;网格需求&quot;。\n<\/li><li>\n解释方向场为什么有&quot;周期跳跃&quot;，并说明为什么用 cos(4θ)、sin(4θ) 可以消掉整数变量。\n<\/li><li>\n说明奇异点是怎么产生的，以及它为什么对应四边形网格里的 3 价或 5 价顶点。\n<\/li><li>\n对比三类六面体网格化路线（晶格覆盖/八叉树、标架场参数化、多立方体）的适用条件。\n<\/li><li>\n判断一个给定的模型该走&quot;四边形路线&quot;还是&quot;六面体路线&quot;。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>重网格化要回答的是&quot;用什么样的单元、按什么方向、以什么密度重新铺一遍表面或体&quot;——所有方法的技术核心都是<strong>先求一个场（方向场/标量场），再按这个场抽网格<\/strong>。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：重网格化到底在换什么<\/h3>\n<p>第 3 章的简化是&quot;减少顶点&quot;，参数化是&quot;摊平&quot;。重网格化是第三件事：<strong>保持形状，换一套更规整的采样<\/strong>。顶点数可以变多（比如把扫描得到的乱三角网格换成整齐的四边形网格），拓扑也可以全变。<\/p>\n<p>为什么要换？因为不同应用要的东西不一样。书里列的典型需求：<\/p>\n<ol><li>\n<strong>形状误差小<\/strong>，关键特征（棱线、尖角）不能糊；\n<\/li><li>\n<strong>单元形状好<\/strong>——三角形接近等边、四边形接近正方形，因为有限元求解的精度与条件数直接依赖单元形状；\n<\/li><li>\n<strong>单元数量可控<\/strong>——仿真算力和误差都跟单元数挂钩；\n<\/li><li>\n<strong>拓扑结构规整<\/strong>——四边形网格的边能连成&quot;网格线&quot;（edge flow），这对纹理、曲面拟合、六面体铺层都是前提；\n<\/li><li>\n<strong>特征对齐<\/strong>——棱线要落在网格线上，而不是横穿单元。\n<\/ol>\n<p>所以书里说得很直白：<strong>不存在&quot;最好的网格&quot;，只存在&quot;适合某个需求的网格&quot;<\/strong>。三角形/四面体网格靠 Delaunay 就能做到成熟稳定，但四边形/六面体在&quot;结构规整&quot;上有天然优势，因此成为本章重点——也正因为难，才需要方向场、整数规划这些重武器。<\/p>\n<h3>概念 2：四边形化 = 参数化 + 取整数格点<\/h3>\n<p>四边形化最经典的路线是<strong>全局参数化法<\/strong>：把曲面切成若干片（chart），每片摊到平面得到 (u, v)；然后在平面上按<strong>整数格点<\/strong>（u、v 都取整数）连出正方形网格，再映回曲面。<\/p>\n<p>这里立刻出现一个相容性问题：两个相邻片 M_i、M_j 在公共边界上必须画出<strong>同一套<\/strong>四边形顶点。书里给出的必要条件是：跨过公共部分的映射，必须能通过 <strong>90° 的整数倍旋转<\/strong>加<strong>整数平移<\/strong>互相对应。换成坐标语言：u、v 在片与片之间的变换必须是<\/p>\n<pre><code>u&#x27; = a u + b v + m,   v&#x27; = c u + d v + n<\/code><\/pre>\n<p>其中 (a b; c d) 是 90° 的整数倍旋转（四种：0°、90°、180°、270°），m、n 是整数。这就是<strong>周期跳跃<\/strong>的源头：不是&quot;坐标系旋转了 90°，向量就真的转了 90°&quot;，而是&quot;跨片时参数坐标要经过一次离散变换&quot;。<\/p>\n<h3>概念 3：方向场与周期跳跃<\/h3>\n<p><strong>方向场（交叉场）<\/strong>（难度：高难）。四边形网格的走向由每点的两个正交方向决定（实际存 4 个方向，因为 ±u、±v 等价）。麻烦在于：方向场是&quot;无朝向&quot;的——你把 u 换成 −u，铺出来的四边形一样。所以在相邻两点之间做插值时，得先约定&quot;怎么对齐这 4 个方向的编号&quot;。<\/p>\n<p>数学上常用两种写法：<\/p>\n<ol><li>\n<strong>带整数变量的写法<\/strong>：在每条边上记一个整数 k_e，表示跨过这条边时方向编号要循环移动 k_e 步。优化时 k_e 是整数变量，于是问题变成<strong>混合整数规划<\/strong>——求解昂贵。\n<\/li><li>\n<strong>三角函数写法<\/strong>：把角度乘以 4 再取 (cos 4θ, sin 4θ)。因为旋转 90° 对应 θ 加 π/2，乘 4 后就是加 2π，三角函数值不变——<strong>整数变量自动消失了<\/strong>。这也是书里强调的&quot;利用周期性去除变量&quot;。\n<\/ol>\n<p><strong>奇异点<\/strong>（难度：进阶）。想象你站在一个顶点上，绕它走一圈回到原处，方向场的值必须和出发时一致。如果方向场在这一圈里累积的旋转不是 90° 的整数倍（在乘 4 的表示里不是 2π 的整数倍），那它就不可能连续地对齐回来——这个点就是<strong>奇异点<\/strong>。<\/p>\n<p>奇异点无法避免，而且正是四边形网格里那些&quot;不能四根边都接上&quot;的顶点。用<strong>价<\/strong>（n，连出去的边数）来记账，指数定义为<\/p>\n<pre><code>index = (4 − n) / 4<\/code><\/pre>\n<ul><li>\n<strong>3 价顶点<\/strong>：指数 +1/4（四个这样的顶点凑成 +1）；\n<\/li><li>\n<strong>5 价顶点<\/strong>：指数 −1/4；\n<\/li><li>\n<strong>4 价顶点<\/strong>：指数 0，就是普通规则顶点。\n<\/ul>\n<p><strong>Poincaré-Hopf 定理<\/strong>（离散版）说：闭合网格上所有顶点指数之和等于欧拉示性数 χ。球面 χ = 2，所以<\/p>\n<pre><code>Σ (4 − n_i)/4 = 2<\/code><\/pre>\n<p>一个球面的四边形网格因此<strong>至少要 8 个 3 价顶点<\/strong>（8 × 1/4 = 2），或者用&quot;5 价与 3 价混合、净和仍为 2&quot;的方式凑。你不可能铺出一个完全没有奇异点的四边形球面——这就是为什么所有四边形模型上都能看到几个&quot;三条边交会&quot;或&quot;五条边交会&quot;的点。<\/p>\n<p>（顺带一个能自查的例子：四面体的三角网格所有顶点都是 3 价，若直接当四边形骨架，指数和 = 4 × 1/4 = 1 ≠ 2，说明它的拓扑配不上球面的四边形网格，必须细分并补入更多奇异点。）<\/p>\n<p><strong>混合整数求解<\/strong>（难度：高难）。带整数变量的能量通常这样处理：先把整数当连续变量松弛，解一个二次规划；然后把最接近整数的变量固定，再优化剩下的，反复迭代。书里指出这个细节很关键：<strong>一次把所有整数都固定会得到很糟的方向场（奇异点过多），逐步迭代凑整才能得到光顺结果<\/strong>。<\/p>\n<p><strong>特征对齐与度量定制<\/strong>（难度：高难）。四边形网格要沿棱线走，还要按需要加密。前者靠给方向场加&quot;对齐约束&quot;（在特征边上要求方向与该边一致，或成 45°）；后者靠改<strong>度量<\/strong>：定义每个点的 2×2 对称正定矩阵 g，用它替代欧氏度量去量长度。g 的特征向量给方向、特征值给该方向的密度。麻烦在于 g 必须对称正定（g11 g22 − g12² &gt; 0、迹为正），直接优化很难保持；技巧是写 g = exp(G)，G 是任意对称矩阵，指数映射自动保证正定，就把不等式约束消掉了。<\/p>\n<h3>概念 4：另一条路——用标量场的等值线切块<\/h3>\n<p><strong>Morse-Smale 复形法<\/strong>（难度：高难）。不用方向场，用一个标量函数 ψ 在曲面上的&quot;地形&quot;来切块：<\/p>\n<ul><li>\nψ 的<strong>极大点<\/strong>、<strong>极小点<\/strong>、<strong>鞍点<\/strong>是关键点；\n<\/li><li>\n沿 ψ 的梯度流走，会形成分界线（separation lines）；\n<\/li><li>\n这些分界线把曲面切成一块块四边形区域，每块对应一个鞍点，从而生成四边形网格。\n<\/ul>\n<p>为什么这能给出四边形？因为一个鞍点连着两条上行的流线和两条下行的流线，四条边界围出一块——正好四条边。控制质量的办法是设计 ψ 的性质：让它的一阶方向（特征向量）对齐棱线（特征对齐）、让它的二阶导数条件成立（避免关键点退化）、并让两个方向的密度变化均衡（书里写作要求 ∂²ψ/∂x∂y 的符号条件，避免鞍点挤在一起）。<\/p>\n<p>实际求解 ψ 用的是<strong>周期向量场 + Dirichlet 能量<\/strong>：先求一个光滑的向量场，要求它在特征线处满足整数约束（u、v 坐标在特征角点处必须是整数）、在对角线约束处满足 ψ0 ψ3 − ψ1 ψ2 的关系，能量写成<\/p>\n<pre><code>E(ψ) = ʃ |∇ψ|²  subject to  特征约束<\/code><\/pre>\n<p>求解分两步：先不管非线性约束、用变量替换消掉线性约束，把问题化成最小特征值问题（这是谱方法的标准套路，第 5 章的 Laplace 特征值也是同一批工具）；再用 Gauss-Newton 在约束下迭代修正。<\/p>\n<h3>概念 5：六面体网格化——三维的同类问题，难一档<\/h3>\n<p>把表面换成体，四边形换成六面体。三条主要路线：<\/p>\n<p><strong>晶格覆盖 / 八叉树<\/strong>（难度：进阶）。用规则的立方体格（或八叉树的变尺寸格）盖住模型，边界处的格子裁剪成贴合的六面体。优点是简单、自动；缺点很致命：<strong>边界附近的单元质量差<\/strong>（被裁过的格子形状歪、体积悬殊），而有限元恰恰最在意边界附近。<\/p>\n<p><strong>标架场参数化<\/strong>（难度：高难）。把四边形化的&quot;方向场&quot;升级成<strong>标架场<\/strong>：每点给 3 个互相垂直的方向（相当于一个局部坐标系）。然后求一个映射，把它拉回到整数格点，抽取整数等值面（isosurface）得到六面体。技术难点有两个：<\/p>\n<ol><li>\n对称标架的<strong>表示<\/strong>：三个方向无顺序（旋转、交换都会给出同一个标架），所以不能直接存三个向量。做法是用球面调和函数把这个对称性编码成一个 9 维向量，在 R⁹ 里定义距离、做光顺。\n<\/li><li>\n<strong>奇异结构<\/strong>：三维的奇异结构不再是孤立点，而是&quot;奇异线&quot;（一整条线上的某个邻域都转不回来），这让整数约束的组合爆炸。\n<\/ol>\n<p><strong>多立方体（polycube）<\/strong>（难度：进阶）。先用一堆轴对齐的立方体拼出模型的粗近似（有点像乐高），再把这个&quot;积木模型&quot;光滑地映射回原形状。因为积木模型本身就是六面体网格，映射回原形状就得到六面体网格。优点是全局结构极其规整、自动；缺点是近似阶段会丢细节，且拼出来的形状与原模型差异大时映射会严重扭曲。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[输入三角网格] --&gt; B{目标单元}\n    B --&gt;|四边形| C[求方向场&lt;br/&gt;周期跳跃 / 乘4表示]\n    C --&gt; D[混合整数优化&lt;br/&gt;松弛 + 逐步取整]\n    D --&gt; E[参数化到平面&lt;br/&gt;按整数格点抽网格]\n    B --&gt;|四边形 另一路线| F[求标量场 ψ&lt;br/&gt;Morse-Smale 切块]\n    F --&gt; E\n    B --&gt;|六面体| G[求标架场&lt;br/&gt;球面调和 9维表示]\n    G --&gt; H[体参数化&lt;br/&gt;抽整数等值面]\n    B --&gt;|六面体 快速路线| I[多立方体&lt;br/&gt;积木近似 + 映射]\n    I --&gt; H\n    E --&gt; J[输出规整网格]\n    H --&gt; J<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：四条入口对应四条技术路线，但都收敛到&quot;参数化 + 抽整数格点&quot;这一个出口。看图要抓住：<strong>方向场/标量场/标架场的作用都是把&quot;网格怎么铺&quot;变成一个可以事先求解的场<\/strong>，之后的抽取都是机械操作。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：四边形重网格化像贴瓷砖。瓷砖必须按格子贴，墙面有拐角、有弧形，你就得先决定&quot;每个区域的砖缝朝哪&quot;（方向场），再决定&quot;砖从哪块整砖开始&quot;（整数平移）。两个区域接缝处的砖缝必须对得上，否则会错缝——这就是周期跳跃。<strong>失效边界<\/strong>：瓷砖是刚性的，而四边形网格允许单元被轻微拉伸，所以实际允许一定变形，只要不翻。<\/p>\n<p><strong>实例（周期跳跃必须出现）<\/strong>：在平面上取一个环形区域，绕中心一圈。方向场在每点都取&quot;沿半径方向和沿切向方向&quot;。绕中心走 360° 回来，径向方向转过了 360°，而方向场只认 4 个等价方向（转 90° 视为同一个），所以 360° 相当于 4×90°，回到原值——<code>k<\/code> 累积为 4。这不产生奇异点（4 是整数，指数 0）。<\/p>\n<p>换成&quot;沿 45° 方向&quot;（把方向场扭半格），绕一圈累积 360°，但 45° 不属于 4 个等价方向，累积不是 90° 的整数倍，中心必须放一个奇异点：此处方向场绕一圈净转 90°，对应指数 +1/4，也就是一个 3 价顶点。<strong>这就是&quot;扭转方向场必然产生奇异点&quot;的可验证例子。<\/strong><\/p>\n<p><strong>实例（奇异点计数）<\/strong>：一个四面体的三角网格，每个顶点都是 3 价。若直接把它当四边形骨架，按 index = (4 − n)/4 每个顶点是 +1/4，四个顶点之和 = 1，而球面要求 2，缺口意味着&quot;至少还得补 4 个 +1/4&quot;。这解释了为什么把模型换成四边形网格时，顶点数、价数会被迫改变（Catmull-Clark 一类细分加密操作就是在补这个缺口）。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;重网格化 = 简化&quot;<\/strong>——实际上重网格化可以增加顶点（把粗糙的扫描网格换成密集规整的四边形），它换的是&quot;单元类型、方向、密度&quot;，不是数量。\n<\/li><li>\n<strong>别以为&quot;四边形网格越规整越好，奇异点越少越好&quot;<\/strong>——实际上奇异点数量受拓扑下界约束（球面至少要有总指数 +4 的奇异点）。追求&quot;零奇异点&quot;是不可能的，能做的是把它们放到不显眼的位置，并让它们均匀分布。\n<\/li><li>\n<strong>别以为&quot;方向场的整数变量只是实现细节&quot;<\/strong>——实际上它决定了跨片语义能否一致：整数变量没处理好，片与片的四边形格点就会错位，出现裂缝。\n<\/li><li>\n<strong>别以为&quot;八叉树六面体已经够用&quot;<\/strong>——实际上边界单元质量差是它的结构性缺陷，有限元在边界处的应力集中恰恰最需要好单元。这就是标架场参数化这类重方法存在的理由。\n<\/li><li>\n<strong>别以为&quot;多立方体是最省事的自动方法，所以选它&quot;<\/strong>——实际上它牺牲了形状逼近（积木近似），对细节多、形状细长的模型会严重失真。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n（单选）四边形化的全局参数化法要求相邻片之间的坐标变换属于哪一类？\n<p>A. 任意仿射变换　B. 90° 的整数倍旋转 + 整数平移　C. 只允许平移　D. 相似变换 <strong>答案<\/strong>：B。<strong>解析<\/strong>：只有 90° 整数倍旋转 + 整数平移才能保证两边公共边界上的整数格点重合，从而四边形顶点对得上。<\/p>\n<\/ol>\n<ol><li>\n（单选）为什么用 (cos 4θ, sin 4θ) 表示方向场能消掉整数变量？\n<p>A. 因为三角函数是周期函数，旋转 90° 对应 θ 加 π/2，乘 4 后加 2π，值不变　B. 因为角度被归一化到 [0, 2π)　C. 因为它把方向场变成了标量场　D. 因为 θ 的取值范围被限制 <strong>答案<\/strong>：A。<strong>解析<\/strong>：这是&quot;利用周期性去除整数变量&quot;的标准手法，等价于把 4 个等价方向压成一个点。<\/p>\n<\/ol>\n<ol><li>\n（填空）四边形网格的顶点指数按 index = (4 − n)/4 定义，则 3 价顶点指数为＿＿，5 价顶点为＿＿；球面上指数之和必须为＿＿。\n<p><strong>答案<\/strong>：+1/4；−1/4；2（等于球面欧拉示性数 χ，因此至少需要 8 个 3 价顶点）。<\/p>\n<\/ol>\n<ol><li>\n（简答）Morse-Smale 复形法为什么能产生四边形块？\n<p><strong>答案要点<\/strong>：标量场的一个鞍点有两条上行流线和两条下行流线，构成四条边界，围出一块四边形区域；极大点/极小点/鞍点与分界线的组合把曲面分割成这样的块。网格质量靠设计 ψ 的特征向量（对齐棱线）和二阶条件（避免关键点退化）来控制。<\/p>\n<\/ol>\n<ol><li>\n（简答）三类六面体路线的最大缺点分别是什么？\n<p><strong>答案要点<\/strong>：晶格/八叉树——边界单元质量差（裁过的格子形状失真）；标架场参数化——奇异结构是线状，整数约束组合爆炸，求解难且可能失败；多立方体——形状逼近差，细节与细长结构容易失真。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n重网格化 = 形状不变 + 单元/方向/密度可变；需求决定方案，没有最好的网格。\n<\/li><li>\n四边形化必过三关：方向场（周期跳跃）、整数相容（90° 旋转 + 整数平移）、奇异点（受拓扑下界约束）。\n<\/li><li>\n六面体化是同一套思路升一维：标架场代替方向场，体参数化代替面参数化，代价是奇异结构变线、求解更难。\n<\/ul>", "kind": "chapter", "title": "第 4 章：网格模型的重网格化"}, "ch05": {"html": "<h1>第 5 章：三维形状分析<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：5 小时 | <strong>前置<\/strong>：第 1 章的曲率与离散 Laplace；矩阵特征值的基本概念；基本的聚类与距离度量\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n区分全局描述子与局部描述子的用途，并为&quot;检索&quot;和&quot;找对应点&quot;各选一种合适的描述子。\n<\/li><li>\n解释为什么 D2 形状分布对旋转不敏感，以及它丢了什么信息。\n<\/li><li>\n说清热核签名（HKS）为什么等距不变，并写出它的定义式。\n<\/li><li>\n写出归一化割（Ncut）为什么不能简单用&quot;切口最小&quot;，并说明它如何避免把模型切成一个小碎片。\n<\/li><li>\n判断一个分割任务该用区域增长、图割还是交互式方法。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>形状分析的核心动作是<strong>降维<\/strong>：把&quot;一个有几万个顶点的三维形状&quot;压成一个几十到几百维的向量或一条曲线，让&quot;像不像&quot;变成&quot;距离近不近&quot;。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：描述子的两类用法<\/h3>\n<p><strong>形状描述子<\/strong>（难度：基础）就是把形状（或形状的某个局部）映射成一个向量的函数。<\/p>\n<ul><li>\n<strong>全局描述子<\/strong>：整个模型 → 一个向量。用于分类、检索、粗配准（先按描述子筛候选，再精配）。\n<\/li><li>\n<strong>局部描述子<\/strong>：某个顶点（及其邻域）→ 一个向量。用于找对应点（&quot;这个模型的鼻子对应那个模型的哪个点&quot;）、局部相似性判断。\n<\/ul>\n<p>一个合格的描述子要满足几条朴素要求：<strong>对不该变的东西不敏感<\/strong>（旋转、平移、尺度、采样密度），<strong>对该变的东西敏感<\/strong>（形状差异）。这几条之间是矛盾的，所以描述子的设计永远在做权衡。<\/p>\n<h3>概念 2：人工定义的全局描述子<\/h3>\n<p><strong>D2 形状分布<\/strong>（难度：基础）。做法极简单：在模型表面随机采两个点，量它们之间的距离 d；重复很多次（比如 10 万次），统计 d 的分布（直方图），这个直方图就是描述子。<\/p>\n<p>为什么它对旋转不敏感？因为距离在旋转下不变，随机采样也不区分方向。所以两个&quot;只差一个旋转&quot;的模型，D2 分布几乎相同。缺点也很清楚：<strong>它只知道距离分布，不知道这些距离长在哪儿<\/strong>。一个球和一个排列巧合的哑铃可能有相近的 D2，但形状完全不同。<\/p>\n<p><strong>球谐描述子<\/strong>（难度：高难）。把模型看作一个&quot;球面上的信号&quot;（例如某方向上的半径函数或体素指示函数），展开到球谐基 Y_l^m 上，取低阶系数当特征：<\/p>\n<pre><code>f(θ, φ) = Σ_{l=0}^{L} Σ_{m=−l}^{l} c_l^m Y_l^m(θ, φ)<\/code><\/pre>\n<p>低阶系数刻画整体形状（像椭球还是像圆柱），高阶系数刻画细节。只保留前若干阶就得到旋转不变的粗描述（因为对系数按 l 取模，旋转只改变同阶系数的组合）。它对&quot;星形&quot;模型（从某个中心看，每个方向只有一层表面）很有效，对复杂拓扑或非星形模型要先做分解，否则投影会丢结构。<\/p>\n<p><strong>其他经典全局描述子<\/strong>：光场/深度图像（从若干视角渲染深度图再统计）、形状直方图、基于体素的占据率等，思路一致——选一种&quot;投影方式&quot;，统计其分布。<\/p>\n<h3>概念 3：局部描述子与谱方法<\/h3>\n<p><strong>曲率类描述子<\/strong>（难度：基础）。最直接的局部特征就是第 1 章的主曲率 (k1, k2)，或者它们的组合（H、K、曲率比值）。它对噪声敏感，需要先在多尺度上平滑再算。<\/p>\n<p><strong>旋转图像（Spin Image）<\/strong>（难度：进阶）。给一个顶点 p 和它的法向 n，建立一个&quot;圆柱坐标系&quot;：沿 n 方向记高度 α，垂直 n 的方向记径向距离 β。把 p 邻域内的点都投影到这个 (α, β) 平面上，累加成一张二维图——这就是旋转图像。它旋转不变（因为坐标系跟着 n 转），但<strong>对法向误差很敏感<\/strong>，且不区分正负方向（正反两面会混）。<\/p>\n<p><strong>热核签名（HKS）<\/strong>（难度：高难）。这是本章最漂亮的一个构造。想象在顶点 x 上放一滴热水，热量会沿着曲面扩散。经过时间 t 后，x 处还剩多少热量？写成数学式：<\/p>\n<pre><code>HKS(x, t) = Σ_{i=1}^{∞} exp(−λ_i t) φ_i(x)²<\/code><\/pre>\n<p>其中 λ_i 和 φ_i 是<strong>离散 Laplace 算子的第 i 个特征值和特征向量<\/strong>（第 1 章的余切 Laplace 就在这里派上用场），φ_i(x) 是第 i 个特征向量在顶点 x 的分量。把 t 从很小变到很大，得到一条曲线，这条曲线就是 x 点的签名。<\/p>\n<p>为什么等距不变？因为热扩散只依赖曲面<strong>内在的度量<\/strong>（沿曲面走多远），不依赖它在空间里怎么弯曲。你把一张纸卷成筒，纸上任意两点的测地距离不变，热扩散完全一样。这就是 HKS 的核心价值：<strong>它区分不了&quot;卷起来的纸&quot;和&quot;平铺的纸&quot;，但这对&quot;找对应点&quot;恰恰是优点<\/strong>——人做同一个动作，姿势变了但对应部位不变。<\/p>\n<p>曲线还有直观解释：<\/p>\n<ul><li>\nt 很小：热量还没扩散出去，HKS 主要由局部几何决定（近似与平均曲率有关）；\n<\/li><li>\nt 很大：热量扩散到全曲面，HKS 趋于常数（只由总面积和低频模态决定）。\n<\/ul>\n<p>书里强调的就是这个多尺度性质：小 t 抓细节，大 t 抓全局。<\/p>\n<p><strong>波核签名（WKS）<\/strong>（难度：高难）。HKS 的&quot;振动版&quot;。把热扩散方程换成正弦波动，权重变成对特征值的另一种采样（在 log 尺度上给一个高斯窗），于是每个特征值的贡献是 gaussian(λ) 而非 exp(−λt)。好处是对尺度差异更鲁棒、能量集中在特定频段。两者思路相同：<strong>用 Laplace 谱构造一个与坐标无关的局部签名<\/strong>。<\/p>\n<h3>概念 4：学习型描述子<\/h3>\n<p>手工描述子的设计依赖人的先验（选什么尺度、怎么归一化）。学习型路线直接让网络学：<\/p>\n<ul><li>\n输入可以是局部的<strong>几何描述子<\/strong>（如多个尺度的曲率、法向滤波描述子 FEND 第 2 章提过、深度图像 patch）；\n<\/li><li>\n网络（多层感知机、EdgeNet 这种在网格边上卷积的结构）输出一个新的特征向量；\n<\/li><li>\n训练目标是&quot;同一个部位在不同模型/不同姿态下特征接近，不同部位远&quot;。\n<\/ul>\n<p>书里举的 EdgeNet 属于这一类的早期代表：它在网格的<strong>边<\/strong>上做聚合，把顶点特征沿边传递，再拼成局部描述子。这与第 8 章的图神经网络是同一脉络，只是第 5 章还停留在&quot;小网络 + 手工输入&quot;阶段。<\/p>\n<h3>概念 5：网格分割<\/h3>\n<p><strong>网格分割<\/strong>（难度：进阶）就是按几何或语义把模型切成若干块。四类典型做法：<\/p>\n<p><strong>区域增长 / 分水岭<\/strong>（难度：进阶）。先算每个顶点的主曲率和主方向，把&quot;曲率极小&quot;的等高线当分水岭的&quot;谷线&quot;，从种子点往外生长，遇到谷线就停。书里提到的贪心分水岭就是这个思路：为了避免过分割，先在每个顶点的邻域上做形态学操作生成&quot;标识集&quot;，再用方向曲率高程图当梯度做分水岭。它快、直观，但对噪声敏感，且需要调种子。<\/p>\n<p><strong>聚类<\/strong>（难度：基础）。把顶点按 (|k_min|, |k_max|) 这样的特征向量做 k 均值聚类，再接区域增长合并。简单，但不保证块连通。<\/p>\n<p><strong>归一化割（Ncut）<\/strong>（难度：高难）。把网格看成图：顶点是节点、边权是&quot;两个顶点有多像&quot;（比如距离与曲率相似度）。切分就是把图分成两块 A、B，切口代价是跨块的边权和。如果只最小化切口，最优解往往是&quot;切下一个孤立顶点&quot;——因为切一刀就完事。所以要加入&quot;块要够大&quot;的约束：<\/p>\n<pre><code>Ncut(A, B) = cut(A, B)/assoc(A, V) + cut(B, A)/assoc(B, V)<\/code><\/pre>\n<p>分母 assoc(A, V) 是 A 与全图的连接总量，于是&quot;块太小&quot;会因分母小而被惩罚。求解 Ncut 的松弛形式会变成一个<strong>广义特征值问题<\/strong>（用拉普拉斯矩阵），取第二小特征向量做二分——这与谱聚类是同一个数学对象。这也说明第 1 章的 Laplace 矩阵在第 5 章又出现了一次。<\/p>\n<p><strong>交互式分割<\/strong>（难度：进阶）。用户刷几笔（前景/背景），算法把这些笔刷当硬约束，其余用随机游走或图割补齐。随机游走法很直观：从每个未标记顶点出发随机游走，先碰到哪个标记就归哪类；其解也等价于解一个 Laplace 方程（又一次用到余量 Laplace）。<\/p>\n<p><strong>协同分割<\/strong>（难度：高难）。给一组同类模型（比如十把椅子），要求&quot;切出来的块在所有模型上一一对应&quot;。做法是把所有模型的特征放在一起做联合聚类/联合图割，使切法一致。它是&quot;分割&quot;和&quot;对应&quot;两个问题的合体。<\/p>\n<h3>概念 6：匹配与检索<\/h3>\n<p><strong>检索<\/strong>（难度：进阶）。流程是：算描述子 → 建索引（如 KD 树）→ 查询最近邻。真实系统的关键是<strong>多描述子融合<\/strong>：D2 抓整体比例、球谐抓低频形状、HKS/曲率抓局部。融合方式有加权距离、或者用 boosting 学一组弱描述子的权重。<\/p>\n<p><strong>匹配（对应）<\/strong>（难度：高难）。在两张网格间找点对点对应，通常三步：算局部描述子 → 按描述子相似度给候选 → 用形变或图匹配做全局一致化（防止&quot;左手配到右手&quot;这类局部合理的错误）。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[三维模型] --&gt; B[全局描述子]\n    A --&gt; C[局部描述子]\n    B --&gt; B1[统计类&lt;br/&gt;D2 距离分布]\n    B --&gt; B2[频域类&lt;br/&gt;球谐系数]\n    C --&gt; C1[微分类&lt;br/&gt;主曲率 H K]\n    C --&gt; C2[谱类&lt;br/&gt;HKS WKS]\n    C --&gt; C3[学习类&lt;br/&gt;EdgeNet 特征]\n    B --&gt; D[检索 / 分类]\n    C --&gt; E[对应 / 配准]\n    A --&gt; F[分割]\n    F --&gt; F1[区域增长 / 分水岭]\n    F --&gt; F2[图割 Ncut]\n    F --&gt; F3[交互式 / 协同]\n    F --&gt; G[语义分析]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：左边是&quot;压缩成向量&quot;，右边是&quot;切成块&quot;。两条路最后都服务于&quot;理解形状&quot;。看图要认出：HKS、Ncut、随机游走三个看似无关的方法，底层都是同一个 Laplace 算子——这是第 1 章算子层在本书里复用最密集的一章。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：描述子像给人拍照做身份识别。D2 相当于只记录&quot;身上各部位之间距离的统计&quot;——双胞胎身高体重一样就分不开；HKS 相当于记录&quot;热量从某点扩散的快慢&quot;——它对人怎么摆姿势不敏感（等距不变），但每个人身上的&quot;扩散曲线&quot;不同，所以能认人。<strong>失效边界<\/strong>：HKS 分不开镜像对称的部位（左右手），因为它只看距离不看朝向；这也是实际系统要再叠一层&quot;朝向/法向&quot;特征的原因。<\/p>\n<p><strong>实例（球面的 HKS 可算）<\/strong>：单位球面上，离散 Laplace 的特征值是 λ_l = l(l+1)，每个特征值的重数是 2l+1，特征向量在球面上均匀分布，于是 φ_i(x)² 的平均值是 1/(4π)。所以<\/p>\n<pre><code>HKS(x, t) = Σ_{l=0}^{∞} (2l+1)/(4π) exp(−l(l+1) t)<\/code><\/pre>\n<p>取 t = 1：l=0 贡献 1/(4π) ≈ 0.0796；l=1 贡献 3/(4π) × e^{−2} ≈ 0.2387 × 0.1353 ≈ 0.0323；l=2 贡献 5/(4
