&quot;<\/strong>——实际上只需算前几十个特征对（稀疏矩阵的部分特征分解），几千顶点的模型在秒级完成。\n<\/li><li>\n<strong>别以为&quot;D2 无用&quot;<\/strong>——实际上它在&quot;没有对应、没有参数化&quot;的粗筛阶段非常可靠，是级联检索的第一层。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>5.1.1<\/td><td>全局描述子<\/td><td>D2、球谐、光场<\/td><\/tr><tr><td>5.1.2<\/td><td>局部描述子<\/td><td>Spin Image、HKS、WKS<\/td><\/tr><tr><td>5.2<\/td><td>学习型描述子<\/td><td>人工特征 + 网络<\/td><\/tr><tr><td>5.4<\/td><td>检索<\/td><td>多描述子融合<\/td><\/tr><tr><td>8.4<\/td><td>深度几何<\/td><td>端到端学习替代手工<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：Laplace 特征值、热扩散、球面调和\n<\/li><li>\n后续：匹配、分割、协同分割\n<\/li><li>\n对照：D2（统计）、Spin Image（局部几何）、PointNet（学习）\n<\/ul>", "kind": "concept", "title": "形状描述子与谱签名（HKS / WKS）"}, "c12": {"html": "<h1>网格分割与归一化割<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 5 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>把网格切成若干块；归一化割（Ncut）用&quot;切口尽量小 + 每块不能太小&quot;的比值目标代替&quot;切口最小&quot;，其松弛解是一个广义特征值问题。<\/p>\n<h2>为什么重要<\/h2>\n<p>分割是语义分析的第一步。Ncut 的意义超出分割本身：它展示了&quot;约束怎么进目标函数&quot;——如果把&quot;块不能太小&quot;写成硬约束，问题会变组合；写成归一化分母，问题就变成可解的谱问题。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[网格 → 图&lt;br/&gt;顶点=节点 边权=相似度] --&gt; B[构造拉普拉斯 L]\n    B --&gt; C[解广义特征值&lt;br/&gt;L x = λ D x]\n    C --&gt; D[取第二小特征向量]\n    D --&gt; E[按符号或阈值二分]\n    E --&gt; F[递归二分 = 多块]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：核心是&quot;把分割变成谱问题&quot;；第二小特征向量（Fiedler 向量）给出最优切分方向。<\/p>\n<h2>详解<\/h2>\n<p><strong>图的构造<\/strong>（难度：进阶）。顶点是节点，边权 w_ij 表示&quot;i 与 j 应该在同一块&quot;的程度。常用 w_ij = exp(−d(i,j)²/σ²)，或者结合曲率相似度。切分代价是跨块的边权和：<\/p>\n<pre><code>cut(A, B) = Σ_{i∈A, j∈B} w_ij<\/code><\/pre>\n<p><strong>为什么不能只最小化切口<\/strong>（难度：进阶）。考虑走廊：切下末端 1 个点，切口是 1；从中间切成两半，切口也是 1。两者 cut 相同，但前者语义荒谬。归一化把&quot;块的大小&quot;纳入分母：<\/p>\n<pre><code>Ncut(A, B) = cut(A, B)/assoc(A, V) + cut(B, A)/assoc(B, V)<\/code><\/pre>\n<p>assoc(A, V) 是 A 与全图的连接总量（约等于 A 的&quot;体积&quot;）。于是切下 1 个点得 1/1 + 1/99 ≈ 1.01，从中间切得 1/50 + 1/50 = 0.04。<strong>前者被惩罚。<\/strong><\/p>\n<p><strong>谱解<\/strong>（难度：高难）。把 Ncut 写成矩阵形式，最小化它等价于求<\/p>\n<pre><code>(D − W) x = λ D x<\/code><\/pre>\n<p>的第二小特征值对应的特征向量（D 是度矩阵，W 是权重矩阵）。这个向量在每个顶点给一个实数，按符号（或按 0 阈值）二分就得到切分。递归二分就得到多块。<\/p>\n<p><strong>其他分割方法<\/strong>（难度：进阶）：<\/p>\n<ul><li>\n<strong>区域增长/分水岭<\/strong>：靠曲率极值线当边界，快但不稳；\n<\/li><li>\n<strong>聚类<\/strong>：按曲率特征 k 均值，简单但不保证连通；\n<\/li><li>\n<strong>随机游走<\/strong>：解 Laplace 方程，等价于&quot;从每个点出发先碰到哪个标记&quot;；\n<\/li><li>\n<strong>交互式<\/strong>：用户刷几笔当硬约束，其余由优化补齐；\n<\/li><li>\n<strong>协同分割<\/strong>：多个模型联合优化，使对应部位切法一致。\n<\/ul>\n<p><strong>数值例子<\/strong>（可手算，1D）。一条 4 个顶点的链，边权都为 1。度矩阵 D = diag(1, 2, 2, 1)，W 是相邻为 1 的矩阵。L = D − W 的第二小特征向量（Fiedler 向量）在该链上近似线性变化（约为 (−0.5, −0.5, +0.5, +0.5) 的形态），按 0 切正好从中间分开——与&quot;直觉最优切法&quot;一致。这个例子说明谱方法不是玄学，它确实给&quot;最均衡的切法&quot;。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;Ncut 只是加了个分母&quot;<\/strong>——实际上这个分母让问题从组合优化变成谱问题，是&quot;可解&quot;的关键。\n<\/li><li>\n<strong>别以为&quot;分割越碎越准&quot;<\/strong>——实际上过分割是常态，工程上要再加合并（按相似度与语义似然）。\n<\/li><li>\n<strong>别以为&quot;谱方法一定给连通块&quot;<\/strong>——实际上特征向量的符号区域可能不连通，需要后处理（连通化）。\n<\/li><li>\n<strong>别以为&quot;分割和识别可以分开做&quot;<\/strong>——实际上两者互相依赖（第 9 章），联合求解更稳。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>5.3.1<\/td><td>全自动分割<\/td><td>区域增长、聚类、Ncut、随机游走<\/td><\/tr><tr><td>5.3.2<\/td><td>交互式分割<\/td><td>笔刷约束 + 优化<\/td><\/tr><tr><td>5.3.3<\/td><td>协同分割<\/td><td>联合特征/联合图割<\/td><\/tr><tr><td>9.3.2<\/td><td>场景理解<\/td><td>分割 + 识别联合<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：图、拉普拉斯矩阵、特征值\n<\/li><li>\n后续：协同分割、语义标注\n<\/li><li>\n对照：分水岭（几何驱动）、Ncut（谱驱动）\n<\/ul>", "kind": "concept", "title": "网格分割与归一化割"}, "c13": {"html": "<h1>蒙皮：LBS、DQS 与骨骼学习<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 6 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>把表面顶点绑定到若干根骨头上（权重），骨头一动、顶点按权重混合各家变换跟过去；LBS 是&quot;位置加权平均&quot;，DQS 是&quot;旋转加权平均&quot;。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是动画工业的默认方案，也是&quot;插值重构&quot;这一类形变的代表。理解 LBS 的结构性缺陷（糖纸收缩），才能理解为什么第 6 章后面要搞梯度域和 ARAP。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[模型 + 骨架] --&gt; B[顶点权重&lt;br/&gt;软选或学习]\n    B --&gt; C[每根骨算 R t]\n    C --&gt; D1[LBS 位置加权]\n    C --&gt; D2[DQS 对偶四元数插值]\n    D1 --&gt; E[关节处收缩]\n    D2 --&gt; F[收缩减轻]\n    D1 --&gt; G[加姿态修正项]\n    G --&gt; H[可用的蒙皮结果]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：LBS 的缺陷是原理性的，修法要么换成&quot;旋转插值&quot;，要么叠一个学出来的修正项。<\/p>\n<h2>详解<\/h2>\n<p><strong>LBS 公式<\/strong>（难度：进阶）：<\/p>\n<pre><code>v&#x27; = Σ_j w_ij (R_j v + t_j),   Σ_j w_ij = 1<\/code><\/pre>\n<p><strong>糖纸收缩的可算例子<\/strong>（难度：进阶）。设一个顶点距肘关节 r = 1，权重 0.5/0.5。前臂骨绕关节转 90°：<\/p>\n<ul><li>\n在前臂骨坐标系下：位置 P1 = R(90°)v，到关节距离仍为 1；\n<\/li><li>\n在上臂骨坐标系下：位置 P0 = v，到关节距离 1；\n<\/li><li>\nLBS 结果 (P0 + P1)/2，到关节距离 = |P0 + P1|/2 = √(1² + 1²)/2 = 0.707。\n<\/ul>\n<p><strong>关节处长度缩为 0.707 倍<\/strong>，看起来像糖纸被拧紧。这就是 candy-wrapper 效应。权重越接近 0.5/0.5、旋转角越大，收缩越严重（可以验证：转 180° 时新位置到关节距离为 0——完全塌到关节）。<\/p>\n<p><strong>DQS<\/strong>（难度：高难）。把每根骨的变换表示成对偶四元数（旋转 + 平移），对这些四元数做<strong>归一化的线性插值<\/strong>（可以先平均再归一化），再作用到顶点。它插值的是&quot;运动&quot;而不是&quot;位置&quot;，因此糖纸现象大幅减轻。代价是可能出现&quot;凸起&quot;（bulge），以及对非刚性变换表达力有限。<\/p>\n<p><strong>骨骼学习<\/strong>（难度：高难）。手工绑骨很贵，于是从动画序列里自动学：<\/p>\n<ol><li>\n用均值漂移（mean shift）把顶点按运动轨迹聚类，每个簇当一根&quot;骨头&quot;；\n<\/li><li>\n每簇的仿射变换用最小二乘从顶点运动里拟合；\n<\/li><li>\n拟合出的 3×3 矩阵不一定是旋转（可能含缩放/剪切），要<strong>投影回 SO(3)<\/strong>（用 SVD：R = U Vᵀ）才符合骨骼语义；\n<\/li><li>\n平移部分用最小二乘求。\n<\/ol>\n<p>书里 6.1 节用的就是这套（聚类半径 h 控制骨骼数量，h 越大骨骼越少、精度越低）。<\/p>\n<p><strong>权重与修正<\/strong>（难度：进阶）。工业实践里还有两层：<\/p>\n<ul><li>\n<strong>权重平滑<\/strong>：让权重在网格上平滑过渡，避免关节处出现硬折；\n<\/li><li>\n<strong>姿态修正（pose space deformation）<\/strong>：为每个关节姿态学一个&quot;修正位移&quot;，把被压扁的部分撑回来。这相当于&quot;用数据修补 LBS 的物理错误&quot;。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;LBS 精度差只是权重没调好&quot;<\/strong>——实际上位置平均 ≠ 旋转平均，这是数学结构问题，任何权重都无法完全消除。\n<\/li><li>\n<strong>别以为&quot;DQS 完全解决了收缩&quot;<\/strong>——实际上它换成&quot;凸起&quot;问题，且对大幅非刚性形变仍不理想。\n<\/li><li>\n<strong>别以为&quot;骨骼越多越好&quot;<\/strong>——实际上骨骼多意味着权重更局部、更硬，关节过渡反而更生硬，且计算与美术成本上升。\n<\/li><li>\n<strong>别以为&quot;学出来的骨骼一定有物理意义&quot;<\/strong>——实际上它只是运动模式的聚类，可能与真实解剖结构不对应（这对动画可用、对医学仿真不可用）。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>6.1.1<\/td><td>蒙皮技术<\/td><td>LBS、权重、骨骼学习<\/td><\/tr><tr><td>6.1.2<\/td><td>自由形变<\/td><td>FFD 作为对照<\/td><\/tr><tr><td>6.3<\/td><td>形变能量<\/td><td>ARAP 修 LBS 的细节丢失<\/td><\/tr><tr><td>8.2.6<\/td><td>混合蒙皮<\/td><td>用字典学习降低权重矩阵秩<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：旋转矩阵、四元数、最小二乘\n<\/li><li>\n后续：ARAP、姿态修正、材质优化\n<\/li><li>\n对照：FFD（晶格驱动）、梯度域（保微分）\n<\/ul>", "kind": "concept", "title": "蒙皮：LBS、DQS 与骨骼学习"}, "c14": {"html": "<h1>梯度域形变与 ARAP<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 6、7 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>梯度域形变：保留每个顶点的微分坐标（拉普拉斯坐标），只改少数控制点，再解 Poisson 方程重建全局位置；ARAP：要求每个三角形尽量只旋转不拉伸，用&quot;局部算旋转、全局解位置&quot;交替迭代。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是&quot;局部细节 vs 全局位置&quot;这条分界线的典型运用，也是第 6 章的核心技术、第 7 章投影动力学的前身。学会它，很多网格处理问题都能自己写出能量。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[原网格 与 拉普拉斯坐标 δ] --&gt; B[用户指定约束&lt;br/&gt;某些顶点到新位置]\n    B --&gt; C[估计局部旋转]\n    C --&gt; D[解最小二乘 L v&#x27; = b]\n    D --&gt; E[更新旋转 重解]\n    E --&gt; F{收敛?}\n    F --&gt;|否| D\n    F --&gt;|是| G[形变结果]\n    D --&gt; H[梯度域 单次解]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：上面那条循环是 ARAP（旋转与位置交替优化）；如果旋转固定一次不更新，就退化成梯度域的线性解。<\/p>\n<h2>详解<\/h2>\n<p><strong>拉普拉斯坐标<\/strong>（难度：进阶）。δ_i = Δv_i 描述&quot;i 比邻居平均高多少&quot;，是局部形状的编码。关键洞察：<\/p>\n<ul><li>\n<strong>位置是全局的<\/strong>：改一个点，所有点的位置都变；\n<\/li><li>\n<strong>δ 是局部的<\/strong>：平移整个模型，δ 不变；旋转模型，δ 会跟着转（因为它是有方向的量）。\n<\/ul>\n<p>所以形变时&quot;保留 δ&quot;就等于&quot;保留局部形状&quot;。<\/p>\n<p><strong>最小二乘形式<\/strong>（难度：高难）：<\/p>\n<pre><code>min_{v&#x27;}  Σ_i | Δv&#x27;_i − T_i δ_i |² + λ Σ_{i∈C} | v&#x27;_i − p_i |²<\/code><\/pre>\n<p>T_i 是把原 δ 旋到新姿态的局部旋转（否则形状朝向不对）；第二项是用户约束（C 是受控顶点集，p_i 是目标位置）。对 v&#x27; 求导得到<\/p>\n<pre><code>(Lᵀ L + λ I_C) v&#x27; = Lᵀ (T δ) + λ p<\/code><\/pre>\n<p>L 是 Laplace 矩阵，稀疏，用 Cholesky 或共轭梯度求解。<\/p>\n<p><strong>为什么是 Poisson<\/strong>（难度：高难）。连续版本里，目标是求 f 使 ∇f ≈ u（u 是给定的目标梯度场）。但任意 u 未必是某个函数的梯度——它可能含旋转（无散）分量。Helmholtz-Hodge 分解说：<\/p>\n<pre><code>u = ∇ψ + ∇×ω + h<\/code><\/pre>\n<p>只有 ∇ψ 部分可积。求 f 使 ∇f 最接近 u，等价于先取旋度为零的部分，即解<\/p>\n<pre><code>∇²φ = ∇·u<\/code><\/pre>\n<p>这就解释了&quot;梯度域&quot;这个名字，也解释了为什么这个方法稳定：它把不可能满足的部分（旋转/调和分量）自动投影掉了。<\/p>\n<p><strong>ARAP<\/strong>（难度：高难）。能量写成逐三角形：<\/p>\n<pre><code>E = Σ_t Σ_{edges (i,j)} (w_ij/2) | (v&#x27;_i − v&#x27;_j) − R_t (v_i − v_j) |²<\/code><\/pre>\n<p>R_t 是每个三角形自己的最优旋转。求解：<\/p>\n<ul><li>\n<strong>局部步<\/strong>：对每个三角形，把三条边向量作为 3×3 矩阵的列，求使 |E − R S| 最小的 R（Procrustes：SVD 得 R = V Uᵀ，修正 det）；\n<\/li><li>\n<strong>全局步<\/strong>：固定所有 R_t，解稀疏线性系统求 v&#x27;（矩阵恒定，可预分解）。\n<\/ul>\n<p>能量单调下降，收敛到局部极小。<\/p>\n<p><strong>与梯度域的关系<\/strong>（难度：高难）。两者都是&quot;局部-全局&quot;，区别在局部量：梯度域用<strong>顶点的一阶微分<\/strong>（δ）并估计一个旋转；ARAP 用<strong>边的差分<\/strong>并对每个三角形精确求旋转。ARAP 更准（旋转是真实最优而非估计），代价是每步多一次逐三角形 SVD。<\/p>\n<p><strong>数值例子（一维）<\/strong>（难度：进阶）。4 个顶点在 0、1、2、3，δ = (1, 0, 0, −1)。固定首末为 0 和 2，内部 δ 保持 0：<\/p>\n<pre><code>2x2 − x1 − x3 = 0,  x1 = 0\n2x3 − x2 − x4 = 0,  x4 = 2\n→ x2 = 2/3, x3 = 4/3<\/code><\/pre>\n<p>位置均匀分布。若改用&quot;保边长&quot;（ARAP）目标，每条边都要求长度 1，总长 3 塞进长度 2 的区间是矛盾的，最小二乘解给出边长 2/3。<strong>这个对比说明：梯度域保的是二阶结构（均匀性），ARAP 保的是一阶结构（边长）。<\/strong><\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;梯度域形变不会失真&quot;<\/strong>——实际上它只保局部微分，不保体积和全局尺度，大幅动作会让关节塌陷（需要内部体图或体积约束）。\n<\/li><li>\n<strong>别以为&quot;ARAP 一定收敛到全局最优&quot;<\/strong>——实际上只保证能量单调下降，可能停在局部极小，结果依赖初值。\n<\/li><li>\n<strong>别以为&quot;局部旋转可以随便估&quot;<\/strong>——实际上旋转估错，细节就会朝错误方向&quot;翘起&quot;，这正是梯度域不如 ARAP 稳的原因。\n<\/li><li>\n<strong>别以为&quot;Helmholtz 分解只是理论&quot;<\/strong>——实际上它解释了&quot;为什么直接对向量场积分会失败&quot;，也指导了实现：必须先取散度再解 Poisson，而不是直接积分。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>6.2.1<\/td><td>梯度域 Poisson 编辑<\/td><td>解 L v = b，体图防塌陷<\/td><\/tr><tr><td>6.2.2<\/td><td>基于体图的梯度域<\/td><td>内外两层图约束体积与自交<\/td><\/tr><tr><td>6.3.1<\/td><td>非线性约束优化<\/td><td>ARAP、骨架约束、体积约束<\/td><\/tr><tr><td>6.3.2<\/td><td>子空间求解<\/td><td>只在少数基上求<\/td><\/tr><tr><td>7.1.3<\/td><td>投影动力学<\/td><td>同一局部-全局结构用于物理<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：拉普拉斯坐标、最小二乘、SVD/Procrustes\n<\/li><li>\n后续：ARAP、子空间形变、投影动力学\n<\/li><li>\n对照：LBS（插值，无优化）、FFD（晶格控制）\n<\/ul>", "kind": "concept", "title": "梯度域形变与 ARAP"}, "c15": {"html": "<h1>弹性模拟：隐式积分、PBD 与子空间<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 7 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>按 M ẍ + D ẋ + f_int = f_ext 推进形状；显式积分受&quot;最快振动&quot;限制步长，隐式积分不受但每步要解方程，子空间/Cubature/投影动力学是三种降本手段。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是&quot;形变能量 + 优化&quot;在时间维度上的延伸：第 6 章的能量是静态的，第 7 章让它随时间演化。工程上的布料、软组织、碎裂都靠这一套。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[运动方程] --&gt; B{积分方式}\n    B --&gt;|显式| C[便宜 但 h ≤ 2/ωmax]\n    B --&gt;|隐式| D[稳定 每步解稀疏系统]\n    D --&gt; E[降本三招]\n    E --&gt; E1[子空间模态]\n    E --&gt; E2[投影动力学 常量矩阵]\n    E --&gt; E3[Cubature 代表单元]\n    D --&gt; F[碰撞约束]\n    F --&gt; G[最终动画]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：三条降本路线互相独立、可以叠加；选择哪条取决于瓶颈（自由度、单元数、还是求解次数）。<\/p>\n<h2>详解<\/h2>\n<p><strong>运动方程的三项<\/strong>（难度：进阶）：<\/p>\n<ul><li>\nM ẍ：惯性（质量 × 加速度）；\n<\/li><li>\nD ẋ：阻尼（Rayleigh：D = α_m M + α_k K）；\n<\/li><li>\nf_int：内力 = −∂E/∂x（E 是弹性势能）。\n<\/ul>\n<p><strong>显式的稳定性条件<\/strong>（难度：进阶）。单弹簧 ω = √(k/m)，显式积分稳定要求 h ≤ 2/ω。全系统 ω_max 决定步长，网格加密使 ω_max 上升（刚度随 1/边长 增长），这解释了&quot;细分一倍、代价翻倍&quot;。<\/p>\n<p><strong>隐式积分<\/strong>（难度：高难）。用未知的 x_{n+1} 写方程，Newton 迭代每步解稀疏线性系统。无条件稳定，但大步长会引入数值阻尼（看起来&quot;发黏&quot;）。<\/p>\n<p><strong>子空间<\/strong>（难度：高难）。线性化后解广义特征值问题 K φ = λ M φ，取最低 K 个模态作基，未知量从 3N 降到 K。失效场景：大幅非线性形变（线性基失效）、局部尖锐碰撞（需要高频模态）。<\/p>\n<p><strong>PBD<\/strong>（难度：高难）。三步：预测位置 → 投影约束 → 反推速度。极稳、易实现；刚度靠迭代次数&quot;堆&quot;出来，物理参数不直接。<\/p>\n<p><strong>投影动力学<\/strong>（难度：高难）。把内力写成一组投影问题之和，隐式积分每步变成解<\/p>\n<pre><code>(M/h² + Σ w_i S_iᵀ S_i) x = b<\/code><\/pre>\n<p>左边恒定 → 预分解一次，每步只回代。收敛时的解与隐式积分一致，速度却接近 PBD。<\/p>\n<p><strong>Cubature<\/strong>（难度：高难）。从所有单元里选少量&quot;代表单元&quot;，用训练数据拟合（最小化整体内力误差）。单元计算量降一个数量级，代价是牺牲局部细节。<\/p>\n<p><strong>碰撞<\/strong>（难度：进阶）。检测用 BVH（层次包围盒），处理用约束（KKT/投影）。自碰撞要先排除相邻三角形，否则布料会粘住。书里还给了&quot;每个顶点只保留一个碰撞约束&quot;的简化策略（让矩阵变对角，大幅提速）——实验表明视觉上无明显失真。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;隐式积分步长越大越好&quot;<\/strong>——实际上大步长稳定但精度低、阻尼重，看起来发黏。\n<\/li><li>\n<strong>别以为&quot;弹簧模型和有限元只是实现差别&quot;<\/strong>——实际上弹簧刚度与网格密度耦合，有限元的材料参数与网格无关。\n<\/li><li>\n<strong>别以为&quot;PBD 迭代多了就等于物理正确&quot;<\/strong>——实际上它收敛到&quot;约束满足&quot;的解，参数需要标定，中间状态无物理意义。\n<\/li><li>\n<strong>别以为&quot;BVH 建一次就够&quot;<\/strong>——实际上形变会让包围盒失效，需要每帧重拟合或定期重建。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>7.1.1<\/td><td>弹性运动方程<\/td><td>弹簧/无网格/有限元<\/td><\/tr><tr><td>7.1.2<\/td><td>子空间降维<\/td><td>模态分析、Cubature<\/td><\/tr><tr><td>7.1.3<\/td><td>位置与投影加速<\/td><td>PBD、投影动力学<\/td><\/tr><tr><td>7.2<\/td><td>碰撞<\/td><td>BVH、约束处理、自碰撞<\/td><\/tr><tr><td>7.3<\/td><td>运动编辑<\/td><td>旋转-应变空间、材质优化<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：Newton 法、特征值问题、约束优化\n<\/li><li>\n后续：布料/软组织模拟、运动编辑、材质反演\n<\/li><li>\n对照：纯几何形变（无形力平衡）\n<\/ul>", "kind": "concept", "title": "弹性模拟：隐式积分、PBD 与子空间"}, "c16": {"html": "<h1>稀疏、低秩与深度几何学习<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 8 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>用&quot;少数原子线性组合&quot;（稀疏）或&quot;信息高度重复&quot;（低秩）作为先验，把几何问题写成可解的优化；深度学习则把手写先验换成从数据里学的先验。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是&quot;数据驱动&quot;这一路的总纲：第 5 章的学习型描述子、第 8 章的去噪/重建/配准/生成都落在这里。理解 L1 与低秩的几何直觉，就能判断一个论文里的能量到底在约束什么。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[几何信号 不规则定义域] --&gt; B[稀疏先验]\n    A --&gt; C[低秩先验]\n    B --&gt; B1[局部字典]\n    B --&gt; B2[冗余字典 + L1]\n    C --&gt; C1[核范数 奇异值和]\n    B1 --&gt; D[去噪 重建 匹配]\n    B2 --&gt; D\n    C1 --&gt; E[正朝向 蒙皮降维]\n    A --&gt; F[深度学习]\n    F --&gt; F1[PointNet 对称池化]\n    F --&gt; F2[流形卷积 测地邻域]\n    F --&gt; F3[生成模型 VAE GAN]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：上半是&quot;数学先验&quot;（无需训练），下半是&quot;数据先验&quot;（需要训练）。两者在任务上重叠，但保证不同。<\/p>\n<h2>详解<\/h2>\n<p><strong>L1 为什么稀疏<\/strong>（难度：高难）。凸优化的几何直觉：数据项 |y − Dx|² ≤ ε 是一个椭圆，L1 惩罚 λ|x|₁ 的等值线是菱形。椭圆与菱形相切的位置多半在菱形的尖角（坐标轴上）→ 某分量为 0。L2 的等值线是圆，切点一般不在坐标轴上 → 只缩小不归零。<\/p>\n<p><strong>一维手算<\/strong>（难度：进阶）。y = 1、D = 1、λ = 2：L2 解 x = 1/(1+λ/2) = 0.5（非零）；L1 解 x = max(1 − λ/2, 0) = 0（<strong>被阈值化到零<\/strong>）。这就是&quot;软阈值&quot;的来历。<\/p>\n<p><strong>低秩正朝向<\/strong>（难度：高难）。观察：人造模型沿坐标轴有对称性，摆正时它在三个坐标平面上的投影矩阵行与行高度相似 → 秩低。于是求&quot;使三个投影矩阵秩之和最小&quot;的旋转。秩的凸替代是核范数（奇异值之和）。这是一个<strong>完全无监督<\/strong>的方法，不需要训练数据。<\/p>\n<p><strong>压缩感知<\/strong>（难度：高难）。若信号在基下稀疏，则用远少于维数的测量也能唯一恢复（把无穷多解压成唯一解）。几何里用它做&quot;从少量采样恢复细节&quot;。<\/p>\n<p><strong>几何信号的特殊困难<\/strong>（难度：进阶）。图像有局部紧支撑的正交基（小波），几何没有：Laplace 特征向量是全局支撑的，无法表示局部细节。所以要么用局部字典，要么用冗余字典 + L1 选择，要么让网络自己学基。<\/p>\n<p><strong>深度几何的四种姿势<\/strong>（难度：进阶）：<\/p>\n<ol><li>\n<strong>假图像 CNN<\/strong>：给每个三角形算 600 维特征、重排成 30×20 矩阵，套 CNN。书里明确指出&quot;排列顺序与矩阵形状影响结果&quot;——它并不真正尊重拓扑。\n<\/li><li>\n<strong>PointNet<\/strong>：逐点 MLP + 全局最大池化。顺序无关来自最大池化的对称性；旋转靠 T-Net 学一个变换矩阵（只是近似抵消）。\n<\/li><li>\n<strong>流形卷积<\/strong>：按测地距离定义邻域，在切平面上按极坐标 (角度, 半径) 分箱聚合。难点是局部坐标系对齐。\n<\/li><li>\n<strong>生成/递归模型<\/strong>：VAE/GAN 学形状分布、RNN 做非刚性配准。可控性差（难保证不自交/不翻转）。\n<\/ol>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;L1 总比 L2 好&quot;<\/strong>——实际上 L1 在有相关特征时随机挑一个、丢弃另一个，不稳定；L2 解唯一、稳定。\n<\/li><li>\n<strong>别以为&quot;把三角形特征排成矩阵就是尊重拓扑&quot;<\/strong>——实际上排列与邻接无关，换顺序结果就变。\n<\/li><li>\n<strong>别以为&quot;PointNet 天然旋转不变&quot;<\/strong>——实际上它只保证顺序不变，旋转靠学出来的变换层近似抵消。\n<\/li><li>\n<strong>别以为&quot;生成模型能替代物理模拟&quot;<\/strong>——实际上它不保证力平衡、体积守恒、不自交；硬约束任务仍要靠优化。\n<\/li><li>\n<strong>别以为&quot;深度学习不需要几何算子&quot;<\/strong>——实际上成功模型的输入几乎都是曲率、法向、测地距离、Laplace 特征这些算子算出来的量。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>8.1<\/td><td>压缩感知与稀疏学习<\/td><td>稀疏编码、字典、L1、低秩<\/td><\/tr><tr><td>8.2<\/td><td>几何处理应用<\/td><td>去噪、重建、匹配、蒙皮、正朝向<\/td><\/tr><tr><td>8.3<\/td><td>机器学习基础<\/td><td>MLP、CNN、损失与训练<\/td><\/tr><tr><td>8.4<\/td><td>深度几何<\/td><td>假图像 CNN、PointNet、流形卷积、生成模型<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：线性代数、概率、凸优化\n<\/li><li>\n后续：数据驱动重建、端到端配准\n<\/li><li>\n对照：手工能量（可解释、可保证）vs 学习先验（表达力强、可控性弱）\n<\/ul>", "kind": "concept", "title": "稀疏、低秩与深度几何学习"}, "__path__": {"html": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：几何处理的数学基础<\/strong><br>阅读：<a href=\"#/chapter/ch01\">第 1 章：几何处理的数学基础<\/a><br>检查点：ch01 自测 ≥ 3/4，能写出余切权重表达式<\/li><li class='path-step' id='path-02'><strong>步骤 02：点云曲面重建与光顺<\/strong><br>阅读：<a href=\"#/chapter/ch02\">第 2 章：点云曲面重建和光顺<\/a><br>检查点：能讲清 ICP 两步交替为什么单调下降<\/li><li class='path-step' id='path-03'><strong>步骤 03：参数化与多分辨率表示<\/strong><br>阅读：<a href=\"#/chapter/ch03\">第 3 章：网格曲面的参数化和多分辨率表示<\/a><br>检查点：能解释参数化为什么翻转、QEM 误差怎么累加<\/li><li class='path-step' id='path-04'><strong>步骤 04：网格模型的重网格化<\/strong><br>阅读：<a href=\"#/chapter/ch04\">第 4 章：网格模型的重网格化<\/a><br>检查点：能画出方向场奇异点与 3/5 价顶点的对应<\/li><li class='path-step' id='path-05'><strong>步骤 05：三维形状分析<\/strong><br>阅读：<a href=\"#/chapter/ch05\">第 5 章：三维形状分析<\/a><br>检查点：能说出 HKS 为什么等距不变<\/li><li class='path-step' id='path-06'><strong>步骤 06：网格曲面的形变<\/strong><br>阅读：<a href=\"#/chapter/ch06\">第 6 章：网格曲面的形变<\/a><br>检查点：能写出梯度域形变的最小二乘形式<\/li><li class='path-step' id='path-07'><strong>步骤 07：弹性运动模拟<\/strong><br>阅读：<a href=\"#/chapter/ch07\">第 7 章：弹性运动模拟<\/a><br>检查点：能解释 PBD 与隐式积分的关系<\/li><li class='path-step' id='path-08'><strong>步骤 08：基于机器学习的几何处理<\/strong><br>阅读：<a href=\"#/chapter/ch08\">第 8 章：基于机器学习的几何处理<\/a><br>检查点：能说出 PointNet 为什么能容忍点序<\/li><li class='path-step' id='path-09'><strong>步骤 09：新型几何处理应用<\/strong><br>阅读：<a href=\"#/chapter/ch09\">第 9 章：新型几何处理应用<\/a><br>检查点：能列出 3D 打印的三类几何约束<\/li><li class='path-step' id='path-10'><strong>步骤 10：综合检验<\/strong><br>阅读：<a href=\"#/chapter/mix\">综合测验与最终检验<\/a><br>检查点：完成最终检验项目并给出技术报告<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "kind": "path", "title": "学习路径"}, "__quiz_all__": {"html": "<p>（无综合题）<\/p>", "kind": "quiz", "title": "综合测验"}, "__quiz_ch01__": {"html": "<h1>测验：第 1 章：几何处理的数学基础<\/h1><div class='quiz-item' data-qid='q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 一个闭合球面网格的离散高斯曲率（角度亏欠）总和是多少？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q01' value='0'> 0<\/label><label class='quiz-opt'><input type='radio' name='q01' value='1'> 2π<\/label><label class='quiz-opt'><input type='radio' name='q01' value='2'> 4π<\/label><label class='quiz-opt'><input type='radio' name='q01' value='3'> 与剖分密度成正比<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q02' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 哪种表示能够精确表达一个圆？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q02' value='0'> 三次样条<\/label><label class='quiz-opt'><input type='radio' name='q02' value='1'> B-样条<\/label><label class='quiz-opt'><input type='radio' name='q02' value='2'> 有理样条 NURBS<\/label><label class='quiz-opt'><input type='radio' name='q02' value='3'> 均匀 B 样条<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q03' data-type='blank'><p class='quiz-q'><b>Q3.<\/b> 某顶点有 3 个邻居，每条边的余切权重和为 1.2，混合面积 A_i = 0.4。则离散 Laplace 前的系数 1/(2A_i) 为＿＿，Δx_i 等于该系数乘以＿＿。<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q04' data-type='blank'><p class='quiz-q'><b>Q4.<\/b> 为什么三次样条&quot;C² 连续&quot;却&quot;不局部&quot;？<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch02__": {"html": "<h1>测验：第 2 章：点云曲面重建和光顺<\/h1><div class='quiz-item' data-qid='q05' data-type='single'><p class='quiz-q'><b>Q1.<\/b> ICP 每轮迭代包含哪两步？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q05' value='0'> 特征提取与分类<\/label><label class='quiz-opt'><input type='radio' name='q05' value='1'> 找最近点对应与解闭式最优变换<\/label><label class='quiz-opt'><input type='radio' name='q05' value='2'> 三角化与抽等值面<\/label><label class='quiz-opt'><input type='radio' name='q05' value='3'> 估法向与双边滤波<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q06' data-type='single'><p class='quiz-q'><b>Q2.<\/b> Poisson 重建求解的方程是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q06' value='0'> ∇f = 0<\/label><label class='quiz-opt'><input type='radio' name='q06' value='1'> Δf = ∇·V<\/label><label class='quiz-opt'><input type='radio' name='q06' value='2'> f 等于距离场<\/label><label class='quiz-opt'><input type='radio' name='q06' value='3'> ∇×V = 0<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q07' data-type='blank'><p class='quiz-q'><b>Q3.<\/b> Delaunay 三角剖分的&quot;最小角最大化&quot;性质带来的实际好处是＿＿；而显式重建方法最怕＿＿和＿＿。<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q08' data-type='blank'><p class='quiz-q'><b>Q4.<\/b> 双边滤波为什么能保住棱线？<\/p "__quiz_ch07__": {"html": "<h1>测验：第 7 章：弹性运动模拟<\/h1><div class='quiz-item' data-qid='q25' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 显式积分的时间步上限主要由什么决定？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q25' value='0'> 总质量<\/label><label class='quiz-opt'><input type='radio' name='q25' value='1'> 系统最高振动频率<\/label><label class='quiz-opt'><input type='radio' name='q25' value='2'> 外力大小<\/label><label class='quiz-opt'><input type='radio' name='q25' value='3'> 顶点数量<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q26' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 投影动力学每步的线性系统有什么特点？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q26' value='0'> 每步重新分解<\/label><label class='quiz-opt'><input type='radio' name='q26' value='1'> 左边矩阵恒定，可预分解，每步只回代<\/label><label class='quiz-opt'><input type='radio' name='q26' value='2'> 是非线性系统<\/label><label class='quiz-opt'><input type='radio' name='q26' value='3'> 是特征值问题<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q27' data-type='blank'><p class='quiz-q'><b>Q3.<\/b> 子空间模拟把未知量从＿＿个降到＿＿个；它在＿＿与＿＿两类场景下会失效。<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q28' data-type='blank'><p class='quiz-q'><b>Q4.<\/b> 为什么&quot;网格加密会让弹簧质点模型变硬&quot;？<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch08__": {"html": "<h1>测验：第 8 章：基于机器学习的几何处理<\/h1><div class='quiz-item' data-qid='q29' data-type='single'><p class='quiz-q'><b>Q1.<\/b> L1 正则产生稀疏解的直接原因是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q29' value='0'> 它是凸函数<\/label><label class='quiz-opt'><input type='radio' name='q29' value='1'> 等值线有尖角，最优点易落在坐标轴上<\/label><label class='quiz-opt'><input type='radio' name='q29' value='2'> 梯度更大<\/label><label class='quiz-opt'><input type='radio' name='q29' value='3'> 等价于 L0<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q30' data-type='single'><p class='quiz-q'><b>Q2.<\/b> PointNet 对输入顺序不敏感靠的是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q30' value='0'> 卷积<\/label><label class='quiz-opt'><input type='radio' name='q30' value='1'> 循环网络<\/label><label class='quiz-opt'><input type='radio' name='q30' value='2'> 逐点 MLP + 对称池化（最大池化）<\/label><label class='quiz-opt'><input type='radio' name='q30' value='3'> 图拉普拉斯<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q31' data-type='blank'><p class='quiz-q'><b>Q3.<\/b> 低秩正朝向方法依赖的观察是：人造模型摆正时，其在三个坐标平面上的投影矩阵具有＿＿；可优化的替代目标是＿＿。<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q32' data-type='blank'><p class='quiz-q'><b>Q4.<\/b> 为什么几何信号比图像信号更难稀疏表达？<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch09__": {"html": "<h1>测验：第 9 章：新型几何处理应用<\/h1><div class='quiz-item' data-qid='q33' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 重定向行走中人对哪类增益最敏感？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q33' value='0'> 平移增益<\/label><label class='quiz-opt'><input type='radio' name='q33' value='1'> 旋转增益<\/label><label class='quiz-opt'><input type='radio' name='q33' value='2'> 视场角增益<\/label><label class='quiz-opt'><input type='radio' name='q33' value='3'> 时间增益<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q34' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 3D 打印中&quot;悬垂面&quot;的判定依据是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q34' value='0'> 面积大小<\/label><label class='quiz-opt'><input type='radio' name='q34' value='1'> 法向与竖直方向夹角（相对水平面倾角小于约 45°）<\/label><label class='quiz-opt'><input type='radio' name='q34' value='2'> 顶点数量<\/label><label class='quiz-opt'><input type='radio' name='q34' value='3'> 曲率符号<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q35' data-type='blank'><p class='quiz-q'><b>Q3.<\/b> 机器人自主扫描把&quot;自由区域&quot;与&quot;未知区域&quot;的交界称为＿＿；用势场规划时通常把＿＿当作势源。<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q36' data-type='blank'><p class='quiz-q'><b>Q4.<\/b> 为什么&quot;联合分割与识别&quot;比&quot;先分割再识别&quot;更稳？<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_mix__": {"html": "<h1>测验：综合测验与最终检验<\/h1><div class='quiz-item' data-qid='q37' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 下列哪一项<strong>不需要<\/strong>求解全局稀疏线性系统？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q37' value='0'> 调和参数化<\/label><label class='quiz-opt'><input type='radio' name='q37' value='1'> 梯度域形变<\/label><label class='quiz-opt'><input type='radio' name='q37' value='2'> Poisson 重建<\/label><label class='quiz-opt'><input type='radio' name='q37' value='3'> QEM 边坍缩的选边<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q38' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 第 1 章的离散 Laplace 算子在第 5 章被用来做什么？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q38' value='0'> 计算 Hausdorff 距离<\/label><label class='quiz-opt'><input type='radio' name='q38' value='1'> 构造 HKS 与谱聚类（Ncut）<\/label><label class='quiz-opt'><input type='radio' name='q38' value='2'> 生成四边形网格<\/label><label class='quiz-opt'><input type='radio' name='q38' value='3'> 处理碰撞<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q39' data-type='blank'><p class='quiz-q'><b>Q3.<\/b> 从数学结构上看，第 6 章的梯度域形变、第 7 章的投影动力学、第 2 章的 Poisson 重建都共享同一个模式：先构造＿＿，再解＿＿。<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q40' data-type='blank'><p class='quiz-q'><b>Q4.<\/b> 为什么&quot;四边形化球面不可能没有奇异点&quot;？请用指数与欧拉示性数说明。<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q41' data-type='blank'><p class='quiz-q'><b>Q5.<\/b> 给定一份带噪声、有遮挡缺失的文物扫描点云，请给出处理流程并说明每一步的理由。<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q42' data-type='blank'><p class='quiz-q'><b>Q6.<\/b> 如果你要在移动端实时编辑一个 5 万顶点的网格（拖拽骨架 + 保体积），会选择哪些技术组合？说明取舍。<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__cards__": {"html": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "kind": "cards", "title": "抽认卡"}, "__glossary__": {"html": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='离散化（discretization）'>离散化（Discretization） — 把连续的曲面、微分、积分换成有限个点和面能表达、能计算的一整套做法 <span class=glossary-ref>（第 1 章：几何处理的数学基础）<\/span><\/li><li data-term='多边形网格曲面'>多边形网格曲面 — 顶点表记坐标、面片表记&quot;哪几个顶点连成一个面&quot;，拼出的分片平面曲面 <span class=glossary-ref>（第 1 章：几何处理的数学基础）<\/span><\/li><li data-term='顶点表 / 面片表'>顶点表 / 面片表 — 顶点表是一串坐标，面片表是一串顶点编号的组合 <span class=glossary-ref>（第 1 章：几何处理的数学基础）<\/span><\/li><li data-term='流形网格'>流形网格 — 每个顶点的邻域都像一小块平盘，没有自交、没有多余薄片的网格 <span class=glossary-ref>（第 1 章：几何处理的数学基础）<\/span><\/li><li data-term='亏格（genus）'>亏格（genus） — 曲面上&quot;洞&quot;的个数，甜甜圈是 1，球是 0 <span class=glossary-ref>（第 1 章：几何处理的数学基础）<\/span><\/li><li data-term='隐式曲面'>隐式曲面 — 用&quot;函数值等于零&quot;的点集来描述的曲面，没有顶点和面片 <span class=glossary-ref>（第 1 章：几何处理的数学基础）<\/span><\/li><li data-term='符号距离场（sdf）'>符号距离场（SDF） — 空间每一点记录&quot;到曲面多远&quot;和&quot;在里还是在外&quot; <span class=glossary-ref>（第 1 章：几何处理的数学基础）<\/span><\/li><li data-term='等值面'>等值面 — 函数取值相同的点连成的面，SDF 的零等值面就是曲面本身 <span class=glossary-ref>（第 1 章：几何处理的数学基础）<\/span><\/li><li data-term='参数曲面'>参数曲面 — 用两个参数 (u,v) 把一张平面片&quot;贴&quot;到空间曲面上 <span class=glossary-ref>（第 1 章：几何处理的数学基础）<\/span><\/li><li data-term='三次样条'>三次样条 — 分段的三次多项式，接缝处一阶、二阶导数都连续 <span class=glossary-ref>（第 1 章：几何处理的数学基础）<\/span><\/li><li data-term='自然边界条件'>自然边界条件 — 样条首末两端二阶导数取零的约定 <span class=glossary-ref>（第 1 章：几何处理的数学基础）<\/span><\/li><li data-term='埃尔米特样条'>埃尔米特样条 — 除了点，还给每点的切方向，因此能局部修改 <span class=glossary-ref>（第 1 章：几何处理的数学基础）<\/span><\/li><li data-term='bézier 曲线'>Bézier 曲线 — 把控制点按 Bernstein 权重做加权平均得到的曲线 <span class=glossary-ref>（第 1 章：几何处理的数学基础）<\/span><\/li><li data-term='de casteljau 算法'>de Casteljau 算法 — 反复取两点中点来画 Bézier 曲线的数值方法 <span class=glossary-ref>（第 1 章：几何处理的数学基础）<\/span><\/li><li data-term='b-样条'>B-样条 — Bézier 的局部版：改一个控制点只影响附近几段 <span class=glossary-ref>（第 1 章：几何处理的数学基础）<\/span><\/li><li data-term='有理样条（nurbs）'>有理样条（NURBS） — 给控制点加权重再平均，能精确画出圆和圆锥 <span class=glossary-ref>（第 1 章：几何处理的数学基础）<\/span><\/li><li data-term='第一基本形式'>第一基本形式 — 曲面上的&quot;尺子&quot;，用来量切向长度和夹角 <span class=glossary-ref>（第 1 章：几何处理的数学基础）<\/span><\/li><li data-term='第二基本形式'>第二基本形式 — 曲面上的&quot;弯曲计&quot;，用来量沿法向弯了多少 <span class=glossary-ref>（第 1 章：几何处理的数学基础）<\/span><\/li><li data-term='主曲率'>主曲率 — 一点上沿两个互相垂直方向的最大、最小弯曲程度 <span class=glossary-ref>（第 1 章：几何处理的数学基础）<\/span><\/li><li data-term='高斯曲率'>高斯曲率 — 两个主曲率的乘积，反映&quot;像球还是像马鞍&quot; <span class=glossary-ref>（第 1 章：几何处理的数学基础）<\/span><\/li><li data-term='平均曲率'>平均曲率 — 两个主曲率的一半之和，反映&quot;整体鼓还是塌&quot; <span class=glossary-ref>（第 1 章：几何处理的数学基础）<\/span><\/li><li data-term='脐点'>脐点 — 两个主曲率相等的点，局部像球面 <span class=glossary-ref>（第 1 章：几何处理的数学基础）<\/span><\/li><li data-term='离散 laplace 算子'>离散 Laplace 算子 — 把&quot;本点与邻居的加权平均之差&quot;写成矩阵，逐顶点计算 <span class=glossary-ref>（第 1 章：几何处理的数学基础）<\/span><\/li><li data-term='余切权重'>余切权重 — 用边所对角的余切给这条边加权，是离散 Laplace 的标准权重 <span class=glossary-ref>（第 1 章：几何处理的数学基础）<\/span><\/li><li data-term='角度亏欠'>角度亏欠 — 顶点一圈三角形的内角和与 2π 的差，即离散高斯曲率 <span class=glossary-ref>（第 1 章：几何处理的数学基础）<\/span><\/li><li data-term='离散高斯-博内定理'>离散高斯-博内定理 — 全网格角度亏欠求和 = 2π × 欧拉示性数 <span class=glossary-ref>（第 1 章：几何处理的数学基础）<\/span><\/li><li data-term='hausdorff 距离'>Hausdorff 距离 — 两个点集各自的&quot;最不像&quot;程度取大者，用来衡量两条曲面差多少 <span class=glossary-ref>（第 1 章：几何处理的数学基础）<\/span><\/li><li data-term='voronoi 图'>Voronoi 图 — 每个点分到一块&quot;离它最近&quot;的地盘 <span class=glossary-ref>（第 1 章：几何处理的数学基础）<\/span><\/li><li data-term='delaunay 三角剖分'>Delaunay 三角剖分 — Voronoi 图的对偶：地盘相邻的点连成三角形 <span class=glossary-ref>（第 1 章：几何处理的数学基础）<\/span><\/li><li data-term='网格求交裁剪'>网格求交裁剪 — 让两个网格的三角形两两求交、切开、重新连边 <span class=glossary-ref>（第 1 章：几何处理的数学基础）<\/span><\/li><li data-term='无约束优化'>无约束优化 — 只让目标函数变小，不加任何限制 <span class=glossary-ref>（第 1 章：几何处理的数学基础）<\/span><\/li><li data-term='牛顿法'>牛顿法 — 用二阶导数（Hessian）直接跳到二次近似的最小点 <span class=glossary-ref>（第 1 章：几何处理的数学基础）<\/span><\/li><li data-term='带约束优化'>带约束优化 — 在等式/不等式限制下找最优 <span class=glossary-ref>（第 1 章：几何处理的数学基础）<\/span><\/li><li data-term='kkt 条件'>KKT 条件 — 带约束问题最优解的&quot;必要条件&quot;，含互补松弛 <span class=glossary-ref>（第 1 章：几何处理的数学基础）<\/span><\/li><li data-term='点云配准'>点云配准 — 求一个变换把两片点云对齐 <span class=glossary-ref>（第 2 章：点云曲面重建和光顺）<\/span><\/li><li data-term='icp'>ICP — 交替做&quot;找最近点对&quot;和&quot;解最优变换&quot;直到不再改善 <span class=glossary-ref>（第 2 章：点云曲面重建和光顺）<\/span><\/li><li data-term='刚性变换'>刚性变换 — 只有旋转和平移，形状不变 <span class=glossary-ref>（第 2 章：点云曲面重建和光顺）<\/span><\/li><li data-term='非刚性配准'>非刚性配准 — 允许目标发生形变的配准 <span class=glossary-ref>（第 2 章：点云曲面重建和光顺）<\/span><\/li><li data-term='crust 算法'>Crust 算法 — 借 Voronoi 顶点扩张采样集，再从 Delaunay 里挑出曲面三角形 <span class=glossary-ref>（第 2 章：点云曲面重建和光顺）<\/span><\/li><li data-term='极点（pole）'>极点（pole） — 某采样点所在 Voronoi 单元里，离它最远、位于曲面两侧的两个顶点 <span class=glossary-ref>（第 2 章：点云曲面重建和光顺）<\/span><\/li><li data-term='power crust'>Power Crust — 用带权 Voronoi 处理采样不均匀的 Crust 变体 <span class=glossary-ref>（第 2 章：点云曲面重建和光顺）<\/span><\/li><li data-term='cocone 算法'>Cocone 算法 — 用锥形条件筛三角形，保证输出是流形 <span class=glossary-ref>（第 2 章：点云曲面重建和光顺）<\/span><\/li><li data-term='径向基函数（rbf）'>径向基函数（RBF） — 以每个采样点为中心放一个&quot;钟形&quot;函数，叠加起来拟合曲面 <span class=glossary-ref>（第 2 章：点云曲面重建和光顺）<\/span><\/li><li data-term='poisson 曲面重建'>Poisson 曲面重建 — 解 Poisson 方程，让指示函数的梯度等于采样法向场 <span class=glossary-ref>（第 2 章：点云曲面重建和光顺）<\/span><\/li><li data-term='marching cubes'>Marching Cubes — 在体素格上按符号变化挖出三角形，得到等值面 <span class=glossary-ref>（第 2 章：点云曲面重建和光顺）<\/span><\/li><li data-term='曲面光顺'>曲面光顺 — 抹掉高频噪声、保留大形状的操作 <span class=glossary-ref>（第 2 章：点云曲面重建和光顺）<\/span><\/li><li data-term='双边滤波'>双边滤波 — 只有距离近、法向也接近的邻居才参与平均 <span class=glossary-ref>（第 2 章：点云曲面重建和光顺）<\/span><\/li><li data-term='参数化'>参数化 — 给曲面上每个点一个平面坐标 (u,v) <span class=glossary-ref>（第 3 章：网格曲面的参数化和多分辨率表示）<\/span><\/li><li data-term='调和映射'>调和映射 — 让参数化坐标满足拉普拉斯方程（离散下即坐标是邻居的加权平均） <span class=glossary-ref>（第 3 章：网格曲面的参数化和多分辨率表示）<\/span><\/li><li data-term='共形 / 保角'>共形 / 保角 — 只保角度不保面积；反过来叫保面积 <span class=glossary-ref>（第 3 章：网格曲面的参数化和多分辨率表示）<\/span><\/li><li data-term='翻转（flip）'>翻转（flip） — 摊平后三角形绕向反转或重叠 <span class=glossary-ref>（第 3 章：网格曲面的参数化和多分辨率表示）<\/span><\/li><li data-term='多片参数化'>多片参数化 — 先把曲面切成几块，各自摊平再拼回来 <span class=glossary-ref>（第 3 章：网格曲面的参数化和多分辨率表示）<\/span><\/li><li data-term='渐进参数化'>渐进参数化 — 先摊平粗网格，再插入新点局部修正 <span class=glossary-ref>（第 3 章：网格曲面的参数化和多分辨率表示）<\/span><\/li><li data-term='二次误差度量（qem）'>二次误差度量（QEM） — 删点时用&quot;到原来若干平面的距离平方和&quot;评估损失 <span class=glossary-ref>（第 3 章：网格曲面的参数化和多分辨率表示）<\/span><\/li><li data-term='渐进网格（pm）'>渐进网格（PM） — 把简化过程存成一串可逆的边坍缩记录 <span class=glossary-ref>（第 3 章：网格曲面的参数化和多分辨率表示）<\/span><\/li><li data-term='三角带'>三角带 — 用&quot;加一个顶点成一个三角形&quot;的方式连续输出三角形 <span class=glossary-ref>（第 3 章：网格曲面的参数化和多分辨率表示）<\/span><\/li><li data-term='edgebreaker'>Edgebreaker — 用 C/L/E/R/S 五种符号沿边遍历编码整个网格 <span class=glossary-ref>（第 3 章：网格曲面的参数化和多分辨率表示）<\/span><\/li><li data-term='重网格化'>重网格化 — 保持形状、换一套更规整的采样（顶点数可变多也可变少） <span class=glossary-ref>（第 4 章：网格模型的重网格化）<\/span><\/li><li data-term='方向场 / 交叉场'>方向场 / 交叉场 — 每点给 4 个互相垂直的切向，规定四边形怎么铺 <span class=glossary-ref>（第 4 章：网格模型的重网格化）<\/span><\/li><li data-term='周期跳跃'>周期跳跃 — 方向场转过 90° 时向量分量变号，跨块计算要先翻符号 <span class=glossary-ref>（第 4 章：网格模型的重网格化）<\/span><\/li><li data-term='奇异点'>奇异点 — 方向场绕一圈回不到原值的位置，对应 3 价或 5 价顶点 <span class=glossary-ref>（第 4 章：网格模型的重网格化）<\/span><\/li><li data-term='morse-smale 复形'>Morse-Smale 复形 — 用标量场的梯度流把曲面切成四边形块 <span class=glossary-ref>（第 4 章：网格模型的重网格化）<\/span><\/li><li data-term='标架场'>标架场 — 每点给 3 个互相垂直方向，六面体网格的铺设依据 <span class=glossary-ref>（第 4 章：网格模型的重网格化）<\/span><\/li><li data-term='多立方体（polycube）'>多立方体（polycube） — 用轴对齐立方体拼出的近似模型，可当六面体网格的骨架 <span class=glossary-ref>（第 4 章：网格模型的重网格化）<\/span><\/li><li data-term='形状描述子'>形状描述子 — 把形状压成一个向量，使&quot;像不像&quot;变成可算的距离 <span class=glossary-ref>（第 5 章：三维形状分析）<\/span><\/li><li data-term='d2 形状分布'>D2 形状分布 — 随机采样两点、统计距离分布作为描述子 <span class=glossary-ref>（第 5 章：三维形状分析）<\/span><\/li><li data-term='球谐函数描述子'>球谐函数描述子 — 把形状展开到球面频率基上，取系数当特征 <span class=glossary-ref>（第 5 章：三维形状分析）<\/span><\/li><li data-term='热核签名（hks）'>热核签名（HKS） — 曲面上某点残留热量的时间曲线，等距不变 <span class=glossary-ref>（第 5 章：三维形状分析）<\/span><\/li><li data-term='波核签名（wks）'>波核签名（WKS） — 用拉普拉斯特征值加权的振动版签名 <span class=glossary-ref>（第 5 章：三维形状分析）<\/span><\/li><li data-term='网格分割'>网格分割 — 按几何或语义把网格切成若干互不重叠的块 <span class=glossary-ref>（第 5 章：三维形状分析）<\/span><\/li><li data-term='归一化割'>归一化割 — 切口小、且每块不能太小的分割目标 <span class=glossary-ref>（第 5 章：三维形状分析）<\/span><\/li><li data-term='协同分割'>协同分割 — 一组相关模型一起切，对应部位切法一致 <span class=glossary-ref>（第 5 章：三维形状分析）<\/span><\/li><li data-term='形状检索'>形状检索 — 按描述子距离从库里找最相似的模型 <span class=glossary-ref>（第 5 章：三维形状分析）<\/span><\/li><li data-term='蒙皮'>蒙皮 — 用骨架带动表面，顶点按权重混合若干骨头的变换 <span class=glossary-ref>（第 6 章：网格曲面的形变）<\/span><\/li><li data-term='线性混合蒙皮（lbs）'>线性混合蒙皮（LBS） — 顶点位置 = 各骨变换后的位置按权重相加 <span class=glossary-ref>（第 6 章：网格曲面的形变）<\/span><\/li><li data-term='自由形变（ffd）'>自由形变（FFD） — 把模型装进控制网格，动格子就带动模型 <span class=glossary-ref>（第 6 章：网格曲面的形变）<\/span><\/li><li data-term='梯度域形变'>梯度域形变 — 保留每个点的微分坐标，再一次性重建全局位置 <span class=glossary-ref>（第 6 章：网格曲面的形变）<\/span><\/li><li data-term='拉普拉斯坐标'>拉普拉斯坐标 — 顶点位置减去邻居平均，刻画&quot;局部凸起多少&quot; <span class=glossary-ref>（第 6 章：网格曲面的形变）<\/span><\/li><li data-term='变形图（cage / 体图）'>变形图（cage / 体图） — 包住模型的低模控制网格，用来传递形变 <span class=glossary-ref>（第 6 章：网格曲面的形变）<\/span><\/li><li data-term='arap'>ARAP — 让每个三角形尽量只旋转不拉伸的形状保持能量 <span class=glossary-ref>（第 6 章：网格曲面的形变）<\/span><\/li><li data-term='局部-全局迭代'>局部-全局迭代 — 先固定旋转求位置、再固定位置求旋转，交替下降 <span class=glossary-ref>（第 6 章：网格曲面的形变）<\/span><\/li><li data-term='子空间形变'>子空间形变 — 只在少数基向量张成的空间里求未知量，以速度换精度 <span class=glossary-ref>（第 6 章：网格曲面的形变）<\/span><\/li><li data-term='弹性运动模拟'>弹性运动模拟 — 按力与加速度的物理方程推进形状随时间变化 <span class=glossary-ref>（第 7 章：弹性运动模拟）<\/span><\/li><li data-term='隐式积分'>隐式积分 — 用后一时刻的力反推位移，大时间步也稳定 <span class=glossary-ref>（第 7 章：弹性运动模拟）<\/span><\/li><li data-term='子空间降维'>子空间降维 — 只用最低频的少量振动模态表示运动 <span class=glossary-ref>（第 7 章：弹性运动模拟）<\/span><\/li><li data-term='pbd / 投影动力学'>PBD / 投影动力学 — 先预测位置，再把约束&quot;投影&quot;回满足约束的集合 <span class=glossary-ref>（第 7 章：弹性运动模拟）<\/span><\/li><li data-term='碰撞检测'>碰撞检测 — 判断哪些三角形对相交 <span class=glossary-ref>（第 7 章：弹性运动模拟）<\/span><\/li><li data-term='层次包围盒（bvh）'>层次包围盒（BVH） — 用一层层盒子把不可能相交的三角形成批排除 <span class=glossary-ref>（第 7 章：弹性运动模拟）<\/span><\/li><li data-term='旋转-应变分解'>旋转-应变分解 — 把形变拆成旋转部分和拉伸部分，分别控制 <span class=glossary-ref>（第 7 章：弹性运动模拟）<\/span><\/li><li data-term='稀疏编码'>稀疏编码 — 用字典里少数几个&quot;原子&quot;的加权和表示信号 <span class=glossary-ref>（第 8 章：基于机器学习的几何处理）<\/span><\/li><li data-term='字典学习'>字典学习 — 连&quot;原子&quot;本身也从数据里学出来 <span class=glossary-ref>（第 8 章：基于机器学习的几何处理）<\/span><\/li><li data-term='l1 正则'>L1 正则 — 加一项&quot;系数绝对值之和&quot;的惩罚，逼出稀疏解 <span class=glossary-ref>（第 8 章：基于机器学习的几何处理）<\/span><\/li><li data-term='低秩优化'>低秩优化 — 要求矩阵秩尽量小，等价于要求信息高度重复 <span class=glossary-ref>（第 8 章：基于机器学习的几何处理）<\/span><\/li><li data-term='压缩感知'>压缩感知 — 信号本身稀疏时，少量测量即可恢复 <span class=glossary-ref>（第 8 章：基于机器学习的几何处理）<\/span><\/li><li data-term='pointnet'>PointNet — 逐点提特征、再池化成全局向量的点云网络 <span class=glossary-ref>（第 8 章：基于机器学习的几何处理）<\/span><\/li><li data-term='流形卷积'>流形卷积 — 在曲面上按测地距离聚合邻居，而不是按平面网格 <span class=glossary-ref>（第 8 章：基于机器学习的几何处理）<\/span><\/li><li data-term='生成模型（vae/gan）'>生成模型（VAE/GAN） — 学数据分布，并能采样出新的形状 <span class=glossary-ref>（第 8 章：基于机器学习的几何处理）<\/span><\/li><li data-term='重定向行走'>重定向行走 — 用视觉增益、转向、传送让人在有限空间里以为走了很远 <span class=glossary-ref>（第 9 章：新型几何处理应用）<\/span><\/li><li data-term='场景映射'>场景映射 — 把虚拟大场景&quot;折叠&quot;进真实小场地 <span class=glossary-ref>（第 9 章：新型几何处理应用）<\/span><\/li><li data-term='可打印性'>可打印性 — 能支撑、能闭合、强度够、装得进打印空间 <span class=glossary-ref>（第 9 章：新型几何处理应用）<\/span><\/li><li data-term='切片与路径规划'>切片与路径规划 — 把模型切成一层层轮廓并规划打印头轨迹 <span class=glossary-ref>（第 9 章：新型几何处理应用）<\/span><\/li><\/ul>", "kind": "glossary", "title": "术语表"}, "__patterns__": {"html": "<h1>模式与框架库<\/h1>\n<p>这本书真正可迁移的不是具体算法，而是作者反复使用的几个分析框架，以及他明确反对的做法。下面把框架和规则抽出来，用的时候可以直接套。<\/p>\n<h2>框架一：三种表示的选择题<\/h2>\n<p>任何几何问题先问&quot;我用哪种表示&quot;：<\/p>\n<table><thead><tr><th>表示<\/th><th>擅长的<\/th><th>不擅长的<\/th><\/tr><\/thead><tbody><tr><td>多边形网格<\/td><td>渲染、编辑、拓扑明确<\/td><td>布尔运算、拓扑变化、光滑度<\/td><\/tr><tr><td>隐式（SDF/指示函数）<\/td><td>布尔运算、重建、拓扑自适应<\/td><td>精确渲染、尖锐特征<\/td><\/tr><tr><td>参数（样条/NURBS）<\/td><td>光滑曲面、工业 CAD<\/td><td>任意拓扑、局部细节<\/td><\/tr><\/tbody><\/table>\n<p><strong>怎么用<\/strong>：先问&quot;这个任务需要拓扑变化吗&quot;（需要 → 隐式）、&quot;需要精确工业曲线吗&quot;（需要 → 参数）、&quot;只要渲染和编辑吗&quot;（是 → 网格）。三者可以互相转换（Marching Cubes、参数化、拟合），所以真正的决策是&quot;转换成本 vs 收益&quot;。<\/p>\n<h2>框架二：局部微分 + 全局求解<\/h2>\n<p>这是全书出现频率最高的结构。所有变体都是同一条：<\/p>\n<ol><li>\n定义一个<strong>局部量<\/strong>（拉普拉斯坐标、边长、法向、相似变换）；\n<\/li><li>\n写一个&quot;让新形状的局部量保持原局部量&quot;的能量；\n<\/li><li>\n求解 → 得到全局坐标。\n<\/ol>\n<table><thead><tr><th>出现位置<\/th><th>局部量<\/th><th>全局求解<\/th><\/tr><\/thead><tbody><tr><td>Poisson 重建<\/td><td>法向场<\/td><td>Δf = ∇·V<\/td><\/tr><tr><td>参数化<\/td><td>三角形形状<\/td><td>稀疏最小二乘<\/td><\/tr><tr><td>梯度域形变<\/td><td>拉普拉斯坐标<\/td><td>L v&#x27; = b<\/td><\/tr><tr><td>ARAP<\/td><td>边长<\/td><td>稀疏系统 + 旋转交替<\/td><\/tr><tr><td>投影动力学<\/td><td>约束投影<\/td><td>常量矩阵系统<\/td><\/tr><\/tbody><\/table>\n<p><strong>怎么用<\/strong>：遇到&quot;要改整体但保细节&quot;的需求，先问&quot;细节能被什么局部量表示&quot;，再问&quot;这些局部量是否可积&quot;。不可积的部分必须投影掉（Helmholtz 分解），否则系统无解。<\/p>\n<h2>框架三：交替优化（局部-全局迭代）<\/h2>\n<p>固定 A 求 B，固定 B 求 A，循环到收敛。<\/p>\n<ul><li>\nASAP：旋转 ↔ 坐标；\n<\/li><li>\nARAP：每三角形旋转 ↔ 顶点位置；\n<\/li><li>\nICP：对应 ↔ 变换；\n<\/li><li>\n方向场：整数 ↔ 连续场（逐步取整）。\n<\/ul>\n<p><strong>怎么用<\/strong>：只要能量能拆成&quot;每对变量各自的最优子问题&quot;，就可以交替。注意三个前提：每个子问题可解（闭式或凸）、整体能量单调下降、初值不离正确解太远。三者缺一，就会卡在坏的局部极小。<\/p>\n<h2>框架四：约束怎么进目标函数<\/h2>\n<p>三种写法，代价完全不同：<\/p>\n<table><thead><tr><th>写法<\/th><th>例子<\/th><th>优点<\/th><th>缺点<\/th><\/tr><\/thead><tbody><tr><td>硬约束（拉格朗日/KKT）<\/td><td>固定控制点、锚点<\/td><td>精确满足<\/td><td>组合爆炸、可能不可行<\/td><\/tr><tr><td>软约束（惩罚项 λ）<\/td><td>筛选 Poisson、权重正则<\/td><td>一定可解<\/td><td>λ 难调，太大病态、太小不满足<\/td><\/tr><tr><td>归一化（比值目标）<\/td><td>Ncut、MIPS<\/td><td>无需调参、自动平衡<\/td><td>目标非凸<\/td><\/tr><\/tbody><\/table>\n<p><strong>怎么用<\/strong>：能写成归一化的，优先归一化（Ncut 就是范例）；必须精确满足又规模小的，用硬约束；规模大或可能不可行，用软约束并给出 λ 的敏感度分析。<\/p>\n<h2>框架五：从连续到离散的三次检查<\/h2>\n<p>离散化不是&quot;把公式里的积分换成求和&quot;。每次都要检查三件事：<\/p>\n<ol><li>\n<strong>收敛性<\/strong>：细分后是否趋于连续解？（均匀 Laplace 权重不满足，余切权重满足）\n<\/li><li>\n<strong>不变量<\/strong>：连续定理在离散下是否仍成立？（Gauss-Bonnet 对任意剖分成 2πχ）\n<\/li><li>\n<strong>退化情形<\/strong>：钝角、退化三角形、非流形边怎么处理？（钝角使余切为负）\n<\/ol>\n<p><strong>怎么用<\/strong>：写完一个离散算子，先找它的连续原型定理，再验证&quot;剖分加密时误差是否下降&quot;。通不过第 1 条，算子就是错的。<\/p>\n<h2>决策规则<\/h2>\n<p><strong>R1 重建方法：干净数据用显式，脏数据用隐式。<\/strong> 采样密、噪声低、要拓扑保证 → Crust/Cocone；有噪声、有缺失、要水密 → 筛选 Poisson。理由：显式方法依赖精确的 Delaunay 结构，噪声会改变结构本身。<\/p>\n<p><strong>R2 参数化：先保证不翻，再减少扭曲。<\/strong> Tutte（正权重 + 凸边界）给可行初值；再用 ASAP/MIPS 优化；如果优化中翻转，减小步长或加障碍项。顺序不能反。<\/p>\n<p><strong>R3 简化：误差预算驱动，而不是面数驱动。<\/strong> 先定&quot;允许的 Hausdorff 误差&quot;，再让 QEM 跑到预算边界；QEM 的二次型天然就是误差上界估计。<\/p>\n<p><strong>R4 形变：小变形用线性，大变形用非线性。<\/strong> 线性（梯度域）快但关节会塌；非线性（ARAP + 体积约束）慢但不塌。判断标准：旋转角是否超过约 45°、是否有明显弯曲。<\/p>\n<p><strong>R5 模拟：先定时间预算，再选积分器。<\/strong> 需要毫秒级 → PBD 或投影动力学；需要物理准确 → 隐式 + 有限元；需要多次材质迭代 → 子空间 + Cubature。<\/p>\n<p><strong>R6 学习：先问&quot;数据够不够&quot;，再问&quot;要不要保证&quot;。<\/strong> 数据少 → 手工特征 + 浅层模型；数据多但要保证不自交/不翻转 → 学习 + 后处理投影；数据多且只要&quot;像&quot; → 端到端生成。<\/p>\n<h2>反模式（作者明确反对或反复警告的）<\/h2>\n<p><strong>A1 &quot;把网格加密就能提精度&quot;。<\/strong> 错在：加密后刚度、权重、时间步都要重标定，不重标定等于换了一个物理系统。正确做法：按边长重标定弹簧刚度，或改用连续介质参数。<\/p>\n<p><strong>A2 &quot;一次性取整整数变量&quot;。<\/strong> 错在：远离整数的分量被硬拉过去，奇异点爆炸、场极不光顺。正确做法：先解连续松弛，再逐步固定最接近整数的部分，迭代优化剩余。<\/p>\n<p><strong>A3 &quot;直接对向量场积分&quot;。<\/strong> 错在：一般向量场不可积（含旋转分量），积分结果依赖路径。正确做法：先取散度再解 Poisson（Helmholtz-Hodge）。<\/p>\n<p><strong>A4 &quot;先光顺再重建&quot;。<\/strong> 错在：光顺需要法向/邻域，而点云没有可靠邻域；顺序反了会把结构一起抹平。正确做法：先重建（或先做 MLS 投影 + 法向估计），再对网格光顺。<\/p>\n<p><strong>A5 &quot;把三角形特征重排成矩阵就当图像处理&quot;。<\/strong> 错在：排列与拓扑邻接无关，换顺序结果就变，违背&quot;几何处理应尊重曲面结构&quot;的初衷。正确做法：用测地邻域/切平面分箱（流形卷积），或至少按参数化展开。<\/p>\n<p><strong>A6 &quot;用学习模型替代所有几何算子&quot;。<\/strong> 错在：网络不保证体积守恒、不自交、力平衡。正确做法：网络负责&quot;先验/残差/加速&quot;，硬约束交给投影与优化。<\/p>", "kind": "模式库", "title": "模式库"}, "__cheatsheet__": {"html": "<h1>速查表<\/h1>\n<p>公式、流程、参数判据三类。用 Unicode 符号表示，方便在纯文本环境里读。<\/p>\n<h2>一、公式与规则<\/h2>\n<table><thead><tr><th>场景<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>离散 Laplace<\/td><td>Δx_i = (1/(2A_i)) Σ_j (cot α_ij + cot β_ij)(x_j − x_i)<\/td><\/tr><tr><td>均匀权重（对照）<\/td><td>Δx_i = (1/deg i) Σ_j (x_j − x_i)，不收敛<\/td><\/tr><tr><td>离散高斯曲率<\/td><td>K_i = 2π − Σθ_i<\/td><\/tr><tr><td>Gauss-Bonnet（离散）<\/td><td>Σ_i K_i = 2π(V − E + F) = 2πχ<\/td><\/tr><tr><td>平均曲率法向<\/td><td>H n ≈ Δx / 2（绝对值，符号依赖定向）<\/td><\/tr><tr><td>主曲率估计<\/td><td>拟合二次型 H = (1/2)(k1+k2)、K = k1·k2；k = H ± √(H² − K)<\/td><\/tr><tr><td>第一基本形式<\/td><td>E = x_u·x_u、F = x_u·x_v、G = x_v·x_v<\/td><\/tr><tr><td>第二基本形式<\/td><td>L = n·x_uu、M = n·x_uv、N = n·x_vv<\/td><\/tr><tr><td>Hermite 基<\/td><td>h00 = 2u³−3u²+1、h01 = −2u³+3u²、h10 = u³−2u²+u、h11 = u³−u²<\/td><\/tr><tr><td>Bernstein<\/td><td>B_{k,m}(u) = C(m,k) u^k (1−u)^{m−k}<\/td><\/tr><tr><td>NURBS<\/td><td>p(u) = Σ w_k p_k B_k / Σ w_k B_k<\/td><\/tr><tr><td>刚性配准<\/td><td>min Σ<\/td><td>R x_i + t − y_i<\/td><td>²；R = V Uᵀ，t = ȳ − R x̄<\/td><\/tr><tr><td>点到面距离<\/td><td>(p − q)·n_q（用目标点法向，ICP 变体）<\/td><\/tr><tr><td>热核签名<\/td><td>HKS(x,t) = Σ exp(−λ_i t) φ_i(x)²<\/td><\/tr><tr><td>波核签名<\/td><td>WKS(x,λ) = Σ g(λ,λ_i) φ_i(x)²，g 为 log 域 Gaussian<\/td><\/tr><tr><td>球面特征值<\/td><td>λ_l = l(l+1)，重数 2l+1<\/td><\/tr><tr><td>Ncut<\/td><td>cut(A,B)/assoc(A,V) + cut(B,A)/assoc(B,V)<\/td><\/tr><tr><td>谱分割方程<\/td><td>(D − W)x = λDx，取第二小特征向量<\/td><\/tr><tr><td>LBS<\/td><td>v&#x27; = Σ_j w_ij (R_j v + t_j)，Σw = 1<\/td><\/tr><tr><td>DQS<\/td><td>对偶四元数归一化线性插值后作用到顶点<\/td><\/tr><tr><td>梯度域<\/td><td>(LᵀL + λI_C)v&#x27; = Lᵀ(Tδ) + λp<\/td><\/tr><tr><td>Helmholtz-Hodge<\/td><td>u = ∇ψ + ∇×ω + h；可积部分只有 ∇ψ<\/td><\/tr><tr><td>ARAP 能量<\/td><td>Σ_t Σ_{ij} (w/2)<\/td><td>(v&#x27;_i−v&#x27;_j) − R_t(v_i−v_j)<\/td><td>²<\/td><\/tr><tr><td>Procrustes<\/td><td>R = V Uᵀ（SVD: E Sᵀ = U Σ Vᵀ）<\/td><\/tr><tr><td>运动方程<\/td><td>Mẍ + Dẋ + f_int = f_ext，D = α_m M + α_k K<\/td><\/tr><tr><td>显式稳定条件<\/td><td>h ≤ 2/ω_max，ω_max = √(k_max/m_min) 上界<\/td><\/tr><tr><td>投影动力学<\/td><td>(M/h² + Σ w_i S_iᵀ S_i)x = b，左边恒定<\/td><\/tr><tr><td>PBD 速度更新<\/td><td>v = (x_new − x_old)/h<\/td><\/tr><tr><td>L1 软阈值（1D）<\/td><td>x = max(<\/td><td>y<\/td><td>− λ/2, 0)·sign(y)<\/td><\/tr><tr><td>核范数<\/td><td>Σ σ_i（奇异值之和），秩的凸松弛<\/td><\/tr><tr><td>QEM 二次型<\/td><td>Q(x) = xᵀAx + 2bᵀx + c；最优 x̄ 解 (A_i+A_j)x̄ = −(b_i+b_j)<\/td><\/tr><tr><td>四边形奇异点指数<\/td><td>index = (4 − n)/4；Σindex = χ<\/td><\/tr><tr><td>方向场三角表示<\/td><td>ξ = (cos 4θ, sin 4θ)，旋转 90° 不变<\/td><\/tr><tr><td>六面体对称<\/td><td>24 种；球面调和 l=0 + l=4 编码为 9 维<\/td><\/tr><tr><td>重定向：增益<\/td><td>平移约 0.6—1.6 可容忍，旋转区间更窄<\/td><\/tr><tr><td>悬垂角判据<\/td><td>相对水平面倾角 &lt; 约 45° 时需要支撑<\/td><\/tr><\/tbody><\/table>\n<h2>二、常用流程<\/h2>\n<p><strong>A. 点云到网格（扫描数据）<\/strong><\/p>\n<pre><code>1. 多视角配准：特征粗配准（FPFH + RANSAC）→ ICP 精修\n2. 法向估计 + 去噪：MLS 投影 或 法向双边滤波\n3. 隐式重建：八叉树 + 筛选 Poisson（λ 由 0.1 起调）\n4. 抽等值面：Marching Cubes\n5. 网格后处理：保特征光顺（Taubin）、简化（QEM）<\/code><\/pre>\n<p><strong>B. 网格到纹理坐标（参数化）<\/strong><\/p>\n<pre><code>1. 切缝：沿曲率脊线，总长度尽量短\n2. Tutte 初值：边界→凸多边形，正权重\n3. 优化扭曲：ASAP 或 MIPS（带防翻转）\n4. 检查：最大角度扭曲、最大面积扭曲、有无翻转\n5. 打包：多片排布到 [0,1]²（bin packing）<\/code><\/pre>\n<p><strong>C. 网格到四边形<\/strong><\/p>\n<pre><code>1. 估交叉场：切向空间 + (cos4θ, sin4θ) 光顺，约束特征对齐\n2. 求整数跳跃（逐步取整），检查奇异点指数总和 = χ\n3. 全局参数化：整数格点约束\n4. 抽网格：按格点连线，修退化单元\n5. 优化：局部拓扑操作（翻转边、合并）<\/code><\/pre>\n<p><strong>D. 形变<\/strong><\/p>\n<pre><code>1. 选能量：小变形 → 梯度域；大变形 → ARAP + 体积\n2. 定约束：控制点/骨架/碰撞\n3. 交替求解至收敛（残差 &lt; 1e-4）\n4. 检查：有无自交、体积变化率、局部翻转<\/code><\/pre>\n<p><strong>E. 模拟<\/strong><\/p>\n<pre><code>1. 建模：弹簧 / 有限元（材料参数与网格无关）\n2. 积分：显式（h 由 ω_max 定）或隐式（预分解）\n3. 加速：子空间（K = 20—60 模态）/ 投影动力学 / Cubature\n4. 碰撞：BVH 检测 → 约束处理（位置修正或 KKT）\n5. 输出：每帧位置 + 速度（可再驱动材质反演）<\/code><\/pre>\n<h2>三、参数判据与经验值<\/h2>\n<table><thead><tr><th>参数<\/th><th>经验值<\/th><th>说明<\/th><\/tr><\/thead><tbody><tr><td>保特征光顺 λ<\/td><td>0.3—0.7<\/td><td>越大越保形，太小不光滑<\/td><\/tr><tr><td>双边滤波 σ_r<\/td><td>约 0.5—1 倍平均边长<\/td><td>决定&quot;跨棱是否被抹平&quot;<\/td><\/tr><tr><td>ICP 收敛阈值<\/td><td>相对误差变化 &lt; 1e-3<\/td><td>太严会空转<\/td><\/tr><tr><td>筛选 Poisson λ<\/td><td>0.1—1<\/td><td>大则贴合噪声，小则平滑过细节<\/td><\/tr><tr><td>八叉树最细层<\/td><td>约 1/256 到 1/512 包围盒<\/td><td>小于此的细节会被抹掉<\/td><\/tr><tr><td>QEM 目标<\/td><td>按误差预算（如 Hausdorff 1% 边长）<\/td><td>不按面数定<\/td><\/tr><tr><td>ARAP 迭代<\/td><td>5—15 次<\/td><td>通常 10 次内收敛<\/td><\/tr><tr><td>子空间模态 K<\/td><td>20—60<\/td><td>大幅动作需更多<\/td><\/tr><tr><td>PBD 迭代<\/td><td>10—30 次/帧<\/td><td>刚度靠迭代堆<\/td><\/tr><tr><td>显式步长<\/td><td>h ≤ 2/ω_max，实际取 0.5 倍<\/td><td>留安全余量<\/td><\/tr><tr><td>碰撞约束簿<\/td><td>每顶点最多 1 个<\/td><td>让矩阵对角，视觉几乎无损<\/td><\/tr><tr><td>悬垂支撑阈值<\/td><td>45°<\/td><td>低于此需支撑<\/td><\/tr><tr><td>重定向平移增益<\/td><td>0.6—1.6<\/td><td>个体差异大，需实测<\/td><\/tr><tr><td>四边形密度场<\/td><td>g = exp(G)，G 对称<\/td><td>保证正定<\/td><\/tr><\/tbody><\/table>\n<h2>四、常见数值校验<\/h2>\n<ul><li>\n闭合网格上 ΣK_i 应等于 2πχ；不等于说明拓扑有问题。\n<\/li><li>\n正四面体每顶点 K = π，总 4π（对应 χ = 2）。\n<\/li><li>\n等边三角形 cot60° = 0.5774，两侧权重 1.1547；A = 0.4330 → 系数 1.333。\n<\/li><li>\n球面 HKS 在 t=1 约 0.113，t=10 约 0.0796（趋于 1/(4π)）。\n<\/li><li>\n100 顶点走廊切 1 点 Ncut ≈ 1.01，中切 ≈ 0.04。\n<\/li><li>\nLBS 90° 旋转、权重 0.5/0.5 → 距离 0.707r。\n<\/li><li>\n四边形球面奇异点指数总和必须为 2（至少 8 个 3 价）。\n<\/li><li>\n1D L1：y=1、λ=2 → 解 0；λ=0.3 → 解 0.85（L2 为 0.769）。\n<\/li><li>\n梯度域 1D：δ=(1,0,0,−1)，固定 0 与 2 → x2=2/3、x3=4/3。\n<\/ul>", "kind": "速查表", "title": "速查表"}}, "base_dir": "/home/user/Doubao/chats/38451880444500994/离散几何处理点化学习/01-离散几何处理与应用", "nav": [{"label": "学习路径", "href": "#/path"}, {"label": "章节", "children": [{"label": "第 1 章：几何处理的数学基础", "href": "#/chapter/ch01"}, {"label": "第 2 章：点云曲面重建和光顺", "href": "#/chapter/ch02"}, {"label": "第 3 章：网格曲面的参数化和多分辨率表示", "href": "#/chapter/ch03"}, {"label": "第 4 章：网格模型的重网格化", "href": "#/chapter/ch04"}, {"label": "第 5 章：三维形状分析", "href": "#/chapter/ch05"}, {"label": "第 6 章：网格曲面的形变", "href": "#/chapter/ch06"}, {"label": "第 7 章：弹性运动模拟", "href": "#/chapter/ch07"}, {"label": "第 8 章：基于机器学习的几何处理", "href": "#/chapter/ch08"}, {"label": "第 9 章：新型几何处理应用", "href": "#/chapter/ch09"}, {"label": "综合测验与最终检验", "href": "#/chapter/mix"}]}, {"label": "概念", "children": [{"label": "离散 Laplace 算子与余切权重", "href": "#/concept/c01"}, {"label": "离散高斯曲率与角度亏欠", "href": "#/concept/c02"}, {"label": "样条家族：从三次样条到 NURBS", "href": "#/concept/c03"}, {"label": "点云配准与 ICP", "href": "#/concept/c04"}, {"label": "Voronoi / Delaunay 与 Crust 系列重建", "href": "#/concept/c05"}, {"label": "Poisson 曲面重建", "href": "#/concept/c06"}, {"label": "参数化：调和、共形与防翻转", "href": "#/concept/c07"}, {"label": "QEM 简化与渐进网格", "href": "#/concept/c08"}, {"label": "方向场、周期跳跃与奇异点", "href": "#/concept/c09"}, {"label": "标架场与六面体重网格化", "href": "#/concept/c10"}, {"label": "形状描述子与谱签名（HKS / WKS）", "href": "#/concept/c11"}, {"label": "网格分割与归一化割", "href": "#/concept/c12"}, {"label": "蒙皮：LBS、DQS 与骨骼学习", "href": "#/concept/c13"}, {"label": "梯度域形变与 ARAP", "href": "#/concept/c14"}, {"label": "弹性模拟：隐式积分、PBD 与子空间", "href": "#/concept/c15"}, {"label": "稀疏、低秩与深度几何学习", "href": "#/concept/c16"}]}, {"label": "测验", "children": [{"label": "综合测验", "href": "#/quiz/all"}, {"label": "测验：第 1 章：几何处理的数学基础", "href": "#/quiz/ch01"}, {"label": "测验：第 2 章：点云曲面重建和光顺", "href": "#/quiz/ch02"}, {"label": "测验：第 3 章：网格曲面的参数化和多分辨率表示", "href": "#/quiz/ch03"}, {"label": "测验：第 4 章：网格模型的重网格化", "href": "#/quiz/ch04"}, {"label": "测验：第 5 章：三维形状分析", "href": "#/quiz/ch05"}, {"label": "测验：第 6 章：网格曲面的形变", "href": "#/quiz/ch06"}, {"label": "测验：第 7 章：弹性运动模拟", "href": "#/quiz/ch07"}, {"label": "测验：第 8 章：基于机器学习的几何处理", "href": "#/quiz/ch08"}, {"label": "测验：第 9 章：新型几何处理应用", "href": "#/quiz/ch09"}, {"label": "测验：综合测验与最终检验", "href": "#/quiz/mix"}]}, {"label": "抽认卡", "href": "#/cards"}, {"label": "术语表", "href": "#/glossary"}, {"label": "模式库", "href": "#/patterns"}, {"label": "速查表", "href": "#/cheatsheet"}], "rendered": {"ch01": "<h1>第 1 章：几何处理的数学基础<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：6 小时 | <strong>前置<\/strong>：向量点积叉积、矩阵与线性方程组、偏导数、基本的求最小值经验\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说清多边形网格、隐式曲面、参数曲面三种表示各自&quot;存了什么、丢了什么&quot;，并判断一个具体任务该用哪种。\n<\/li><li>\n写出三次样条、埃尔米特样条、Bézier、B-样条、有理样条的区别（谁连续、谁局部、谁能精确画圆）。\n<\/li><li>\n从&quot;这个点比邻居平均高出多少&quot;出发，写出离散 Laplace 算子的余切权重公式，并算出一个顶点的具体数值。\n<\/li><li>\n说明为什么把角度亏欠当离散高斯曲率，以及角度亏欠求和为什么只能是 2π 的整数倍。\n<\/li><li>\n判断一个优化问题该用线搜索、牛顿、拟牛顿还是带约束的 KKT/投影方法。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>连续几何在计算机里只能被采样，因此所有&quot;微分、积分、距离、最优化&quot;都必须先改写成<strong>只依赖顶点坐标和邻接关系的离散公式<\/strong>；这套改写就是本书的算子层，后面八章都在消费它。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 0：三件必须先有的工具<\/h3>\n<p><strong>向量<\/strong>：一根有方向和长度的箭头，本书用 (x, y, z) 三个数字记它。<\/p>\n<p><strong>点积<\/strong>：a·b = ax bx + ay by + az bz，结果是<strong>一个数<\/strong>，含义是&quot;a 在 b 上投影的长度 × b 的长度&quot;。用它算夹角：cos θ = a·b / (|a||b|)。余切（cot）就是 cos/sin，等于&quot;邻边除以对边&quot;，30° 的余切约 1.732——记住这个数，本章后面算算子要用。<\/p>\n<p><strong>叉积<\/strong>：a×b 结果是<strong>一个向量<\/strong>，垂直于 a 和 b 张成的平面，长度等于平行四边形面积。三角形 (p0, p1, p2) 的单位法向就是：<\/p>\n<pre><code>n = (p1 − p0) × (p2 − p0) / |(p1 − p0) × (p2 − p0)|<\/code><\/pre>\n<p>叉积长度的一半正好是三角形面积，所以网格每个三角形的面积不用另算。<\/p>\n<p><strong>偏导数<\/strong>：把其他变量当常数、只对一个变量求导。∂f/∂x 就是&quot;只动 x 时 f 变多快&quot;。<\/p>\n<p><strong>梯度 ∇f<\/strong>：把所有偏导装成一个向量 (∂f/∂x, ∂f/∂y, ∂f/∂z)。它的方向是函数<strong>上升最快<\/strong>的方向，长度是上升速率。所以要让函数变小，就往 −∇f 走。<\/p>\n<h3>概念 1：三种曲面表示，各存了什么<\/h3>\n<p><strong>多边形网格曲面<\/strong>（难度：基础）。用两个表描述：<strong>顶点表<\/strong>记坐标，一行一个顶点；<strong>面片表<\/strong>记&quot;哪几个顶点围成一个面&quot;，一行一个面。加上<strong>边表<\/strong>（哪两个顶点相连）就是完整拓扑。<\/p>\n<p>为什么必须单独记拓扑？因为坐标只是位置，&quot;谁和谁相邻&quot;是另一份信息。同一堆顶点，连法不同就是不同形状：可以是球，也可以是一团自交的乱面。<\/p>\n<p>如果每个顶点的邻域摊平后都像一小块圆盘、网格没有自交也没有多余薄片，这个网格叫<strong>流形网格<\/strong>。流形是绝大多数算法的隐含前提：Laplace 算子、参数化、形变都要求&quot;每个顶点周围是一圈有序的三角形&quot;。<\/p>\n<p><strong>亏格<\/strong>数曲面上洞的个数：球是 0，甜甜圈是 1，双环把手是 2。亏格不是画出来的细节，它是拓扑不变量——你怎么揉都不能把甜甜圈揉成球而不撕开。<\/p>\n<p><strong>隐式曲面<\/strong>（难度：基础）。不存点，存一个函数 f(x, y, z)，曲面就是 f = 0 的那些点。最常用的是<strong>符号距离场<\/strong>（SDF）：每个点记&quot;到曲面的距离&quot;，外加一个符号表示在内部还是外部。它的好处是内外判定只要看符号、求交只要比较值；坏处是&quot;曲面上有哪些点&quot;要靠 Marching Cubes 这类算法挖出来，精度受格子分辨率限制。<\/p>\n<p><strong>参数曲面<\/strong>（难度：基础）。用两个参数 (u, v) 把一张平面片贴到空间里：S(u, v) = (x(u, v), y(u, v), z(u, v))。好处是曲面上的运算可以退化成平面上的运算（比如纹理坐标天然就是 (u, v)）；坏处是复杂拓扑贴不上一张平面片，必须切成多片。<\/p>\n<p>三者不是竞争关系，而是流水线上的不同工位：扫描仪给点云 → 重建算法给网格（第 2 章）或 SDF → 参数化把网格摊成 (u, v)（第 3 章）→ 设计软件里用样条（本节后面）做精确造型。<\/p>\n<h3>概念 2：样条家族——从&quot;分段多项式&quot;到&quot;能精确画圆&quot;<\/h3>\n<p>先说一个动机。用一条高次多项式去穿过 100 个点，会出现剧烈振荡（龙格现象）；用 100 段直线去连，又会有折角。<strong>样条<\/strong>的思路是：用很多段<strong>低次<\/strong>多项式拼接，并强迫接缝处足够光滑。<\/p>\n<p><strong>三次样条<\/strong>（难度：进阶）。每两个相邻控制点之间放一段三次多项式 p(u) = a u³ + b u² + c u + d，要求接缝处函数值、一阶导、二阶导都连续（即 C² 连续）。设共有 n+1 个控制点、n 段曲线，每段 4 个未知系数，共 4n 个未知数。约束来自两处：每段两端要穿过自己的两个控制点（2n 个方程），每个内部接缝要求一阶、二阶导相等（2(n−1) 个方程）。加起来 4n−2 个方程，比未知数少 2 个，所以还要补两个<strong>边界条件<\/strong>。最常见的是自然边界条件：首末两点二阶导取 0。<\/p>\n<p>它的毛病是<strong>不局部<\/strong>：所有段的系数由一个整体线性系统联立求解，动一个控制点，整条曲线都得重算。<\/p>\n<p><strong>埃尔米特（Hermite）样条<\/strong>（难度：进阶）。在控制点上额外给出切向量（斜率），每段曲线只由它自己的两个端点位置和两个切向决定：<\/p>\n<pre><code>p(u) = p_k h00(u) + p_{k+1} h01(u) + d_k h10(u) + d_{k+1} h11(u)\nh00 = 2u³ − 3u² + 1,  h01 = −2u³ + 3u²\nh10 = u³ − 2u² + u,   h11 = u³ − u²      （0 ≤ u ≤ 1）<\/code><\/pre>\n<p>因为完全局部，改一段不影响别段。代价是斜率先得知道——对交互设计不友好。<\/p>\n<p><strong>Bézier 曲线<\/strong>（难度：进阶）。给定 m+1 个控制点，曲线是它们的加权平均：<\/p>\n<pre><code>p(u) = Σ_{k=0}^{m} p_k B_{k,m}(u),   0 ≤ u ≤ 1\nB_{k,m}(u) = C(m,k) u^k (1−u)^{m−k}<\/code><\/pre>\n<p>权重 B 叫<strong>伯恩斯坦多项式<\/strong>，所有 B 加起来恒等于 1（所以曲线一定落在控制点的凸包里，这叫<strong>凸包性<\/strong>）。u=0 时只有 B_{0,m}=1，曲线正好从 p_0 出发；u=1 时落在 p_m。也就是说曲线<strong>端点插值、其余点只&quot;吸引&quot;不穿过<\/strong>。<\/p>\n<p>数值上不直接算高次幂，用<strong>de Casteljau 算法<\/strong>：反复把相邻控制点按 u : (1−u) 的比例取分点，取 m 轮，最后剩下的那一点就是曲线上的点。3 个控制点、u=0.5 时，依次取中点两次，得到的正是三角形中线中点——这一步可以手算验证。<\/p>\n<p><strong>B-样条<\/strong>（难度：进阶）。Bézier 的局部版。控制点权重改成&quot;只在局部非零&quot;的基函数，于是改一个控制点只影响相邻几段；代价是不再插值端点，曲线被&quot;拉&quot;在控制点附近。<\/p>\n<p><strong>有理样条（NURBS）<\/strong>（难度：高难）。给每个控制点加一个权重 w_k，再归一化：<\/p>\n<pre><code>p(u) = Σ w_k p_k B_{k,m}(u) / Σ w_k B_{k,m}(u)<\/code><\/pre>\n<p>权重越大，曲线越靠近那个控制点；所有权重取 1 时退回普通 B-样条。它有两个别的样条给不了的能力：<strong>精确表示圆和椭圆<\/strong>（普通多项式样条只能逼近，永远差一点），以及在<strong>投影变换下保持不变<\/strong>（因为分子分母同阶，投影后仍是有理形式）。这就是为什么工业 CAD 标准是 NURBS 而不是 B-样条。<\/p>\n<h3>概念 3：曲面上到底&quot;弯了多少&quot;——微分几何量与离散化<\/h3>\n<p><strong>第一基本形式<\/strong>（难度：进阶）。它是曲面上的尺子。记两个切向偏导 S_u、S_v，则<\/p>\n<pre><code>E = S_u·S_u,  F = S_u·S_v,  G = S_v·S_v<\/code><\/pre>\n<p>曲面上一条参数曲线的长度就是 ∫√(E du² + 2F du dv + G dv²)。E、F、G 就是全部&quot;度量信息&quot;：知道它们，就能算长度、角度、面积。<\/p>\n<p><strong>第二基本形式<\/strong>（难度：高难）。它是弯曲计。记单位法向 n，则<\/p>\n<pre><code>L = S_uu·n,  M = S_uv·n,  N = S_vv·n<\/code><\/pre>\n<p>直观上：第一基本形式问&quot;沿切向走多远&quot;，第二基本形式问&quot;走的时候偏离切平面多少&quot;。<\/p>\n<p><strong>主曲率<\/strong>（难度：基础）。在一点上，沿不同切方向弯曲程度不同。使法曲率取最大和最小的两个方向互相垂直，对应的曲率 k1、k2 就是主曲率。它们的组合给出两个最有用的量：<\/p>\n<pre><code>高斯曲率  K = k1 · k2      （乘起来：球面为正，马鞍为负，柱面为 0）\n平均曲率  H = (k1 + k2) / 2<\/code><\/pre>\n<p>欧拉定理说，任一方向的法曲率满足 κ(θ) = k1 cos²θ + k2 sin²θ，所以平均曲率确实是所有方向法曲率的平均。<\/p>\n<p>为什么这两个量重要？因为<strong>极小曲面<\/strong>（肥皂膜）就是 H = 0 的曲面，而 K 决定局部形状类型（球面片 K &gt; 0，马鞍 K &lt; 0，可展面 K = 0）。第 2 章的光顺、第 6 章的形变能量，写的都是 H 或 K 的离散版本。<\/p>\n<p><strong>离散 Laplace 算子<\/strong>（难度：进阶）。连续情形下，Laplace 量 Δx 衡量&quot;这一点和周围平均差多少&quot;。在网格上取顶点 i 的一环邻域（所有直接相连的顶点 j），标准做法是：<\/p>\n<pre><code>Δx_i = (1 / (2 A_i)) Σ_j (cot α_ij + cot β_ij) (x_j − x_i)<\/code><\/pre>\n<p>其中 A_i 是顶点 i 的<strong>混合面积<\/strong>（一圈三角形面积的加权和），α_ij、β_ij 是边 (i, j) 两侧正对着这条边的两个角（<strong>余切权重<\/strong>）。<\/p>\n<p>为什么是余切？一句话：要让这个离散算子在&quot;把网格细分得更密&quot;时收敛到真正的连续 Laplace，权重必须等于这条边两侧角的余切之和——这是从三角形上的分片线性函数的积分直接算出来的结果，不是凑出来的经验公式。代价是：钝角（大于 90°）的余切是负数，所以钝角三角形会让权重变负，网格质量差时算子会失稳。这解释了为什么第 3、4 章要死死盯着三角形质量。<\/p>\n<p>它的一个变形是<strong>平均曲率法向算子<\/strong>：<\/p>\n<pre><code>H(x_i) = (1 / (4 A_i)) Σ_j (cot α_ij + cot β_ij)(x_j − x_i)<\/code><\/pre>\n<p>方向就是法向，长度是平均曲率。第 2 章的光顺就是反复沿这个方向挪一点点。<\/p>\n<p><strong>角度亏欠<\/strong>（难度：进阶）。绕着顶点 i 一圈三角形的内角和记为 Σθ，则<\/p>\n<pre><code>K_i = 2π − Σθ_i<\/code><\/pre>\n<p>这个差叫角度亏欠，直接当离散高斯曲率用。为什么合理？平面上绕一点一圈角度和正好 2π，亏欠为 0；球面上绕一点一圈角度和不足 2π（球面&quot;多出来&quot;的面积要靠这个亏欠补上），所以亏欠为正；马鞍处角度和超过 2π，亏欠为负。符号与连续高斯曲率一致，这是它被采用的根本理由。<\/p>\n<p><strong>离散高斯-博内定理<\/strong>（难度：进阶）。把全网格所有顶点的角度亏欠加起来：<\/p>\n<pre><code>Σ_i K_i = 2π χ,   χ = V − E + F（欧拉示性数）<\/code><\/pre>\n<p>球面 χ = 2，所以总亏欠恒为 4π，不管你把球剖成多少个三角形。这是一个&quot;无论怎么离散都成立&quot;的拓扑恒等式，也是判断网格有没有多余洞、有没有丢面的硬指标：算出来的总亏欠不是 2πχ，就说明拓扑坏了。<\/p>\n<h3>概念 4：算两个曲面差多少——Hausdorff 距离与求交<\/h3>\n<p><strong>Hausdorff 距离<\/strong>（难度：进阶）。定义是双向的&quot;最坏情况&quot;：<\/p>\n<pre><code>d_H(A, B) = max( sup_{a∈A} inf_{b∈B} |a − b| ,  sup_{b∈B} inf_{a∈A} |a − b| )<\/code><\/pre>\n<p>翻译：A 上每个点到 B 的最近距离里取最大，B 到 A 同样取最大，两者取大。它衡量的是&quot;最不像的地方差多远&quot;，不是平均误差——这正是重建质量评估要的：平均误差可以很小，但局部破一个洞就是不能用。<\/p>\n<p>精确算很贵，实用做法是按三角形估上下界：三角形 A 到网格 B 的距离，下界用 A 的顶点到 B 的最近距离，上界用顶点距离加三角形尺寸修正，于是得到全局上下界，可用来做保守判断。<\/p>\n<p><strong>网格求交裁剪<\/strong>（难度：高难）。两个网格做布尔运算（并、交、差）的底层操作：找出所有相交的三角形对、算出交线段、沿交线把三角形切开、再把碎片重新连成闭合网格。它真正的难点不在几何求交，而在<strong>数值鲁棒性<\/strong>：浮点误差会让本应共面的两个三角形一会被判相交一会判不相交，结果是网格出现裂缝或非流形边。第 9 章的 3D 打印、第 7 章的碰撞处理都绕不开它。<\/p>\n<h3>概念 5：怎么把&quot;最小化某个能量&quot;真的算出来<\/h3>\n<p>几何处理的绝大多数问题最后都写成 min_x f(x)。<\/p>\n<p><strong>无约束优化<\/strong>（难度：基础）。核心是<strong>线搜索<\/strong>：每次先定一个下降方向 p_k，再定沿这个方向走多远（步长 α_k）。下降方向的标准形式：<\/p>\n<pre><code>p_k = −B_k⁻¹ ∇f(x_k)<\/code><\/pre>\n<p>B_k 取单位矩阵就是<strong>最速下降法<\/strong>（沿负梯度走，稳但慢，接近最优时会来回锯齿）；取 Hessian ∇²f 就是<strong>牛顿法<\/strong>（用二阶信息一步跳到二次近似的最小点，快但要算 Hessian 且要求它正定，否则方向可能不下降）；取 Hessian 的近似（用梯度差更新）就是<strong>拟牛顿法<\/strong>（BFGS/L-BFGS），在两者之间取平衡，是网格优化里最常用的默认选项。<\/p>\n<p>步长不能乱取，否则&quot;方向对但仍可能上升&quot;。<strong>Wolfe 准则<\/strong>给两个条件：一是函数值要下降够多（Armijo 条件），二是新点的斜率要明显变缓（曲率条件），防止步子太小。<\/p>\n<p><strong>带约束优化<\/strong>（难度：高难）。几何问题常带约束：顶点不能跑到模型外（边界约束）、体积不能变（等式约束）、三角形不能翻（不等式约束）。<\/p>\n<p>等式约束的标准工具是拉格朗日乘子：把约束乘上乘子加进目标，最优解处目标梯度与约束梯度平行。不等式约束再加上<strong>互补松弛<\/strong>：约束要么不起作用（乘子为 0），要么正好压在边界上（约束值为 0），二者必居其一。这三条合起来就是 <strong>KKT 条件<\/strong>，它是&quot;最优的必要条件&quot;，也是很多求解器的收敛判据。<\/p>\n<p>工程上最常遇到的是<strong>带边界约束的二次规划<\/strong>：<\/p>\n<pre><code>min ½ xᵀA x − bᵀx   subject to  x ≥ l<\/code><\/pre>\n<p>它就是&quot;每个顶点有自己的活动范围&quot;的形变/碰撞问题。书里给的典型解法 MPRGP（改进的投影梯度法）思路很朴素：把梯度分成&quot;还在可行域内部、可以自由走&quot;的部分和&quot;已经顶到边界、必须截断&quot;的部分，只沿自由部分下降，必要时用共轭梯度加速。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[三种曲面表示&lt;br/&gt;网格 / 隐式 / 参数] --&gt; B[离散算子层]\n    B --&gt; B1[离散 Laplace&lt;br/&gt;余切权重]\n    B --&gt; B2[角度亏欠&lt;br/&gt;离散高斯曲率]\n    B --&gt; B3[Hausdorff 距离&lt;br/&gt;网格求交]\n    B --&gt; B4[优化器&lt;br/&gt;线搜索 / 牛顿 / KKT]\n    B1 --&gt; C1[第2章 光顺与重建]\n    B1 --&gt; C2[第3章 参数化]\n    B1 --&gt; C3[第6章 形变]\n    B2 --&gt; C4[第5章 形状分析]\n    B3 --&gt; C5[第7章 碰撞 / 第9章 打印]\n    B4 --&gt; C1\n    B4 --&gt; C3<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：图中所有箭头都从&quot;表示&quot;流向&quot;算子&quot;再流向具体章节。看这张图要抓住一点——本书后面每一章的能量函数里出现的 Laplace、曲率、距离、优化器，都出自本章；如果某章读不懂，八成是这里某个算子没吃透。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：把网格想成一张渔网。顶点是网结，三角形是网眼。第一基本形式是&quot;网眼有多大、线有多长&quot;，第二基本形式是&quot;网面拱起来多少&quot;。往网结上轻轻一拉，网眼跟着变形——这就是离散 Laplace 在做事。<strong>类比失效的边界<\/strong>：渔网只能有四边形网眼且不能自交，而真实网格允许任意多边形、允许复杂拓扑（多个洞），也能容忍局部退化。<\/p>\n<p><strong>实例（可手算）<\/strong>：取一个正四面体的四个顶点，边长为 1，全是等边三角形（每个角 60°）。<\/p>\n<ul><li>\n每个顶点周围有 3 个三角形，内角和 Σθ = 3 × 60° = 180° = π。\n<\/li><li>\n角度亏欠 K_i = 2π − π = π ≈ 3.1416。\n<\/li><li>\n四个顶点总亏欠 = 4π，与 2πχ 对照：四面体 V=4、E=6、F=4，χ = 4 − 6 + 4 = 2，2πχ = 4π。对得上。\n<\/ul>\n<p>再算余切权重：等边三角形每个角 60°，cot 60° = 0.5774。某条边两侧各有一个 60° 角，所以权重 w = 0.5774 + 0.5774 = 1.1547。若该顶点有 3 个邻居、混合面积取每个三角形面积的 1/3（等边三角形面积 = √3/4 ≈ 0.4330），则 A_i ≈ 0.4330，于是<\/p>\n<pre><code>Δx_i = (1 / (2 × 0.4330)) × 1.1547 × Σ_j (x_j − x_i) ≈ 1.333 × Σ_j (x_j − x_i)<\/code><\/pre>\n<p>对你的球面网格，Σ_j(x_j − x_i) 会指向内部（邻居平均在&quot;里面&quot;），所以 Δx_i 指向内——这就是为什么光顺时 x ← x + εΔx 会把形状往内收缩一点点（第 2 章会看到收敛面）。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;网格越密就一定越准&quot;<\/strong>——实际上精度取决于算子是否<strong>收敛<\/strong>到连续量。余切 Laplace 在网格质量差（大量钝角三角形）时，权重变负，加密反而放大误差；均匀、近等边的网格才是前提。\n<\/li><li>\n<strong>别以为&quot;样条比网格高级，所以样条更准&quot;<\/strong>——两次都错在对象不同。样条擅长用少量参数表达光滑形状，但对带精细细节、复杂拓扑的形状表达力不足；网格擅长任意拓扑与细节，但不光滑。这也是全书反复要在两者间转换的原因。\n<\/li><li>\n<strong>别以为&quot;高斯曲率可以为任意实数，所以角度亏欠也可以&quot;<\/strong>——离散角度亏欠的值受拓扑约束：全网格求和只能是 2π 的整数倍。单个顶点的亏欠可以很负，但总和固定。算出来不对，说明网格拓扑错了。\n<\/li><li>\n<strong>别以为&quot;牛顿法一定比最速下降快&quot;<\/strong>——牛顿步要求 Hessian 正定。形变能量在接近翻转的三角形附近 Hessian 会不定，此时牛顿方向可能<strong>上升<\/strong>；所以工程实现都加&quot;是否下降&quot;的检查并回退。\n<\/li><li>\n<strong>别以为&quot;带约束优化加上惩罚项就够了&quot;<\/strong>——罚函数法把约束变成大惩罚，精度受罚系数限制，且系数太大导致病态。真正保证可行的是投影法或 KKT 类方法，这也是 MPRGP 那类算法存在的原因。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n（单选）一个球面网格的离散高斯曲率（角度亏欠）之和应该是多少？\n<p>A. 0　B. 2π　C. 4π　D. 取决于剖分密度 <strong>答案<\/strong>：C。<strong>解析<\/strong>：球面 χ = 2（V−E+F = 2），由离散高斯-博内定理，总亏欠 = 2πχ = 4π，与剖分密度无关。<\/p>\n<\/ol>\n<ol><li>\n（单选）下列哪种表示<strong>能精确<\/strong>表示一个圆？\n<p>A. 三次样条　B. B-样条　C. 有理样条（NURBS）　D. Bézier 曲线 <strong>答案<\/strong>：C。<strong>解析<\/strong>：多项式的非有理样条只能逼近圆锥曲线；有理样条分子分母同为多项式，能精确表达圆、椭圆，并在投影变换下保持形式。<\/p>\n<\/ol>\n<ol><li>\n（填空）一个顶点有 3 个邻居，每条边的余切权重和为 1.2，混合面积 A_i = 0.4，则离散 Laplace 前面的系数 1/(2A_i) 等于 ＿＿，整个 Δx_i 等于 ＿＿ × Σ_j(x_j − x_i)。\n<p><strong>答案<\/strong>：1.25；1.5。<strong>解析<\/strong>：1/(2×0.4) = 1.25；再乘 1.2 得 1.5。<\/p>\n<\/ol>\n<ol><li>\n（简答）为什么三次样条虽然 C² 连续，却&quot;缺乏局部控制能力&quot;？\n<p><strong>答案要点<\/strong>：因为求系数要联立一个覆盖全部控制点的线性系统，改一个控制点会改变整个方程组的右端项，因此所有段的系数都要重解（相当于整条曲线重算）。对比埃尔米特样条，每段只由自己两个端点的位置与切向决定，才能局部修改。<\/p>\n<\/ol>\n<ol><li>\n（简答）说明 Wolfe 准则中的两个条件各自防的是什么问题。\n<p><strong>答案要点<\/strong>：Armijo 条件（函数值下降够多）防&quot;步子太小、几乎不动&quot;的伪收敛；曲率条件（新点斜率明显变缓）防&quot;步子太大、越过谷底又爬上来&quot;。两个条件一起，才能保证线搜索既真的下降又不会白走。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n三种表示：网格存拓扑、隐式存函数、参数存 (u, v)；选择看&quot;要不要任意拓扑&quot;&quot;要不要内外判定&quot;&quot;要不要精确造型&quot;。\n<\/li><li>\n样条谱系一句话：三次样条 C² 但全局；埃尔米特局部但要切向；Bézier 凸包但全局；B-样条局部但不插端点；NURBS 能精确画圆且投影不变。\n<\/li><li>\n离散算子两个招牌：Δx_i 用余切权重（钝角会变负）、K_i 用角度亏欠（总和只能是 2πχ）。\n<\/ul>", "ch02": "<h1>第 2 章：点云曲面重建和光顺<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：8 小时 | <strong>前置<\/strong>：第 1 章的 Voronoi/Delaunay、Hausdorff 距离、最小二乘；向量叉积\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说清点云配准为什么必须&quot;找对应点&quot;和&quot;解变换&quot;交替做，并解释 ICP 为什么只会收敛到局部最优。\n<\/li><li>\n区分显式重建（Crust/Cocone 一类）与隐式重建（SDF/RBF/Poisson）的适用场景：什么数据该用哪一类。\n<\/li><li>\n解释 Poisson 重建在做什么（求一个函数，使它的梯度等于采样法向场），以及为什么它比单纯拟合距离更稳。\n<\/li><li>\n说出曲面光顺里&quot;顶点位置光顺&quot;和&quot;法向光顺&quot;的区别，以及双边滤波为什么能保特征。\n<\/li><li>\n给出一份带噪声、带缺失的扫描点云的处理方案并说明理由。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>重建的本质是<strong>把&quot;曲面在哪&quot;这个问题的答案从&quot;点&quot;变成&quot;函数&quot;<\/strong>：显式方法直接连三角形，隐式方法先求一个覆盖全空间的场再挖等值面；而无论哪种，都得先让点云与目标对齐、并把噪声压下去。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：点云配准——先把两片点云摆到一起<\/h3>\n<p>扫描一件文物，通常要转着扫好几圈，每次得到一个局部点云。要把它们拼成完整模型，第一步是<strong>配准<\/strong>：求一个变换，把源点云摆到目标点云的坐标系里。<\/p>\n<p><strong>刚性配准<\/strong>（难度：基础）。只允许旋转加平移，不允许拉伸。数学上就是求 R（3×3 旋转）和 t（平移向量），使<\/p>\n<pre><code>min_{R,t}  Σ_i | R x_i + t − y_i |²<\/code><\/pre>\n<p>其中 x_i 是源点，y_i 是它在目标点云里的对应点。这个式子有闭式解：先把两片点云的质心移到原点，再求使&quot;交叉协方差矩阵&quot;最优的旋转（用 SVD 或单位四元数都行），最后把质心平移回去。<strong>关键难点不是解这个方程，而是&quot;y_i 是谁&quot;<\/strong>——点云没有顶点编号，对应关系本身未知。<\/p>\n<p><strong>ICP（迭代最近点）<\/strong>（难度：进阶）。解法就是交替两件事：<\/p>\n<ol><li>\n用当前变换把源点云变换过去，为每个点找目标点云里<strong>最近<\/strong>的点当对应点；\n<\/li><li>\n固定这批对应点，解上面那个闭式最小二乘，得到新变换。\n<\/ol>\n<p>再重复，直到误差变化小于阈值。书里明确指出：<strong>ICP 只能保证在欧氏度量下单调收敛到局部最小<\/strong>，不保证全局最优。原因很直白：第一步&quot;找最近点&quot;在错误的变换下会配错，配错的对应点又把变换拉向错误方向，于是卡在局部坑里。工程上的补救是先用特征（FPFH 之类）做粗配准给出初值，再上 ICP 精修；或者用随机采样一致性（RANSAC）反复抽三对点、算变换、用一致程度打分，选最好的初值。<\/p>\n<p>点云稀疏时还有个改进（Chen 等）：不用&quot;点到点&quot;距离，而用&quot;源点沿法向投到目标曲面的交点&quot;作为对应，度量改成点到切平面的距离，收敛更快。<\/p>\n<p><strong>非刚性配准<\/strong>（难度：高难）。人体、软组织、表情扫描这类数据不能只用刚体变换。三种典型路线：<\/p>\n<ul><li>\n<strong>薄板样条（TPS）<\/strong>：把形变写成一个&quot;弯曲能量最小&quot;的插值函数。薄板能量 ʃʃ[(∂²f/∂x²)² + 2(∂²f/∂x∂y)² + (∂²f/∂y²)²] 衡量函数弯得有多厉害，能量最小意味着&quot;用最不弯的方式把对应点拉过去&quot;。它适合做全局平滑的大形变。\n<\/li><li>\n<strong>带锚点的非刚性配准<\/strong>：少量人工指定的对应点当锚点，约束整体不被拉歪，再用形变场拟合其余点。书里给了三阶段权重安排（先只按锚点预变形、再加配准误差项、最后降锚点权重微调），本质是&quot;先粗对齐、再让数据说话&quot;。\n<\/li><li>\n<strong>拟刚体变形<\/strong>：把模型切成若干块，每块只允许近似刚体运动，块与块之间的连接处允许少量拉伸。这样既能贴合大幅动作，又不会把局部形状揉烂——这就是后面第 6 章 ARAP 思想的前身。\n<\/ul>\n<h3>概念 2：显式重建——直接连三角形<\/h3>\n<p>先复习两个基本对象（第 1 章提过，这里要用）：<\/p>\n<ul><li>\n<strong>Voronoi 图<\/strong>：给每个采样点分一块地盘，地盘内的任意位置离这个点最近。\n<\/li><li>\n<strong>Delaunay 三角剖分<\/strong>：Voronoi 的对偶图——地盘相邻的采样点之间连边，形成三角剖分。\n<\/ul>\n<p>Delaunay 有几条必须记住的性质：二维下剖分唯一（除非四点共圆）；三角形外接圆内不含其它采样点；结果满足<strong>最小角最大化<\/strong>（三角形尽量接近正三角形）。最后一条是它在网格生成里不可替代的原因。<\/p>\n<p><strong>Crust 算法<\/strong>（难度：高难）。思路是&quot;用 Voronoi 顶点当帮手&quot;。二维情形：把采样点集 P 的 Voronoi 顶点也加进去，得到 P ∪ V 的 Delaunay 剖分；只保留两端点都来自 P 的边，这些边组成 Crust。直观解释：Voronoi 顶点位于&quot;两个采样点地盘的交界&quot;，也就是曲面中轴附近；把它们加入后，中轴附近的边会被&quot;抢走&quot;，剩下的边就贴着曲面。<\/p>\n<p>三维要难一些：对每个采样点 p，它所在 Voronoi 单元里离它最远的两个顶点（分居曲面两侧）叫<strong>极点<\/strong> p⁺、p⁻。算法步骤是：算 Voronoi 图；对不在凸包上的 p 取最远 Voronoi 顶点作为 p⁺ 方向；对在凸包上的 p 用相邻三角形外法向平均作为 p⁺；再取与 p⁺ 点积为负且最远的作为 p⁻；最后把极点加入采样集重算 Delaunay，只保留三个顶点都属于原始点集的三角形。<\/p>\n<p>再加一步<strong>法向滤波<\/strong>：极点向量 (p⁺ − p) 近似垂直于曲面，若某个三角形的法向与对应极点向量差太多，就丢掉。递归删掉&quot;锐边&quot;相邻的三角形，剩下的就是重建曲面。<\/p>\n<p><strong>Power Crust<\/strong>（难度：高难）：用带权 Voronoi（Power 图）处理采样密度不均匀的情况，每个点带一个半径，等于它到最近邻距离的一部分。<strong>Cocone<\/strong>（难度：高难）：用&quot;锥形条件&quot;筛三角形——三角形的对偶 Voronoi 边必须落在一个以极点方向为轴的窄锥内，这样能保证输出是流形、且法向收敛。<\/p>\n<p>这类方法（统称 Delaunay 基重建）有理论保证：采样足够密、噪声足够小时，重建结果与真实曲面同胚。代价是三维 Delaunay 三角化的复杂度高、实现难，而且<strong>怕噪声、怕缺失<\/strong>——一点噪声就让 Delaunay 结构改变，一个扫描盲区就让输出不封闭（不水密）。所以它们适合&quot;高质量、高密度、低噪声&quot;的点云。<\/p>\n<h3>概念 3：隐式重建——先求场，再挖面<\/h3>\n<p>隐式重建不直接连面，而是先构造一个定义在全空间的函数 f，让 f = 0 正好是曲面，然后用 Marching Cubes 之类的方法把零等值面挖成三角形。<\/p>\n<p><strong>符号距离场（SDF）+ 移动最小二乘<\/strong>（难度：进阶）。最直接的想法：f(x) = 到最近采样点的距离，符号由法向定。但这样 f 在每个采样点处是尖的（不可导），且对法向噪声极敏感。改进是<strong>移动最小二乘法（MLS）<\/strong>：在查询点 x 附近取一圈邻居，局部拟合一个平面或二次曲面，用拟合值当 f(x)。书里写作<\/p>\n<pre><code>f̂_x = argmin_f Σ_i θ(|x − p_i|) (f(p_i) − g_i)²<\/code><\/pre>\n<p>θ 是随距离衰减的权重。MLS 把&quot;符号敏感&quot;的问题缓和了（局部平均），是目前点云处理的基础工具（PCL 里的标配）。<\/p>\n<p><strong>径向基函数（RBF）<\/strong>（难度：高难）。把 f 写成一组&quot;钟形&quot;函数的叠加：<\/p>\n<pre><code>f(x) = G(x) + Σ_i λ_i φ(|x − p_i|)<\/code><\/pre>\n<p>G 是低次多项式（保证精度），φ 是径向对称的基（常用 φ(r) = r³ 或 r² log r）。未知系数 λ_i 由插值条件定：曲面采样点处 f = 0，再在法向方向上取偏移点让 f 等于偏移量。φ 是全局支撑的，所以解的是一个<strong>稠密<\/strong>线性系统——点数上万就难算，通常要 Fast Multipole 加速。<\/p>\n<p><strong>Poisson 重建<\/strong>（难度：高难）。这是隐式重建里工程上最成功的一个。核心观察：如果 f 是&quot;内部为 1、外部为 0&quot;的指示函数，那么它的梯度 ∇f 在曲面处是一个指向内法向的&quot;脉冲场&quot;——也就是采样法向场。所以反过来：<strong>已知法向场 V，求 f 使 ∇f ≈ V<\/strong>。<\/p>\n<p>∇f = V 是一个超定问题（三个分量方程对一个未知函数），最小二乘解正好是 Poisson 方程：<\/p>\n<pre><code>Δf = ∇·V<\/code><\/pre>\n<p>左边是 Laplace 算子，右边是法向场的散度。做法是：把法向场 V 用八叉树的节点基函数（每个节点一个平滑的&quot;盒式滤波&quot;函数）表示，得到稀疏的散度向量；解一个稀疏线性系统（可以用多重网格，因为八叉树的层次天然对应多尺度）；最后对 f 取某个等值（通常用采样点的平均值）做 Marching Cubes。<\/p>\n<p>它比 SDF 稳的原因很实在：<strong>它拟合的是梯度，不是数值<\/strong>。梯度对常数偏移不敏感，所以不需要知道&quot;离曲面多远&quot;这种容易估错的量；它把所有采样点当成一个整体求一个全局一致解，噪声被平均掉。它也有代价：过度平滑细节、把薄结构糊掉，且对法向估计错误非常敏感（法向错了梯度就错了）。后来的&quot;筛选 Poisson&quot;（Screened Poisson）加了一个&quot;解要靠近采样点&quot;的项，才把细节找回来。<\/p>\n<p><strong>多层单元剖分（MPU）<\/strong>（难度：高难）。把空间切成八叉树小格，每格用三类局部函数之一拟合：一般光滑部分用二元二次多项式、边缘用两片二次曲面拼接、拐角用三片。适合超大点集和带尖锐特征的模型，缺点是对噪声不友好。<\/p>\n<h3>概念 4：曲面光顺——把噪声压下去但别把特征磨平<\/h3>\n<p>扫描数据必然带高频抖动。光顺（smoothing）的目标是：把抖动去掉，但边缘、尖角、棱线要留下。<\/p>\n<p><strong>顶点位置光顺<\/strong>（难度：基础）。最简单的做法直接用第 1 章的离散 Laplace：<\/p>\n<pre><code>x_i ← x_i + ε Δx_i,   ε 取很小（例如 0.001—0.01）<\/code><\/pre>\n<p>这叫<strong>显式 Laplacian 光顺<\/strong>，等价于热传导：噪声（高频）衰减快，大形状（低频）衰减慢。它的两个问题：一是网格整体向内收缩（Laplace 方向指向内部，见第 1 章的例子）；二是步长稍大就爆炸。修法是<strong>Taubin 光顺<\/strong>：交替做一次正向（λ 倍）和一次反向（μ 倍，μ 为负且绝对值更大），让收缩和膨胀抵消，只留高频衰减。<\/p>\n<p><strong>法向光顺<\/strong>（难度：进阶）。不动顶点位置，只修正每个面/顶点的法向，再用新法向重建位置。好处是保体积、保特征更自然。做法核心是<strong>双边滤波<\/strong>：对某个面片 f，取其邻域 N(f) 内的面片 g，加权平均它们的法向：<\/p>\n<pre><code>n̂_f = (1/W) Σ_{g∈N(f)} w_s(|c_f − c_g|) · w_r(|n_f − n_g|) · n_g<\/code><\/pre>\n<p>w_s 是空间核（离得近权重大），w_r 是值域核（法向差别小的权重大）。两项一乘，<strong>跨过棱线时法向差别大，值域权重趋于 0，于是另一侧的三角形几乎不参与平均<\/strong>——这就是&quot;保特征&quot;的机制。图像上的双边滤波同理：颜色差别大的像素不互相平滑，所以边缘留住。<\/p>\n<p><strong>数据驱动的法向滤波<\/strong>（难度：高难）。手工核函数的参数（σ_s、σ_r）不好定，于是把&quot;某个面片及其若干次双边滤波结果&quot;拼成一个描述子（FEND，面法向滤波描述子），送进神经网络，让网络输出滤波后的法向。本质是把&quot;该平滑多少&quot;这个判断从人手交给数据。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[原始点云] --&gt; B[配准&lt;br/&gt;刚性 ICP / 非刚性 TPS]\n    B --&gt; C{数据质量}\n    C --&gt;|高密度 低噪声| D[显式重建&lt;br/&gt;Crust / Power Crust / Cocone]\n    C --&gt;|有噪声 有缺失| E[隐式重建&lt;br/&gt;SDF-MLS / RBF / Poisson]\n    D --&gt; F[网格曲面]\n    E --&gt; F\n    F --&gt; G[光顺&lt;br/&gt;顶点 Laplacian / 法向双边 / FEND]\n    G --&gt; H[可用于后续章节的网格]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：图里的分叉点是&quot;数据质量&quot;，这是全章最重要的决策。看这张图要记住：显式方法给理论保证但要干净数据，隐式方法能容噪声但会过平滑；光顺永远放在最后一步，因为它会改变几何，先光顺再配准会破坏对应关系。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：显式重建像&quot;沿着人群的外轮廓把相邻的人用绳子连起来&quot;——必须先看清谁挨着谁，人群一乱（噪声）绳子就乱连。隐式重建像&quot;用雾气把整个人群包起来，再按等浓度面切出形状&quot;——即使有人站位错乱，雾的形状整体还是对的；代价是细节被雾糊掉。<strong>失效边界<\/strong>：雾不能太浓（过度平滑会吃掉薄壁和手指这类细结构），也不能太稀（噪声就重新显形）。<\/p>\n<p><strong>实例（可手算的 ICP）<\/strong>：设目标点云是三点 (0,0)、(2,0)、(0,2)；源点云是把它们绕原点旋转 30° 得到的 (0,0)、(1.732,1)、( −1,1.732)。已知&quot;编号对应&quot;时，闭式解给出的旋转正好是 30°，残差为 0。但如果初值是旋转 0°，第一次&quot;找最近点&quot;会把源点 (1.732, 1) 配到目标 (2, 0)（距离 ≈ 1.03，比配到 (0,2) 的 1.9 小），解出的旋转约 24°；下一轮对应点不变，旋转被拉到 30°。这说明两件事：对应关系在小旋转下会被逐步纠正（单调收敛），而初值偏差大时就会配错并卡住（局部最优）。<\/p>\n<p><strong>实例（双边滤波保特征）<\/strong>：设某面片法向为 (0,0,1)，邻居里有一半法向 (0,0,1)、一半法向 (1,0,0)（代表一个 90° 棱）。若 σ_r 取 0.1，则跨棱邻居的 w_r = exp(−|差|²/(2×0.1²)) = exp(−50) ≈ 0，完全不参与；若 σ_r 取 1.0，则 w_r = exp(−0.5) ≈ 0.61，跨棱邻居参与一半权重，棱就被磨圆了。<strong>这就是 σ_r 必须按模型的棱角尺度来定的原因。<\/strong><\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;ICP 一定能找到全局最优&quot;<\/strong>——实际上它只是交替下降，每步都下降但不保证到全局最小。这就是所有工业流程都要先做粗配准（特征匹配/RANSAC）给初值的原因。\n<\/li><li>\n<strong>别以为&quot;点云越密，重建一定越好&quot;<\/strong>——实际上显式方法的理论保证要求&quot;采样密度相对于特征尺寸足够高&quot;，即<strong>局部特征尺度<\/strong>采样定理。一个薄壁结构上点再密，若跨壁两侧的点混在一起，Delaunay 会把两壁连成一片，结果是实心块而不是薄壳。\n<\/li><li>\n<strong>别以为&quot;Poisson 重建比 Crust 先进，所以一律用 Poisson&quot;<\/strong>——实际上 Poisson 拟合梯度，天然会平滑掉小于八叉树最细层的细节，且对法向噪声敏感；数据干净、要求拓扑精确时，Cocone 一类仍更可靠。\n<\/li><li>\n<strong>别以为&quot;隐式重建的输出天然是水密的&quot;<\/strong>——实际上只有采样覆盖完整时才是。扫描盲区会让场在缺口处没有约束，Marching Cubes 会补出一层&quot;假面&quot;，或者干脆留洞。\n<\/li><li>\n<strong>别以为&quot;光顺只是去噪，不改形状&quot;<\/strong>——实际上 Laplacian 光顺一定收缩（因为 Δx 指向内部），大曲率区域收缩更明显。做尺寸敏感的应用（如 3D 打印配合）时必须用体积保持或 Taubin 类方法。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n（单选）ICP 的每一次迭代包含哪两步？\n<p>A. 求特征 + 分类　B. 找最近点对应 + 解闭式最优变换　C. 三角化 + 抽等值面　D. 估法向 + 双边滤波 <strong>答案<\/strong>：B。<strong>解析<\/strong>：ICP 的核心就是&quot;对应—求解&quot;交替；特征与分类属于学习型方法，三角化属于重建，双边滤波属于光顺。<\/p>\n<\/ol>\n<ol><li>\n（单选）Poisson 重建求解的方程是？\n<p>A. ∇f = 0　B. Δf = ∇·V　C. f = 距离场　D. ∇×V = 0 <strong>答案<\/strong>：B。<strong>解析<\/strong>：由&quot;求 f 使 ∇f ≈ V&quot;的最小二乘正规方程得到 Δf = ∇·V，左边 Laplace、右边法向场散度。<\/p>\n<\/ol>\n<ol><li>\n（填空）Delaunay 三角剖分满足&quot;最小角最大化&quot;，含义是＿＿＿＿；它带来的实际好处是＿＿＿＿。\n<p><strong>答案<\/strong>：在所有可能的三角剖分中，让最小内角尽可能大；三角形更接近正三角形，网格质量好，离散算子（如余切 Laplace）不会因钝角出现负权重。<\/p>\n<\/ol>\n<ol><li>\n（简答）为什么显式重建方法&quot;怕噪声、怕缺失&quot;？\n<p><strong>答案要点<\/strong>：显式方法依赖 Delaunay 结构判断&quot;哪些三角形该留&quot;，而 Delaunay 由采样点的精确位置决定；噪声会改变点位置从而改变剖分结构，导致筛掉的三角形错位；缺失会让局部没有采样，重建结果不封闭、不水密。隐式方法把约束摊到全空间的场上，单点噪声被平均，所以更稳。<\/p>\n<\/ol>\n<ol><li>\n（简答）双边滤波里&quot;空间核&quot;和&quot;值域核&quot;分别起什么作用？去掉其中一个会怎样？\n<p><strong>答案要点<\/strong>：空间核限制平滑的邻域范围（远处的面片不参与），保证局部性；值域核按法向差异降权，使跨棱的面片不互相平均，从而保特征。去掉值域核就退化成普通高斯/邻域平均，棱被磨圆；去掉空间核则全模型互相影响，等于全局平均，形状会被拉平。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n配准永远在&quot;对应&quot;与&quot;变换&quot;之间交替；ICP 是局部方法，初值靠粗配准。\n<\/li><li>\n显式重建（Crust/Power Crust/Cocone）要干净数据，给理论保证；隐式重建（MLS/RBF/Poisson）能容噪声，代价是过平滑。\n<\/li><li>\nPoisson 重建的关键词是&quot;梯度拟合&quot;：解 Δf = ∇·V，八叉树基函数让系统稀疏可解。\n<\/li><li>\n光顺的两条路线：动位置（Laplacian/Taubin，会收缩）与动法向（双边/FEND，更保特征）。\n<\/ul>", "ch03": "<h1>第 3 章：网格曲面的参数化和多分辨率表示<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：8 小时 | <strong>前置<\/strong>：第 1 章的离散 Laplace 与余切权重、第 2 章的网格质量概念；矩阵最小二乘\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说清参数化要满足什么条件，以及&quot;无翻转&quot;为什么必须专门处理。\n<\/li><li>\n写出调和参数化的最小二乘形式，并解释为什么固定边界后它一定有唯一解。\n<\/li><li>\n说明保角与保面积为什么不能同时做到，ASAP 与 MIPS 各自在优化什么。\n<\/li><li>\n用 QEM 判断一条边该不该坍缩，并说明渐进网格如何把简化过程存成可逆记录。\n<\/li><li>\n说出三角带和 Edgebreaker 各压缩了哪部分冗余，压缩比大致来自哪里。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>参数化是&quot;把曲面摊平&quot;——它把三维形状变成一张二维图，代价是必然产生扭曲；整个第 3 章的技巧，都在<strong>选择让哪种扭曲小一点、并保证摊平后不翻面<\/strong>。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：为什么要把曲面摊平<\/h3>\n<p>两件真实需求：贴纹理需要每个顶点有 (u, v) 坐标（GPU 按二维坐标采样图片）；传输和绘制需要更少的数据量（简化与压缩）。这三件事（参数化、多分辨率、压缩）看起来无关，其实都在回答同一个问题：<strong>这个网格里哪些信息是必要的、哪些是冗余的<\/strong>。<\/p>\n<h3>概念 2：参数化——摊平，但不能翻面<\/h3>\n<p><strong>参数化<\/strong>（难度：进阶）就是给每个顶点算一个平面坐标 (u_i, v_i)，要求这个映射是<strong>一一对应<\/strong>的（同胚）：不重叠、不撕裂、不翻面。<\/p>\n<p><strong>调和参数化<\/strong>（难度：进阶）。思路是让内部顶点在平面上的位置等于其邻居的平均——这正是第 1 章的离散 Laplace 取零：<\/p>\n<pre><code>Δu_i = 0,  Δv_i = 0  （对所有内部顶点）<\/code><\/pre>\n<p>用余切权重展开就是<\/p>\n<pre><code>Σ_j w_ij (u_j − u_i) = 0,   w_ij = cot α_ij + cot β_ij<\/code><\/pre>\n<p>边界顶点的坐标是已知量（比如把边界固定在一个圆或正方形上），于是这变成一个线性方程组：内部顶点的 u（和 v）是未知量，边界是已知项。写成矩阵形式 A x = b，A 是对称正定（在合适权重下）的稀疏矩阵，所以解存在且唯一。<\/p>\n<p><strong>Tutte 定理<\/strong>（难度：进阶）是这一步的理论靠山：如果网格同胚于圆盘、边界映射到<strong>凸<\/strong>多边形上、且所有权重为<strong>正<\/strong>，那么这个调和映射一定是双射（不重叠、不翻转）。这条定理解释了为什么参数化总从&quot;Tutte 嵌入&quot;起步——它是唯一有保证的起点。<\/p>\n<p>但它有代价：余切权重可以为负（钝角三角形），一旦出现负权重，Tutte 的保证就失效；而且固定成圆形边界会带来巨大的<strong>面积扭曲<\/strong>（圆盘被压成圆，中间被挤、边缘被拉）。<\/p>\n<p><strong>保角与保面积<\/strong>（难度：高难）。理想的摊平应该&quot;既不改变角度也不改变面积&quot;，但高斯告诉我们：曲面摊到平面不可能等距（除非它本来就是可展面，比如柱面、锥面）。所以只能二选一或折中：<\/p>\n<ul><li>\n<strong>保角（共形）<\/strong>：每个三角形在平面上保持原角度，形状像但大小变。数学条件是映射的 Jacobian 矩阵是两个奇异值相等的相似变换。\n<\/li><li>\n<strong>保面积<\/strong>：每个三角形面积不变，形状被剪歪。\n<\/ul>\n<p>实际纹理贴图更在意保角（角度失真看起来像拉伸，最刺眼），所以主流是 LSCM、ARAP、ASAP 这些&quot;尽量保角&quot;的能量。<\/p>\n<p><strong>ASAP<\/strong>（难度：高难）。它的能量写成<\/p>\n<pre><code>E = Σ_t A_t | J_t − Z_t |²_F     （F 为 Frobenius 范数）<\/code><\/pre>\n<p>其中 J_t 是三角形 t 的 Jacobian（从三维局部坐标到二维的参数化线性变换），Z_t 是&quot;与 J_t 最接近的相似变换&quot;：把 J_t 做奇异值分解 J = U Σ Vᵀ，取 σ̄ = (σ1 + σ2)/2，则 Z = U σ̄ I Vᵀ。于是它惩罚的是&quot;每个三角形偏离相似变换的量&quot;，也就是纯粹的<strong>形状扭曲<\/strong>，不惩罚大小。求解是交替的：固定 Z 解最小二乘求顶点坐标，再固定坐标对每个三角形重算 Z——这就是后面第 6 章 ARAP 的局部-全局迭代，套路完全一样。<\/p>\n<p><strong>MIPS 能量<\/strong>（难度：高难）用的是&quot;两个奇异值的比&quot; σ1/σ2，比值等于 1 才最优，无穷大表示退化（三角形被压成线）。它的优点是<strong>自带防翻转<\/strong>：翻转时带符号面积为负，能量趋于无穷，所以优化过程不会跨过翻转状态。<\/p>\n<p><strong>局部防翻转参数化<\/strong>（难度：高难）。真正工业级的需求是&quot;给我一些固定点（比如特征点必须落在纹理指定位置），其余尽量平顺，且不许翻转&quot;。做法分两类：<\/p>\n<ol><li>\n<strong>显式约束优化<\/strong>：把&quot;三角形有向面积 &gt; 0&quot;直接当约束（内点法/障碍函数法），能支持任意形变能量，但问题非凸，容易停在局部解。\n<\/li><li>\n<strong>能量自带障碍<\/strong>：用 MIPS 或伸缩能量，翻转时能量爆炸，优化自然避开。实现简单，但收敛慢、需要好的初值（通常先用 Tutte 起步）。\n<\/ol>\n<p><strong>多片参数化<\/strong>（难度：进阶）。复杂拓扑（多个洞）摊不成一整片平面，必须先切开（cut）成若干同胚于圆盘的片，各自摊平，再在接缝处对齐。切缝的选择直接影响扭曲：要沿曲率大的地方切（比如把圆柱沿母线切），切口会藏在视觉不敏感处。<\/p>\n<p><strong>渐进参数化<\/strong>（难度：高难）。从 Tutte 起步的扭曲往往很大，而扭曲能量高度非凸。渐进参数化的做法很巧：<strong>不用原始网格作为参考<\/strong>，而是构造一串中间&quot;参考三角形&quot;，让当前参数化结果与这串参考之间的仿射变换扭曲有界、同时逐步靠近原网格。等于把一个大跳变成了很多小步，从而避免一开始就在能量很高的地方打转。<\/p>\n<h3>概念 3：简化与多分辨率——少画几个三角形也不变样<\/h3>\n<p><strong>QEM（二次误差度量）<\/strong>（难度：进阶）。简化最常用的操作是<strong>边坍缩<\/strong>：把一条边的两个端点合并成一个，删掉退化的三角形。问题是怎么选边。QEM 给每个顶点维护一个二次型：<\/p>\n<pre><code>Q_i(x) = xᵀ A_i x + 2 b_iᵀ x + c_i = Σ_{planes p ∈ P(i)} (n_pᵀ x + d_p)²<\/code><\/pre>\n<p>含义是&quot;点 x 到与该顶点相关的所有平面的距离平方和&quot;。把边 (i, j) 坍缩到一个新位置 x̄ 时，误差近似为 (Q_i + Q_j)(x̄)，而 x̄ 的最优位置由 ∇(Q_i + Q_j) = 0 解出（一个 3×3 线性系统，可预先把 4×4 的齐次矩阵 Q 相加）。于是选边的规则就是：<strong>算每条边
