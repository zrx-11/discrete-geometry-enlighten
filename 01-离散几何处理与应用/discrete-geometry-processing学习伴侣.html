渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：核心动作是&quot;用极点把中轴附近的边挤走&quot;，剩下的边就贴着表面；法向滤波是最后的清理。<\/p>\n<h2>详解<\/h2>\n<p><strong>Delaunay 的四条性质<\/strong>（难度：进阶）：<\/p>\n<ol><li>\n二维下唯一（无四点共圆时）；\n<\/li><li>\n三角剖分的外边界是点集的凸包；\n<\/li><li>\n每个三角形的外接圆内不含采样点（空圆性质）；\n<\/li><li>\n最小角最大化（最接近正三角形）。\n<\/ol>\n<p>性质 4 是它在网格生成里不可替代的原因；性质 3 是 Crust 类算法能&quot;筛边&quot;的依据。<\/p>\n<p><strong>Crust 的直觉<\/strong>（难度：高难）。把 Voronoi 顶点加入采样集后重算 Delaunay：Voronoi 顶点位于中轴（到两个采样点等距的地方），它们&quot;抢走&quot;了那些穿过物体内部的边，于是剩下的边集中在表面附近。二维时这个论证是严格的（Amenta 等 1998）。<\/p>\n<p><strong>三维要加极点<\/strong>（难度：高难）。三维 Voronoi 单元形状复杂，靠全部 Voronoi 顶点不可靠。所以只取每个点的两个<strong>极点<\/strong>：Voronoi 单元里离 p 最远的两个顶点，它们通常分居表面两侧（一个在外、一个在内）。极点向量 (p⁺ − p) 近似垂直于表面——这就是能用它做<strong>法向滤波<\/strong>的原因：与极点方向差太多的三角形，说明它斜穿表面，丢掉。<\/p>\n<p><strong>Power Crust / Cocone<\/strong>（难度：高难）：<\/p>\n<ul><li>\n<strong>Power Crust<\/strong> 用带权 Voronoi（Power 图）处理<strong>采样密度不均<\/strong>：给每个点一个权重（半径），边界处的稀疏采样不会把曲面&quot;拉歪&quot;。\n<\/li><li>\n<strong>Cocone<\/strong> 用<strong>锥形条件<\/strong>：三角形的对偶 Voronoi 边必须落在以极点方向为轴、半角约 (π/2 − 采样角) 的锥内。这个条件直接保证&quot;输出是流形、法向收敛&quot;，是三代里理论最漂亮的。\n<\/ul>\n<p><strong>代价<\/strong>（难度：进阶）。三维 Delaunay 三角化的复杂度高（最坏 O(n²)，实际 O(n log n)—O(n^{4/3})），实现复杂（需要精确谓词处理退化情形）。而且对噪声敏感：噪声改变点位置 → 改变 Delaunay 结构 → 筛出的三角形错位。所以工程上&quot;高噪声数据&quot;通常直接跳过这条路线，用 Poisson（见另一篇概念页）。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;点越密越好&quot;<\/strong>——实际上理论保证要求&quot;局部特征尺度上的采样密度&quot;，薄壁两侧的点如果混在一起，Delaunay 会把两壁连成一片。\n<\/li><li>\n<strong>别以为&quot;Crust 不需要法向&quot;<\/strong>——实际上三维 Crust 一定要法向滤波，否则输出不是流形、会出现&quot;纸片&quot;。\n<\/li><li>\n<strong>别以为&quot;理论保证就意味着工程可用&quot;<\/strong>——实际上保证的前提（无噪声、无缺失、采样密度足够）在真实扫描里几乎不成立，所以显式方法主要用于&quot;高质量点云&quot;或&quot;理论分析&quot;。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>1.4.2<\/td><td>计算几何基础<\/td><td>Voronoi/Delaunay 定义与性质<\/td><\/tr><tr><td>2.2.1—2.2.4<\/td><td>显式重建<\/td><td>Crust/Power Crust/Cocone<\/td><\/tr><tr><td>2.3<\/td><td>与隐式方法对比<\/td><td>干净数据用显式，脏数据用隐式<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：Voronoi、Delaunay、中轴\n<\/li><li>\n后续：Poisson 重建（隐式路线）、重网格化（Delaunay 撒点）\n<\/li><li>\n对照：RBF/Poisson（隐式，不怕噪声）\n<\/ul>", "c06": "<h1>Poisson 曲面重建<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 2 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>把&quot;曲面在哪&quot;变成&quot;求一个指示函数 f，使它的梯度尽量等于采样法向场&quot;，解出来就是 Poisson 方程 Δf = ∇·V，再挖它的等值面。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是工程上最稳的隐式重建方法：对噪声容忍度高、全局一致、能处理不均匀采样，是扫描数据重建的常用默认选择。它同时是&quot;梯度域&quot;思想在重建上的第一次出现，与第 6 章的形变、第 7 章的模拟共用同一套数学。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[点云 + 法向] --&gt; B[构造向量场 V&lt;br/&gt;采样法向]\n    B --&gt; C[八叉树分块&lt;br/&gt;节点基函数]\n    C --&gt; D[算散度 ∇·V]\n    D --&gt; E[解 Δf = ∇·V&lt;br/&gt;稀疏系统 多重网格]\n    E --&gt; F[取等值面&lt;br/&gt;Marching Cubes]\n    F --&gt; G[水密网格]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：整条链路的关键是&quot;不直接拟合距离，而拟合梯度&quot;。梯度对常数偏移不敏感，所以不需要知道精确距离。<\/p>\n<h2>详解<\/h2>\n<p><strong>为什么拟合梯度<\/strong>（难度：高难）。如果 f 是&quot;内部 1、外部 0&quot;的指示函数，那么 ∇f 在曲面处是指向内法向的脉冲，在别处为 0。反过来，已知法向场 V，要解<\/p>\n<pre><code>min_f  ʃ |∇f − V|²<\/code><\/pre>\n<p>正规方程（变分）就是 Δf = ∇·V。这有两个好处：<\/p>\n<ol><li>\n<strong>不需要符号距离<\/strong>：SDF 要求&quot;知道离曲面多远&quot;，这个量在噪声数据里很难估；梯度没有这个问题。\n<\/li><li>\n<strong>全局一致<\/strong>：所有采样点共同决定一个 f，噪声被平均，不会局部乱跳。\n<\/ol>\n<p><strong>离散实现<\/strong>（难度：高难）。关键是选基函数。Octree 每层用&quot;盒式滤波的 m 次卷积&quot;（即 B-样条基的近似），得到一个局部支撑、平滑的节点函数。于是：<\/p>\n<ul><li>\n每个采样点只影响它所在叶子节点及邻域（稀疏）；\n<\/li><li>\n散度向量稀疏，系统稀疏；\n<\/li><li>\n层次结构天然支持<strong>多重网格<\/strong>（粗层解完给细层当初值），解几百万未知量也可行。\n<\/ul>\n<p><strong>筛选 Poisson<\/strong>（难度：高难）。原版 Poisson 有一个偏差：它不是插值，而是最小二乘拟合梯度，所以曲面会偏离采样点（整体&quot;胀&quot;或&quot;缩&quot;）。Screened Poisson 加一项&quot;f 在采样点处要等于 0.5（或其他等值）&quot;：<\/p>\n<pre><code>min_f  ʃ |∇f − V|² + λ Σ_i (f(p_i) − c)²<\/code><\/pre>\n<p>这一项把细节拉回来，λ 小则平滑、大则贴合。这是工程上最常用的版本。<\/p>\n<p><strong>数值例子<\/strong>（一维，可手算）。设采样法向场在一维上为：内部区间的梯度为 +1（从 0 到 L），两端之外为 0。则散度 ∇·V 是两个脉冲（在 0 处 −1、在 L 处 +1）。解 Δf = ∇·V 得 f 是一个&quot;梯形&quot;：0 到 L 线性上升，两端平坦。取 f = 0.5 的等值点，正好落在 0 和 L——即曲面的位置。这个一维例子把&quot;梯度积分回位置&quot;讲清楚了。<\/p>\n<p><strong>局限<\/strong>（难度：进阶）：<\/p>\n<ul><li>\n会平滑掉小于最细八叉树层的细节（薄壁、细杆容易被糊掉）；\n<\/li><li>\n对法向质量高度敏感（法向错了，梯度就错了）；\n<\/li><li>\n非封闭、有遮挡的扫描会补出&quot;假面&quot;（因为 f 在缺口处没有约束，解会自己延伸）。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;Poisson 是最先进的重建，所以都该用它&quot;<\/strong>——实际上它牺牲细节换稳定；要求拓扑精确、特征尖锐时，Cocone 或&quot;稀疏选择重建&quot;（第 8 章）更合适。\n<\/li><li>\n<strong>别以为&quot;解 Poisson 一定要全局稠密矩阵&quot;<\/strong>——实际上八叉树基函数让它稀疏，配合多重网格可以处理千万级点云。\n<\/li><li>\n<strong>别以为&quot;结果一定是水密的&quot;<\/strong>——实际上只有采样覆盖完整才水密；有洞时 Marching Cubes 会在无约束区域自己补面，这既是优点（得到封闭体）也是缺点（补错）。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>2.3.3<\/td><td>隐式重建<\/td><td>八叉树基函数 + 多重网格<\/td><\/tr><tr><td>2.4<\/td><td>与光顺的关系<\/td><td>重建后再光顺，顺序不能反<\/td><\/tr><tr><td>6.2<\/td><td>梯度域形变<\/td><td>同一数学：∇f = V 的最小二乘<\/td><\/tr><tr><td>7.1<\/td><td>Projective Dynamics<\/td><td>∇²u = Gᵀ∇g 的同类结构<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：散度、Laplace 算子、稀疏线性系统\n<\/li><li>\n后续：筛选 Poisson、Marching Cubes\n<\/li><li>\n对照：RBF（稠密、插值）、SDF+MLS（局部的）\n<\/ul>", "c07": "<h1>参数化：调和、共形与防翻转<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 3、4 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>给曲面上每个顶点一个平面坐标 (u, v)，要求这个映射是一一对应（不重叠、不撕裂、不翻转）；做法是解一个带约束的优化，从 Tutte 嵌入起步，再优化扭曲能量。<\/p>\n<h2>为什么重要<\/h2>\n<p>纹理贴图、曲面拟合、四边形化（第 4 章的全局参数化法）都以它为前提。它还是&quot;最小二乘 + 局部-全局迭代&quot;这套方法在二维的样板，第 6 章 ARAP 就是它的三维版本。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[网格 切开成圆盘片] --&gt; B[Tutte 嵌入&lt;br/&gt;边界→凸多边形 正权重]\n    B --&gt; C{扭曲太大?}\n    C --&gt;|是| D[优化扭曲能量&lt;br/&gt;ASAP / MIPS / ARAP]\n    D --&gt; E[防翻转&lt;br/&gt;障碍项 或 显式约束]\n    E --&gt; F{仍翻转?}\n    F --&gt;|是| G[加切缝 或 减小步长]\n    F --&gt;|否| H[输出 u v 坐标]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：Tutte 只保证&quot;不翻&quot;，不保证&quot;不扭&quot;；后面所有工作都是在&quot;减少扭曲但保持不翻&quot;之间走钢丝。<\/p>\n<h2>详解<\/h2>\n<p><strong>调和参数化<\/strong>（难度：进阶）。要求内部顶点满足 Δu = 0、Δv = 0（离散下就是&quot;坐标等于邻居加权平均&quot;）。写成方程组：<\/p>\n<pre><code>Σ_j w_ij (u_j − u_i) = 0,   w_ij = cot α_ij + cot β_ij<\/code><\/pre>\n<p>边界坐标固定，于是内部坐标是唯一解。<strong>Tutte 定理<\/strong>保证：边界凸 + 权重全正 → 映射是双射。注意余切权重可能为负（钝角），所以严格按 Tutte 用时得换成正权重（均匀权重或重心权重），代价是扭曲更大。<\/p>\n<p><strong>扭曲从哪来<\/strong>（难度：高难）。摊平必然扭曲，两类：<\/p>\n<ul><li>\n<strong>角度扭曲（共形）<\/strong>：三角形被&quot;剪歪&quot;但面积按比例缩放；\n<\/li><li>\n<strong>面积扭曲<\/strong>：角度保持但大小被改变。\n<\/ul>\n<p>数学上，映射的 Jacobian J 的奇异值 σ1、σ2 描述一切：σ1 = σ2 表示共形（相似变换），σ1 σ2 = 1 表示保面积，两者都满足就是等距（只有可展面能做到）。所以扭曲能量都是在惩罚&quot;σ1 与 σ2 的差异&quot;或&quot;σ1 σ2 偏离 1&quot;。<\/p>\n<p><strong>ASAP<\/strong>（难度：高难）。能量 E = Σ_t A_t |J_t − Z_t|²，其中 Z_t 是&quot;与 J_t 最接近的相似变换&quot;（把 J 做 SVD 后取 σ̄ = (σ1+σ2)/2 重构）。求解交替：<\/p>\n<ul><li>\n固定 Z，对顶点坐标解最小二乘（稀疏系统）；\n<\/li><li>\n固定坐标，对每个三角形重算 Z（SVD，逐三角形独立）。\n<\/ul>\n<p><strong>MIPS<\/strong>（难度：高难）。能量用 σ1/σ2（比值），比值趋于 ∞ 表示三角形退化。它的杀手级优点是：<strong>翻转时有向面积为负，能量趋于无穷<\/strong>，所以优化永远不会跨过翻转状态（自带防翻转）。代价是收敛慢、需要好的初值。<\/p>\n<p><strong>显式防翻转<\/strong>（难度：高难）。把&quot;每个三角形有向面积 &gt; 0&quot;当不等式约束，用内点法或障碍函数（如 log det）处理。好处是能配合任意能量；坏处是非凸、容易卡在局部解，且靠近边界时步长极小。<\/p>\n<p><strong>多片与切缝<\/strong>（难度：进阶）。复杂拓扑必须先切成圆盘。切缝选择的原则：沿曲率大的脊线切（切口藏在视觉不敏感处）、切缝总长度尽量短、避免穿过特征。<\/p>\n<p><strong>渐进参数化<\/strong>（难度：高难）。从 Tutte 起步时扭曲可能极大，而能量非凸。做法是构造一串&quot;中间参考三角形&quot;，使&quot;当前结果与参考之间&quot;的扭曲有界、参考逐步靠近原网格——把一个大跳跃拆成很多小步，避免一开始就陷在坏解里。<\/p>\n<p><strong>数值例子<\/strong>（可手算）。正方形网格，4 个角固定为 (0,0)、(1,0)、(1,1)、(0,1)，内部只有一个中心顶点，与四角相连，权重都取 1。中心顶点方程：<\/p>\n<pre><code>4 u_c − (0 + 1 + 1 + 0) = 0  →  u_c = 0.5\n4 v_c − (0 + 0 + 1 + 1) = 0  →  v_c = 0.5<\/code><\/pre>\n<p>中心落在正中。若把某个角的权重加大（模拟该处三角形更&quot;尖&quot;，余切更大），中心会被拉向那个角。这就是&quot;参数化结果依赖权重、权重依赖三角形状&quot;的最小例子。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;参数化就是投影&quot;<\/strong>——实际上投影在有回折的曲面上会重叠，不是双射；参数化必须解全局方程。\n<\/li><li>\n<strong>别以为&quot;Tutte 一定不翻转&quot;<\/strong>——实际上定理要求正权重 + 凸边界，余切权重在钝角处为负时会翻。\n<\/li><li>\n<strong>别以为&quot;保角和保面积能同时最优&quot;<\/strong>——实际上只有可展面能等距，一般曲面必须取舍。\n<\/li><li>\n<strong>别以为&quot;扭曲能量是凸的，所以一定能求全局最优&quot;<\/strong>——实际上含奇异值/比值的能量非凸，工程解法都依赖好的初值与渐进策略。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>3.1.1<\/td><td>单/多片参数化<\/td><td>Tutte 起步、切缝<\/td><\/tr><tr><td>3.1.2<\/td><td>局部防翻转<\/td><td>障碍函数、显式约束<\/td><\/tr><tr><td>3.1.3—3.1.4<\/td><td>局部到整体、渐进<\/td><td>分片缝合、渐进参考<\/td><\/tr><tr><td>4.2<\/td><td>四边形化<\/td><td>全局参数化 + 整数格点<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：离散 Laplace、SVD、Tutte 定理\n<\/li><li>\n后续：四边形化、纹理映射、ARAP\n<\/li><li>\n对照：调和（角度偏保）、LSCM（共形）、ARAP（局部刚体）\n<\/ul>", "c08": "<h1>QEM 简化与渐进网格<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 3 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>用&quot;删掉这条边后新顶点到原来若干平面的距离平方和&quot;评估每次边坍缩的损失，选损失最小的先坍缩；把整个坍缩序列倒过来存，就是渐进网格。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是&quot;误差可累加&quot;的典范：一次坍缩的误差能被新顶点继承，所以整个简化过程的误差可以量化控制。第 3 章的多分辨率、第 8 章的粗化预处理都以它为基座。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[原始网格] --&gt; B[为每个顶点建二次型 Q]\n    B --&gt; C[对每条边算 (Qi+Qj) 的最小值]\n    C --&gt; D[优先队列取最小]\n    D --&gt; E[坍缩 更新邻域 Q = Qi+Qj]\n    E --&gt; F{达到目标边数?}\n    F --&gt;|否| C\n    F --&gt;|是| G[粗网格 + 坍缩记录]\n    G --&gt; H[反序执行 = 渐进网格]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：右边的&quot;反序执行&quot;是关键——简化过程本身就是可逆的多分辨率结构，不必另外建层次。<\/p>\n<h2>详解<\/h2>\n<p><strong>二次型<\/strong>（难度：进阶）。每个顶点维护<\/p>\n<pre><code>Q_i(x) = Σ_{p ∈ planes(i)} (n_pᵀ x + d_p)² = xᵀ A_i x + 2 b_iᵀ x + c_i<\/code><\/pre>\n<p>用齐次坐标写成 4×4 矩阵 Q_i，则&quot;点 x 的误差&quot;= xᵀ Q_i x（x 取齐次形式 (x, y, z, 1)）。这条式子的意思是&quot;点到与该顶点相关的所有平面的距离平方和&quot;——平面包括相邻三角形的支撑平面。<\/p>\n<p><strong>边坍缩的最优位置<\/strong>（难度：进阶）。把边 (i, j) 合成一个顶点，误差约等于 (Q_i + Q_j)(x̄)。对 x̄ 求极小：解 3×3 线性系统<\/p>\n<pre><code>(A_i + A_j) x̄ = −(b_i + b_j)<\/code><\/pre>\n<p>若矩阵奇异（退化情形），退回到&quot;取 i、j 或中点&quot;这几条候选，选误差最小者。算完得到该边的&quot;坍缩代价&quot;，放进优先队列。<\/p>\n<p><strong>为什么平面先被简化<\/strong>（难度：进阶）。平面上所有顶点都在同一组平面内，误差恒为 0。于是平面区域的边代价为 0，最先被坍缩；直到平面被压到只剩边界，代价才开始上升。而 90° 棱边上的顶点同时属于两个差异很大的平面，误差不为 0，被留到最后。<strong>这就是&quot;平面先塌、特征后动&quot;的机制<\/strong>，不是靠手工规则。<\/p>\n<p><strong>渐进网格 PM<\/strong>（难度：进阶）。把坍缩序列倒过来：每条坍缩记录包含&quot;被删的两个顶点编号、新顶点位置、受影响的三角形&quot;。从粗网格出发，逐条执行分裂（vsplit），就能得到任意精度的模型。<\/p>\n<ul><li>\n存储：粗网格 + k 条记录，比存多个 LOD 省；\n<\/li><li>\n任意分辨率：不是只支持 2—3 档，而是连续可调；\n<\/li><li>\n误差可控：每条记录都带误差值，可按预算停止。\n<\/ul>\n<p><strong>边界与属性<\/strong>（难度：进阶）。实际实现要处理：边界边（不能随便坍缩，否则轮廓变形）、属性（纹理坐标、法向要一起插值）、非流形（要保护）、自交（坍缩后要检查）。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;QEM 只是启发式，没有理论&quot;<\/strong>——实际上它是最小二乘近似下的最优位置选择，误差单调可加，是&quot;贪心但可控&quot;的典型。\n<\/li><li>\n<strong>别以为&quot;误差为 0 的边可以无限坍缩&quot;<\/strong>——实际上平面区域确实会被压到极小，但要保留至少一个三角形（否则拓扑丢失）；实现里要加&quot;不产生非流形/不删光面&quot;的保护。\n<\/li><li>\n<strong>别以为&quot;简化到很低面数还能保住细节&quot;<\/strong>——实际上 QEM 保的是&quot;到平面族的距离&quot;，对尖锐特征（棱、尖角）只能保住位置，保不住细节形状（那需要特征保持的变体，如加特征边约束）。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>3.2.1<\/td><td>网格简化<\/td><td>QEM 边坍缩<\/td><\/tr><tr><td>3.2.2<\/td><td>多分辨率<\/td><td>渐进网格 PM<\/td><\/tr><tr><td>3.3.4—3.3.6<\/td><td>压缩<\/td><td>渐进编码、序列编码<\/td><\/tr><tr><td>8.2<\/td><td>学习型处理<\/td><td>常以简化网格为输入<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：最小二乘、优先队列、平面方程\n<\/li><li>\n后续：渐进网格、渐进压缩、LOD 渲染\n<\/li><li>\n对照：重网格化（换采样而非减顶点）\n<\/ul>", "c09": "<h1>方向场、周期跳跃与奇异点<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 4 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>在每个顶点给出 4 个等价的正交切向（交叉场），它规定四边形网格往哪铺；跨块时需要&quot;旋转 90° 的整数倍&quot;来对齐，转不回来的点就是奇异点。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是四边形化从&quot;艺术&quot;变成&quot;可计算&quot;的关键：把&quot;网格怎么铺&quot;变成一个可以全局优化、可以证明约束的场。奇异点的分布直接决定四边形网格的质量。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[输入曲面] --&gt; B[求交叉场&lt;br/&gt;4 个等价方向]\n    B --&gt; C[跨边的整数跳跃 k]\n    C --&gt; D[优化能量 + 约束]\n    D --&gt; E[奇异点 由 k 的绕数决定]\n    E --&gt; F[按场抽取四边形网格]\n    F --&gt; G[3价 5价 顶点出现在奇异点处]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：奇异点不是缺陷，而是场的拓扑必然产物；网格的&quot;五星点&quot;就是它的可视化。<\/p>\n<h2>详解<\/h2>\n<p><strong>为什么需要 4 个等价方向<\/strong>（难度：进阶）。四边形网格的一个单元有两族平行边，方向 ±u 与 ±v 都给同一族边。所以场是&quot;无朝向&quot;的：把 u 换成 −u、或把 (u, v) 换成 (v, u)，铺出来的网格一样。这就是 C4 对称（4 阶循环）的来源。<\/p>\n<p><strong>两种表示<\/strong>（难度：高难）：<\/p>\n<ol><li>\n<strong>带整数跳跃的表示<\/strong>。在每条边 e 上记整数 k_e，表示&quot;跨过 e 时方向编号要循环移 k 步&quot;。优化时 k_e 是离散变量，问题变成混合整数规划。\n<\/li><li>\n<strong>三角函数表示<\/strong>。把角度乘 4：ξ = (cos 4θ, sin 4θ)。旋转 90° 对应 θ + π/2，乘 4 后是 +2π，三角函数值不变——<strong>整数变量自动消失<\/strong>，优化变成连续问题。\n<\/ol>\n<p>第二种是主流，因为它把一个离散组合问题变成了普通的向量场光滑问题（最小化 Dirichlet 能量 ʃ|∇ξ|²）。<\/p>\n<p><strong>奇异点怎么产生<\/strong>（难度：高难）。绕顶点走一圈，场必须回到原值。在乘 4 的表示里，&quot;回到原值&quot;要求累积转角是 2π 的整数倍。如果累积转角是 2π×m 且 m 非零，这个点就有非零指数。换算回四边形网格，优雅的记账方式是用价 n：<\/p>\n<pre><code>index = (4 − n) / 4      3 价 → +1/4，5 价 → −1/4<\/code><\/pre>\n<p>而<strong>Poincaré-Hopf 定理<\/strong>要求闭合曲面上 Σ index = χ。球面 χ = 2，所以至少需要 8 个 +1/4（即 8 个 3 价顶点），或等价的组合。这就是&quot;四边形球面不可能没有奇异点&quot;的严格理由。<\/p>\n<p><strong>整数约束的求解<\/strong>（难度：高难）。带整数变量的能量常用&quot;松弛—取整&quot;策略：先把 k 当连续变量解二次规划，再把最接近整数的固定，优化剩余，反复迭代。书里强调：<strong>一次性全部取整会得到奇异点过多、非常不光顺的场<\/strong>，逐步取整才有效。<\/p>\n<p><strong>特征对齐与度量定制<\/strong>（难度：高难）：<\/p>\n<ul><li>\n<strong>对齐<\/strong>：在特征边上，要求场的方向与该边一致（或成 45°）；边界处要求方向沿边界。\n<\/li><li>\n<strong>密度<\/strong>：用 2×2 对称正定矩阵 g（度量张量）替代欧氏度量，其特征向量给方向、特征值给密度。约束 g 正定很麻烦，技巧是写 g = exp(G)（G 任意对称），指数映射保证正定，把不等式约束变成无约束。\n<\/ul>\n<p><strong>数值例子<\/strong>（可验证）。平面上取&quot;径向 + 切向&quot;场：绕一圈，方向转 360°，而 4 个等价方向只认 90° 的整数倍，360° = 4×90° → 整数，无奇异点（指数 0）。<\/p>\n<p>把场改成一个常数 45° 方向并带一次&quot;扭转&quot;：绕一圈累积 360°，但 45° 不在 4 个等价方向的集合里，累积不是 90° 的整数倍 → 中心必须有奇异点，指数 +1/4（3 价）。<strong>这个对比用一张纸就能画出，是理解周期跳跃的最快方式。<\/strong><\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;奇异点是算法缺陷，应该消除&quot;<\/strong>——实际上它们的总指数受拓扑下界约束，能做的只有&quot;放到合适的位置、均匀分布&quot;。\n<\/li><li>\n<strong>别以为&quot;乘 4 的表示只是换元，结果一样&quot;<\/strong>——实际上它改变了优化问题的性质（连续 vs 混合整数），这是可行与不可行的区别。\n<\/li><li>\n<strong>别以为&quot;方向场光滑了网格就好看&quot;<\/strong>——实际上网格质量还取决于奇异点位置与密度场；奇异点挤在一起会导致局部三角形畸变。\n<\/li><li>\n<strong>别以为&quot;整数取整可以最后一次性做&quot;<\/strong>——实际上取整顺序影响解的质量，逐步取整才能得到少奇异点的场。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>4.2.1<\/td><td>方向场驱动四边形化<\/td><td>周期跳跃、整数相容<\/td><\/tr><tr><td>4.2.2<\/td><td>Morse-Smale<\/td><td>用标量场替代方向场<\/td><\/tr><tr><td>4.3.2<\/td><td>标架场<\/td><td>三维推广（对称标架的 9 维表示）<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：向量场、绕数、欧拉示性数、混合整数优化\n<\/li><li>\n后续：四边形抽取、标架场、六面体\n<\/li><li>\n对照：Morse-Smale（用标量场切块）\n<\/ul>", "c10": "<h1>标架场与六面体重网格化<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 4 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>在每个点给出 3 个互相垂直的方向（标架），用它约束体参数化，再抽整数等值面就得到六面体网格；难在标架有 24 种对称、奇异结构是线而不是点。<\/p>\n<h2>为什么重要<\/h2>\n<p>六面体网格是有限元最想要的单元（精度与收敛速度都好），但自动生成极其困难。标架场路线是&quot;用场约束全局结构&quot;这一思路在三维的代表。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[输入网格] --&gt; B[求对称标架场&lt;br/&gt;每点3个正交方向]\n    B --&gt; C[奇异结构&lt;br/&gt;奇异线]\n    C --&gt; D[体参数化&lt;br/&gt;映射到整数格]\n    D --&gt; E[抽整数等值面]\n    E --&gt; F[六面体网格]\n    A --&gt; G[另一路线 多立方体&lt;br/&gt;积木近似 + 映射]\n    G --&gt; F<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：两条路线的区别在于&quot;全局结构从哪来&quot;——一条从场求解，一条从积木形状强制。<\/p>\n<h2>详解<\/h2>\n<p><strong>对称性带来的表示难题<\/strong>（难度：高难）。3 个正交方向，但：<\/p>\n<ul><li>\n三个方向的<strong>顺序<\/strong>可以任意排列（6 种）；\n<\/li><li>\n每个方向的正负不重要（8 种）；\n<\/li><li>\n但&quot;右手系&quot;约束会限制一部分。\n<\/ul>\n<p>总共 24 种等价表示（立方体的旋转群）。所以不能简单存 3 个向量再去插值——插值出来的往往不是正交标架。<\/p>\n<p><strong>9 维表示<\/strong>（难度：高难）。经典做法是用<strong>球面调和函数<\/strong>把对称性编码：把标架展开成 l=0 与 l=4 的球面调和的组合（因为 3 个方向与其相反方向构成的多项式在旋转下不变），得到一个 9 维向量（1 + 4 + 4 或等价的分量数）。在这个空间里：<\/p>\n<ul><li>\n距离可定义（R⁹ 中的欧氏距离），\n<\/li><li>\n光顺就是最小化相邻标架在 9 维空间中的差，\n<\/li><li>\n奇异结构从&quot;向量不连续&quot;变成&quot;9 维向量场的拓扑缺陷&quot;。\n<\/ul>\n<p><strong>奇异结构是线<\/strong>（难度：高难）。四边形网格的奇异点是孤立点（3 价/5 价顶点），六面体网格的奇异结构是<strong>线<\/strong>：沿一条线走，周围的六面体拓扑&quot;转不回来&quot;，整条线的邻域都受影响。这导致整数约束的组合爆炸（每条奇异线都是一组约束），求解难度比二维高一档。<\/p>\n<p><strong>多立方体路线<\/strong>（难度：进阶）。先用轴对齐的立方体拼出模型（像乐高），得到极其规整的结构，再把这个&quot;积木模型&quot;光滑映射回原形状。优点：<\/p>\n<ul><li>\n全局结构自动规整（每块都是标准六面体）；\n<\/li><li>\n奇异结构只出现在积木的拐角上，位置可控；\n<\/li><li>\n求解简单（映射是分段线性的、可用调和映射优化）。\n<\/ul>\n<p>缺点：<\/p>\n<ul><li>\n积木近似会丢失细节（细杆、薄片、弯曲大的部位）；\n<\/li><li>\n形状与积木差异大时映射扭曲严重；\n<\/li><li>\n拼装本身是一个组合优化问题。\n<\/ul>\n<p><strong>晶格与八叉树路线<\/strong>（难度：进阶）。直接撒规则格子或八叉树格子，边界处裁成贴合体。快，但<strong>边界单元质量差<\/strong>——有限元在边界处最需要好单元，这是它的结构性缺陷。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;六面体只是四边形加一维&quot;<\/strong>——实际上三维的奇异结构从点变成线，整数约束的组合复杂度完全不同。\n<\/li><li>\n<strong>别以为&quot;标架场平滑了就一定生成好网格&quot;<\/strong>——实际上还要求积分性（场可积、能抽出一致的格点），不可积的场会导致抽取失败或单元错位。\n<\/li><li>\n<strong>别以为&quot;多立方体是偷懒做法，质量一定差&quot;<\/strong>——实际上对建筑类、机械类块状模型它非常合适，代价只出现在细长/薄壁结构上。\n<\/li><li>\n<strong>别以为&quot;八叉树够用&quot;<\/strong>——实际上边界单元质量是结构性问题，不是调参能解决的。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>4.3.1<\/td><td>基于局部拓扑操作<\/td><td>从四边形网格挤出、局部修正<\/td><\/tr><tr><td>4.3.2<\/td><td>三维标架场<\/td><td>球面调和 9 维表示、奇异线<\/td><\/tr><tr><td>4.3.3<\/td><td>多立方体结构<\/td><td>积木近似 + 映射<\/td><\/tr><tr><td>4.3.4<\/td><td>闭形式多立方体<\/td><td>用闭 1-形式保证可积<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：方向场与周期跳跃、球面调和、体参数化\n<\/li><li>\n后续：六面体网格质量优化、有限元\n<\/li><li>\n对照：晶格/八叉树（简单但边界差）、多立方体（规整但近似粗）\n<\/ul>", "c11": "<h1>形状描述子与谱签名（HKS / WKS）<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 5、8 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>把形状（或形状的局部）压成一个向量/曲线，让&quot;像不像&quot;可计算；谱签名是用 Laplace 算子的特征值/特征向量构造的、与坐标无关的局部签名。<\/p>\n<h2>为什么重要<\/h2>\n<p>检索、对应、分类、配准的粗筛全都依赖它。HKS 的&quot;等距不变&quot;是几何处理里最漂亮的性质之一：它让人体的不同姿势仍能对应上同一部位。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[网格] --&gt; B[离散 Laplace 矩阵 L]\n    B --&gt; C[特征分解&lt;br/&gt;λi 与 φi]\n    C --&gt; D1[HKS&lt;br/&gt;Σ exp −λt φ²]\n    C --&gt; D2[WKS&lt;br/&gt;Σ gaussian λ φ²]\n    D1 --&gt; E[局部签名曲线]\n    D2 --&gt; E\n    E --&gt; F[匹配 / 检索 / 分割]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：同一个特征分解，换一种&quot;对特征值的加权方式&quot;就得到不同签名（热的核 vs 波的核）。<\/p>\n<h2>详解<\/h2>\n<p><strong>HKS 的定义与含义<\/strong>（难度：高难）：<\/p>\n<pre><code>HKS(x, t) = Σ_i exp(−λ_i t) φ_i(x)²<\/code><\/pre>\n<p>它等于&quot;在 x 放一滴单位热量，t 时刻在 x 处剩余的热量&quot;（热核的对角元）。两点性质：<\/p>\n<ul><li>\n<strong>等距不变<\/strong>：热扩散只依赖内在度量（沿曲面距离），弯曲纸面不改变它；\n<\/li><li>\n<strong>多尺度<\/strong>：t 小看局部（近似与曲率有关），t 大看全局（趋于常数）。\n<\/ul>\n<p><strong>WKS<\/strong>（难度：高难）。把 exp 换成对 log 特征值的 Gaussian 窗（g(λ)）= exp(−(log λ − log λ_c)²/(2σ²)），相当于&quot;在某个频段上做滤波&quot;。好处是对尺度差异更稳、且能量集中在指定频段。<\/p>\n<p><strong>球面的可算例子<\/strong>（难度：进阶）。单位球面：λ_l = l(l+1)，重数 2l+1，φ 均匀 → φ_i(x)² 平均为 1/(4π)。于是<\/p>\n<pre><code>HKS(t) = Σ_l (2l+1)/(4π) exp(−l(l+1)t)<\/code><\/pre>\n<p>t=1 时：l=0 项 0.0796、l=1 项 0.0323、l=2 项 0.001、更高阶可忽略，合计约 0.113。t=10 时只剩 0.0796（几乎为常数）。<strong>这说明&quot;单一 t 值没有信息，必须用一条曲线&quot;。<\/strong><\/p>\n<p><strong>其他描述子<\/strong>（难度：进阶）：<\/p>\n<ul><li>\n<strong>D2<\/strong>：随机采样点对的距离分布。对旋转不敏感，但丢空间信息；\n<\/li><li>\n<strong>球谐<\/strong>：把形状展开到球面频率基；要求先球参数化；\n<\/li><li>\n<strong>Spin Image<\/strong>：以法向为轴的圆柱坐标投影直方图，对法向误差敏感；\n<\/li><li>\n<strong>学习型<\/strong>：把上述人工特征输入小网络，学出更判别性的向量（第 5 章 EdgeNet、第 8 章 PointNet）。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;HKS 旋转不变就万能&quot;<\/strong>——实际上是等距不变，分不开镜像（左右手），也分不开&quot;凸起&quot;与&quot;凹陷&quot;。\n<\/li><li>\n<strong>别以为&quot;描述子维度越高越好&quot;<\/strong>——实际上高维特征在数据少时更容易过拟合、对噪声更敏感；粗筛阶段低维反而稳。\n<\/li><li>\n<strong>别以为&quot;谱签名计算很贵，不实用&quot;<\/strong>——实际上只需算前几十个特征对（稀疏矩阵的部分特征分解），几千顶点的模型在秒级完成。\n<\/li><li>\n<strong>别以为&quot;D2 无用&quot;<\/strong>——实际上它在&quot;没有对应、没有参数化&quot;的粗筛阶段非常可靠，是级联检索的第一层。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>5.1.1<\/td><td>全局描述子<\/td><td>D2、球谐、光场<\/td><\/tr><tr><td>5.1.2<\/td><td>局部描述子<\/td><td>Spin Image、HKS、WKS<\/td><\/tr><tr><td>5.2<\/td><td>学习型描述子<\/td><td>人工特征 + 网络<\/td><\/tr><tr><td>5.4<\/td><td>检索<\/td><td>多描述子融合<\/td><\/tr><tr><td>8.4<\/td><td>深度几何<\/td><td>端到端学习替代手工<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：Laplace 特征值、热扩散、球面调和\n<\/li><li>\n后续：匹配、分割、协同分割\n<\/li><li>\n对照：D2（统计）、Spin Image（局部几何）、PointNet（学习）\n<\/ul>", "c12": "<h1>网格分割与归一化割<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 5 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>把网格切成若干块；归一化割（Ncut）用&quot;切口尽量小 + 每块不能太小&quot;的比值目标代替&quot;切口最小&quot;，其松弛解是一个广义特征值问题。<\/p>\n<h2>为什么重要<\/h2>\n<p>分割是语义分析的第一步。Ncut 的意义超出分割本身：它展示了&quot;约束怎么进目标函数&quot;——如果把&quot;块不能太小&quot;写成硬约束，问题会变组合；写成归一化分母，问题就变成可解的谱问题。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[网格 → 图&lt;br/&gt;顶点=节点 边权=相似度] --&gt; B[构造拉普拉斯 L]\n    B --&gt; C[解广义特征值&lt;br/&gt;L x = λ D x]\n    C --&gt; D[取第二小特征向量]\n    D --&gt; E[按符号或阈值二分]\n    E --&gt; F[递归二分 = 多块]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：核心是&quot;把分割变成谱问题&quot;；第二小特征向量（Fiedler 向量）给出最优切分方向。<\/p>\n<h2>详解<\/h2>\n<p><strong>图的构造<\/strong>（难度：进阶）。顶点是节点，边权 w_ij 表示&quot;i 与 j 应该在同一块&quot;的程度。常用 w_ij = exp(−d(i,j)²/σ²)，或者结合曲率相似度。切分代价是跨块的边权和：<\/p>\n<pre><code>cut(A, B) = Σ_{i∈A, j∈B} w_ij<\/code><\/pre>\n<p><strong>为什么不能只最小化切口<\/strong>（难度：进阶）。考虑走廊：切下末端 1 个点，切口是 1；从中间切成两半，切口也是 1。两者 cut 相同，但前者语义荒谬。归一化把&quot;块的大小&quot;纳入分母：<\/p>\n<pre><code>Ncut(A, B) = cut(A, B)/assoc(A, V) + cut(B, A)/assoc(B, V)<\/code><\/pre>\n<p>assoc(A, V) 是 A 与全图的连接总量（约等于 A 的&quot;体积&quot;）。于是切下 1 个点得 1/1 + 1/99 ≈ 1.01，从中间切得 1/50 + 1/50 = 0.04。<strong>前者被惩罚。<\/strong><\/p>\n<p><strong>谱解<\/strong>（难度：高难）。把 Ncut 写成矩阵形式，最小化它等价于求<\/p>\n<pre><code>(D − W) x = λ D x<\/code><\/pre>\n<p>的第二小特征值对应的特征向量（D 是度矩阵，W 是权重矩阵）。这个向量在每个顶点给一个实数，按符号（或按 0 阈值）二分就得到切分。递归二分就得到多块。<\/p>\n<p><strong>其他分割方法<\/strong>（难度：进阶）：<\/p>\n<ul><li>\n<strong>区域增长/分水岭<\/strong>：靠曲率极值线当边界，快但不稳；\n<\/li><li>\n<strong>聚类<\/strong>：按曲率特征 k 均值，简单但不保证连通；\n<\/li><li>\n<strong>随机游走<\/strong>：解 Laplace 方程，等价于&quot;从每个点出发先碰到哪个标记&quot;；\n<\/li><li>\n<strong>交互式<\/strong>：用户刷几笔当硬约束，其余由优化补齐；\n<\/li><li>\n<strong>协同分割<\/strong>：多个模型联合优化，使对应部位切法一致。\n<\/ul>\n<p><strong>数值例子<\/strong>（可手算，1D）。一条 4 个顶点的链，边权都为 1。度矩阵 D = diag(1, 2, 2, 1)，W 是相邻为 1 的矩阵。L = D − W 的第二小特征向量（Fiedler 向量）在该链上近似线性变化（约为 (−0.5, −0.5, +0.5, +0.5) 的形态），按 0 切正好从中间分开——与&quot;直觉最优切法&quot;一致。这个例子说明谱方法不是玄学，它确实给&quot;最均衡的切法&quot;。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;Ncut 只是加了个分母&quot;<\/strong>——实际上这个分母让问题从组合优化变成谱问题，是&quot;可解&quot;的关键。\n<\/li><li>\n<strong>别以为&quot;分割越碎越准&quot;<\/strong>——实际上过分割是常态，工程上要再加合并（按相似度与语义似然）。\n<\/li><li>\n<strong>别以为&quot;谱方法一定给连通块&quot;<\/strong>——实际上特征向量的符号区域可能不连通，需要后处理（连通化）。\n<\/li><li>\n<strong>别以为&quot;分割和识别可以分开做&quot;<\/strong>——实际上两者互相依赖（第 9 章），联合求解更稳。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>5.3.1<\/td><td>全自动分割<\/td><td>区域增长、聚类、Ncut、随机游走<\/td><\/tr><tr><td>5.3.2<\/td><td>交互式分割<\/td><td>笔刷约束 + 优化<\/td><\/tr><tr><td>5.3.3<\/td><td>协同分割<\/td><td>联合特征/联合图割<\/td><\/tr><tr><td>9.3.2<\/td><td>场景理解<\/td><td>分割 + 识别联合<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：图、拉普拉斯矩阵、特征值\n<\/li><li>\n后续：协同分割、语义标注\n<\/li><li>\n对照：分水岭（几何驱动）、Ncut（谱驱动）\n<\/ul>", "c13": "<h1>蒙皮：LBS、DQS 与骨骼学习<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 6 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>把表面顶点绑定到若干根骨头上（权重），骨头一动、顶点按权重混合各家变换跟过去；LBS 是&quot;位置加权平均&quot;，DQS 是&quot;旋转加权平均&quot;。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是动画工业的默认方案，也是&quot;插值重构&quot;这一类形变的代表。理解 LBS 的结构性缺陷（糖纸收缩），才能理解为什么第 6 章后面要搞梯度域和 ARAP。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[模型 + 骨架] --&gt; B[顶点权重&lt;br/&gt;软选或学习]\n    B --&gt; C[每根骨算 R t]\n    C --&gt; D1[LBS 位置加权]\n    C --&gt; D2[DQS 对偶四元数插值]\n    D1 --&gt; E[关节处收缩]\n    D2 --&gt; F[收缩减轻]\n    D1 --&gt; G[加姿态修正项]\n    G --&gt; H[可用的蒙皮结果]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：LBS 的缺陷是原理性的，修法要么换成&quot;旋转插值&quot;，要么叠一个学出来的修正项。<\/p>\n<h2>详解<\/h2>\n<p><strong>LBS 公式<\/strong>（难度：进阶）：<\/p>\n<pre><code>v&#x27; = Σ_j w_ij (R_j v + t_j),   Σ_j w_ij = 1<\/code><\/pre>\n<p><strong>糖纸收缩的可算例子<\/strong>（难度：进阶）。设一个顶点距肘关节 r = 1，权重 0.5/0.5。前臂骨绕关节转 90°：<\/p>\n<ul><li>\n在前臂骨坐标系下：位置 P1 = R(90°)v，到关节距离仍为 1；\n<\/li><li>\n在上臂骨坐标系下：位置 P0 = v，到关节距离 1；\n<\/li><li>\nLBS 结果 (P0 + P1)/2，到关节距离 = |P0 + P1|/2 = √(1² + 1²)/2 = 0.707。\n<\/ul>\n<p><strong>关节处长度缩为 0.707 倍<\/strong>，看起来像糖纸被拧紧。这就是 candy-wrapper 效应。权重越接近 0.5/0.5、旋转角越大，收缩越严重（可以验证：转 180° 时新位置到关节距离为 0——完全塌到关节）。<\/p>\n<p><strong>DQS<\/strong>（难度：高难）。把每根骨的变换表示成对偶四元数（旋转 + 平移），对这些四元数做<strong>归一化的线性插值<\/strong>（可以先平均再归一化），再作用到顶点。它插值的是&quot;运动&quot;而不是&quot;位置&quot;，因此糖纸现象大幅减轻。代价是可能出现&quot;凸起&quot;（bulge），以及对非刚性变换表达力有限。<\/p>\n<p><strong>骨骼学习<\/strong>（难度：高难）。手工绑骨很贵，于是从动画序列里自动学：<\/p>\n<ol><li>\n用均值漂移（mean shift）把顶点按运动轨迹聚类，每个簇当一根&quot;骨头&quot;；\n<\/li><li>\n每簇的仿射变换用最小二乘从顶点运动里拟合；\n<\/li><li>\n拟合出的 3×3 矩阵不一定是旋转（可能含缩放/剪切），要<strong>投影回 SO(3)<\/strong>（用 SVD：R = U Vᵀ）才符合骨骼语义；\n<\/li><li>\n平移部分用最小二乘求。\n<\/ol>\n<p>书里 6.1 节用的就是这套（聚类半径 h 控制骨骼数量，h 越大骨骼越少、精度越低）。<\/p>\n<p><strong>权重与修正<\/strong>（难度：进阶）。工业实践里还有两层：<\/p>\n<ul><li>\n<strong>权重平滑<\/strong>：让权重在网格上平滑过渡，避免关节处出现硬折；\n<\/li><li>\n<strong>姿态修正（pose space deformation）<\/strong>：为每个关节姿态学一个&quot;修正位移&quot;，把被压扁的部分撑回来。这相当于&quot;用数据修补 LBS 的物理错误&quot;。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;LBS 精度差只是权重没调好&quot;<\/strong>——实际上位置平均 ≠ 旋转平均，这是数学结构问题，任何权重都无法完全消除。\n<\/li><li>\n<strong>别以为&quot;DQS 完全解决了收缩&quot;<\/strong>——实际上它换成&quot;凸起&quot;问题，且对大幅非刚性形变仍不理想。\n<\/li><li>\n<strong>别以为&quot;骨骼越多越好&quot;<\/strong>——实际上骨骼多意味着权重更局部、更硬，关节过渡反而更生硬，且计算与美术成本上升。\n<\/li><li>\n<strong>别以为&quot;学出来的骨骼一定有物理意义&quot;<\/strong>——实际上它只是运动模式的聚类，可能与真实解剖结构不对应（这对动画可用、对医学仿真不可用）。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>6.1.1<\/td><td>蒙皮技术<\/td><td>LBS、权重、骨骼学习<\/td><\/tr><tr><td>6.1.2<\/td><td>自由形变<\/td><td>FFD 作为对照<\/td><\/tr><tr><td>6.3<\/td><td>形变能量<\/td><td>ARAP 修 LBS 的细节丢失<\/td><\/tr><tr><td>8.2.6<\/td><td>混合蒙皮<\/td><td>用字典学习降低权重矩阵秩<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：旋转矩阵、四元数、最小二乘\n<\/li><li>\n后续：ARAP、姿态修正、材质优化\n<\/li><li>\n对照：FFD（晶格驱动）、梯度域（保微分）\n<\/ul>", "c14": "<h1>梯度域形变与 ARAP<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 6、7 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>梯度域形变：保留每个顶点的微分坐标（拉普拉斯坐标），只改少数控制点，再解 Poisson 方程重建全局位置；ARAP：要求每个三角形尽量只旋转不拉伸，用&quot;局部算旋转、全局解位置&quot;交替迭代。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是&quot;局部细节 vs 全局位置&quot;这条分界线的典型运用，也是第 6 章的核心技术、第 7 章投影动力学的前身。学会它，很多网格处理问题都能自己写出能量。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[原网格 与 拉普拉斯坐标 δ] --&gt; B[用户指定约束&lt;br/&gt;某些顶点到新位置]\n    B --&gt; C[估计局部旋转]\n    C --&gt; D[解最小二乘 L v&#x27; = b]\n    D --&gt; E[更新旋转 重解]\n    E --&gt; F{收敛?}\n    F --&gt;|否| D\n    F --&gt;|是| G[形变结果]\n    D --&gt; H[梯度域 单次解]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：上面那条循环是 ARAP（旋转与位置交替优化）；如果旋转固定一次不更新，就退化成梯度域的线性解。<\/p>\n<h2>详解<\/h2>\n<p><strong>拉普拉斯坐标<\/strong>（难度：进阶）。δ_i = Δv_i 描述&quot;i 比邻居平均高多少&quot;，是局部形状的编码。关键洞察：<\/p>\n<ul><li>\n<strong>位置是全局的<\/strong>：改一个点，所有点的位置都变；\n<\/li><li>\n<strong>δ 是局部的<\/strong>：平移整个模型，δ 不变；旋转模型，δ 会跟着转（因为它是有方向的量）。\n<\/ul>\n<p>所以形变时&quot;保留 δ&quot;就等于&quot;保留局部形状&quot;。<\/p>\n<p><strong>最小二乘形式<\/strong>（难度：高难）：<\/p>\n<pre><code>min_{v&#x27;}  Σ_i | Δv&#x27;_i − T_i δ_i |² + λ Σ_{i∈C} | v&#x27;_i − p_i |²<\/code><\/pre>\n<p>T_i 是把原 δ 旋到新姿态的局部旋转（否则形状朝向不对）；第二项是用户约束（C 是受控顶点集，p_i 是目标位置）。对 v&#x27; 求导得到<\/p>\n<pre><code>(Lᵀ L + λ I_C) v&#x27; = Lᵀ (T δ) + λ p<\/code><\/pre>\n<p>L 是 Laplace 矩阵，稀疏，用 Cholesky 或共轭梯度求解。<\/p>\n<p><strong>为什么是 Poisson<\/strong>（难度：高难）。连续版本里，目标是求 f 使 ∇f ≈ u（u 是给定的目标梯度场）。但任意 u 未必是某个函数的梯度——它可能含旋转（无散）分量。Helmholtz-Hodge 分解说：<\/p>\n<pre><code>u = ∇ψ + ∇×ω + h<\/code><\/pre>\n<p>只有 ∇ψ 部分可积。求 f 使 ∇f 最接近 u，等价于先取旋度为零的部分，即解<\/p>\n<pre><code>∇²φ = ∇·u<\/code><\/pre>\n<p>这就解释了&quot;梯度域&quot;这个名字，也解释了为什么这个方法稳定：它把不可能满足的部分（旋转/调和分量）自动投影掉了。<\/p>\n<p><strong>ARAP<\/strong>（难度：高难）。能量写成逐三角形：<\/p>\n<pre><code>E = Σ_t Σ_{edges (i,j)} (w_ij/2) | (v&#x27;_i − v&#x27;_j) − R_t (v_i − v_j) |²<\/code><\/pre>\n<p>R_t 是每个三角形自己的最优旋转。求解：<\/p>\n<ul><li>\n<strong>局部步<\/strong>：对每个三角形，把三条边向量作为 3×3 矩阵的列，求使 |E − R S| 最小的 R（Procrustes：SVD 得 R = V Uᵀ，修正 det）；\n<\/li><li>\n<strong>全局步<\/strong>：固定所有 R_t，解稀疏线性系统求 v&#x27;（矩阵恒定，可预分解）。\n<\/ul>\n<p>能量单调下降，收敛到局部极小。<\/p>\n<p><strong>与梯度域的关系<\/strong>（难度：高难）。两者都是&quot;局部-全局&quot;，区别在局部量：梯度域用<strong>顶点的一阶微分<\/strong>（δ）并估计一个旋转；ARAP 用<strong>边的差分<\/strong>并对每个三角形精确求旋转。ARAP 更准（旋转是真实最优而非估计），代价是每步多一次逐三角形 SVD。<\/p>\n<p><strong>数值例子（一维）<\/strong>（难度：进阶）。4 个顶点在 0、1、2、3，δ = (1, 0, 0, −1)。固定首末为 0 和 2，内部 δ 保持 0：<\/p>\n<pre><code>2x2 − x1 − x3 = 0,  x1 = 0\n2x3 − x2 − x4 = 0,  x4 = 2\n→ x2 = 2/3, x3 = 4/3<\/code><\/pre>\n<p>位置均匀分布。若改用&quot;保边长&quot;（ARAP）目标，每条边都要求长度 1，总长 3 塞进长度 2 的区间是矛盾的，最小二乘解给出边长 2/3。<strong>这个对比说明：梯度域保的是二阶结构（均匀性），ARAP 保的是一阶结构（边长）。<\/strong><\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;梯度域形变不会失真&quot;<\/strong>——实际上它只保局部微分，不保体积和全局尺度，大幅动作会让关节塌陷（需要内部体图或体积约束）。\n<\/li><li>\n<strong>别以为&quot;ARAP 一定收敛到全局最优&quot;<\/strong>——实际上只保证能量单调下降，可能停在局部极小，结果依赖初值。\n<\/li><li>\n<strong>别以为&quot;局部旋转可以随便估&quot;<\/strong>——实际上旋转估错，细节就会朝错误方向&quot;翘起&quot;，这正是梯度域不如 ARAP 稳的原因。\n<\/li><li>\n<strong>别以为&quot;Helmholtz 分解只是理论&quot;<\/strong>——实际上它解释了&quot;为什么直接对向量场积分会失败&quot;，也指导了实现：必须先取散度再解 Poisson，而不是直接积分。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>6.2.1<\/td><td>梯度域 Poisson 编辑<\/td><td>解 L v = b，体图防塌陷<\/td><\/tr><tr><td>6.2.2<\/td><td>基于体图的梯度域<\/td><td>内外两层图约束体积与自交<\/td><\/tr><tr><td>6.3.1<\/td><td>非线性约束优化<\/td><td>ARAP、骨架约束、体积约束<\/td><\/tr><tr><td>6.3.2<\/td><td>子空间求解<\/td><td>只在少数基上求<\/td><\/tr><tr><td>7.1.3<\/td><td>投影动力学<\/td><td>同一局部-全局结构用于物理<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：拉普拉斯坐标、最小二乘、SVD/Procrustes\n<\/li><li>\n后续：ARAP、子空间形变、投影动力学\n<\/li><li>\n对照：LBS（插值，无优化）、FFD（晶格控制）\n<\/ul>", "c15": "<h1>弹性模拟：隐式积分、PBD 与子空间<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 7 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>按 M ẍ + D ẋ + f_int = f_ext 推进形状；显式积分受&quot;最快振动&quot;限制步长，隐式积分不受但每步要解方程，子空间/Cubature/投影动力学是三种降本手段。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是&quot;形变能量 + 优化&quot;在时间维度上的延伸：第 6 章的能量是静态的，第 7 章让它随时间演化。工程上的布料、软组织、碎裂都靠这一套。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[运动方程] --&gt; B{积分方式}\n    B --&gt;|显式| C[便宜 但 h ≤ 2/ωmax]\n    B --&gt;|隐式| D[稳定 每步解稀疏系统]\n    D --&gt; E[降本三招]\n    E --&gt; E1[子空间模态]\n    E --&gt; E2[投影动力学 常量矩阵]\n    E --&gt; E3[Cubature 代表单元]\n    D --&gt; F[碰撞约束]\n    F --&gt; G[最终动画]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：三条降本路线互相独立、可以叠加；选择哪条取决于瓶颈（自由度、单元数、还是求解次数）。<\/p>\n<h2>详解<\/h2>\n<p><strong>运动方程的三项<\/strong>（难度：进阶）：<\/p>\n<ul><li>\nM ẍ：惯性（质量 × 加速度）；\n<\/li><li>\nD ẋ：阻尼（Rayleigh：D = α_m M + α_k K）；\n<\/li><li>\nf_int：内力 = −∂E/∂x（E 是弹性势能）。\n<\/ul>\n<p><strong>显式的稳定性条件<\/strong>（难度：进阶）。单弹簧 ω = √(k/m)，显式积分稳定要求 h ≤ 2/ω。全系统 ω_max 决定步长，网格加密使 ω_max 上升（刚度随 1/边长 增长），这解释了&quot;细分一倍、代价翻倍&quot;。<\/p>\n<p><strong>隐式积分<\/strong>（难度：高难）。用未知的 x_{n+1} 写方程，Newton 迭代每步解稀疏线性系统。无条件稳定，但大步长会引入数值阻尼（看起来&quot;发黏&quot;）。<\/p>\n<p><strong>子空间<\/strong>（难度：高难）。线性化后解广义特征值问题 K φ = λ M φ，取最低 K 个模态作基，未知量从 3N 降到 K。失效场景：大幅非线性形变（线性基失效）、局部尖锐碰撞（需要高频模态）。<\/p>\n<p><strong>PBD<\/strong>（难度：高难）。三步：预测位置 → 投影约束 → 反推速度。极稳、易实现；刚度靠迭代次数&quot;堆&quot;出来，物理参数不直接。<\/p>\n<p><strong>投影动力学<\/strong>（难度：高难）。把内力写成一组投影问题之和，隐式积分每步变成解<\/p>\n<pre><code>(M/h² + Σ w_i S_iᵀ S_i) x = b<\/code><\/pre>\n<p>左边恒定 → 预分解一次，每步只回代。收敛时的解与隐式积分一致，速度却接近 PBD。<\/p>\n<p><strong>Cubature<\/strong>（难度：高难）。从所有单元里选少量&quot;代表单元&quot;，用训练数据拟合（最小化整体内力误差）。单元计算量降一个数量级，代价是牺牲局部细节。<\/p>\n<p><strong>碰撞<\/strong>（难度：进阶）。检测用 BVH（层次包围盒），处理用约束（KKT/投影）。自碰撞要先排除相邻三角形，否则布料会粘住。书里还给了&quot;每个顶点只保留一个碰撞约束&quot;的简化策略（让矩阵变对角，大幅提速）——实验表明视觉上无明显失真。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;隐式积分步长越大越好&quot;<\/strong>——实际上大步长稳定但精度低、阻尼重，看起来发黏。\n<\/li><li>\n<strong>别以为&quot;弹簧模型和有限元只是实现差别&quot;<\/strong>——实际上弹簧刚度与网格密度耦合，有限元的材料参数与网格无关。\n<\/li><li>\n<strong>别以为&quot;PBD 迭代多了就等于物理正确&quot;<\/strong>——实际上它收敛到&quot;约束满足&quot;的解，参数需要标定，中间状态无物理意义。\n<\/li><li>\n<strong>别以为&quot;BVH 建一次就够&quot;<\/strong>——实际上形变会让包围盒失效，需要每帧重拟合或定期重建。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>7.1.1<\/td><td>弹性运动方程<\/td><td>弹簧/无网格/有限元<\/td><\/tr><tr><td>7.1.2<\/td><td>子空间降维<\/td><td>模态分析、Cubature<\/td><\/tr><tr><td>7.1.3<\/td><td>位置与投影加速<\/td><td>PBD、投影动力学<\/td><\/tr><tr><td>7.2<\/td><td>碰撞<\/td><td>BVH、约束处理、自碰撞<\/td><\/tr><tr><td>7.3<\/td><td>运动编辑<\/td><td>旋转-应变空间、材质优化<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：Newton 法、特征值问题、约束优化\n<\/li><li>\n后续：布料/软组织模拟、运动编辑、材质反演\n<\/li><li>\n对照：纯几何形变（无形力平衡）\n<\/ul>", "c16": "<h1>稀疏、低秩与深度几何学习<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 8 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>用&quot;少数原子线性组合&quot;（稀疏）或&quot;信息高度重复&quot;（低秩）作为先验，把几何问题写成可解的优化；深度学习则把手写先验换成从数据里学的先验。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是&quot;数据驱动&quot;这一路的总纲：第 5 章的学习型描述子、第 8 章的去噪/重建/配准/生成都落在这里。理解 L1 与低秩的几何直觉，就能判断一个论文里的能量到底在约束什么。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[几何信号 不规则定义域] --&gt; B[稀疏先验]\n    A --&gt; C[低秩先验]\n    B --&gt; B1[局部字典]\n    B --&gt; B2[冗余字典 + L1]\n    C --&gt; C1[核范数 奇异值和]\n    B1 --&gt; D[去噪 重建 匹配]\n    B2 --&gt; D\n    C1 --&gt; E[正朝向 蒙皮降维]\n    A --&gt; F[深度学习]\n    F --&gt; F1[PointNet 对称池化]\n    F --&gt; F2[流形卷积 测地邻域]\n    F --&gt; F3[生成模型 VAE GAN]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：上半是&quot;数学先验&quot;（无需训练），下半是&quot;数据先验&quot;（需要训练）。两者在任务上重叠，但保证不同。<\/p>\n<h2>详解<\/h2>\n<p><strong>L1 为什么稀疏<\/strong>（难度：高难）。凸优化的几何直觉：数据项 |y − Dx|² ≤ ε 是一个椭圆，L1 惩罚 λ|x|₁ 的等值线是菱形。椭圆与菱形相切的位置多半在菱形的尖角（坐标轴上）→ 某分量为 0。L2 的等值线是圆，切点一般不在坐标轴上 → 只缩小不归零。<\/p>\n<p><strong>一维手算<\/strong>（难度：进阶）。y = 1、D = 1、λ = 2：L2 解 x = 1/(1+λ/2) = 0.5（非零）；L1 解 x = max(1 − λ/2, 0) = 0（<strong>被阈值化到零<\/strong>）。这就是&quot;软阈值&quot;的来历。<\/p>\n<p><strong>低秩正朝向<\/strong>（难度：高难）。观察：人造模型沿坐标轴有对称性，摆正时它在三个坐标平面上的投影矩阵行与行高度相似 → 秩低。于是求&quot;使三个投影矩阵秩之和最小&quot;的旋转。秩的凸替代是核范数（奇异值之和）。这是一个<strong>完全无监督<\/strong>的方法，不需要训练数据。<\/p>\n<p><strong>压缩感知<\/strong>（难度：高难）。若信号在基下稀疏，则用远少于维数的测量也能唯一恢复（把无穷多解压成唯一解）。几何里用它做&quot;从少量采样恢复细节&quot;。<\/p>\n<p><strong>几何信号的特殊困难<\/strong>（难度：进阶）。图像有局部紧支撑的正交基（小波），几何没有：Laplace 特征向量是全局支撑的，无法表示局部细节。所以要么用局部字典，要么用冗余字典 + L1 选择，要么让网络自己学基。<\/p>\n<p><strong>深度几何的四种姿势<\/strong>（难度：进阶）：<\/p>\n<ol><li>\n<strong>假图像 CNN<\/strong>：给每个三角形算 600 维特征、重排成 30×20 矩阵，套 CNN。书里明确指出&quot;排列顺序与矩阵形状影响结果&quot;——它并不真正尊重拓扑。\n<\/li><li>\n<strong>PointNet<\/strong>：逐点 MLP + 全局最大池化。顺序无关来自最大池化的对称性；旋转靠 T-Net 学一个变换矩阵（只是近似抵消）。\n<\/li><li>\n<strong>流形卷积<\/strong>：按测地距离定义邻域，在切平面上按极坐标 (角度, 半径) 分箱聚合。难点是局部坐标系对齐。\n<\/li><li>\n<strong>生成/递归模型<\/strong>：VAE/GAN 学形状分布、RNN 做非刚性配准。可控性差（难保证不自交/不翻转）。\n<\/ol>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;L1 总比 L2 好&quot;<\/strong>——实际上 L1 在有相关特征时随机挑一个、丢弃另一个，不稳定；L2 解唯一、稳定。\n<\/li><li>\n<strong>别以为&quot;把三角形特征排成矩阵就是尊重拓扑&quot;<\/strong>——实际上排列与邻接无关，换顺序结果就变。\n<\/li><li>\n<strong>别以为&quot;PointNet 天然旋转不变&quot;<\/strong>——实际上它只保证顺序不变，旋转靠学出来的变换层近似抵消。\n<\/li><li>\n<strong>别以为&quot;生成模型能替代物理模拟&quot;<\/strong>——实际上它不保证力平衡、体积守恒、不自交；硬约束任务仍要靠优化。\n<\/li><li>\n<strong>别以为&quot;深度学习不需要几何算子&quot;<\/strong>——实际上成功模型的输入几乎都是曲率、法向、测地距离、Laplace 特征这些算子算出来的量。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>8.1<\/td><td>压缩感知与稀疏学习<\/td><td>稀疏编码、字典、L1、低秩<\/td><\/tr><tr><td>8.2<\/td><td>几何处理应用<\/td><td>去噪、重建、匹配、蒙皮、正朝向<\/td><\/tr><tr><td>8.3<\/td><td>机器学习基础<\/td><td>MLP、CNN、损失与训练<\/td><\/tr><tr><td>8.4<\/td><td>深度几何<\/td><td>假图像 CNN、PointNet、流形卷积、生成模型<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：线性代数、概率、凸优化\n<\/li><li>\n后续：数据驱动重建、端到端配准\n<\/li><li>\n对照：手工能量（可解释、可保证）vs 学习先验（表达力强、可控性弱）\n<\/ul>", "__path__": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：几何处理的数学基础<\/strong><br>阅读：<a href=\"#/chapter/ch01\">第 1 章：几何处理的数学基础<\/a><br>检查点：ch01 自测 ≥ 3/4，能写出余切权重表达式<\/li><li class='path-step' id='path-02'><strong>步骤 02：点云曲面重建与光顺<\/strong><br>阅读：<a href=\"#/chapter/ch02\">第 2 章：点云曲面重建和光顺<\/a><br>检查点：能讲清 ICP 两步交替为什么单调下降<\/li><li class='path-step' id='path-03'><strong>步骤 03：参数化与多分辨率表示<\/strong><br>阅读：<a href=\"#/chapter/ch03\">第 3 章：网格曲面的参数化和多分辨率表示<\/a><br>检查点：能解释参数化为什么翻转、QEM 误差怎么累加<\/li><li class='path-step' id='path-04'><strong>步骤 04：网格模型的重网格化<\/strong><br>阅读：<a href=\"#/chapter/ch04\">第 4 章：网格模型的重网格化<\/a><br>检查点：能画出方向场奇异点与 3/5 价顶点的对应<\/li><li class='path-step' id='path-05'><strong>步骤 05：三维形状分析<\/strong><br>阅读：<a href=\"#/chapter/ch05\">第 5 章：三维形状分析<\/a><br>检查点：能说出 HKS 为什么等距不变<\/li><li class='path-step' id='path-06'><strong>步骤 06：网格曲面的形变<\/strong><br>阅读：<a href=\"#/chapter/ch06\">第 6 章：网格曲面的形变<\/a><br>检查点：能写出梯度域形变的最小二乘形式<\/li><li class='path-step' id='path-07'><strong>步骤 07：弹性运动模拟<\/strong><br>阅读：<a href=\"#/chapter/ch07\">第 7 章：弹性运动模拟<\/a><br>检查点：能解释 PBD 与隐式积分的关系<\/li><li class='path-step' id='path-08'><strong>步骤 08：基于机器学习的几何处理<\/strong><br>阅读：<a href=\"#/chapter/ch08\">第 8 章：基于机器学习的几何处理<\/a><br>检查点：能说出 PointNet 为什么能容忍点序<\/li><li class='path-step' id='path-09'><strong>步骤 09：新型几何处理应用<\/strong><br>阅读：<a href=\"#/chapter/ch09\">第 9 章：新型几何处理应用<\/a><br>检查点：能列出 3D 打印的三类几何约束<\/li><li class='path-step' id='path-10'><strong>步骤 10：综合检验<\/strong><br>阅读：<a href=\"#/chapter/mix\">综合测验与最终检验<\/a><br>检查点：完成最终检验项目并给出技术报告<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "__quiz_all__": "<p>（无综合题）<\/p>", "__quiz_ch01__": "<h1>测验：第 1 章：几何处理的数学基础<\/h1><div class='quiz-item' data-qid='q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 一个闭合球面网格的离散高斯曲率（角度亏欠）总和是多少？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q01' value='0'> 0<\/label><label class='quiz-opt'><input type='radio' name='q01' value='1'> 2π<\/label><label class='quiz-opt'><input type='radio' name='q01' value='2'> 4π<\/label><label class='quiz-opt'><input type='radio' name='q01' value='3'> 与剖分密度成正比<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q02' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 哪种表示能够精确表达一个圆？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q02' value='0'> 三次样条<\/label><label class='quiz-opt'><input type='radio' name='q02' value='1'> B-样条<\/label><label class='quiz-opt'><input type='radio' name='q02' value='2'> 有理样条 NURBS<\/label><label class='quiz-opt'><input type='radio' name='q02' value='3'> 均匀 B 样条<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q03' data-type='blank'><p class='quiz-q'><b>Q3.<\/b> 某顶点有 3 个邻居，每条边的余切权重和为 1.2，混合面积 A_i = 0.4。则离散 Laplace 前的系数 1/(2A_i) 为＿＿，Δx_i 等于该系数乘以＿＿。<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q04' data-type='blank'><p class='quiz-q'><b>Q4.<\/b> 为什么三次样条&quot;C² 连续&quot;却&quot;不局部&quot;？<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch02__": "<h1>测验：第 2 章：点云曲面重建和光顺<\/h1><div class='quiz-item' data-qid='q05' data-type='single'><p class='quiz-q'><b>Q1.<\/b> ICP 每轮迭代包含哪两步？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q05' value='0'> 特征提取与分类<\/label><label class='quiz-opt'><input type='radio' name='q05' value='1'> 找最近点对应与解闭式最优变换<\/label><label class='quiz-opt'><input type='radio' name='q05' value='2'> 三角化与抽等值面<\/label><label class='quiz-opt'><input type='radio' name='q05' 2 章的 Poisson 重建都共享同一个模式：先构造＿＿，再解＿＿。<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q40' data-type='blank'><p class='quiz-q'><b>Q4.<\/b> 为什么&quot;四边形化球面不可能没有奇异点&quot;？请用指数与欧拉示性数说明。<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q41' data-type='blank'><p class='quiz-q'><b>Q5.<\/b> 给定一份带噪声、有遮挡缺失的文物扫描点云，请给出处理流程并说明每一步的理由。<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q42' data-type='blank'><p class='quiz-q'><b>Q6.<\/b> 如果你要在移动端实时编辑一个 5 万顶点的网格（拖拽骨架 + 保体积），会选择哪些技术组合？说明取舍。<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__cards__": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "__glossary__": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='离散化（discretization）'>离散化（Discretization） — 把连续的曲面、微分、积分换成有限个点和面能表达、能计算的一整套做法 <span class=glossary-ref>（第 1 章：几何处理的数学基础）<\/span><\/li><li data-term='多边形网格曲面'>多边形网格曲面 — 顶点表记坐标、面片表记&quot;哪几个顶点连成一个面&quot;，拼出的分片平面曲面 <span class=glossary-ref>（第 1 章：几何处理的数学基础）<\/span><\/li><li data-term='顶点表 / 面片表'>顶点表 / 面片表 — 顶点表是一串坐标，面片表是一串顶点编号的组合 <span class=glossary-ref>（第 1 章：几何处理的数学基础）<\/span><\/li><li data-term='流形网格'>流形网格 — 每个顶点的邻域都像一小块平盘，没有自交、没有多余薄片的网格 <span class=glossary-ref>（第 1 章：几何处理的数学基础）<\/span><\/li><li data-term='亏格（genus）'>亏格（genus） — 曲面上&quot;洞&quot;的个数，甜甜圈是 1，球是 0 <span class=glossary-ref>（第 1 章：几何处理的数学基础）<\/span><\/li><li data-term='隐式曲面'>隐式曲面 — 用&quot;函数值等于零&quot;的点集来描述的曲面，没有顶点和面片 <span class=glossary-ref>（第 1 章：几何处理的数学基础）<\/span><\/li><li data-term='符号距离场（sdf）'>符号距离场（SDF） — 空间每一点记录&quot;到曲面多远&quot;和&quot;在里还是在外&quot; <span class=glossary-ref>（第 1 章：几何处理的数学基础）<\/span><\/li><li data-term='等值面'>等值面 — 函数取值相同的点连成的面，SDF 的零等值面就是曲面本身 <span class=glossary-ref>（第 1 章：几何处理的数学基础）<\/span><\/li><li data-term='参数曲面'>参数曲面 — 用两个参数 (u,v) 把一张平面片&quot;贴&quot;到空间曲面上 <span class=glossary-ref>（第 1 章：几何处理的数学基础）<\/span><\/li><li data-term='三次样条'>三次样条 — 分段的三次多项式，接缝处一阶、二阶导数都连续 <span class=glossary-ref>（第 1 章：几何处理的数学基础）<\/span><\/li><li data-term='自然边界条件'>自然边界条件 — 样条首末两端二阶导数取零的约定 <span class=glossary-ref>（第 1 章：几何处理的数学基础）<\/span><\/li><li data-term='埃尔米特样条'>埃尔米特样条 — 除了点，还给每点的切方向，因此能局部修改 <span class=glossary-ref>（第 1 章：几何处理的数学基础）<\/span><\/li><li data-term='bézier 曲线'>Bézier 曲线 — 把控制点按 Bernstein 权重做加权平均得到的曲线 <span class=glossary-ref>（第 1 章：几何处理的数学基础）<\/span><\/li><li data-term='de casteljau 算法'>de Casteljau 算法 — 反复取两点中点来画 Bézier 曲线的数值方法 <span class=glossary-ref>（第 1 章：几何处理的数学基础）<\/span><\/li><li data-term='b-样条'>B-样条 — Bézier 的局部版：改一个控制点只影响附近几段 <span class=glossary-ref>（第 1 章：几何处理的数学基础）<\/span><\/li><li data-term='有理样条（nurbs）'>有理样条（NURBS） — 给控制点加权重再平均，能精确画出圆和圆锥 <span class=glossary-ref>（第 1 章：几何处理的数学基础）<\/span><\/li><li data-term='第一基本形式'>第一基本形式 — 曲面上的&quot;尺子&quot;，用来量切向长度和夹角 <span class=glossary-ref>（第 1 章：几何处理的数学基础）<\/span><\/li><li data-term='第二基本形式'>第二基本形式 — 曲面上的&quot;弯曲计&quot;，用来量沿法向弯了多少 <span class=glossary-ref>（第 1 章：几何处理的数学基础）<\/span><\/li><li data-term='主曲率'>主曲率 — 一点上沿两个互相垂直方向的最大、最小弯曲程度 <span class=glossary-ref>（第 1 章：几何处理的数学基础）<\/span><\/li><li data-term='高斯曲率'>高斯曲率 — 两个主曲率的乘积，反映&quot;像球还是像马鞍&quot; <span class=glossary-ref>（第 1 章：几何处理的数学基础）<\/span><\/li><li data-term='平均曲率'>平均曲率 — 两个主曲率的一半之和，反映&quot;整体鼓还是塌&quot; <span class=glossary-ref>（第 1 章：几何处理的数学基础）<\/span><\/li><li data-term='脐点'>脐点 — 两个主曲率相等的点，局部像球面 <span class=glossary-ref>（第 1 章：几何处理的数学基础）<\/span><\/li><li data-term='离散 laplace 算子'>离散 Laplace 算子 — 把&quot;本点与邻居的加权平均之差&quot;写成矩阵，逐顶点计算 <span class=glossary-ref>（第 1 章：几何处理的数学基础）<\/span><\/li><li data-term='余切权重'>余切权重 — 用边所对角的余切给这条边加权，是离散 Laplace 的标准权重 <span class=glossary-ref>（第 1 章：几何处理的数学基础）<\/span><\/li><li data-term='角度亏欠'>角度亏欠 — 顶点一圈三角形的内角和与 2π 的差，即离散高斯曲率 <span class=glossary-ref>（第 1 章：几何处理的数学基础）<\/span><\/li><li data-term='离散高斯-博内定理'>离散高斯-博内定理 — 全网格角度亏欠求和 = 2π × 欧拉示性数 <span class=glossary-ref>（第 1 章：几何处理的数学基础）<\/span><\/li><li data-term='hausdorff 距离'>Hausdorff 距离 — 两个点集各自的&quot;最不像&quot;程度取大者，用来衡量两条曲面差多少 <span class=glossary-ref>（第 1 章：几何处理的数学基础）<\/span><\/li><li data-term='voronoi 图'>Voronoi 图 — 每个点分到一块&quot;离它最近&quot;的地盘 <span class=glossary-ref>（第 1 章：几何处理的数学基础）<\/span><\/li><li data-term='delaunay 三角剖分'>Delaunay 三角剖分 — Voronoi 图的对偶：地盘相邻的点连成三角形 <span class=glossary-ref>（第 1 章：几何处理的数学基础）<\/span><\/li><li data-term='网格求交裁剪'>网格求交裁剪 — 让两个网格的三角形两两求交、切开、重新连边 <span class=glossary-ref>（第 1 章：几何处理的数学基础）<\/span><\/li><li data-term='无约束优化'>无约束优化 — 只让目标函数变小，不加任何限制 <span class=glossary-ref>（第 1 章：几何处理的数学基础）<\/span><\/li><li data-term='牛顿法'>牛顿法 — 用二阶导数（Hessian）直接跳到二次近似的最小点 <span class=glossary-ref>（第 1 章：几何处理的数学基础）<\/span><\/li><li data-term='带约束优化'>带约束优化 — 在等式/不等式限制下找最优 <span class=glossary-ref>（第 1 章：几何处理的数学基础）<\/span><\/li><li data-term='kkt 条件'>KKT 条件 — 带约束问题最优解的&quot;必要条件&quot;，含互补松弛 <span class=glossary-ref>（第 1 章：几何处理的数学基础）<\/span><\/li><li data-term='点云配准'>点云配准 — 求一个变换把两片点云对齐 <span class=glossary-ref>（第 2 章：点云曲面重建和光顺）<\/span><\/li><li data-term='icp'>ICP — 交替做&quot;找最近点对&quot;和&quot;解最优变换&quot;直到不再改善 <span class=glossary-ref>（第 2 章：点云曲面重建和光顺）<\/span><\/li><li data-term='刚性变换'>刚性变换 — 只有旋转和平移，形状不变 <span class=glossary-ref>（第 2 章：点云曲面重建和光顺）<\/span><\/li><li data-term='非刚性配准'>非刚性配准 — 允许目标发生形变的配准 <span class=glossary-ref>（第 2 章：点云曲面重建和光顺）<\/span><\/li><li data-term='crust 算法'>Crust 算法 — 借 Voronoi 顶点扩张采样集，再从 Delaunay 里挑出曲面三角形 <span class=glossary-ref>（第 2 章：点云曲面重建和光顺）<\/span><\/li><li data-term='极点（pole）'>极点（pole） — 某采样点所在 Voronoi 单元里，离它最远、位于曲面两侧的两个顶点 <span class=glossary-ref>（第 2 章：点云曲面重建和光顺）<\/span><\/li><li data-term='power crust'>Power Crust — 用带权 Voronoi 处理采样不均匀的 Crust 变体 <span class=glossary-ref>（第 2 章：点云曲面重建和光顺）<\/span><\/li><li data-term='cocone 算法'>Cocone 算法 — 用锥形条件筛三角形，保证输出是流形 <span class=glossary-ref>（第 2 章：点云曲面重建和光顺）<\/span><\/li><li data-term='径向基函数（rbf）'>径向基函数（RBF） — 以每个采样点为中心放一个&quot;钟形&quot;函数，叠加起来拟合曲面 <span class=glossary-ref>（第 2 章：点云曲面重建和光顺）<\/span><\/li><li data-term='poisson 曲面重建'>Poisson 曲面重建 — 解 Poisson 方程，让指示函数的梯度等于采样法向场 <span class=glossary-ref>（第 2 章：点云曲面重建和光顺）<\/span><\/li><li data-term='marching cubes'>Marching Cubes — 在体素格上按符号变化挖出三角形，得到等值面 <span class=glossary-ref>（第 2 章：点云曲面重建和光顺）<\/span><\/li><li data-term='曲面光顺'>曲面光顺 — 抹掉高频噪声、保留大形状的操作 <span class=glossary-ref>（第 2 章：点云曲面重建和光顺）<\/span><\/li><li data-term='双边滤波'>双边滤波 — 只有距离近、法向也接近的邻居才参与平均 <span class=glossary-ref>（第 2 章：点云曲面重建和光顺）<\/span><\/li><li data-term='参数化'>参数化 — 给曲面上每个点一个平面坐标 (u,v) <span class=glossary-ref>（第 3 章：网格曲面的参数化和多分辨率表示）<\/span><\/li><li data-term='调和映射'>调和映射 — 让参数化坐标满足拉普拉斯方程（离散下即坐标是邻居的加权平均） <span class=glossary-ref>（第 3 章：网格曲面的参数化和多分辨率表示）<\/span><\/li><li data-term='共形 / 保角'>共形 / 保角 — 只保角度不保面积；反过来叫保面积 <span class=glossary-ref>（第 3 章：网格曲面的参数化和多分辨率表示）<\/span><\/li><li data-term='翻转（flip）'>翻转（flip） — 摊平后三角形绕向反转或重叠 <span class=glossary-ref>（第 3 章：网格曲面的参数化和多分辨率表示）<\/span><\/li><li data-term='多片参数化'>多片参数化 — 先把曲面切成几块，各自摊平再拼回来 <span class=glossary-ref>（第 3 章：网格曲面的参数化和多分辨率表示）<\/span><\/li><li data-term='渐进参数化'>渐进参数化 — 先摊平粗网格，再插入新点局部修正 <span class=glossary-ref>（第 3 章：网格曲面的参数化和多分辨率表示）<\/span><\/li><li data-term='二次误差度量（qem）'>二次误差度量（QEM） — 删点时用&quot;到原来若干平面的距离平方和&quot;评估损失 <span class=glossary-ref>（第 3 章：网格曲面的参数化和多分辨率表示）<\/span><\/li><li data-term='渐进网格（pm）'>渐进网格（PM） — 把简化过程存成一串可逆的边坍缩记录 <span class=glossary-ref>（第 3 章：网格曲面的参数化和多分辨率表示）<\/span><\/li><li data-term='三角带'>三角带 — 用&quot;加一个顶点成一个三角形&quot;的方式连续输出三角形 <span class=glossary-ref>（第 3 章：网格曲面的参数化和多分辨率表示）<\/span><\/li><li data-term='edgebreaker'>Edgebreaker — 用 C/L/E/R/S 五种符号沿边遍历编码整个网格 <span class=glossary-ref>（第 3 章：网格曲面的参数化和多分辨率表示）<\/span><\/li><li data-term='重网格化'>重网格化 — 保持形状、换一套更规整的采样（顶点数可变多也可变少） <span class=glossary-ref>（第 4 章：网格模型的重网格化）<\/span><\/li><li data-term='方向场 / 交叉场'>方向场 / 交叉场 — 每点给 4 个互相垂直的切向，规定四边形怎么铺 <span class=glossary-ref>（第 4 章：网格模型的重网格化）<\/span><\/li><li data-term='周期跳跃'>周期跳跃 — 方向场转过 90° 时向量分量变号，跨块计算要先翻符号 <span class=glossary-ref>（第 4 章：网格模型的重网格化）<\/span><\/li><li data-term='奇异点'>奇异点 — 方向场绕一圈回不到原值的位置，对应 3 价或 5 价顶点 <span class=glossary-ref>（第 4 章：网格模型的重网格化）<\/span><\/li><li data-term='morse-smale 复形'>Morse-Smale 复形 — 用标量场的梯度流把曲面切成四边形块 <span class=glossary-ref>（第 4 章：网格模型的重网格化）<\/span><\/li><li data-term='标架场'>标架场 — 每点给 3 个互相垂直方向，六面体网格的铺设依据 <span class=glossary-ref>（第 4 章：网格模型的重网格化）<\/span><\/li><li data-term='多立方体（polycube）'>多立方体（polycube） — 用轴对齐立方体拼出的近似模型，可当六面体网格的骨架 <span class=glossary-ref>（第 4 章：网格模型的重网格化）<\/span><\/li><li data-term='形状描述子'>形状描述子 — 把形状压成一个向量，使&quot;像不像&quot;变成可算的距离 <span class=glossary-ref>（第 5 章：三维形状分析）<\/span><\/li><li data-term='d2 形状分布'>D2 形状分布 — 随机采样两点、统计距离分布作为描述子 <span class=glossary-ref>（第 5 章：三维形状分析）<\/span><\/li><li data-term='球谐函数描述子'>球谐函数描述子 — 把形状展开到球面频率基上，取系数当特征 <span class=glossary-ref>（第 5 章：三维形状分析）<\/span><\/li><li data-term='热核签名（hks）'>热核签名（HKS） — 曲面上某点残留热量的时间曲线，等距不变 <span class=glossary-ref>（第 5 章：三维形状分析）<\/span><\/li><li data-term='波核签名（wks）'>波核签名（WKS） — 用拉普拉斯特征值加权的振动版签名 <span class=glossary-ref>（第 5 章：三维形状分析）<\/span><\/li><li data-term='网格分割'>网格分割 — 按几何或语义把网格切成若干互不重叠的块 <span class=glossary-ref>（第 5 章：三维形状分析）<\/span><\/li><li data-term='归一化割'>归一化割 — 切口小、且每块不能太小的分割目标 <span class=glossary-ref>（第 5 章：三维形状分析）<\/span><\/li><li data-term='协同分割'>协同分割 — 一组相关模型一起切，对应部位切法一致 <span class=glossary-ref>（第 5 章：三维形状分析）<\/span><\/li><li data-term='形状检索'>形状检索 — 按描述子距离从库里找最相似的模型 <span class=glossary-ref>（第 5 章：三维形状分析）<\/span><\/li><li data-term='蒙皮'>蒙皮 — 用骨架带动表面，顶点按权重混合若干骨头的变换 <span class=glossary-ref>（第 6 章：网格曲面的形变）<\/span><\/li><li data-term='线性混合蒙皮（lbs）'>线性混合蒙皮（LBS） — 顶点位置 = 各骨变换后的位置按权重相加 <span class=glossary-ref>（第 6 章：网格曲面的形变）<\/span><\/li><li data-term='自由形变（ffd）'>自由形变（FFD） — 把模型装进控制网格，动格子就带动模型 <span class=glossary-ref>（第 6 章：网格曲面的形变）<\/span><\/li><li data-term='梯度域形变'>梯度域形变 — 保留每个点的微分坐标，再一次性重建全局位置 <span class=glossary-ref>（第 6 章：网格曲面的形变）<\/span><\/li><li data-term='拉普拉斯坐标'>拉普拉斯坐标 — 顶点位置减去邻居平均，刻画&quot;局部凸起多少&quot; <span class=glossary-ref>（第 6 章：网格曲面的形变）<\/span><\/li><li data-term='变形图（cage / 体图）'>变形图（cage / 体图） — 包住模型的低模控制网格，用来传递形变 <span class=glossary-ref>（第 6 章：网格曲面的形变）<\/span><\/li><li data-term='arap'>ARAP — 让每个三角形尽量只旋转不拉伸的形状保持能量 <span class=glossary-ref>（第 6 章：网格曲面的形变）<\/span><\/li><li data-term='局部-全局迭代'>局部-全局迭代 — 先固定旋转求位置、再固定位置求旋转，交替下降 <span class=glossary-ref>（第 6 章：网格曲面的形变）<\/span><\/li><li data-term='子空间形变'>子空间形变 — 只在少数基向量张成的空间里求未知量，以速度换精度 <span class=glossary-ref>（第 6 章：网格曲面的形变）<\/span><\/li><li data-term='弹性运动模拟'>弹性运动模拟 — 按力与加速度的物理方程推进形状随时间变化 <span class=glossary-ref>（第 7 章：弹性运动模拟）<\/span><\/li><li data-term='隐式积分'>隐式积分 — 用后一时刻的力反推位移，大时间步也稳定 <span class=glossary-ref>（第 7 章：弹性运动模拟）<\/span><\/li><li data-term='子空间降维'>子空间降维 — 只用最低频的少量振动模态表示运动 <span class=glossary-ref>（第 7 章：弹性运动模拟）<\/span><\/li><li data-term='pbd / 投影动力学'>PBD / 投影动力学 — 先预测位置，再把约束&quot;投影&quot;回满足约束的集合 <span class=glossary-ref>（第 7 章：弹性运动模拟）<\/span><\/li><li data-term='碰撞检测'>碰撞检测 — 判断哪些三角形对相交 <span class=glossary-ref>（第 7 章：弹性运动模拟）<\/span><\/li><li data-term='层次包围盒（bvh）'>层次包围盒（BVH） — 用一层层盒子把不可能相交的三角形成批排除 <span class=glossary-ref>（第 7 章：弹性运动模拟）<\/span><\/li><li data-term='旋转-应变分解'>旋转-应变分解 — 把形变拆成旋转部分和拉伸部分，分别控制 <span class=glossary-ref>（第 7 章：弹性运动模拟）<\/span><\/li><li data-term='稀疏编码'>稀疏编码 — 用字典里少数几个&quot;原子&quot;的加权和表示信号 <span class=glossary-ref>（第 8 章：基于机器学习的几何处理）<\/span><\/li><li data-term='字典学习'>字典学习 — 连&quot;原子&quot;本身也从数据里学出来 <span class=glossary-ref>（第 8 章：基于机器学习的几何处理）<\/span><\/li><li data-term='l1 正则'>L1 正则 — 加一项&quot;系数绝对值之和&quot;的惩罚，逼出稀疏解 <span class=glossary-ref>（第 8 章：基于机器学习的几何处理）<\/span><\/li><li data-term='低秩优化'>低秩优化 — 要求矩阵秩尽量小，等价于要求信息高度重复 <span class=glossary-ref>（第 8 章：基于机器学习的几何处理）<\/span><\/li><li data-term='压缩感知'>压缩感知 — 信号本身稀疏时，少量测量即可恢复 <span class=glossary-ref>（第 8 章：基于机器学习的几何处理）<\/span><\/li><li data-term='pointnet'>PointNet — 逐点提特征、再池化成全局向量的点云网络 <span class=glossary-ref>（第 8 章：基于机器学习的几何处理）<\/span><\/li><li data-term='流形卷积'>流形卷积 — 在曲面上按测地距离聚合邻居，而不是按平面网格 <span class=glossary-ref>（第 8 章：基于机器学习的几何处理）<\/span><\/li><li data-term='生成模型（vae/gan）'>生成模型（VAE/GAN） — 学数据分布，并能采样出新的形状 <span class=glossary-ref>（第 8 章：基于机器学习的几何处理）<\/span><\/li><li data-term='重定向行走'>重定向行走 — 用视觉增益、转向、传送让人在有限空间里以为走了很远 <span class=glossary-ref>（第 9 章：新型几何处理应用）<\/span><\/li><li data-term='场景映射'>场景映射 — 把虚拟大场景&quot;折叠&quot;进真实小场地 <span class=glossary-ref>（第 9 章：新型几何处理应用）<\/span><\/li><li data-term='可打印性'>可打印性 — 能支撑、能闭合、强度够、装得进打印空间 <span class=glossary-ref>（第 9 章：新型几何处理应用）<\/span><\/li><li data-term='切片与路径规划'>切片与路径规划 — 把模型切成一层层轮廓并规划打印头轨迹 <span class=glossary-ref>（第 9 章：新型几何处理应用）<\/span><\/li><\/ul>", "__patterns__": "<h1>模式与框架库<\/h1>\n<p>这本书真正可迁移的不是具体算法，而是作者反复使用的几个分析框架，以及他明确反对的做法。下面把框架和规则抽出来，用的时候可以直接套。<\/p>\n<h2>框架一：三种表示的选择题<\/h2>\n<p>任何几何问题先问&quot;我用哪种表示&quot;：<\/p>\n<table><thead><tr><th>表示<\/th><th>擅长的<\/th><th>不擅长的<\/th><\/tr><\/thead><tbody><tr><td>多边形网格<\/td><td>渲染、编辑、拓扑明确<\/td><td>布尔运算、拓扑变化、光滑度<\/td><\/tr><tr><td>隐式（SDF/指示函数）<\/td><td>布尔运算、重建、拓扑自适应<\/td><td>精确渲染、尖锐特征<\/td><\/tr><tr><td>参数（样条/NURBS）<\/td><td>光滑曲面、工业 CAD<\/td><td>任意拓扑、局部细节<\/td><\/tr><\/tbody><\/table>\n<p><strong>怎么用<\/strong>：先问&quot;这个任务需要拓扑变化吗&quot;（需要 → 隐式）、&quot;需要精确工业曲线吗&quot;（需要 → 参数）、&quot;只要渲染和编辑吗&quot;（是 → 网格）。三者可以互相转换（Marching Cubes、参数化、拟合），所以真正的决策是&quot;转换成本 vs 收益&quot;。<\/p>\n<h2>框架二：局部微分 + 全局求解<\/h2>\n<p>这是全书出现频率最高的结构。所有变体都是同一条：<\/p>\n<ol><li>\n定义一个<strong>局部量<\/strong>（拉普拉斯坐标、边长、法向、相似变换）；\n<\/li><li>\n写一个&quot;让新形状的局部量保持原局部量&quot;的能量；\n<\/li><li>\n求解 → 得到全局坐标。\n<\/ol>\n<table><thead><tr><th>出现位置<\/th><th>局部量<\/th><th>全局求解<\/th><\/tr><\/thead><tbody><tr><td>Poisson 重建<\/td><td>法向场<\/td><td>Δf = ∇·V<\/td><\/tr><tr><td>参数化<\/td><td>三角形形状<\/td><td>稀疏最小二乘<\/td><\/tr><tr><td>梯度域形变<\/td><td>拉普拉斯坐标<\/td><td>L v&#x27; = b<\/td><\/tr><tr><td>ARAP<\/td><td>边长<\/td><td>稀疏系统 + 旋转交替<\/td><\/tr><tr><td>投影动力学<\/td><td>约束投影<\/td><td>常量矩阵系统<\/td><\/tr><\/tbody><\/table>\n<p><strong>怎么用<\/strong>：遇到&quot;要改整体但保细节&quot;的需求，先问&quot;细节能被什么局部量表示&quot;，再问&quot;这些局部量是否可积&quot;。不可积的部分必须投影掉（Helmholtz 分解），否则系统无解。<\/p>\n<h2>框架三：交替优化（局部-全局迭代）<\/h2>\n<p>固定 A 求 B，固定 B 求 A，循环到收敛。<\/p>\n<ul><li>\nASAP：旋转 ↔ 坐标；\n<\/li><li>\nARAP：每三角形旋转 ↔ 顶点位置；\n<\/li><li>\nICP：对应 ↔ 变换；\n<\/li><li>\n方向场：整数 ↔ 连续场（逐步取整）。\n<\/ul>\n<p><strong>怎么用<\/strong>：只要能量能拆成&quot;每对变量各自的最优子问题&quot;，就可以交替。注意三个前提：每个子问题可解（闭式或凸）、整体能量单调下降、初值不离正确解太远。三者缺一，就会卡在坏的局部极小。<\/p>\n<h2>框架四：约束怎么进目标函数<\/h2>\n<p>三种写法，代价完全不同：<\/p>\n<table><thead><tr><th>写法<\/th><th>例子<\/th><th>优点<\/th><th>缺点<\/th><\/tr><\/thead><tbody><tr><td>硬约束（拉格朗日/KKT）<\/td><td>固定控制点、锚点<\/td><td>精确满足<\/td><td>组合爆炸、可能不可行<\/td><\/tr><tr><td>软约束（惩罚项 λ）<\/td><td>筛选 Poisson、权重正则<\/td><td>一定可解<\/td><td>λ 难调，太大病态、太小不满足<\/td><\/tr><tr><td>归一化（比值目标）<\/td><td>Ncut、MIPS<\/td><td>无需调参、自动平衡<\/td><td>目标非凸<\/td><\/tr><\/tbody><\/table>\n<p><strong>怎么用<\/strong>：能写成归一化的，优先归一化（Ncut 就是范例）；必须精确满足又规模小的，用硬约束；规模大或可能不可行，用软约束并给出 λ 的敏感度分析。<\/p>\n<h2>框架五：从连续到离散的三次检查<\/h2>\n<p>离散化不是&quot;把公式里的积分换成求和&quot;。每次都要检查三件事：<\/p>\n<ol><li>\n<strong>收敛性<\/strong>：细分后是否趋于连续解？（均匀 Laplace 权重不满足，余切权重满足）\n<\/li><li>\n<strong>不变量<\/strong>：连续定理在离散下是否仍成立？（Gauss-Bonnet 对任意剖分成 2πχ）\n<\/li><li>\n<strong>退化情形<\/strong>：钝角、退化三角形、非流形边怎么处理？（钝角使余切为负）\n<\/ol>\n<p><strong>怎么用<\/strong>：写完一个离散算子，先找它的连续原型定理，再验证&quot;剖分加密时误差是否下降&quot;。通不过第 1 条，算子就是错的。<\/p>\n<h2>决策规则<\/h2>\n<p><strong>R1 重建方法：干净数据用显式，脏数据用隐式。<\/strong> 采样密、噪声低、要拓扑保证 → Crust/Cocone；有噪声、有缺失、要水密 → 筛选 Poisson。理由：显式方法依赖精确的 Delaunay 结构，噪声会改变结构本身。<\/p>\n<p><strong>R2 参数化：先保证不翻，再减少扭曲。<\/strong> Tutte（正权重 + 凸边界）给可行初值；再用 ASAP/MIPS 优化；如果优化中翻转，减小步长或加障碍项。顺序不能反。<\/p>\n<p><strong>R3 简化：误差预算驱动，而不是面数驱动。<\/strong> 先定&quot;允许的 Hausdorff 误差&quot;，再让 QEM 跑到预算边界；QEM 的二次型天然就是误差上界估计。<\/p>\n<p><strong>R4 形变：小变形用线性，大变形用非线性。<\/strong> 线性（梯度域）快但关节会塌；非线性（ARAP + 体积约束）慢但不塌。判断标准：旋转角是否超过约 45°、是否有明显弯曲。<\/p>\n<p><strong>R5 模拟：先定时间预算，再选积分器。<\/strong> 需要毫秒级 → PBD 或投影动力学；需要物理准确 → 隐式 + 有限元；需要多次材质迭代 → 子空间 + Cubature。<\/p>\n<p><strong>R6 学习：先问&quot;数据够不够&quot;，再问&quot;要不要保证&quot;。<\/strong> 数据少 → 手工特征 + 浅层模型；数据多但要保证不自交/不翻转 → 学习 + 后处理投影；数据多且只要&quot;像&quot; → 端到端生成。<\/p>\n<h2>反模式（作者明确反对或反复警告的）<\/h2>\n<p><strong>A1 &quot;把网格加密就能提精度&quot;。<\/strong> 错在：加密后刚度、权重、时间步都要重标定，不重标定等于换了一个物理系统。正确做法：按边长重标定弹簧刚度，或改用连续介质参数。<\/p>\n<p><strong>A2 &quot;一次性取整整数变量&quot;。<\/strong> 错在：远离整数的分量被硬拉过去，奇异点爆炸、场极不光顺。正确做法：先解连续松弛，再逐步固定最接近整数的部分，迭代优化剩余。<\/p>\n<p><strong>A3 &quot;直接对向量场积分&quot;。<\/strong> 错在：一般向量场不可积（含旋转分量），积分结果依赖路径。正确做法：先取散度再解 Poisson（Helmholtz-Hodge）。<\/p>\n<p><strong>A4 &quot;先光顺再重建&quot;。<\/strong> 错在：光顺需要法向/邻域，而点云没有可靠邻域；顺序反了会把结构一起抹平。正确做法：先重建（或先做 MLS 投影 + 法向估计），再对网格光顺。<\/p>\n<p><strong>A5 &quot;把三角形特征重排成矩阵就当图像处理&quot;。<\/strong> 错在：排列与拓扑邻接无关，换顺序结果就变，违背&quot;几何处理应尊重曲面结构&quot;的初衷。正确做法：用测地邻域/切平面分箱（流形卷积），或至少按参数化展开。<\/p>\n<p><strong>A6 &quot;用学习模型替代所有几何算子&quot;。<\/strong> 错在：网络不保证体积守恒、不自交、力平衡。正确做法：网络负责&quot;先验/残差/加速&quot;，硬约束交给投影与优化。<\/p>", "__cheatsheet__": "<h1>速查表<\/h1>\n<p>公式、流程、参数判据三类。用 Unicode 符号表示，方便在纯文本环境里读。<\/p>\n<h2>一、公式与规则<\/h2>\n<table><thead><tr><th>场景<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>离散 Laplace<\/td><td>Δx_i = (1/(2A_i)) Σ_j (cot α_ij + cot β_ij)(x_j − x_i)<\/td><\/tr><tr><td>均匀权重（对照）<\/td><td>Δx_i = (1/deg i) Σ_j (x_j − x_i)，不收敛<\/td><\/tr><tr><td>离散高斯曲率<\/td><td>K_i = 2π − Σθ_i<\/td><\/tr><tr><td>Gauss-Bonnet（离散）<\/td><td>Σ_i K_i = 2π(V − E + F) = 2πχ<\/td><\/tr><tr><td>平均曲率法向<\/td><td>H n ≈ Δx / 2（绝对值，符号依赖定向）<\/td><\/tr><tr><td>主曲率估计<\/td><td>拟合二次型 H = (1/2)(k1+k2)、K = k1·k2；k = H ± √(H² − K)<\/td><\/tr><tr><td>第一基本形式<\/td><td>E = x_u·x_u、F = x_u·x_v、G = x_v·x_v<\/td><\/tr><tr><td>第二基本形式<\/td><td>L = n·x_uu、M = n·x_uv、N = n·x_vv<\/td><\/tr><tr><td>Hermite 基<\/td><td>h00 = 2u³−3u²+1、h01 = −2u³+3u²、h10 = u³−2u²+u、h11 = u³−u²<\/td><\/tr><tr><td>Bernstein<\/td><td>B_{k,m}(u) = C(m,k) u^k (1−u)^{m−k}<\/td><\/tr><tr><td>NURBS<\/td><td>p(u) = Σ w_k p_k B_k / Σ w_k B_k<\/td><\/tr><tr><td>刚性配准<\/td><td>min Σ<\/td><td>R x_i + t − y_i<\/td><td>²；R = V Uᵀ，t = ȳ − R x̄<\/td><\/tr><tr><td>点到面距离<\/td><td>(p − q)·n_q（用目标点法向，ICP 变体）<\/td><\/tr><tr><td>热核签名<\/td><td>HKS(x,t) = Σ exp(−λ_i t) φ_i(x)²<\/td><\/tr><tr><td>波核签名<\/td><td>WKS(x,λ) = Σ g(λ,λ_i) φ_i(x)²，g 为 log 域 Gaussian<\/td><\/tr><tr><td>球面特征值<\/td><td>λ_l = l(l+1)，重数 2l+1<\/td><\/tr><tr><td>Ncut<\/td><td>cut(A,B)/assoc(A,V) + cut(B,A)/assoc(B,V)<\/td><\/tr><tr><td>谱分割方程<\/td><td>(D − W)x = λDx，取第二小特征向量<\/td><\/tr><tr><td>LBS<\/td><td>v&#x27; = Σ_j w_ij (R_j v + t_j)，Σw = 1<\/td><\/tr><tr><td>DQS<\/td><td>对偶四元数归一化线性插值后作用到顶点<\/td><\/tr><tr><td>梯度域<\/td><td>(LᵀL + λI_C)v&#x27; = Lᵀ(Tδ) + λp<\/td><\/tr><tr><td>Helmholtz-Hodge<\/td><td>u = ∇ψ + ∇×ω + h；可积部分只有 ∇ψ<\/td><\/tr><tr><td>ARAP 能量<\/td><td>Σ_t Σ_{ij} (w/2)<\/td><td>(v&#x27;_i−v&#x27;_j) − R_t(v_i−v_j)<\/td><td>²<\/td><\/tr><tr><td>Procrustes<\/td><td>R = V Uᵀ（SVD: E Sᵀ = U Σ Vᵀ）<\/td><\/tr><tr><td>运动方程<\/td><td>Mẍ + Dẋ + f_int = f_ext，D = α_m M + α_k K<\/td><\/tr><tr><td>显式稳定条件<\/td><td>h ≤ 2/ω_max，ω_max = √(k_max/m_min) 上界<\/td><\/tr><tr><td>投影动力学<\/td><td>(M/h² + Σ w_i S_iᵀ S_i)x = b，左边恒定<\/td><\/tr><tr><td>PBD 速度更新<\/td><td>v = (x_new − x_old)/h<\/td><\/tr><tr><td>L1 软阈值（1D）<\/td><td>x = max(<\/td><td>y<\/td><td>− λ/2, 0)·sign(y)<\/td><\/tr><tr><td>核范数<\/td><td>Σ σ_i（奇异值之和），秩的凸松弛<\/td><\/tr><tr><td>QEM 二次型<\/td><td>Q(x) = xᵀAx + 2bᵀx + c；最优 x̄ 解 (A_i+A_j)x̄ = −(b_i+b_j)<\/td><\/tr><tr><td>四边形奇异点指数<\/td><td>index = (4 − n)/4；Σindex = χ<\/td><\/tr><tr><td>方向场三角表示<\/td><td>ξ = (cos 4θ, sin 4θ)，旋转 90° 不变<\/td><\/tr><tr><td>六面体对称<\/td><td>24 种；球面调和 l=0 + l=4 编码为 9 维<\/td><\/tr><tr><td>重定向：增益<\/td><td>平移约 0.6—1.6 可容忍，旋转区间更窄<\/td><\/tr><tr><td>悬垂角判据<\/td><td>相对水平面倾角 &lt; 约 45° 时需要支撑<\/td><\/tr><\/tbody><\/table>\n<h2>二、常用流程<\/h2>\n<p><strong>A. 点云到网格（扫描数据）<\/strong><\/p>\n<pre><code>1. 多视角配准：特征粗配准（FPFH + RANSAC）→ ICP 精修\n2. 法向估计 + 去噪：MLS 投影 或 法向双边滤波\n3. 隐式重建：八叉树 + 筛选 Poisson（λ 由 0.1 起调）\n4. 抽等值面：Marching Cubes\n5. 网格后处理：保特征光顺（Taubin）、简化（QEM）<\/code><\/pre>\n<p><strong>B. 网格到纹理坐标（参数化）<\/strong><\/p>\n<pre><code>1. 切缝：沿曲率脊线，总长度尽量短\n2. Tutte 初值：边界→凸多边形，正权重\n3. 优化扭曲：ASAP 或 MIPS（带防翻转）\n4. 检查：最大角度扭曲、最大面积扭曲、有无翻转\n5. 打包：多片排布到 [0,1]²（bin packing）<\/code><\/pre>\n<p><strong>C. 网格到四边形<\/strong><\/p>\n<pre><code>1. 估交叉场：切向空间 + (cos4θ, sin4θ) 光顺，约束特征对齐\n2. 求整数跳跃（逐步取整），检查奇异点指数总和 = χ\n3. 全局参数化：整数格点约束\n4. 抽网格：按格点连线，修退化单元\n5. 优化：局部拓扑操作（翻转边、合并）<\/code><\/pre>\n<p><strong>D. 形变<\/strong><\/p>\n<pre><code>1. 选能量：小变形 → 梯度域；大变形 → ARAP + 体积\n2. 定约束：控制点/骨架/碰撞\n3. 交替求解至收敛（残差 &lt; 1e-4）\n4. 检查：有无自交、体积变化率、局部翻转<\/code><\/pre>\n<p><strong>E. 模拟<\/strong><\/p>\n<pre><code>1. 建模：弹簧 / 有限元（材料参数与网格无关）\n2. 积分：显式（h 由 ω_max 定）或隐式（预分解）\n3. 加速：子空间（K = 20—60 模态）/ 投影动力学 / Cubature\n4. 碰撞：BVH 检测 → 约束处理（位置修正或 KKT）\n5. 输出：每帧位置 + 速度（可再驱动材质反演）<\/code><\/pre>\n<h2>三、参数判据与经验值<\/h2>\n<table><thead><tr><th>参数<\/th><th>经验值<\/th><th>说明<\/th><\/tr><\/thead><tbody><tr><td>保特征光顺 λ<\/td><td>0.3—0.7<\/td><td>越大越保形，太小不光滑<\/td><\/tr><tr><td>双边滤波 σ_r<\/td><td>约 0.5—1 倍平均边长<\/td><td>决定&quot;跨棱是否被抹平&quot;<\/td><\/tr><tr><td>ICP 收敛阈值<\/td><td>相对误差变化 &lt; 1e-3<\/td><td>太严会空转<\/td><\/tr><tr><td>筛选 Poisson λ<\/td><td>0.1—1<\/td><td>大则贴合噪声，小则平滑过细节<\/td><\/tr><tr><td>八叉树最细层<\/td><td>约 1/256 到 1/512 包围盒<\/td><td>小于此的细节会被抹掉<\/td><\/tr><tr><td>QEM 目标<\/td><td>按误差预算（如 Hausdorff 1% 边长）<\/td><td>不按面数定<\/td><\/tr><tr><td>ARAP 迭代<\/td><td>5—15 次<\/td><td>通常 10 次内收敛<\/td><\/tr><tr><td>子空间模态 K<\/td><td>20—60<\/td><td>大幅动作需更多<\/td><\/tr><tr><td>PBD 迭代<\/td><td>10—30 次/帧<\/td><td>刚度靠迭代堆<\/td><\/tr><tr><td>显式步长<\/td><td>h ≤ 2/ω_max，实际取 0.5 倍<\/td><td>留安全余量<\/td><\/tr><tr><td>碰撞约束簿<\/td><td>每顶点最多 1 个<\/td><td>让矩阵对角，视觉几乎无损<\/td><\/tr><tr><td>悬垂支撑阈值<\/td><td>45°<\/td><td>低于此需支撑<\/td><\/tr><tr><td>重定向平移增益<\/td><td>0.6—1.6<\/td><td>个体差异大，需实测<\/td><\/tr><tr><td>四边形密度场<\/td><td>g = exp(G)，G 对称<\/td><td>保证正定<\/td><\/tr><\/tbody><\/table>\n<h2>四、常见数值校验<\/h2>\n<ul><li>\n闭合网格上 ΣK_i 应等于 2πχ；不等于说明拓扑有问题。\n<\/li><li>\n正四面体每顶点 K = π，总 4π（对应 χ = 2）。\n<\/li><li>\n等边三角形 cot60° = 0.5774，两侧权重 1.1547；A = 0.4330 → 系数 1.333。\n<\/li><li>\n球面 HKS 在 t=1 约 0.113，t=10 约 0.0796（趋于 1/(4π)）。\n<\/li><li>\n100 顶点走廊切 1 点 Ncut ≈ 1.01，中切 ≈ 0.04。\n<\/li><li>\nLBS 90° 旋转、权重 0.5/0.5 → 距离 0.707r。\n<\/li><li>\n四边形球面奇异点指数总和必须为 2（至少 8 个 3 价）。\n<\/li><li>\n1D L1：y=1、λ=2 → 解 0；λ=0.3 → 解 0.85（L2 为 0.769）。\n<\/li><li>\n梯度域 1D：δ=(1,0,0,−1)，固定 0 与 2 → x2=2/3、x3=4/3。\n<\/ul>"}};
const pages = DATA.rendered;
const manifest = DATA.manifest;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SLUG = manifest.slug || 'book';
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(SLUG+':'+k)||'null') }catch(e){ return null } },
  set(k,v){ try{ localStorage.setItem(SLUG+':'+k, JSON.stringify(v)) }catch(e){} }
};
let state = { visited: store.get('visited')||[], quiz: store.get('quiz')||{}, cards: store.get('cards')||{} };

/* ---------- 导航 ---------- */
function renderNav(){
  const nav = $('#nav'); nav.innerHTML='';
  const build = items => items.forEach(it=>{
    if(it.children){
      const sec=document.createElement('div'); sec.className='nav-sec'; sec.textContent=it.label; nav.appendChild(sec);
      it.children.forEach(c=>{
        const a=document.createElement('a'); a.className='nav-item'; a.href=c.href; a.textContent=c.label;
        const id=routeId(c.href);
        if(state.visited.includes(id)) a.innerHTML = esc(c.label)+' <span class="done">✓</span>';
        nav.appendChild(a);
      });
    }else{
      const a=document.createElement('a'); a.className='nav-item'; a.href=it.href; a.textContent=it.label;
      const id=routeId(it.href);
      if(state.visited.includes(id)) a.innerHTML = esc(it.label)+' <span class="done">✓</span>';
      nav.appendChild(a);
    }
  });
  build(DATA.nav);
  updateProgress();
}
function routeId(href){ return href.replace('#/',''); }

/* ---------- 路由 ---------- */
function routeIdFromHash(){
  let h = location.hash.replace(/^#\//,'');
  if(!h) return 'path';
  if(h==='path') return 'path';
  const m = h.match(/^(chapter|concept)\/(.+)$/);
  if(m) return m[1]+'/'+m[2];
  return h; // quiz/all, quiz/ch01, cards, glossary, patterns, cheatsheet
}
function showPage(rid){
  const id = rid==='path' ? '__path__' : rid.startsWith('quiz/') ? '__quiz_'+rid.split('/')[1]+'__' : rid==='cards'?'__cards__':rid==='glossary'?'__glossary__':rid==='patterns'?'__patterns__':rid==='cheatsheet'?'__cheatsheet__':rid.startsWith('chapter/')?rid.split('/')[1]:rid.startsWith('concept/')?rid.split('/')[1]:rid;
  const html = pages[id] || '<div class="empty">页面不存在</div>';
  $('#view').innerHTML = html;
  document.querySelectorAll('.nav-item').forEach(a=>a.classList.toggle('active', routeId(a.getAttribute('href'))===rid));
  if(!state.visited.includes(rid) && (rid.startsWith('chapter/')||rid.startsWith('concept/'))){
    state.visited.push(rid); store.set('visited', state.visited); renderNav();
  }
  window.scrollTo(0,0);
  if(rid==='cards') initCards();
  if(rid==='glossary') initGlossary();
  if(rid.startsWith('quiz')) initQuizzes(rid);
  if(id==='__path__') updatePath();
  renderMermaid();
}

/* ---------- 进度 ---------- */
function updateProgress(){
  const chs = (manifest.chapters||[]).length;
  const done = (manifest.chapters||[]).filter(c=>state.visited.includes('chapter/'+c.id)).length;
  const pct = chs? Math.round(done/chs*100) : 0;
  $('#progress-fill').style.width = pct+'%';
  $('#progress-label').textContent = `进度 ${pct}% · 已学 ${done}/${chs} 章`;
}
function updatePath(){
  document.querySelectorAll('.path-step').forEach(el=>{
    const step = el.id.replace('path-','');
    const s = (manifest.learningPath||[]).find(x=>x.step===step);
    if(s && (s.chapterIds||[]).every(c=>state.visited.includes('chapter/'+c))){
      el.classList.add('passed');
      const lbl = el.querySelector('.checkpoint-ok'); if(!lbl){ const sp=document.createElement('span'); sp.className='done'; sp.textContent=' ✓ 已完成'; el.appendChild(sp); }
    }
  });
}

/* ---------- 测验 ---------- */
function initQuizzes(rid){
  document.querySelectorAll('.quiz-item').forEach(item=>{
    const btn = item.querySelector('.quiz-check');
    if(!btn || item.dataset.inited){ return }
    item.dataset.inited='1';
    btn.addEventListener('click', ()=>{
      const qid = item.dataset.qid; const type = item.dataset.type;
      const q = (manifest.quizzes||[]).find(x=>x.id===qid); if(!q) return;
      let user, correct=false, fb;
      if(type==='single'){
        const sel = item.querySelector('input:checked');
        user = sel? parseInt(sel.value) : null;
        correct = user===q.answer;
        fb = correct?'✓ 正确':'✗ 错误'+(user==null?'（未作答）':'');
      } else if(type==='multi'){
        user = Array.from(item.querySelectorAll('input:checked')).map(i=>parseInt(i.value)).sort();
        const ans = Array.isArray(q.answer)? q.answer.slice().sort(): [q.answer];
        correct = user.length>0 && JSON.stringify(user)===JSON.stringify(ans);
        fb = correct?'✓ 正确':'✗ 错误';
      } else if(type==='blank'){
        const v = (item.querySelector('.quiz-blank').value||'').trim().toLowerCase();
        const a = String(q.answer).trim().toLowerCase();
        correct = v===a;
        fb = correct?'✓ 正确':'✗ 错误'+(v?'':'（未作答）');
      }
      item.querySelectorAll('input:checked').forEach(i=>{
        const val=parseInt(i.value);
        if(Array.isArray(q.answer)? q.answer.includes(val) : val===q.answer) i.parentElement.style.color='var(--ok)';
        else i.parentElement.style.color='var(--bad)';
      });
      const feed = item.querySelector('.quiz-feedback');
      feed.className = 'quiz-feedback '+(correct?'fb-ok':'fb-bad');
      feed.textContent = fb;
      let ex = item.querySelector('.quiz-explain');
      if(!ex){ ex=document.createElement('div'); ex.className='quiz-explain'; item.appendChild(ex); }
      ex.innerHTML = '解析：' + esc(q.explain||'');
      // 记录成绩（按章聚合）
      const ch = q.chapterId||'__all__';
      if(!state.quiz[ch]) state.quiz[ch]={done:0,total:0};
      state.quiz[ch].done = Math.min(state.quiz[ch].total+1, state.quiz[ch].done+1);
      state.quiz[ch].total += 1;
      store.set('quiz', state.quiz);
    });
  });
}

/* ---------- 抽认卡 ---------- */
let cardIdx = 0, cardList = [];
function initCards(){
  const cards = manifest.flashcards||[];
  cardList = cards.slice();
  cardIdx = 0;
  const sel = $('#card-filter');
  sel.innerHTML = '<option value="">全部</option>';
  [...new Set(cards.map(c=>c.chapterId).filter(Boolean))].forEach(c=>{
    const o=document.createElement('option'); o.value=c; o.textContent=manifestChTitle(c); sel.appendChild(o);
  });
  sel.onchange = ()=>{ const v=sel.value; cardList = v? cards.filter(c=>c.chapterId===v): cards.slice(); cardIdx=0; showCard(); };
  $('#flashcard').onclick = ()=>$('#flashcard').classList.toggle('flip');
  $('#card-known-btn').onclick = ()=>{ markCard(true); };
  $('#card-again-btn').onclick = ()=>{ markCard(false); };
  showCard();
}
function showCard(){
  updateCardCounts();
  if(cardIdx>=cardList.length){ $('#card-stage').innerHTML='<div class="empty">本组卡片已全部复习完 🎉</div>'; return; }
  const c = cardList[cardIdx];
  document.querySelector('.fc-front').textContent = c.front;
  document.querySelector('.fc-back').textContent = c.back;
  $('#flashcard').classList.remove('flip');
}
function markCard(known){
  const c = cardList[cardIdx]; if(!c) return;
  state.cards[c.id] = known?'known':'again';
  store.set('cards', state.cards);
  cardIdx++; showCard();
}
function updateCardCounts(){
  const known = Object.values(state.cards).filter(v=>v==='known').length;
  const again = Object.values(state.cards).filter(v=>v==='again').length;
  $('#card-known').textContent = known;
  $('#card-again').textContent = again;
  $('#card-left').textContent = Math.max(0, cardList.length-cardIdx);
}
function manifestChTitle(id){
  const c=(manifest.chapters||[]).find(x=>x.id===id); return c? c.title : id;
}

/* ---------- 术语表 ---------- */
function initGlossary(){
  const input = $('#glossary-filter');
  if(!input || input.dataset.inited) return;
  input.dataset.inited='1';
  input.oninput = ()=>{
    const v = input.value.trim().toLowerCase();
    document.querySelectorAll('#glossary-list li').forEach(li=>{
      li.style.display = (!v || li.dataset.term.includes(v)) ? '' : 'none';
    });
  };
}

/* ---------- 搜索 ---------- */
let searchIndex = null;
function buildSearchIndex(){
  if(searchIndex) return searchIndex;
  searchIndex = [];
  Object.entries(pages).forEach(([id, htmlText])=>{
    if(id.startsWith('__')) return;
    const text = htmlText.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ');
    searchIndex.push({id, text});
  });
  return searchIndex;
}
$('#q').addEventListener('input', e=>{
  const v = e.target.value.trim().toLowerCase();
  if(!v){ showPage(routeIdFromHash()); return; }
  buildSearchIndex();
  const hits = searchIndex.filter(p=>p.text.toLowerCase().includes(v)).slice(0,20);
  const label = id => id.startsWith('chapter/')? ('章节：'+manifestChTitle(id.split('/')[1])) : id.startsWith('concept/')? ('概念：'+id.split('/')[1]) : id;
  $('#view').innerHTML = '<h1>搜索结果：'+esc(v)+'</h1>' +
    (hits.length? hits.map(h=>`<div class="search-hit"><a href="#/${h.id}">${esc(label(h.id))}</a><br><span class="sub">${esc(h.text.slice(0,180))}</span></div>`).join('')
                 : '<div class="empty">未找到相关页面，试试章节名/概念名/术语。</div>');
});

/* ---------- Mermaid 懒加载（联网渲染，离线显示源码） ---------- */
function renderMermaid(){
  if(!document.querySelector('.mermaid')) return;
  const s=document.createElement('script');
  s.src='https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js';
  s.onload=()=>{ try{
    mermaid.initialize({startOnLoad:false, theme: matchMedia('(prefers-color-scheme: dark)').matches?'dark':'default'});
    document.querySelectorAll('.mermaid').forEach(el=>{
      const code=el.textContent;
      mermaid.render('mm'+Math.random().toString(36).slice(2), code)
        .then(({svg})=>{ el.innerHTML=svg; })
        .catch(()=>{ el.textContent=code; });
    });
  }catch(e){} };
  document.head.appendChild(s);
}

/* ---------- 深色模式 ---------- */
const themeBtn=$('#theme-btn');
themeBtn.onclick=()=>{
  const d = document.body.dataset.theme==='dark';
  document.body.dataset.theme = d? '' : 'dark';
  themeBtn.textContent = d? '🌙 深色' : '☀️ 浅色';
};

/* ---------- 启动 ---------- */
renderNav();
window.addEventListener('hashchange', ()=>showPage(routeIdFromHash()));
(function(){
  const sb=document.querySelector('.sidebar'); if(!sb) return;
  const btn=document.createElement('button'); btn.id='nav-toggle'; btn.textContent='目录（点开选择章节）';
  btn.onclick=()=>sb.classList.toggle('open');
  sb.insertBefore(btn, sb.querySelector('#nav'));
  window.addEventListener('hashchange',()=>{ if(window.innerWidth<=760) sb.classList.remove('open'); });
})();
showPage(routeIdFromHash());
</script>
</body>
