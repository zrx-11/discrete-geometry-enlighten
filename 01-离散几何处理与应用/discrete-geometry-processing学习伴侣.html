π) × e^{−6} ≈ 0.3979 × 0.00248 ≈ 0.00099；l≥3 已小于 10^{-5}。合计约 0.113。取 t = 10：l=1 项变成 0.2387 × e^{−20} ≈ 5×10^{-10}，几乎只剩 l=0 的 0.0796。<strong>这个数字演示了两件事：t 越小保留的高阶（细节）越多；t 大到一定程度后签名退化成常数。<\/strong> 所以 HKS 必须用&quot;多条 t 的曲线&quot;一起当特征，单点值没有信息。<\/p>\n<p><strong>实例（Ncut 为什么不能只看切口）<\/strong>：一条由 100 个顶点组成的细长走廊（每对相邻顶点连边，边权为 1）。切下最末端 1 个顶点，切口代价 = 1；把走廊从中间切成两半，切口代价 = 1。两种切法的 cut 完全相同，但前者把模型切成了 1 个点 + 99 个点，语义上毫无意义。Ncut 的分母 assoc(A,V) 对前者约等于 1，对后者约等于 50，于是前者得分 ≈ 1/1 + 1/99 ≈ 1.01，后者 ≈ 1/50 + 1/50 = 0.04——<strong>后者更优<\/strong>。这就是&quot;归一化&quot;的作用。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;描述子越复杂越好&quot;<\/strong>——实际上描述子的价值在于&quot;该忽略的忽略、该敏感的敏感&quot;。一个 20 维的 D2 在粗筛阶段往往比 500 维的深度特征更可靠，因为它对噪声和采样差异不敏感。\n<\/li><li>\n<strong>别以为&quot;HKS 是旋转不变的，所以它完全不变&quot;<\/strong>——实际上 HKS 是<strong>等距不变<\/strong>（弯曲不变），不是旋转不变那么弱。但正因为只看内在度量，它区分不了镜像（左右手），也区分不了&quot;鼓起来&quot;和&quot;凹下去&quot;这类只改外在形状的差异。\n<\/li><li>\n<strong>别以为&quot;球谐描述子对任何模型都适用&quot;<\/strong>——实际上它要求先把模型映射到球面（球参数化）。对非星形、多孔洞的模型，映射本身就有扭曲，系数会失真。\n<\/li><li>\n<strong>别以为&quot;分割就是找切口最小的地方&quot;<\/strong>——实际上最小切口会把模型切成碎片，必须加&quot;块大小/块均衡&quot;约束（Ncut 的分母）才有语义。\n<\/li><li>\n<strong>别以为&quot;协同分割等于分别分割再对齐&quot;<\/strong>——实际上分别分割的结果往往互不一致（同一部位切法不同），协同分割必须在优化里就共享信息（联合特征、联合图割），一致性是求解出来的，不是事后修补出来的。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n（单选）HKS 的等距不变性来源于？\n<p>A. 它用了法向　B. 它只依赖 Laplace 算子的特征值/特征向量，而它们只由内在度量决定　C. 它对坐标做了归一化　D. 它取的是曲率 <strong>答案<\/strong>：B。<strong>解析<\/strong>：热扩散由曲面内在度量决定，离散 Laplace 由余切权重（只与边长角度有关）构造，因此弯曲纸面不改变签名。<\/p>\n<\/ol>\n<ol><li>\n（单选）Ncut 相比&quot;最小切口&quot;多了什么？\n<p>A. 加了体积约束　B. 用 assoc 归一化，惩罚过小的块　C. 用了深度网络　D. 强制块数固定 <strong>答案<\/strong>：B。<strong>解析<\/strong>：Ncut 的两项分母是块与全图的连接量，块越小分母越小、得分越大，从而被抑制。<\/p>\n<\/ol>\n<ol><li>\n（填空）HKS 的 t 很小时主要由＿＿决定，t 很大时趋于＿＿。\n<p><strong>答案<\/strong>：局部几何（高阶特征模态/细节）；常数（只剩最低频模态，与总面积有关）。<\/p>\n<\/ol>\n<ol><li>\n（简答）D2 形状分布为什么对旋转不敏感，又丢了什么？\n<p><strong>答案要点<\/strong>：它统计的是采样点对之间的距离，距离在旋转下不变；但它不记录&quot;这段距离位于模型的哪个位置、哪个方向&quot;，所以空间分布信息全丢，不同形状可能撞分布。<\/p>\n<\/ol>\n<ol><li>\n（简答）协同分割为什么不能&quot;各切各的再对齐&quot;？\n<p><strong>答案要点<\/strong>：各模型独立分割时，切法由各自局部几何与噪声决定，同一语义部位可能被切成不同形状、不同块数，事后对齐没有可靠依据；协同分割在特征空间或图割层面联合优化，让&quot;对应部位的切法一致&quot;成为求解约束，从而得到可对应的分块。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n描述子 = 降维 + 选择性忽略；全局用于检索，局部用于对应。\n<\/li><li>\n谱方法三兄弟（HKS、WKS、Ncut/谱聚类）都建立在第 1 章的 Laplace 上：前者用特征值当&quot;频率&quot;，后者用特征向量当&quot;切分方向&quot;。\n<\/li><li>\n分割的难点不是切得开，而是切得<strong>均衡且语义一致<\/strong>；Ncut 归一化、交互约束、协同联合优化都是在补这一点。\n<\/ul>", "kind": "chapter", "title": "第 5 章：三维形状分析"}, "ch06": {"html": "<h1>第 6 章：网格曲面的形变<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：7 小时 | <strong>前置<\/strong>：第 2 章的光顺（Laplacian 收缩）、第 3 章的局部-全局迭代（ASAP）、第 1 章的 Laplacian 与最小二乘\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说出插值重构类与能量驱动类形变的根本区别，并各举两个方法。\n<\/li><li>\n解释线性混合蒙皮（LBS）为什么会出现&quot;糖纸收缩&quot;（candy-wrapper）现象。\n<\/li><li>\n写出梯度域形变的最小二乘目标，并说明为什么它等价于解一个 Poisson 方程。\n<\/li><li>\n说明 ARAP 的局部-全局迭代两步各在做什么，以及它为什么比纯 Laplacian 形变更保形状。\n<\/li><li>\n判断一个编辑需求（大幅弯曲、保体积、局部细节）该用哪类方法。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>形变要同时满足两件互相拉扯的事：<strong>跟住用户的操作<\/strong>（位置要动到目标处）和<strong>保住原有形状<\/strong>（局部细节不能被揉烂）。所有方法都是在&quot;用多少自由度去描述形变&quot;上做文章：自由度越少越稳、越不自由。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：两条技术路线<\/h3>\n<p><strong>插值重构<\/strong>（难度：进阶）：用户给出参数（骨点位置、控制格点位移、权重），算法按固定的规则<strong>直接算出<\/strong>形变后的顶点位置。速度快、可交互，但形变质量由规则本身决定，用户无法提高。<\/p>\n<p>抽象地写作 P&#x27; = f(P, 参数)，f 是事先定义的插值函数。<\/p>\n<p><strong>能量驱动<\/strong>（难度：高难）：定义形变质量的度量（能量），把&quot;用户操作&quot;当约束，最小化能量。质量可控，但每次编辑要解一个优化问题（通常几秒）。第 3 章的 ASAP 已经是这个套路，本章把它做到极致。<\/p>\n<h3>概念 2：蒙皮——用骨架带动表面<\/h3>\n<p><strong>蒙皮<\/strong>（难度：进阶）是动画里的标准做法：模型内部有一副骨架，每个顶点绑定到若干骨头上（有权重 w_ij，表示第 i 个顶点受第 j 根骨头影响多少），骨头一动，顶点跟着动。<\/p>\n<p><strong>线性混合蒙皮（LBS）<\/strong>（难度：进阶）的公式朴素到极点：<\/p>\n<pre><code>v_i&#x27; = Σ_j w_ij (R_j v_i + t_j)<\/code><\/pre>\n<p>即：对每根骨头算它自己的旋转 R_j 和平移 t_j，把顶点变换过去，再按权重加起来（权重满足 Σ_j w_ij = 1）。<\/p>\n<p>它快、可微、几乎所有游戏引擎都用它。但它有一个著名的病：<strong>糖纸收缩<\/strong>。举个可算的例子：一根前臂骨和一根上臂骨，肘部某顶点对两根骨头的权重各 0.5。把前臂绕肘旋转 90°，顶点在前臂骨下的位置 P1 = R(90°)v，在上臂骨下的位置 P0 = v（不动），LBS 给出 (P0 + P1)/2。若 v 到肘关节的距离为 r，则 |P1 − P0| = r√2，取平均后新位置到关节的距离变成 r√2/2 ≈ 0.707r——<strong>顶点被拉向关节，形状像糖纸被拧紧<\/strong>。这就是&quot;权重平均不是旋转平均&quot;造成的体积损失。<\/p>\n<p>修法有三层：<\/p>\n<ol><li>\n<strong>对偶四元数蒙皮（DQS）<\/strong>：不平均变换后的位置，而是先平均&quot;旋转+平移&quot;的 4D 表示（对偶四元数），再作用到顶点上。旋转被&quot;正确地插值&quot;，糖纸现象大幅减轻（代价是对某些旋转会出现&quot;凸起&quot;）。\n<\/li><li>\n<strong>学习骨骼<\/strong>：自动从动画序列里学出骨骼和权重（书里提到用均值漂移聚类把顶点聚成若干簇，每簇当一根骨头；把 9 维仿射矩阵的旋转部分投影回 SO(3)，再用最小二乘求平移）。\n<\/li><li>\n<strong>加形状修正<\/strong>：在 LBS 结果上再叠一个&quot;姿态修正&quot;项（学出来的），把被压扁的部分撑回来。\n<\/ol>\n<h3>概念 3：自由形变（FFD）<\/h3>\n<p><strong>FFD<\/strong>（难度：进阶）。把模型装进一个控制晶格（三维的格子），用户拖动格点，模型跟着变。数学上是三线性（或 B-样条）插值：<\/p>\n<pre><code>v&#x27; = Σ_{lattice nodes c} B_c(v) · d_c<\/code><\/pre>\n<p>B_c 是控制格点的基函数（离得近的格点权重大），d_c 是格点的位移。优点是不用处理模型本身的拓扑，任何模型都能用；缺点是格点必须包住模型、对局部细节控制力弱，且格点数一多就不好拖。<\/p>\n<h3>概念 4：梯度域形变——保留&quot;局部怎么弯&quot;的信息<\/h3>\n<p>这是本章的核心技术。先回顾第 1 章：拉普拉斯坐标 δ_i = Δv_i 描述的是&quot;这个顶点比邻居平均高出多少&quot;，也就是<strong>局部形状<\/strong>（微分信息）。而顶点坐标是<strong>全局位置<\/strong>。梯度域形变的思路是：<\/p>\n<blockquote>编辑时，我只改动少数控制点；对未被直接控制的顶点，我希望它们的<strong>局部形状（δ）保持原样<\/strong>，然后重新解出全局位置。<\/blockquote>\n<p>写成最小二乘：<\/p>\n<pre><code>min_{v&#x27;}  Σ_i | Δv&#x27;_i − T_i δ_i |²  +  约束项（用户指定的顶点要落在目标位置）<\/code><\/pre>\n<p>这里的 T_i 是一个局部旋转，把原来的 δ 旋到新姿态（否则形状&quot;朝向&quot;不对，会扭曲）。解这个最小二乘，就是解一个线性系统：<\/p>\n<pre><code>L v&#x27; = b<\/code><\/pre>\n<p>L 是 Laplace 矩阵（第 1 章的余切权重），b 由目标微分坐标和约束共同构成。矩阵是稀疏的，几万顶点也能解（用 Cholesky 或共轭梯度）。<\/p>\n<p><strong>为什么等价于 Poisson 方程<\/strong>：在连续形式下，目标是求 f 使得 ∇f ≈ 给定的向量场 u。数学上有<strong>Helmholtz-Hodge 分解<\/strong>：任何向量场都能唯一分解为<\/p>\n<pre><code>u = ∇ψ + ∇×ω + h<\/code><\/pre>\n<p>三部分分别是&quot;梯度场（无旋）&quot;、&quot;旋转场（无散）&quot;、&quot;调和场（既无旋又无散）&quot;。向量场里只有梯度部分是&quot;能被某个函数求导出来的&quot;。所以求 f 使 ∇f ≈ u，就要先<strong>把 u 的旋转部分和调和部分去掉<\/strong>，只留梯度部分，这等价于解<\/p>\n<pre><code>∇²φ = ∇·u     （即 Poisson 方程）<\/code><\/pre>\n<p>离散版本就是上面那个 L v&#x27; = b。这是&quot;梯度域&quot;这个名字的由来：不是直接在位置空间编辑，而是在<strong>梯度（微分）空间编辑<\/strong>，再积分回位置。<\/p>\n<p><strong>体图（cage）约束<\/strong>（难度：进阶）。只保表面梯度会出问题：一个大变形（比如把手臂抬起来）会让靠近关节的部位塌陷（书里图 6.5 的例子：只靠表面梯度驱动，腿部会塌）。原因是表面梯度只约束了&quot;表面怎么弯&quot;，没约束&quot;内部体积怎么变&quot;。解法是在模型内部放一个<strong>填充图<\/strong>（防止体积变化）、在外部放一个<strong>覆盖图<\/strong>（防止局部自交），两者的顶点也参与形变、并把它们的变换传给表面顶点。这是&quot;用低维的控制结构去约束高维形状&quot;的典型做法，和 FFD 一个思路，只是图是任意形状的。<\/p>\n<h3>概念 5：非线性子空间梯度域形变<\/h3>\n<p>梯度域漂亮，但有两个残留问题：<\/p>\n<ol><li>\n它用<strong>旋转的近似<\/strong>（把 δ 按某个估计的旋转转一下）。旋转估计得不准，细节就保不住。\n<\/li><li>\n它是<strong>线性<\/strong>方法，大幅形变时&quot;线性化误差&quot;积累，会出现明显的体积/长度偏差。\n<\/ol>\n<p><strong>ARAP（As-Rigid-As-Possible）<\/strong>（难度：高难）。它的能量直接定义在每个三角形上：<\/p>\n<pre><code>E = Σ_t  (1/2) Σ_{edges (i,j) in t}  w_ij  | (v&#x27;_i − v&#x27;_j) − R_t (v_i − v_j) |²<\/code><\/pre>\n<p>含义：每个三角形 t 有一个自己的最优旋转 R_t，要求形变后的边向量等于&quot;原来的边向量转一下&quot;，尽量不拉伸。R_t 怎么求？把三个边向量算出来，求使它们最接近旋转的那个 R（这叫 <strong>Procrustes 问题<\/strong>，用 SVD 解：对协方差矩阵做 SVD 得 U Σ Vᵀ，R = V Uᵀ；若 det 为负则修正一列）。<\/p>\n<p>求解用<strong>局部-全局迭代<\/strong>：<\/p>\n<ul><li>\n<strong>局部步<\/strong>：固定顶点位置 v&#x27;，对每个三角形单独算最优 R_t（SVD）；\n<\/li><li>\n<strong>全局步<\/strong>：固定所有 R_t，解一个稀疏线性系统求新的 v&#x27;（就是上面那个最小二乘，矩阵不变，可预先分解）。\n<\/ul>\n<p>两步交替，能量单调下降。这与第 3 章 ASAP 的结构完全一样——ASAP 是二维版本（参数化），ARAP 是三维版本（形变）。<\/p>\n<p><strong>子空间形变<\/strong>（难度：高难）。ARAP 的未知量还是全部顶点（几万个），每步都要解大系统。既然形变通常只由少数几种&quot;运动模式&quot;组成（弯曲、扭转、拉伸），就可以预先算一组基（比如低频 Laplace 特征向量、或者从一组样本形变里做 PCA），只在基张成的<strong>子空间<\/strong>里求系数：<\/p>\n<pre><code>v&#x27; = v + Σ_{k=1}^{K} c_k B_k     （K 远小于顶点数，比如 30 对 30000）<\/code><\/pre>\n<p>未知量从 3N 个降到 K 个，且可以预先算好高维矩阵的投影。书里进一步把&quot;骨架约束&quot;（用户拖某根虚拟骨架）和&quot;体积约束&quot;都写进这个子空间优化里，于是可以做到：拖一根骨架、保持体积、保住细节，交互帧率还够用。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[用户操作&lt;br/&gt;拖点 拖骨架 拖格子] --&gt; B{形变路线}\n    B --&gt;|插值重构| C1[蒙皮 LBS / DQS]\n    B --&gt;|插值重构| C2[自由形变 FFD]\n    B --&gt;|能量驱动 线性| D1[梯度域 Poisson 编辑]\n    B --&gt;|能量驱动 非线性| D2[ARAP 局部-全局]\n    D1 --&gt; D3[体图约束&lt;br/&gt;内部填充 + 外部覆盖]\n    D2 --&gt; E1[子空间降维&lt;br/&gt;只在少数基上求]\n    D3 --&gt; F[形变结果]\n    E1 --&gt; F<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：四条线路的区别就是&quot;用多少自由度 + 是否显式优化能量&quot;。看图要记住：LBS/FFD 是&quot;一次算完&quot;，梯度域/ARAP 是&quot;每帧解方程&quot;，子空间是&quot;把方程缩小后再解&quot;。选择依据是&quot;要交互速度还是要形状质量&quot;。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：形变像捏橡皮泥。LBS 是&quot;按骨架的伸缩比例把每块泥巴缩放&quot;——快，但关节处的泥会被挤扁；梯度域是&quot;记下每块泥巴原来凸起多少，挪动后再按记录重新鼓起来&quot;——形状保得住，但大幅挪动时体积会塌；ARAP 是&quot;规定每块泥巴只许转不许拉&quot;——最保形状，但要反复迭代。<strong>失效边界<\/strong>：真实橡皮泥是不可压缩的，ARAP 只约束边长，对&quot;体积必须严格不变&quot;的要求还得额外加体积项。<\/p>\n<p><strong>实例（梯度域解一个具体系统）<\/strong>：一条 1D 的&quot;网格&quot;（4 个顶点排成一线，坐标 0、1、2、3），拉普拉斯坐标（用简单差分）δ = (1, 0, 0, −1)。现在把第 1 个顶点固定在 0、第 4 个固定在 2（即整体压缩到原来长度的 2/3）。<\/p>\n<p>重建方程是：内部顶点的 δ 保持 0，边界为 0 与 2。对内部顶点 x2、x3 有：<\/p>\n<ul><li>\n2x2 − x1 − x3 = 0（x1 = 0）\n<\/li><li>\n2x3 − x2 − x4 = 0（x4 = 2）\n<\/ul>\n<p>解得 x2 = 2/3、x3 = 4/3。位置均匀分布——正说明&quot;内部 δ 保持 0&quot;就是&quot;保持均匀&quot;，形变被均匀摊到了整条线上。<\/p>\n<p>如果改用&quot;保边&quot;（ARAP）思路，则要求边长都等于原长 1，总长 3 塞进区间 [0,2] 是做不到的（矛盾），求解会得到&quot;最小二乘意义下最接近&quot;的结果：边长 ≈ 2/3。这个对比正好说明：<strong>梯度域保的是&quot;局部二阶结构&quot;，ARAP 保的是&quot;边长&quot;，目标不同，结果不同。<\/strong><\/p>\n<p><strong>实例（LBS 糖纸的数值）<\/strong>：接概念 2 的算例，v 距关节 r = 1，旋转 90°：新位置到关节距离 0.707。若把权重改成 0.9/0.1，则新位置 ≈ 0.9 × (旋转后) + 0.1 × (原位置)，到关节距离 ≈ 0.905——权重越&quot;软&quot;（越接近 0.5/0.5），关节处收缩越明显。<strong>这就是为什么蒙皮权重必须&quot;硬&quot;、且关节附近要专门做修正。<\/strong><\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;梯度域形变是万能的，随便怎么拖都不会坏&quot;<\/strong>——实际上它只保局部微分，不保体积、不保全局尺度；大幅动作会让关节附近塌陷，必须加内部体图或体积约束。\n<\/li><li>\n<strong>别以为&quot;LBS 只是精度差一点，本质没问题&quot;<\/strong>——实际上它的错误是结构性的：位置平均不等于旋转平均，所以肘、膝这类大角度关节必然收缩，不是调参数能解决的。\n<\/li><li>\n<strong>别以为&quot;ARAP 一定收敛到全局最优&quot;<\/strong>——实际上局部-全局迭代只保证能量单调下降，可能停在局部极小；初值（通常用 LBS 或梯度域结果）与约束方式会影响最终形状。\n<\/li><li>\n<strong>别以为&quot;子空间方法精度低所以不值得用&quot;<\/strong>——实际上多数交互编辑的自由度本来就很低（用户只拖一两个点），子空间足够表达；它的价值是把求解时间从秒级降到毫秒级，从而把&quot;批处理&quot;变成&quot;实时手工调整&quot;。\n<\/li><li>\n<strong>别以为&quot;Helmholtz 分解只是数学装饰&quot;<\/strong>——实际上它解释了&quot;为什么直接对向量场积分不可行&quot;：旋转部分和调和部分积不出来，必须投影掉，这一步正是梯度域方法稳健的原因。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n（单选）LBS 出现糖纸收缩的根本原因是？\n<p>A. 权重没归一化　B. 对&quot;变换后的位置&quot;做线性平均，而不是对旋转做插值　C. 骨骼数量太少　D. 网格分辨率不够 <strong>答案<\/strong>：B。<strong>解析<\/strong>：两个 90° 差别的旋转，其变换后位置的中点会落到关节内侧，等价于长度缩为原来的 0.707 倍；DQS 正是为了修这一点。<\/p>\n<\/ol>\n<ol><li>\n（单选）梯度域形变最终要求解的方程是？\n<p>A. ∇×u = 0　B. L v&#x27; = b（离散 Poisson，L 为 Laplace 矩阵）　C. v&#x27; = Σ w_j R_j v　D. 特征值问题 <strong>答案<\/strong>：B。<strong>解析<\/strong>：把&quot;局部微分保持&quot;写成最小二乘，正规方程就是 Laplace 矩阵乘以新坐标等于目标散度项。<\/p>\n<\/ol>\n<ol><li>\n（填空）ARAP 的局部-全局迭代中，局部步固定＿＿、求每个三角形的＿＿；全局步固定＿＿、解一个＿＿线性系统。\n<p><strong>答案<\/strong>：顶点位置；最优旋转（用 SVD 解 Procrustes）；所有旋转；稀疏。<\/p>\n<\/ol>\n<ol><li>\n（简答）为什么&quot;直接让 ∇f = u&quot;往往无解，必须先做 Helmholtz 分解？\n<p><strong>答案要点<\/strong>：任意向量场 u 一般含有旋转（无散）和调和（既无旋又无散）分量，而梯度场必然无旋（∇×∇f = 0）。所以只有当 u 的无旋分量被提取出来后，才存在 f 使 ∇f 等于它；这一步等价于解 ∇²φ = ∇·u，即先取散度再积分。<\/p>\n<\/ol>\n<ol><li>\n（简答）在什么情况下你会选子空间形变而不是完整 ARAP？\n<p><strong>答案要点<\/strong>：交互式编辑（需要毫秒级响应）、形变自由度低（拖少量骨架/点）、可接受预先计算一组基（如低频模态或样本 PCA）的场合。若要求严格保体积、形变幅度极大且需要精确接触，则应保留完整非线性求解（或加体积约束的完整版本）。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n两条主线：插值重构（快、质量由规则定）与能量驱动（慢、质量可优化）；LBS/FFD 属前者，梯度域/ARAP 属后者。\n<\/li><li>\n梯度域的关键词是&quot;保微分、解 Poisson、体图防塌陷&quot;；ARAP 的关键词是&quot;逐三角形最优旋转 + 局部全局迭代&quot;。\n<\/li><li>\n子空间是把大系统投影到少数基上，用精度换交互速度；它不改变能量形式，只改变求解空间。\n<\/ul>", "kind": "chapter", "title": "第 6 章：网格曲面的形变"}, "ch07": {"html": "<h1>第 7 章：网格模型的弹性运动模拟<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：7 小时 | <strong>前置<\/strong>：第 6 章的形变能量、第 1 章的数值优化与 Newton 法；基本的力学（力、加速度）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n写出弹性体的运动方程，并说清三项（惯性、阻尼、内力）各自的物理含义。\n<\/li><li>\n解释为什么显式积分的时间步受限于&quot;最快振动周期&quot;，而隐式积分不受。\n<\/li><li>\n说明子空间模拟怎么把&quot;几万个自由度&quot;降到几十个，以及它的适用边界。\n<\/li><li>\n说清 PBD/投影动力学与&quot;解隐式积分方程&quot;的关系（为什么它也收敛到同一个解）。\n<\/li><li>\n给出一个含自碰撞的布料模拟的基本流程，并指出最容易出错的两处。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>模拟就是在每个时间步回答一个问题：&quot;在重力和碰撞约束下，这一堆顶点接下来该到哪里？&quot;——效率的关键在于<strong>怎么在不牺牲稳定性的前提下，少算一点<\/strong>。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：三种建模方式与运动方程<\/h3>\n<p><strong>弹簧质点模型<\/strong>（难度：基础）。把物体看作一堆质点（顶点），质点之间用弹簧连接，弹性内力由每条边的长度变化定义。它简单、直观，但&quot;弹簧刚度&quot;与&quot;材料硬度&quot;没有直接对应关系，网格越密模型越硬（因为边变短了），需要额外校正。<\/p>\n<p><strong>无网格模型<\/strong>（难度：进阶）。不建网格，用一圈邻域内的点做局部拟合（类似第 2 章的 MLS），适合碎裂、流体这类拓扑会变的场景。<\/p>\n<p><strong>有限元（FEM）<\/strong>（难度：高难）。把物体剖成四面体（或六面体），每个单元内用形函数插值位移，从应变能导出内力。它的优点是物理参数（杨氏模量、泊松比）与材料真实属性对应；缺点是计算量大、需要好质量的网格——这就是第 4 章六面体重网格化存在的工程理由。<\/p>\n<p>无论哪种模型，运动方程都一样：<\/p>\n<pre><code>M ẍ + D ẋ + f_int(x) = f_ext<\/code><\/pre>\n<ul><li>\nM 是质量矩阵（对角，通常就是每个顶点的质量）；\n<\/li><li>\nD 是阻尼矩阵，常用 Rayleigh 阻尼 D = α_m M + α_k K（K 是刚度矩阵），α_m 抑制整体慢速运动、α_k 抑制高频抖动；\n<\/li><li>\nf_int 是弹性内力（势能对位移的负梯度）；\n<\/li><li>\nf_ext 是外力（重力、用户拖拽）。\n<\/ul>\n<h3>概念 2：时间积分——为什么模拟会&quot;炸&quot;<\/h3>\n<p>把方程离散到时间轴上有两种基本做法。<\/p>\n<p><strong>显式积分<\/strong>（难度：进阶）。用当前时刻的力算加速度，直接推出下一时刻位置：<\/p>\n<pre><code>x_{n+1} = x_n + h v_n + h² a_n / m<\/code><\/pre>\n<p>快、简单，但<strong>稳定性受条件限制<\/strong>。以最简单的单弹簧为例，其振动频率 ω = √(k/m)。数学上可以证明：显式积分稳定要求<\/p>\n<pre><code>h ≤ 2 / ω_max<\/code><\/pre>\n<p>ω_max 是全模型最高频（最硬的弹簧、最小的质量、最短的边）。网格加密时 ω_max 会随边长变短而升高（弹簧振子频率与 1/边长 同阶），于是 h 必须越来越小，步数越来越多。这就是&quot;网格越细模拟越慢&quot;的根源，也是布料模拟里最硬的现实约束。<\/p>\n<p><strong>隐式积分<\/strong>（难度：高难）。用<strong>未知的下一时刻<\/strong>的力来写方程：<\/p>\n<pre><code>M (x_{n+1} − 2x_n + x_{n−1}) / h² + D (…) + f_int(x_{n+1}) = f_ext<\/code><\/pre>\n<p>因为 f_int 非线性，要 Newton 迭代，每步解一个稀疏线性系统。代价是每步贵，收益是<strong>无条件稳定<\/strong>（多大的 h 都不炸，虽然太大时会&quot;过度阻尼&quot;显得黏）。工业级模拟基本都用隐式（或其变体）。<\/p>\n<h3>概念 3：子空间降维——只用几十个自由度<\/h3>\n<p><strong>模态分析<\/strong>（难度：高难）。线性化后，系统的自由振动满足<\/p>\n<pre><code>K φ = λ M φ<\/code><\/pre>\n<p>这是一个广义特征值问题，解出 λ_k（振动频率的平方）和 φ_k（振动模态）。低频模态是大尺度的整体摆动（比如整个人体的晃动），高频模态是局部抖动。<\/p>\n<p><strong>子空间模拟<\/strong>（难度：高难）。既然动画里看得见的运动主要是低频的，就只在最低的 K 个模态张成的空间里求解：<\/p>\n<pre><code>x = x_0 + Σ_{k=1}^{K} q_k φ_k<\/code><\/pre>\n<p>未知量从 3N 个（N 是顶点数）降到 K 个（常见 K = 20—60）。把运动方程投影到模态坐标上，得到一个 K×K 的小系统，可以实时求解。<\/p>\n<p>代价有三个：一是<strong>非线性内力无法精确投影<\/strong>（模态基是线性化得到的，大变形时失效）；二是<strong>局部碰撞无法表达<\/strong>（低频模态摆不出&quot;衣角被桌子挡住&quot;这种尖锐的局部形状）；三是需要预先算特征值分解（几万顶点做一次，可以离线）。<\/p>\n<h3>概念 4：PBD 与投影动力学——&quot;先乱跑，再拉回来&quot;<\/h3>\n<p><strong>PBD（基于位置的动力学）<\/strong>（难度：高难）。思路非常工程化：<\/p>\n<ol><li>\n先不管约束，按外力自由预测位置（x_pred = x + h v + h² f_ext/m）；\n<\/li><li>\n然后把每个约束（边长、体积、碰撞）<strong>投影<\/strong>：把顶点挪到&quot;刚好满足约束&quot;的最近位置；\n<\/li><li>\n用挪动后的位置反推速度（v = (x_new − x_old)/h）。\n<\/ol>\n<p>它极其稳定（因为约束总是被强制满足）、极易实现，是游戏和实时布料的主流。缺点是&quot;刚度&quot;依赖迭代次数：迭代少则物体软，迭代多则硬，物理参数不直接。<\/p>\n<p><strong>投影动力学（Projective Dynamics）<\/strong>（难度：高难）。它把 PBD 和隐式积分统一起来：把内力写成一组&quot;投影问题&quot;的和，每个投影都有一个闭式解（比如&quot;把这条边拉回原长&quot;就是把两端点沿边方向各挪一半）。于是隐式积分的每一步变成：<\/p>\n<pre><code>解 (M/h² + Σ w_i S_iᵀ S_i) x = b(x_pred, 投影目标)<\/code><\/pre>\n<p>左边矩阵<strong>常量<\/strong>（可以预分解一次，后续每步只做回代），右边每步更新。这解释了为什么它能做到&quot;每步只解一个固定稀疏系统&quot;，速度比完整 Newton 快一个量级，而收敛到的解与隐式积分一致（在收敛时两者满足同一组最优性条件）。<\/p>\n<p>书里还提到用 <strong>Poisson 重建<\/strong>求解位移：把形变梯度 G 与目标旋转/应变比较，最小化<\/p>\n<pre><code>min Σ_e V_e | G_e − g(y_e) |²_F<\/code><\/pre>\n<p>其正规方程是 ∇²u = Gᵀ∇g(y)，系数矩阵只与未变形形状有关、恒定不变——同一个套路（第 6 章的梯度域）在物理模拟里再次出现。<\/p>\n<p><strong>Cubature 采样<\/strong>（难度：高难）。完整模拟要对每个四面体算内力，太贵。Cubature 的做法是从大量单元里选一小部分&quot;代表单元&quot;（用训练数据拟合，使整体内力误差最小），只在代表单元上算。它能在保持视觉精度的前提下把单元计算量降一个数量级。代价是：牺牲的单元上无法产生局部细节（比如某个局部被压扁），所以对&quot;精细接触&quot;要慎用。<\/p>\n<h3>概念 5：碰撞检测与处理<\/h3>\n<p>模拟里真正让人头疼的往往不是弹性，而是碰撞。<\/p>\n<p><strong>碰撞检测<\/strong>（难度：进阶）。暴力做法是每帧检查所有三角形对，复杂度 O(n²)——几万个三角形根本不可行。实用方案是<strong>层次包围盒（BVH）<\/strong>：把三角形按空间位置组织成树（每个节点是一个包住其子树所有三角形的盒子），查询时先比大盒子、再比小盒子，只对可能相交的叶子做精确三角形求交。整体复杂度降到接近 O(n log n)。<\/p>\n<p>连续碰撞检测更难：物体在两步之间可能&quot;穿透&quot;（穿过薄墙），所以还需要检查&quot;扫掠体&quot;（这一步到下一步的运动轨迹扫过的空间），或者用自适应步长/时间二分。<\/p>\n<p><strong>碰撞处理<\/strong>（难度：高难）。检测到相交后要消除穿透，常用三招：<\/p>\n<ol><li>\n<strong>位置修正<\/strong>：把穿进去的顶点沿法向推出表面（简单但会让物体&quot;抖&quot;）；\n<\/li><li>\n<strong>约束求解<\/strong>：把&quot;不许穿透&quot;写成不等式约束（第 1 章的 KKT / MPRGP 就在这里出场），在隐式积分里一起解，能得到物理上合理的响应；\n<\/li><li>\n<strong>摩擦与粘滞<\/strong>：切向的相对运动加摩擦约束，否则物体永远在滑。\n<\/ol>\n<p>书里还强调<strong>自碰撞<\/strong>（布料自己叠自己）的处理：需要区分&quot;相邻三角形&quot;（本来就接触，要排除）和&quot;真碰撞&quot;，否则布料会自己粘住不动。<\/p>\n<h3>概念 6：复杂弹性体的运动编辑<\/h3>\n<p><strong>旋转-应变（RS）坐标<\/strong>（难度：高难）。前面提过：任意形变可以分解为&quot;旋转 + 拉伸&quot;（极分解）。把每个单元形变后的梯度写成 G = R S（R 是旋转，S 是对称的应变），就得到两组可独立编辑的参数：调 R 就是改姿势，调 S 就是改胖瘦。书里用这种表示做运动编辑：用户给定关键帧的 RS 参数，中间帧通过插值求解（用 Cubature 拟合降维），得到&quot;姿势对、胖瘦也对&quot;的动画。<\/p>\n<p><strong>材质优化<\/strong>（难度：高难）。反过来：给定一段真实拍摄的运动（比如视频里旗帜的飘动），反推材料的弹性参数（杨氏模量、阻尼系数），使模拟结果与观测一致。这是一个参数拟合问题，通常用梯度下降（对参数求导可用伴随法），把&quot;模拟出来的形状与观测的差&quot;作为损失。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[建模&lt;br/&gt;弹簧质点 / 无网格 / 有限元] --&gt; B[运动方程&lt;br/&gt;M ẍ + D ẋ + f = f_ext]\n    B --&gt; C{时间积分}\n    C --&gt;|显式| C1[快 但 h 受限于最快振动]\n    C --&gt;|隐式| C2[稳 但每步解稀疏系统]\n    C2 --&gt; D[降维加速]\n    D --&gt; D1[子空间模态&lt;br/&gt;最低 K 个模态]\n    D --&gt; D2[投影动力学&lt;br/&gt;常量矩阵 + 投影闭式解]\n    D --&gt; D3[Cubature&lt;br/&gt;只算代表单元]\n    B --&gt; E[碰撞]\n    E --&gt; E1[BVH 检测]\n    E --&gt; E2[约束处理 KKT / 投影]\n    E2 --&gt; F[成片]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：横向是&quot;建模→积分→加速→碰撞&quot;，其中&quot;降维加速&quot;是本章的技术核心。要看出的关系是：子空间、投影动力学、Cubature 三者不冲突，可以叠用（子空间降自由度、Cubature 降单元数、投影动力学降每步求解成本）。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：模拟像给一群人手拉手传递&quot;该往哪走&quot;的指令。显式积分是&quot;每个人按上一秒的指令立刻迈一步&quot;——指令传得快时（网格细），有人会踩到别人脚上（数值发散）；隐式积分是&quot;每个人先协商出一个大家都同意的下一步&quot;——慢，但不会乱；PBD 是&quot;先各自走一步，再互相拽回来&quot;——最快，但拽的次数决定&quot;队伍有多硬&quot;。<strong>失效边界<\/strong>：PBD 的&quot;硬&quot;是靠迭代堆出来的，物理参数不能直接映射；要真实材料参数就必须走隐式。<\/p>\n<p><strong>实例（时间步为什么会炸）<\/strong>：一根弹簧，k = 100 N/m，m = 0.01 kg，则 ω = √(100/0.01) = 100 rad/s。显式积分要求 h ≤ 2/100 = 0.02 s，即每秒至少 50 步。若你把网格细分，边长减半，等效刚度约变为 4 倍（因为应变与长度变化的比值变大），ω 变为 200，h 必须 ≤ 0.01 s，步数翻倍。<strong>这就是&quot;细分一倍、代价翻倍&quot;的量化解释。<\/strong><\/p>\n<p><strong>实例（模态数量与表现力的取舍）<\/strong>：一根两端固定的琴弦，第 k 阶模态的形状是 sin(kπx/L)，频率与 k 成正比。取 K = 3，只能表现&quot;整体上下摆一次、两次、三次&quot;这三种形状；如果你要模拟&quot;拨弦处有一个尖角&quot;，需要很高阶（k 大）的模态。这解释了子空间模拟为什么在&quot;局部尖锐碰撞&quot;上失效——尖锐特征需要高频模态，而高频正好被截掉了。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;隐式积分就是无脑大步长&quot;<\/strong>——实际上大步长虽然稳定，但会把真实的高频振动阻尼掉，看起来&quot;发黏&quot;；精度与稳定性是两件事，工业实现通常还要做步长控制。\n<\/li><li>\n<strong>别以为&quot;弹簧质点模型和有限元只是实现不同，结果一样&quot;<\/strong>——实际上弹簧模型的刚度与网格密度耦合（加密就变硬），而有限元的材料参数与网格无关，两者在&quot;跨分辨率一致&quot;上本质不同。\n<\/li><li>\n<strong>别以为&quot;PBD 迭代越多越接近物理&quot;<\/strong>——实际上它收敛到的是&quot;约束都满足&quot;的解，这个解与隐式积分的最优解在多数情况下一致（投影动力学的证明），但每次迭代的中间状态没有物理意义，且刚度-迭代次数的映射需要标定。\n<\/li><li>\n<strong>别以为&quot;BVH 建好一次就能一直用&quot;<\/strong>——实际上物体在变形，包围盒会失效，需要每帧或每隔几帧重建/更新（更新策略决定了性能，常见做法是&quot;自底向上重拟合&quot;）。\n<\/li><li>\n<strong>别以为&quot;碰撞处理只要把点推出去就够了&quot;<\/strong>——实际上推出会引入非物理的抖动和穿透反弹，正确做法是把非穿透作为约束并入求解（这也是第 1 章 MPRGP 那类算法被引入的原因）。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n（单选）显式积分的时间步上限主要由什么决定？\n<p>A. 总质量　B. 系统最高振动频率　C. 外力大小　D. 顶点数量 <strong>答案<\/strong>：B。<strong>解析<\/strong>：稳定条件 h ≤ 2/ω_max；网格越细，最高频越高，步长必须越小。<\/p>\n<\/ol>\n<ol><li>\n（单选）投影动力学（Projective Dynamics）每步求解的线性系统有什么特点？\n<p>A. 每步都要重新分解　B. 左边矩阵恒定，可预分解　C. 是非线性系统　D. 是特征值问题 <strong>答案<\/strong>：B。<strong>解析<\/strong>：左边是 M/h² 加上投影算子的加权和，只与网格和权重有关，与当前位置无关，因此可以预分解、每步只回代。<\/p>\n<\/ol>\n<ol><li>\n（填空）子空间模拟把未知量从＿＿个降到＿＿个；它失效的两个典型场景是＿＿与＿＿。\n<p><strong>答案<\/strong>：3N（顶点坐标全量）；K（少数模态系数）；大幅非线性形变（线性化基失效）；局部尖锐碰撞（需要高频模态）。<\/p>\n<\/ol>\n<ol><li>\n（简答）为什么&quot;网格加密会让弹簧质点模型变硬&quot;？\n<p><strong>答案要点<\/strong>：弹簧刚度定义在边上，应变由边长变化率衡量；边变短后同样的绝对位移对应更大的相对伸长，等效刚度上升，最高频也随之升高。要跨分辨率一致，必须按边长重新标定刚度，或改用基于连续介质参数的有限元。<\/p>\n<\/ol>\n<ol><li>\n（简答）碰撞处理里&quot;位置推出&quot;和&quot;约束求解&quot;的区别与代价。\n<p><strong>答案要点<\/strong>：位置推出是事后修正，实现简单、但破坏动量守恒、产生抖动与二次穿透；约束求解把非穿透写进优化（KKT/投影），得到满足动量关系的响应，代价是求解规模变大、需要处理不等式约束的活跃集变化。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n一个方程通吃：M ẍ + D ẋ + f_int = f_ext；区别只在 f_int 怎么来（弹簧/有限元）和怎么积分（显式/隐式）。\n<\/li><li>\n稳定的代价与速度的代价在互相交换：隐式稳但贵，子空间/Cubature/投影动力学各自砍掉一部分计算。\n<\/li><li>\n碰撞才是工程难点：检测靠 BVH、处理靠约束、自碰撞要先排除相邻三角形。\n<\/ul>", "kind": "chapter", "title": "第 7 章：弹性运动模拟"}, "ch08": {"html": "<h1>第 8 章：基于机器学习的几何处理<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：6 小时 | <strong>前置<\/strong>：第 1—6 章的算子与能量（尤其第 2 章去噪、第 6 章蒙皮）；基础概率与线性代数；神经网络的基本概念\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说清&quot;把几何信号做稀疏表达&quot;为什么比图像难，难在哪一步。\n<\/li><li>\n解释 L1 正则为什么会产生稀疏解（不是&quot;因为公式长这样&quot;）。\n<\/li><li>\n说明低秩约束为什么可以确定人造模型的正立朝向。\n<\/li><li>\n解释 PointNet 为什么对点的输入顺序不敏感，以及它怎么处理旋转。\n<\/li><li>\n判断一个几何任务该用手工能量还是学习方法，并说出各自的风险。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>这一章做的事是<strong>把手写的能量换成了从数据里学出来的先验<\/strong>：不再由人规定&quot;好的形状应该满足什么&quot;，而是让模型从大量例子里自己总结&quot;什么看起来对&quot;。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：几何信号为什么不好做稀疏表达<\/h3>\n<p>图像是定义在规则格点上的信号，所以有天然的基（傅里叶基、小波基），&quot;稀疏&quot;就是&quot;只有少数几个基系数非零&quot;。<strong>几何信号定义在不规则的流形上<\/strong>——顶点位置不规则、邻接关系不规则，没有一个全局的正交基能像小波那样&quot;局部又紧支撑&quot;。<\/p>\n<p>可行的替代路线有三条：<\/p>\n<ol><li>\n<strong>用 Laplace 特征向量当基<\/strong>（第 5 章那套）：低频模态近似全局形状，但它们是全局支撑的（一个模态在整个曲面上都非零），所以&quot;局部特征&quot;很难只用少数几个模态表示。\n<\/li><li>\n<strong>用局部字典<\/strong>：在每个点附近构造小字典（局部平面、局部二次曲面、局部特征基），让系数稀疏。这就是&quot;局部稀疏&quot;路线。\n<\/li><li>\n<strong>用不光滑基的冗余字典<\/strong>：把有限元的线性基、多项式基、甚至&quot;尖锐特征&quot;专用基一起放进字典，让稀疏选择自己挑（书里 8.2.3 就是用这种冗余字典拟合带尖锐特征的曲面）。\n<\/ol>\n<h3>概念 2：稀疏编码、字典学习、L1、低秩<\/h3>\n<p><strong>稀疏编码<\/strong>（难度：进阶）。给定字典 D（一堆&quot;原子&quot;向量），把一个信号 y 表示成少数原子的组合：<\/p>\n<pre><code>min_x |x|_0   subject to  y ≈ D x<\/code><\/pre>\n<p><code>|x|_0<\/code> 是&quot;非零元素的个数&quot;。这个目标组合爆炸，不可解，于是换成它的凸松弛：<\/p>\n<pre><code>min_x |y − D x|² + λ |x|_1<\/code><\/pre>\n<p><strong>L1 正则为什么产生稀疏<\/strong>（难度：高难）。几何直觉：二维平面上，约束 |y − Dx|² ≤ ε 是一个椭圆，惩罚 λ|x|_1 的等值线是一个菱形。椭圆去碰菱形时，最容易碰到的位置是菱形的<strong>尖角<\/strong>，而尖角正好在坐标轴上——也就是说某个分量为 0。相比之下，L2 的等值线是圆，圆和椭圆相切的位置一般不在坐标轴上，所以 L2 只会让系数&quot;变小&quot;，不会让它们&quot;变没&quot;。<\/p>\n<p>这就是 L1 与 L2 的全部差别。它可以用一个 2 维的例子手算验证：y = (1, 1)，字典是标准基。L2 解为 (0.5, 0.5)（两个都非零）；L1 在 λ 稍大时解为 (1, 0) 或 (0, 1)（一个是 0）。<strong>所以 L1 是&quot;选择&quot;，L2 是&quot;压缩&quot;。<\/strong><\/p>\n<p><strong>字典学习<\/strong>（难度：高难）。字典本身也未必已知，可以和系数交替优化：<\/p>\n<pre><code>交替：固定 D 求 x（稀疏编码） → 固定 x 求 D（最小二乘）<\/code><\/pre>\n<p>这就是 K-SVD 一类算法。几何里的用法是：从一堆形状块里学出&quot;典型局部形状&quot;，再用它们稀疏表示新形状。<\/p>\n<p><strong>低秩优化<\/strong>（难度：高难）。要求矩阵 X 的<strong>秩<\/strong>尽量小。秩小意味着&quot;行与行高度相关&quot;（信息冗余）。几何里的漂亮应用是<strong>模型正朝向<\/strong>：人造模型（椅子、桌子、车）大多沿坐标轴有对称性，所以当模型摆正时，它在三个坐标平面上的投影图像具有<strong>更低秩<\/strong>（投影图的每一行几乎相同）。于是&quot;找朝向&quot;就变成&quot;找一个旋转，使三个投影矩阵的秩（的核范数）最小&quot;。这是一个可验证的判断依据，完全不需要训练数据。<\/p>\n<p><strong>压缩感知<\/strong>（难度：高难）。如果信号本身在某基下稀疏，那么用远少于维数的随机测量也能恢复它——因为稀疏约束把&quot;无穷多解&quot;压成了唯一解。几何里的应用如&quot;从少量采样恢复曲面细节&quot;：假设细节在某字典下稀疏，用少量点拟合出系数。<\/p>\n<h3>概念 3：稀疏与低秩在几何处理里的具体用法<\/h3>\n<p>书里 8.2 节列了一串应用，它们共享一个套路：<strong>把问题写成&quot;数据项 + 稀疏/低秩正则&quot;，然后解&quot;。<\/strong><\/p>\n<ul><li>\n<strong>网格去噪<\/strong>：用边上的微分算子（相邻顶点的差分）作为&quot;稀疏域&quot;，假设噪声在微分域里不稀疏、而真实形状的微分在多数地方接近 0（平坦区域），于是&quot;让微分稀疏&quot;就等于&quot;把噪声当异常值剔除&quot;。这比第 2 章的 Laplacian 光顺更保特征，因为它允许少数地方（棱线）微分很大而不被惩罚。\n<\/li><li>\n<strong>带尖锐特征的曲面重建<\/strong>：用冗余字典（光滑基 + 不光滑基）稀疏选择，能拟合褶皱、尖点。\n<\/li><li>\n<strong>形状匹配<\/strong>：把&quot;两张网格的对应&quot;写成稀疏的少数控制点形变（大部分区域不需要形变）。\n<\/li><li>\n<strong>混合蒙皮<\/strong>：把蒙皮权重矩阵分解成&quot;少数几个姿态基&quot;的组合（低秩），从而能用少量参数表达很多姿态。\n<\/li><li>\n<strong>法向估计<\/strong>：把法向场分解为&quot;光滑主成分 + 稀疏异常&quot;，异常处就是特征。\n<\/ul>\n<h3>概念 4：机器学习基础（本章的&quot;工具段&quot;）<\/h3>\n<p>书里用一节把机器学习的框架讲了一遍，核心就三段：<\/p>\n<ol><li>\n<strong>任务<\/strong>：分类（这个三角形属于哪个部位）、回归（预测法向）、生成（造一个新形状）、对应（找点对点关系）。\n<\/li><li>\n<strong>模型<\/strong>：多层感知机（MLP，全连接层堆叠）、卷积网络（CNN，局部连接 + 权共享 + 池化）、循环网络（RNN，处理序列）。\n<\/li><li>\n<strong>方法<\/strong>：定义损失函数 → 用梯度反传更新参数 → 用验证集选超参数、防过拟合（正则、dropout、数据增广）。\n<\/ol>\n<p>这一节的价值不在深度，而在于它把&quot;几何问题&quot;翻译成了&quot;标准的监督学习问题&quot;，让后面 8.4 节的方法有了共同语言。<\/p>\n<h3>概念 5：深度学习做几何的四种姿势<\/h3>\n<p><strong>① 把三角形特征排成&quot;假图像&quot;<\/strong>（难度：进阶）。既然 CNN 只认规则网格，那就硬造一个：给每个三角形算几十个几何特征（曲率、PCA、SDF 值、形状直径、面积等），拼成 600 维向量，再<strong>重排成 30×20 的矩阵<\/strong>，然后直接套 CNN 做分割/标注。这本质上是用&quot;特征工程 + 排列&quot;绕过不规则性。书里也指出：<strong>排列顺序与矩阵形状对结果有影响<\/strong>——说明这种&quot;假图像&quot;并不真正尊重网格结构。<\/p>\n<p><strong>② 点云网络 PointNet<\/strong>（难度：进阶）。点云是无序集合，网络必须对输入顺序不敏感。PointNet 的做法极其简洁：<\/p>\n<ul><li>\n对每个点独立做 MLP（升维到 1024），得到每点特征；\n<\/li><li>\n对所有点做<strong>最大池化<\/strong>（逐维取最大），得到一个全局向量；\n<\/li><li>\n再拼回每点特征做分类/分割。\n<\/ul>\n<p>为什么对顺序不敏感？因为<strong>最大值与顺序无关<\/strong>——一排数取最大，你把它重新排列，最大值不变。这就是&quot;对称函数&quot;的作用。<\/p>\n<p>怎么处理旋转？加一个&quot;变换网络&quot;（T-Net）学一个 3×3（或 64×64 特征空间）的矩阵，把输入（或特征）先乘一下再往下传，相当于让网络自己&quot;摆正&quot;输入。书里还强调它同时具有&quot;局部与全局&quot;的性质：逐点 MLP 抓局部，池化抓全局，两者拼接。<\/p>\n<p><strong>③ 流形上的网络<\/strong>（难度：高难）。直接在曲面上做卷积：邻域按<strong>测地距离<\/strong>（沿曲面走的最短距离）定义，卷积核在每个切平面上定义，再把邻域点的特征按&quot;极坐标 (角度, 半径)&quot;分箱聚合（Geodesic CNN 一类）。难点在于：切平面的朝向不唯一（要选一个参考方向），且不同点的局部坐标系要对齐，否则卷积核转一下就失效。<\/p>\n<p><strong>④ 端到端生成与配准<\/strong>（难度：高难）。生成模型（VAE/GAN/自编码器）学&quot;形状的分布&quot;，能从随机向量采样出新形状；用 RNN（或点递归网络）做非刚性配准，因为它能一步一步&quot;读取&quot;点云并累积状态。这两类方法的共同点是：<strong>它们不再优化几何能量，而是直接输出结果<\/strong>，因此速度快，但可控性差（很难保证输出不外翻、不穿模）。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[几何信号&lt;br/&gt;不规则定义域] --&gt; B[稀疏表达]\n    B --&gt; B1[局部字典]\n    B --&gt; B2[冗余字典 + L1 选择]\n    B --&gt; B3[低秩约束]\n    B1 --&gt; C[去噪 / 重建 / 匹配]\n    B2 --&gt; C\n    B3 --&gt; C2[正朝向 / 蒙皮降维]\n    A --&gt; D[学习型方法]\n    D --&gt; D1[人工特征 + CNN&lt;br/&gt;三角形排成假图像]\n    D --&gt; D2[PointNet&lt;br/&gt;逐点 MLP + 最大池化]\n    D --&gt; D3[流形卷积&lt;br/&gt;测地邻域]\n    D --&gt; D4[生成模型 / RNN 配准]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：上半部分是&quot;用数学结构换表达效率&quot;（不需要训练数据），下半部分是&quot;用数据换表达效率&quot;（需要训练数据）。看这张图要抓住本质区别：稀疏/低秩方法有明确的数学保证但表达力有限；学习方法表达力强但可控性和泛化性依赖数据。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：手工能量像&quot;老师给的标准答案&quot;——你按规则算，一定对，但规则之外的情况不会处理；学习方法像&quot;看过一万道题的学生&quot;——遇到新题能凭感觉答，答得可能很妙，也可能离谱。<strong>失效边界<\/strong>：学生只在&quot;题型分布内&quot;可靠；模型遇到训练集里没有的拓扑（比如带洞的手柄）、不同的尺度、噪声水平时，表现可能骤降。<\/p>\n<p><strong>实例（L1 的稀疏性手算）<\/strong>：信号 y = 1（一维），字典 D = 1，惩罚 λ = 0.3。L2 目标 |1 − x|² + 0.3 x²，求导 2(x − 1) + 0.6x = 0 得 x = 2/2.6 ≈ 0.769（非零）。L1 目标 |1 − x|² + 0.3|x|，当 x &gt; 0 时求导 2(x − 1) + 0.3 = 0 得 x = 0.85；当 x &lt; 0 时得 x = 1.15（不可行，取负则解为 0.85 的镜像）。但若 λ 增大到 1.5，正区间解为 x = (2 − 1.5)/2 = 0.25，继续增大到 2 时 x = 0——<strong>解被&quot;压到&quot;零<\/strong>。这展示了 L1 的&quot;阈值化&quot;行为：小系数直接归零，大系数只减一点。<\/p>\n<p><strong>实例（低秩正朝向的量化）<\/strong>：一把椅子摆正时，沿 x 轴方向投影到 yz 平面，每一层（每个 x 切片）的形状几乎一样，所以投影矩阵的秩接近 1；把它旋转 45°，每层形状都在变，秩升高（可能到 5—10）。因此&quot;求使秩最小的旋转&quot;就是求正朝向。秩的凸替代是核范数（奇异值之和），可用 SVD 迭代求解。<strong>这个例子的可验证之处<\/strong>：你拿一个有轴对称性的模型，手工算两个朝向的投影矩阵的奇异值衰减速度，正朝向一定更快。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;L1 一定比 L2 好&quot;<\/strong>——实际上 L1 在有相关特征时不稳定（它随机挑一个，丢弃另一个），且对尺度敏感；L2 虽不稀疏但解唯一稳定。选择取决于你要&quot;挑选&quot;还是&quot;平滑&quot;。\n<\/li><li>\n<strong>别以为&quot;把三角形特征排成矩阵喂 CNN 就等价于在网格上做卷积&quot;<\/strong>——实际上这种排列与网格拓扑无关，交换三角形顺序结果就变（书里也点明了这一点），所以它学不到&quot;邻接关系&quot;这种真正的几何结构。\n<\/li><li>\n<strong>别以为&quot;PointNet 对旋转天然不变&quot;<\/strong>——实际上最大池化只解决<strong>顺序不变<\/strong>；旋转要靠 T-Net 学一个变换矩阵来&quot;抵消&quot;，而 T-Net 本身是学出来的，不保证精确抵消（正交性也只是加正则近似保证）。\n<\/li><li>\n<strong>别以为&quot;生成模型能替代物理模拟&quot;<\/strong>——实际上生成模型学的是&quot;看起来合理的形状分布&quot;，它不保证力平衡、体积守恒、不自交；要做可信的动画仍得靠第 7 章的物理。\n<\/li><li>\n<strong>别以为&quot;深度学习不需要几何算子&quot;<\/strong>——实际上几乎所有成功的几何网络，输入都是曲率、法向、测地距离、Laplace 特征这些算子算出来的量。网络替代的是&quot;能量设计&quot;，不是&quot;几何计算&quot;。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n（单选）L1 正则产生稀疏解的直接原因是什么？\n<p>A. 它是凸函数　B. 它的等值线有尖角，最优点容易落在坐标轴上　C. 它的梯度更大　D. 它等价于 L0 <strong>答案<\/strong>：B。<strong>解析<\/strong>：菱形等值线与数据项椭圆相切处常在尖角，对应某分量为零；L2 的圆形等值线不会。<\/p>\n<\/ol>\n<ol><li>\n（单选）PointNet 对输入点顺序不敏感，靠的是？\n<p>A. 卷积　B. 循环网络　C. 逐点 MLP + 对称的池化函数（最大池化）　D. 图拉普拉斯 <strong>答案<\/strong>：C。<strong>解析<\/strong>：逐点独立提特征，再用与顺序无关的对称函数聚合。<\/p>\n<\/ol>\n<ol><li>\n（填空）低秩正朝向方法的核心观察是：人造模型摆正时，其在三个坐标平面上的投影矩阵具有＿＿＿＿，因此可用＿＿＿＿作为可优化的替代目标。\n<p><strong>答案<\/strong>：更低的秩（行高度相关）；核范数（奇异值之和，秩的凸松弛）。<\/p>\n<\/ol>\n<ol><li>\n（简答）为什么几何信号比图像信号更难做稀疏表达？\n<p><strong>答案要点<\/strong>：图像定义在规则格点上，有局部紧支撑的正交基（小波）；几何定义在不规则流形上，Laplace 特征向量是全局支撑的，无法表示局部细节，因此需要局部字典或冗余字典，且字典本身往往要学。<\/p>\n<\/ol>\n<ol><li>\n（简答）在什么情况下你会坚持用手工能量而不是学习方法？\n<p><strong>答案要点<\/strong>：需要可解释性、需要严格保证（不翻转、体积守恒、水密、拓扑正确）、训练数据不足或分布外输入多、需要实时可控编辑时。学习方法在&quot;感知类任务&quot;（分割、对应、生成）上更强，在&quot;硬约束类任务&quot;（可打印、可仿真）上不如优化可靠。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n三条稀疏路径：局部字典、冗余字典 + L1 选择、低秩约束；L1 是&quot;选择&quot;，L2 是&quot;压缩&quot;。\n<\/li><li>\n深度几何的四个姿势：假图像 CNN、PointNet（对称池化）、流形卷积（测地邻域）、生成/递归模型。\n<\/li><li>\n网络替代的是&quot;能量设计&quot;，几何算子仍是输入；硬约束任务别指望网络保出来。\n<\/ul>", "kind": "chapter", "title": "第 8 章：基于机器学习的几何处理"}, "ch09": {"html": "<h1>第 9 章：新型几何处理应用<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★☆☆ | <strong>预估学时<\/strong>：3 小时 | <strong>前置<\/strong>：第 2 章的重建、第 3—4 章的网格处理、第 7 章的物理模拟\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说出重定向行走的三类增益，并解释场景映射为什么是一个&quot;保形优化问题&quot;。\n<\/li><li>\n列出 3D 打印的四类几何约束，并判断一个模型打印失败的最可能原因。\n<\/li><li>\n说明机器人自主扫描为什么要&quot;沿着边界探索&quot;，以及 Poisson 场在这里的作用。\n<\/li><li>\n说出&quot;分割 + 识别联合求解&quot;比&quot;先分割再识别&quot;好在哪里。\n<\/li><li>\n把前八章的方法映射到这三类真实场景里（哪一章在哪一步被用到）。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>前三类应用看似互不相干，本质是同一个转变：<strong>从&quot;几何好不好看&quot;变成&quot;几何在真实约束下能不能用&quot;<\/strong>——人走不过去、打印机装不下、机器人扫不全，这些约束会反过来改写算法目标。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：重定向行走——让人在 3 平方米里走 30 米<\/h3>\n<p>VR 里最大的物理限制是房间太小。<strong>重定向行走<\/strong>（难度：进阶）的思路是：人的视觉与本体感觉（前庭/肌肉感觉）不一致时，在一定范围内大脑会自动纠偏而不察觉。于是可以利用这个&quot;感知容差&quot;做三件事：<\/p>\n<ul><li>\n<strong>平移增益<\/strong>：虚拟里走 1 米，现实里只让你走 0.8 米（增益 1.25）。增益在 0.6—1.6 附近人通常察觉不到差异（个体差异大）。\n<\/li><li>\n<strong>旋转增益<\/strong>：虚拟里转 30°，现实只转 25°。注意人对旋转更敏感，增益范围比平移窄得多。\n<\/li><li>\n<strong>传送/重新定向<\/strong>：直接把你&quot;瞬移&quot;到另一处，或用&quot;门户&quot;设计让空间首尾相接。\n<\/ul>\n<p><strong>场景映射<\/strong>（难度：高难）。更激进的做法是改造虚拟场景的<strong>几何<\/strong>，让它在真实场地里走起来不越界。书里把它写成一个带五项约束的优化：<\/p>\n<ol><li>\n<strong>保形<\/strong>：变形后的虚拟场景要与原来尽量像（用共形扭曲度量，柯西-黎曼方程满足时映射保角）；\n<\/li><li>\n<strong>局部等距<\/strong>：不同位置的形变要按需分配（有些区域不能拉，有些可以缩）；\n<\/li><li>\n<strong>边界约束<\/strong>：虚拟场景的边界要落在真实场地的可行区域内；\n<\/li><li>\n<strong>避障<\/strong>：映射后不能把虚拟障碍物搬到真实障碍物上；\n<\/li><li>\n<strong>多用户一致<\/strong>：多个用户同时在场时，要保证他们&quot;在虚拟里相遇&quot;时&quot;在现实里也靠近&quot;。\n<\/ol>\n<p>数学上它是&quot;求一个尽可能保形的映射 + 一组位置相关的缩放&quot;，用优化求解。这一步的巧妙之处在于：<strong>它把&quot;空间不足&quot;从硬件问题变成了几何变形问题<\/strong>。<\/p>\n<h3>概念 2：3D 打印——所有约束最终都变成几何问题<\/h3>\n<p>3D 打印（难度：进阶）可以粗暴地分成&quot;打印前&quot;和&quot;打印中&quot;，几何处理集中在打印前。<\/p>\n<p><strong>工艺相关<\/strong>（难度：进阶）：<\/p>\n<ul><li>\n<strong>切片<\/strong>：把模型切成一层层二维轮廓（等价于求一组水平面与网格的交线，第 1 章的网格求交裁剪在这里出场）。\n<\/li><li>\n<strong>支撑结构<\/strong>：悬垂面（法向朝下、倾角超过约 45°）需要支撑，否则会塌。生成支撑=在模型下方&quot;种柱子&quot;并保证可拆除。\n<\/li><li>\n<strong>路径规划<\/strong>：每一层的填充方式（直线、蜂窝、螺旋），影响强度与时间。\n<\/li><li>\n<strong>中空与壁厚<\/strong>：实体打印太贵，通常做成&quot;外壳 + 内部稀疏填充&quot;。壁厚不能太薄（强度不够），也不能太厚（材料浪费）。\n<\/ul>\n<p><strong>结构与物理性能<\/strong>（难度：高难）：<\/p>\n<ul><li>\n<strong>站立/旋转稳定<\/strong>：打印出来的物体要能站稳（重心投影落在支撑多边形内）、旋转时（比如陀螺）要稳定。书里给的写法是一个优化：min 形状偏差 + 到目标重心的投影距离，通过<strong>内部挖空或局部变形<\/strong>来调重心——注意这里改的是内部结构，外观不变。\n<\/li><li>\n<strong>强度<\/strong>：打印件的强度有方向性（层间结合弱），所以模型摆放方向、填充方向都要考虑受力方向。\n<\/li><li>\n<strong>大模型分解<\/strong>：打印空间有限，大模型必须切成几块。切分时要考虑：切口尽量避开外观细节、切块要能装配（加榫卯）、每块都要能放进打印空间、尽量少用支撑。书里提到把外观细节部分贴附到内部凸多面体上的做法，节省材料与时间。\n<\/li><li>\n<strong>装箱/紧凑<\/strong>：多件一起打印时，如何摆放最省空间（这是三维装箱问题，NP 难，用启发式）。\n<\/ul>\n<p>一个真实判断：<strong>模型打印失败最常见的原因不是&quot;几何有错&quot;，而是&quot;悬垂没支撑&quot;或&quot;壁太薄&quot;<\/strong>。这两条都能在切片前的几何检查里发现。<\/p>\n<h3>概念 3：机器人——扫得到、看得懂、抓得准<\/h3>\n<p><strong>自主扫描与重建<\/strong>（难度：进阶）。机器人拿着深度相机，要在未知环境里把场景扫全。经典做法是<strong>基于边界的探索<\/strong>：把&quot;已探索的自由区域&quot;与&quot;未知区域&quot;的交界定义为<strong>边界（frontier）<\/strong>，每步选一个边界作为目标移动过去，因为那里最可能带来新信息。这解决&quot;往哪走&quot;。<\/p>\n<p>书里提到的另一种做法用 <strong>Poisson 场<\/strong>规划：在已知/未知区域上构造一个势场（未知区域是&quot;势的源&quot;），机器人沿势的梯度走，自然被&quot;吸&quot;向未探索的地方。这比 frontier 更平滑、更适合连续控制。<\/p>\n<p>扫描的几何难点：<strong>位姿漂移<\/strong>（走一段后累计误差，地图错位）与<strong>闭环<\/strong>（回到起点要闭合）。解决办法是配准（第 2 章的 ICP）加后端优化（图优化/回环检测）。<\/p>\n<p><strong>场景理解<\/strong>（难度：高难）。扫完要&quot;看懂&quot;：把点云分割成物体并识别类别。书里介绍的<strong>联合分割与识别<\/strong>很关键：不要&quot;先分割再识别&quot;，而是：<\/p>\n<ul><li>\n先过分割（切成很多小块）；\n<\/li><li>\n对每块算分类似然（这块像椅子还是桌子）；\n<\/li><li>\n用&quot;区域生长 + 融合&quot;：反复尝试把相邻块合并，如果合并后<strong>整块<\/strong>的分类似然更高，就合并；直到再合并不提高为止。\n<\/ul>\n<p>为什么这样更好？因为分割边界本身是不可靠的（噪声、遮挡会让边界切错），而&quot;这块整体像不像椅子&quot;是一个更强的信号，可以用它反过来修正边界。这是一个很实用的工程哲学：<strong>当两个子问题互相依赖时，联合求解比流水线稳。<\/strong><\/p>\n<p><strong>机械臂 3D 打印<\/strong>（难度：进阶）。把打印头装在机械臂上，就能打印超出打印箱尺寸的大物体（机械臂活动范围更大），也能打印&quot;长在现有物体上&quot;的结构。几何难点是：机械臂有可达性约束（姿态、碰撞、奇异位形），所以切片路径必须同时满足&quot;能打印&quot;与&quot;能到达&quot;——这又把问题变成一个带约束的路径规划。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[前八章的几何技术] --&gt; B[重定向行走]\n    A --&gt; C[3D 打印]\n    A --&gt; D[机器人]\n    B --&gt; B1[感知容差&lt;br/&gt;平移 / 旋转 / 传送]\n    B --&gt; B2[场景映射&lt;br/&gt;保形 + 避障 + 多用户]\n    C --&gt; C1[切片与求交&lt;br/&gt;第1章]\n    C --&gt; C2[支撑 中空 强度&lt;br/&gt;几何约束]\n    C --&gt; C3[分解与装配&lt;br/&gt;装箱]\n    D --&gt; D1[边界探索 / Poisson 场]\n    D --&gt; D2[配准与回环&lt;br/&gt;第2章]\n    D --&gt; D3[分割 + 识别 联合]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：三类应用都在&quot;消费&quot;前八章的技术。看这张图要抓住一条：<strong>应用章节不是新技术，而是约束的叠加<\/strong>——同一个重建算法，在机器人场景里多了&quot;实时、漂移、可达&quot;的限制；同一个网格处理，在打印场景里多了&quot;悬垂、壁厚、装得下&quot;的限制。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：这三类应用像&quot;把实验室里的菜端上餐桌&quot;。重定向行走是&quot;盘子太小，把菜重新摆盘&quot;（改场景）；3D 打印是&quot;烤箱太小、有的食材会塌，得改刀工和摆法&quot;（改结构）；机器人是&quot;让服务员自己在陌生厨房里找东西、还得认得出是什么&quot;（改感知与决策）。<strong>失效边界<\/strong>：实验室里&quot;形状保真&quot;是唯一目标，餐桌上还要考虑成本、时间、安全——这就是为什么本章的方法都以&quot;多目标优化&quot;的形式出现。<\/p>\n<p><strong>实例（重定向增益的可算）<\/strong>：房间 4 m × 4 m，虚拟场景要求的行走路径周长 40 m。若只靠平移增益 1.4，最多把 40 m 压缩到 40/1.4 ≈ 28.6 m，仍然远超房间能提供的有效路径（考虑转身和安全距离，实际可用约 12—15 m）。所以必须叠加&quot;传送&quot;或&quot;场景映射折叠&quot;：把虚拟场景在空间上折叠（比如把一条长走廊映射成&quot;绕圈&quot;），才能把 40 m 塞进 4 m 见方的房间。<strong>这个估算能让你立刻判断&quot;单纯调增益够不够&quot;。<\/strong><\/p>\n<p><strong>实例（悬垂角与支撑）<\/strong>：一个圆锥，锥顶朝上、底面朝下，侧面与水平面夹角 60°（即悬垂角 30°，小于 45°），不需要支撑。把它倒过来（锥顶朝下），侧面变成 60° 悬垂（超过 45°），必须加支撑，否则下面几层会塌。同一形状、两种摆法，支撑需求完全不同——<strong>这就是&quot;打印方向&quot;必须优化的原因<\/strong>。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;重定向行走只靠调增益就行&quot;<\/strong>——实际上增益的可容忍范围很窄（旋转尤其窄），大范围位移必须靠传送或场景映射，否则用户会晕或察觉。\n<\/li><li>\n<strong>别以为&quot;3D 打印的几何处理就是切片&quot;<\/strong>——实际上切片只是最后一步；支撑、中空、强度、分解装配、装箱都在切片之前决定成败。\n<\/li><li>\n<strong>别以为&quot;模型重心稳定只要看几何中心&quot;<\/strong>——实际上重心与质量分布有关，中空结构、多材料都会改变重心；所以&quot;挖空&quot;既是省料手段，也是调重心手段。\n<\/li><li>\n<strong>别以为&quot;机器人扫描就是多拍几张拼起来&quot;<\/strong>——实际上位姿漂移会让拼接错位，必须做配准与回环优化；而且&quot;往哪扫&quot;本身是一个决策问题（边界探索）。\n<\/li><li>\n<strong>别以为&quot;先分割再识别是标准流程，所以联合求解是多此一举&quot;<\/strong>——实际上分割边界依赖识别结果（不知道是椅子就不知道椅子该到哪儿结束），联合求解正是为了解决这个循环依赖。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n（单选）重定向行走中，人对哪类增益最敏感（可容忍范围最窄）？\n<p>A. 平移增益　B. 旋转增益　C. 视场角增益　D. 时间增益 <strong>答案<\/strong>：B。<strong>解析<\/strong>：前庭系统对旋转非常敏感，旋转增益的可容忍区间远窄于平移。<\/p>\n<\/ol>\n<ol><li>\n（单选）3D 打印时&quot;悬垂面&quot;的判定依据是？\n<p>A. 面积大小　B. 法向与竖直方向的夹角（相对水平面倾角小于约 45°）　C. 顶点数量　D. 曲率符号 <strong>答案<\/strong>：B。<strong>解析<\/strong>：悬垂角超过约 45° 时，下方没有材料支撑，必须加支撑。<\/p>\n<\/ol>\n<ol><li>\n（填空）机器人自主扫描中，把&quot;自由区域&quot;与&quot;未知区域&quot;的交界称为＿＿；用势场规划时，通常把＿＿当作势的源，机器人沿梯度移动。\n<p><strong>答案<\/strong>：边界（frontier）；未知区域。<\/p>\n<\/ol>\n<ol><li>\n（简答）为什么&quot;联合分割与识别&quot;比&quot;先分割再识别&quot;更稳？\n<p><strong>答案要点<\/strong>：分割边界在噪声/遮挡下不可靠，而&quot;整块的分类似然&quot;提供全局语义约束；联合求解时，合并相邻块若提升整体似然则合并，等于用语义反过来修正边界，避免把同一物体切碎或把两个物体并成一块。<\/p>\n<\/ol>\n<ol><li>\n（简答）大尺寸模型打印时，分解成多块要考虑哪些几何因素？\n<p><strong>答案要点<\/strong>：每块要能放进打印空间（尺寸约束）；切口要避开外观细节、尽量少支撑；块间要能装配（榫卯/定位特征）；各块的打印方向要利于强度；整体重心与稳定性；材料与时间成本（可把细节贴附到内部凸多面体上省料）。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n三类应用共享一个转变：从&quot;形状保真&quot;到&quot;约束下的可用&quot;。约束（空间、工艺、可达性）会改写优化目标。\n<\/li><li>\n重定向行走靠感知容差 + 场景变形；3D 打印的成败在切片之前的支撑/壁厚/分解/重心；机器人靠边界探索 + 配准回环 + 联合分割识别。\n<\/li><li>\n遇到&quot;两个子问题互相依赖&quot;（分割↔识别、扫描↔重建、切片↔可达），优先考虑联合求解而不是流水线。\n<\/ul>", "kind": "chapter", "title": "第 9 章：新型几何处理应用"}, "mix": {"html": "<h1>《离散几何处理与应用》测验<\/h1>\n<p>每章 4 题，覆盖该章核心结论与常见误解。做错的题回到对应概念页复习，再重做。<\/p>\n<h2>第 1 章 几何处理的数学基础<\/h2>\n<h3>Q1.（单选）一个闭合球面网格的离散高斯曲率（角度亏欠）总和是多少？<\/h3>\n<ul><li>\nA. 0\n<\/li><li>\nB. 2π\n<\/li><li>\nC. 4π\n<\/li><li>\nD. 与剖分密度成正比\n<p><strong>答案<\/strong>：C <strong>解析<\/strong>：离散高斯-博内定理给出总和 = 2πχ，球面 χ = V − E + F = 2，因此 4π，与剖分无关。<\/p>\n<\/ul>\n<h3>Q2.（单选）哪种表示能够精确表达一个圆？<\/h3>\n<ul><li>\nA. 三次样条\n<\/li><li>\nB. B-样条\n<\/li><li>\nC. 有理样条 NURBS\n<\/li><li>\nD. 均匀 B 样条\n<p><strong>答案<\/strong>：C <strong>解析<\/strong>：非有理多项式样条只能逼近圆锥曲线；有理样条分子分母同为多项式，可精确表示圆、椭圆，并在投影变换下保持形式。<\/p>\n<\/ul>\n<h3>Q3.（填空）某顶点有 3 个邻居，每条边的余切权重和为 1.2，混合面积 A_i = 0.4。则离散 Laplace 前的系数 1/(2A_i) 为＿＿，Δx_i 等于该系数乘以＿＿。<\/h3>\n<p><strong>答案<\/strong>：1.25；Σ_j (x_j − x_i) <strong>解析<\/strong>：1/(2×0.4) = 1.25；整个算子为 1.25 × 1.2 × Σ(x_j − x_i) = 1.5Σ(x_j − x_i)。<\/p>\n<h3>Q4.（简答）为什么三次样条&quot;C² 连续&quot;却&quot;不局部&quot;？<\/h3>\n<p><strong>答案<\/strong>：系数由覆盖全部控制点的线性系统联立求出，改一个控制点会改变方程组右端项，所有段都要重解。 <strong>解析<\/strong>：局部性取决于&quot;每段是否只依赖自己的数据&quot;。埃尔米特样条每段只由两个端点位置与切向决定，才真正局部。<\/p>\n<h2>第 2 章 点云曲面重建和光顺<\/h2>\n<h3>Q1.（单选）ICP 每轮迭代包含哪两步？<\/h3>\n<ul><li>\nA. 特征提取与分类\n<\/li><li>\nB. 找最近点对应与解闭式最优变换\n<\/li><li>\nC. 三角化与抽等值面\n<\/li><li>\nD. 估法向与双边滤波\n<p><strong>答案<\/strong>：B <strong>解析<\/strong>：ICP 的核心是&quot;对应—求解&quot;交替；它只是交替下降，因此只保证局部最优。<\/p>\n<\/ul>\n<h3>Q2.（单选）Poisson 重建求解的方程是？<\/h3>\n<ul><li>\nA. ∇f = 0\n<\/li><li>\nB. Δf = ∇·V\n<\/li><li>\nC. f 等于距离场\n<\/li><li>\nD. ∇×V = 0\n<p><strong>答案<\/strong>：B <strong>解析<\/strong>：由&quot;求 f 使 ∇f ≈ V&quot;的最小二乘正规方程得到；左边是 Laplace，右边是法向场的散度。<\/p>\n<\/ul>\n<h3>Q3.（填空）Delaunay 三角剖分的&quot;最小角最大化&quot;性质带来的实际好处是＿＿；而显式重建方法最怕＿＿和＿＿。<\/h3>\n<p><strong>答案<\/strong>：三角形更接近正三角形、网格质量好，离散算子不会因钝角出现负权重；噪声；采样缺失（导致不水密） <strong>解析<\/strong>：质量与算子稳定性直接相关；显式方法依赖精确的 Delaunay 结构，噪声与缺失会改变结构或留下无约束区域。<\/p>\n<h3>Q4.（简答）双边滤波为什么能保住棱线？<\/h3>\n<p><strong>答案<\/strong>：值域核按法向差异降权，跨棱邻居法向差别大，权重趋于零，几乎不参与平均。 <strong>解析<\/strong>：空间核决定&quot;看多远&quot;，值域核决定&quot;谁能参与&quot;。二者相乘后，跨棱平滑被自动抑制。<\/p>\n<h2>第 3 章 网格曲面的参数化和多分辨率表示<\/h2>\n<h3>Q1.（单选）Tutte 定理保证参数化不翻转的条件是？<\/h3>\n<ul><li>\nA. 权重全为正、边界映射到凸多边形\n<\/li><li>\nB. 网格是闭合的\n<\/li><li>\nC. 使用余切权重\n<\/li><li>\nD. 三角形都接近等边\n<p><strong>答案<\/strong>：A <strong>解析<\/strong>：闭合曲面还需先切开；余切权重可能为负，反而破坏前提。<\/p>\n<\/ul>\n<h3>Q2.（单选）QEM 决定坍缩哪条边的依据是？<\/h3>\n<ul><li>\nA. 边最长\n<\/li><li>\nB. 相邻三角形面积最大\n<\/li><li>\nC. 坍缩后到相关平面族的距离平方和最小\n<\/li><li>\nD. 顶点度数最高\n<p><strong>答案<\/strong>：C <strong>解析<\/strong>：二次型可累加，坍缩后 Q = Q_i + Q_j，误差取该二次型的最小值。<\/p>\n<\/ul>\n<h3>Q3.（填空）Edgebreaker 用 5 个符号编码网格拓扑，其中 C 表示＿＿，S 表示＿＿。<\/h3>\n<p><strong>答案<\/strong>：进入一个未访问的三角形；遇到分叉、需要压栈记录 <strong>解析<\/strong>：L/R 表示左右转向、E 表示结束分支；5 个符号即可编码任意连通网格拓扑。<\/p>\n<h3>Q4.（简答）为什么参数化的扭曲能量很难优化？给出两个原因。<\/h3>\n<p><strong>答案<\/strong>：能量高度非凸（含奇异值、比值、障碍项），存在大量局部极小；防翻转约束使可行域边界附近能量趋无穷，步长必须很小。 <strong>解析<\/strong>：这也是为何工程上先用 Tutte 给初值、或用渐进参考三角形把大跳分解成小步。<\/p>\n<h2>第 4 章 网格模型的重网格化<\/h2>\n<h3>Q1.（单选）四边形全局参数化要求相邻片的坐标变换属于？<\/h3>\n<ul><li>\nA. 任意仿射变换\n<\/li><li>\nB. 90° 整数倍旋转 + 整数平移\n<\/li><li>\nC. 仅平移\n<\/li><li>\nD. 相似变换\n<p><strong>答案<\/strong>：B <strong>解析<\/strong>：只有这样才能保证公共边界上的整数格点重合，四边形顶点对齐。<\/p>\n<\/ul>\n<h3>Q2.（单选）用 (cos 4θ, sin 4θ) 表示方向场的目的是？<\/h3>\n<ul><li>\nA. 把方向归一化\n<\/li><li>\nB. 利用周期性消掉整数跳跃变量\n<\/li><li>\nC. 把向量场变成标量场\n<\/li><li>\nD. 限制角度范围\n<p><strong>答案<\/strong>：B <strong>解析<\/strong>：旋转 90° 对应 θ 加 π/2，乘 4 后加 2π，三角函数值不变，于是 4 个等价方向被压成一个点。<\/p>\n<\/ul>\n<h3>Q3.（填空）四边形网格中 3 价顶点指数为＿＿，5 价顶点指数为＿＿；球面上指数之和为＿＿。<\/h3>\n<p><strong>答案<\/strong>：+1/4；−1/4；2 <strong>解析<\/strong>：index = (4 − n)/4，Poincaré-Hopf 要求 Σindex = χ，球面 χ = 2，因此至少 8 个 3 价顶点。<\/p>\n<h3>Q4.（简答）Morse-Smale 法为什么能产生四边形块？<\/h3>\n<p><strong>答案<\/strong>：标量场的一个鞍点有两条上行流线和两条下行流线，构成四条边界，围出一块四边形区域。 <strong>解析<\/strong>：控制质量靠设计 ψ 的特征向量（对齐棱线）与二阶导数条件（避免关键点退化）。<\/p>\n<h2>第 5 章 三维形状分析<\/h2>\n<h3>Q1.（单选）HKS 的等距不变性来自？<\/h3>\n<ul><li>\nA. 它使用了法向\n<\/li><li>\nB. 它只依赖 Laplace 的特征值/特征向量，而它们由内在度量决定\n<\/li><li>\nC. 它对坐标做了归一化\n<\/li><li>\nD. 它用了曲率\n<p><strong>答案<\/strong>：B <strong>解析<\/strong>：热扩散只依赖沿曲面的距离，弯曲纸面不改变签名；代价是分不开镜像。<\/p>\n<\/ul>\n<h3>Q2.（单选）Ncut 相比&quot;最小切口&quot;多了什么？<\/h3>\n<ul><li>\nA. 体积约束\n<\/li><li>\nB. 用 assoc 归一化，惩罚过小的块\n<\/li><li>\nC. 深度网络\n<\/li><li>\nD. 固定块数\n<p><strong>答案<\/strong>：B <strong>解析<\/strong>：分母是块与全图的连接量，切下小碎片会因分母小而得分高，从而被抑制。<\/p>\n<\/ul>\n<h3>Q3.（填空）HKS 在 t 很小时主要由＿＿决定，在 t 很大时趋于＿＿。<\/h3>\n<p><strong>答案<\/strong>：局部几何（高阶模态、细节）；常数（只剩最低频模态） <strong>解析<\/strong>：这也是为什么必须用整条曲线（多个 t）当特征，单点值没有区分度。<\/p>\n<h3>Q4.（简答）D2 形状分布为什么对旋转不敏感，又丢了什么？<\/h3>\n<p><strong>答案<\/strong>：它统计采样点对的距离分布，距离在旋转下不变；但它不记录距离出现在哪个位置、哪个方向，空间分布信息全丢。 <strong>解析<\/strong>：所以 D2 适合粗筛，不适合精细匹配。<\/p>\n<h2>第 6 章 网格曲面的形变<\/h2>\n<h3>Q1.（单选）LBS 糖纸收缩的根本原因是？<\/h3>\n<ul><li>\nA. 权重没归一化\n<\/li><li>\nB. 对&quot;变换后的位置&quot;做线性平均，而非对旋转做插值\n<\/li><li>\nC. 骨骼数量太少\n<\/li><li>\nD. 网格分辨率不足\n<p><strong>答案<\/strong>：B <strong>解析<\/strong>：两个 90° 差异的旋转，位置中点会落到关节内侧，长度缩为 0.707 倍；DQS 插值旋转以减轻此现象。<\/p>\n<\/ul>\n<h3>Q2.（单选）梯度域形变最终求解的是？<\/h3>\n<ul><li>\nA. ∇×u = 0\n<\/li><li>\nB. L v&#x27; = b（离散 Poisson）\n<\/li><li>\nC. 特征值问题\n<\/li><li>\nD. v&#x27; = Σ w_j R_j v\n<p><strong>答案<\/strong>：B <strong>解析<\/strong>：把&quot;保微分&quot;写成最小二乘，正规方程即 Laplace 矩阵乘新坐标等于目标微分项。<\/p>\n<\/ul>\n<h3>Q3.（填空）ARAP 的局部步固定＿＿、求＿＿；全局步固定＿＿、解＿＿线性系统。<\/h3>\n<p><strong>答案<\/strong>：顶点位置；每个三角形的最优旋转（SVD 解 Procrustes）；所有旋转；稀疏 <strong>解析<\/strong>：交替进行，能量单调下降，可能停在局部极小。<\/p>\n<h3>Q4.（简答）为什么&quot;直接令 ∇f = u&quot;常常无解，必须先做 Helmholtz 分解？<\/h3>\n<p><strong>答案<\/strong>：任意向量场含旋转（无散）和调和分量，而梯度场必然无旋；只有先取出无旋部分（等价于解 ∇²φ = ∇·u）才存在 f。 <strong>解析<\/strong>：这一步同时解释了梯度域方法为什么稳。<\/p>\n<h2>第 7 章 网格模型的弹性运动模拟<\/h2>\n<h3>Q1.（单选）显式积分的时间步上限主要由什么决定？<\/h3>\n<ul><li>\nA. 总质量\n<\/li><li>\nB. 系统最高振动频率\n<\/li><li>\nC. 外力大小\n<\/li><li>\nD. 顶点数量\n<p><strong>答案<\/strong>：B <strong>解析<\/strong>：稳定条件 h ≤ 2/ω_max；网格越细 ω_max 越高，步长必须越小。<\/p>\n<\/ul>\n<h3>Q2.（单选）投影动力学每步的线性系统有什么特点？<\/h3>\n<ul><li>\nA. 每步重新分解\n<\/li><li>\nB. 左边矩阵恒定，可预分解，每步只回代\n<\/li><li>\nC. 是非线性系统\n<\/li><li>\nD. 是特征值问题\n<p><strong>答案<\/strong>：B <strong>解析<\/strong>：左边只与网格和权重有关，与当前位置无关。<\/p>\n<\/ul>\n<h3>Q3.（填空）子空间模拟把未知量从＿＿个降到＿＿个；它在＿＿与＿＿两类场景下会失效。<\/h3>\n<p><strong>答案<\/strong>：3N；K；大幅非线性形变；局部尖锐碰撞 <strong>解析<\/strong>：前者使线性化基失效，后者需要被截断的高频模态。<\/p>\n<h3>Q4.（简答）为什么&quot;网格加密会让弹簧质点模型变硬&quot;？<\/h3>\n<p><strong>答案<\/strong>：刚度定义在边上，边变短后同样的绝对位移对应更大的相对伸长，等效刚度上升，最高频也上升。 <strong>解析<\/strong>：要跨分辨率一致，需按边长重标定刚度，或改用有限元的连续介质参数。<\/p>\n<h2>第 8 章 基于机器学习的几何处理<\/h2>\n<h3>Q1.（单选）L1 正则产生稀疏解的直接原因是？<\/h3>\n<ul><li>\nA. 它是凸函数\n<\/li><li>\nB. 等值线有尖角，最优点易落在坐标轴上\n<\/li><li>\nC. 梯度更大\n<\/li><li>\nD. 等价于 L0\n<p><strong>答案<\/strong>：B <strong>解析<\/strong>：菱形等值线与数据项椭圆相切处常在尖角；L2 的圆形等值线不会。<\/p>\n<\/ul>\n<h3>Q2.（单选）PointNet 对输入顺序不敏感靠的是？<\/h3>\n<ul><li>\nA. 卷积\n<\/li><li>\nB. 循环网络\n<\/li><li>\nC. 逐点 MLP + 对称池化（最大池化）\n<\/li><li>\nD. 图拉普拉斯\n<p><strong>答案<\/strong>：C <strong>解析<\/strong>：最大值与顺序无关；旋转则另靠 T-Net 学变换近似抵消。<\/p>\n<\/ul>\n<h3>Q3.（填空）低秩正朝向方法依赖的观察是：人造模型摆正时，其在三个坐标平面上的投影矩阵具有＿＿；可优化的替代目标是＿＿。<\/h3>\n<p><strong>答案<\/strong>：更低的秩（行高度相关）；核范数（奇异值之和） <strong>解析<\/strong>：秩的凸松弛让问题可解，且完全不需要训练数据。<\/p>\n<h3>Q4.（简答）为什么几何信号比图像信号更难稀疏表达？<\/h3>\n<p><strong>答案<\/strong>：图像定义在规则格点上，有局部紧支撑的正交基；几何定义在不规则流形上，Laplace 特征向量是全局支撑的，无法表示局部细节。 <strong>解析<\/strong>：因此需要局部字典、冗余字典 + L1，或让网络学基。<\/p>\n<h2>第 9 章 新型几何处理应用<\/h2>\n<h3>Q1.（单选）重定向行走中人对哪类增益最敏感？<\/h3>\n<ul><li>\nA. 平移增益\n<\/li><li>\nB. 旋转增益\n<\/li><li>\nC. 视场角增益\n<\/li><li>\nD. 时间增益\n<p><strong>答案<\/strong>：B <strong>解析<\/strong>：前庭系统对旋转极敏感，旋转增益的可容忍区间远窄于平移。<\/p>\n<\/ul>\n<h3>Q2.（单选）3D 打印中&quot;悬垂面&quot;的判定依据是？<\/h3>\n<ul><li>\nA. 面积大小\n<\/li><li>\nB. 法向与竖直方向夹角（相对水平面倾角小于约 45°）\n<\/li><li>\nC. 顶点数量\n<\/li><li>\nD. 曲率符号\n<p><strong>答案<\/strong>：B <strong>解析<\/strong>：超过约 45° 的悬垂下方无材料支撑，必须加支撑结构。<\/p>\n<\/ul>\n<h3>Q3.（填空）机器人自主扫描把&quot;自由区域&quot;与&quot;未知区域&quot;的交界称为＿＿；用势场规划时通常把＿＿当作势源。<\/h3>\n<p><strong>答案<\/strong>：边界（frontier）；未知区域 <strong>解析<\/strong>：沿势的梯度移动，机器人会被&quot;吸&quot;向信息量最大的地方。<\/p>\n<h3>Q4.（简答）为什么&quot;联合分割与识别&quot;比&quot;先分割再识别&quot;更稳？<\/h3>\n<p><strong>答案<\/strong>：分割边界在噪声/遮挡下不可靠，而整块的分类似然提供全局语义约束；合并相邻块若提升整体似然则合并，等于用语义修正边界。 <strong>解析<\/strong>：两个子问题互相依赖时，联合求解优于流水线。<\/p>\n<h2>综合测验<\/h2>\n<h3>Q1.（单选）下列哪一项<strong>不需要<\/strong>求解全局稀疏线性系统？<\/h3>\n<ul><li>\nA. 调和参数化\n<\/li><li>\nB. 梯度域形变\n<\/li><li>\nC. Poisson 重建\n<\/li><li>\nD. QEM 边坍缩的选边\n<p><strong>答案<\/strong>：D <strong>解析<\/strong>：QEM 的选边是优先队列 + 局部 3×3 求解；前三者都要解全局稀疏系统。<\/p>\n<\/ul>\n<h3>Q2.（单选）第 1 章的离散 Laplace 算子在第 5 章被用来做什么？<\/h3>\n<ul><li>\nA. 计算 Hausdorff 距离\n<\/li><li>\nB. 构造 HKS 与谱聚类（Ncut）\n<\/li><li>\nC. 生成四边形网格\n<\/li><li>\nD. 处理碰撞\n<p><strong>答案<\/strong>：B <strong>解析<\/strong>：谱方法都需要 Laplace 的特征值/特征向量；Hausdorff 依赖距离，四边形化依赖方向场，碰撞依赖约束。<\/p>\n<\/ul>\n<h3>Q3.（填空）从数学结构上看，第 6 章的梯度域形变、第 7 章的投影动力学、第 2 章的 Poisson 重建都共享同一个模式：先构造＿＿，再解＿＿。<\/h3>\n<p><strong>答案<\/strong>：局部微分/梯度目标；全局 Poisson（或 Laplace）方程 <strong>解析<\/strong>：这就是&quot;局部-全局&quot;模式在全书的三次复用。<\/p>\n<h3>Q4.（简答）为什么&quot;四边形化球面不可能没有奇异点&quot;？请用指数与欧拉示性数说明。<\/h3>\n<p><strong>答案<\/strong>：index = (4 − n)/4，只有 4 价顶点指数为 0；Poincaré-Hopf 要求闭合曲面 Σindex = χ，球面 χ = 2，因此必须有非零指数的顶点（如 8 个 3 价，或等价组合）。 <strong>解析<\/strong>：这说明奇异点是拓扑必然，不是算法缺陷。<\/p>\n<h3>Q5.（简答）给定一份带噪声、有遮挡缺失的文物扫描点云，请给出处理流程并说明每一步的理由。<\/h3>\n<p><strong>答案<\/strong>：① 配准（多视角拼接）：用特征粗配准 + ICP 精修，避免局部最优；② 去噪/法向估计：先做局部拟合（MLS）或法向双边滤波，为后续提供可靠法向；③ 隐式重建（筛选 Poisson）：梯度拟合对噪声稳、能补出封闭面，八叉树 + 多重网格保证可解；④ 光顺（保特征的 Taubin 或法向滤波）修残留噪声；⑤ 重网格化（如需仿真）。若缺失区域关键，需人工补洞或标明不可信区域。 <strong>解析<\/strong>：评分要点是&quot;为什么不用显式重建（怕噪声缺失）&quot;和&quot;重建后再光顺的顺序不能反&quot;。<\/p>\n<h3>Q6.（简答）如果你要在移动端实时编辑一个 5 万顶点的网格（拖拽骨架 + 保体积），会选择哪些技术组合？说明取舍。<\/h3>\n<p><strong>答案<\/strong>：子空间形变（低频模态或样本 PCA 作基）承担自由度降维；能量用 ARAP 或梯度域（保局部细节），并加体积约束/内部体图防塌陷；交互帧用预分解的常量矩阵（投影动力学式）加速；离线预处理特征分解与矩阵分解。取舍：牺牲极端形变精度与局部尖锐细节，换取毫秒级响应；若需要精确接触或大幅非线性，则退回完整非线性求解。 <strong>解析<\/strong>：评分要点是识别&quot;自由度、能量、求解器&quot;三层各自的降本手段，并说明代价。<\/p>\n<h2>最终检验（项目式）<\/h2>\n<p><strong>任务<\/strong>：任选一个真实模型（例如一把椅子或一个手办），完成一条从扫描/下载网格到&quot;可仿真、可打印&quot;的完整链路，并写一份技术报告。<\/p>\n<p>要求：<\/p>\n<ol><li>\n说明数据来源与预处理（配准/去噪），给出 Hausdorff 距离或顶点数等可量化指标；\n<\/li><li>\n做一次参数化，说明切缝选择理由与扭曲度量（报告最大角度扭曲或面积扭曲）；\n<\/li><li>\n做一次简化或重网格化，对比前后单元质量（最小角、边长比）；\n<\/li><li>\n做一次形变（骨架或梯度域），展示一个&quot;会塌陷&quot;的失败案例与修正后的结果；\n<\/li><li>\n若做打印：检查悬垂、壁厚、重心，给出支撑方案或分解方案。\n<\/ol>\n<p>评分要点：每一步的<strong>方法选择有理由<\/strong>（不是&quot;我用了 X&quot;，而是&quot;因为数据有 Y 问题，所以选 X&quot;）；数值指标可复核；失败案例与修正手段写清楚。<\/p>", "kind": "chapter", "title": "综合测验与最终检验"}, "c01": {"html": "<h1>离散 Laplace 算子与余切权重<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 1、2、3、5、6、7 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>把&quot;这个顶点比邻居平均高出多少&quot;写成一个可以矩阵化的量：Δx_i = (1/(2A_i)) Σ_j (cot α_ij + cot β_ij)(x_j − x_i)。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是全书复用次数最多的算子。第 2 章的光顺用它，第 3 章的参数化解 Δu = 0，第 5 章的 HKS 用它算特征值，第 6 章的梯度域形变解 L v&#x27; = b，第 7 章的物理模拟里 ∇²u = Gᵀ∇g 也是它。学会看懂这一个式子，后面六章的能量函数就不会陌生。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    A[顶点 i 与邻居 j] --&gt; B[边两侧角 α β]\n    B --&gt; C[权重 w = cot α + cot β]\n    C --&gt; D[Δx_i = 加权邻居差 / 2A_i]\n    D --&gt; E1[光顺&lt;br/&gt;x + εΔx]\n    D --&gt; E2[参数化&lt;br/&gt;Δu = 0]\n    D --&gt; E3[形变&lt;br/&gt;L v = b]\n    D --&gt; E4[谱签名&lt;br/&gt;特征值]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：左边是&quot;权重怎么来&quot;，右边是&quot;用到哪&quot;。要看出的关键点是：所有下游用法都不再重新发明算子，只是换约束和目标。<\/p>\n<h2>详解<\/h2>\n<p><strong>为什么不是简单平均<\/strong>（难度：进阶）。最朴素的想法是 Δx_i = (1/deg(i)) Σ_j (x_j − x_i)，即均匀权重。它在规则网格上没问题，但在不规则三角网格上不收敛：把网格细分，均匀权重的结果与真实 Laplace 值差一个只与网格形状有关的因子，误差不消失。<\/p>\n<p><strong>余切的来历<\/strong>（难度：高难）。余切权重不是凑出来的，而是从&quot;分片线性函数在三角形上的积分&quot;直接算出来的。推导的骨架是：在三角形上，梯度是常数（分片线性函数），把梯度的内积在三角形上积分，得到<\/p>\n<pre><code>ʃ_T ∇φ_i · ∇φ_j dA = −(1/2)(cot θ_k)     （i、j 是 T 的两个顶点，θ_k 是第三顶点处的角）\nʃ_T ∇φ_i · ∇φ_i dA = (1/2)(cot θ_j + cot θ_k)<\/code><\/pre>\n<p>把所有相邻三角形加起来，就得到 Δx_i = (1/2)Σ_j (cot α + cot β)(x_j − x_i)（A_i 归到前面或吸收进权重，取决于约定）。这里 α、β 就是边 (i, j) 两侧对着这条边的两个角。这个推导同时解释了两件事：<strong>为什么系数是 1/(2A)<\/strong>（面积来自积分），以及<strong>为什么钝角会让权重为负<\/strong>（钝角的余切为负）。<\/p>\n<p><strong>数值例子<\/strong>（可手算）。等边三角形，边长 1，角 60°，cot 60° = 1/√3 ≈ 0.5774。某条内部边两侧各有一个 60°，权重 w = 1.1547。若顶点 i 的混合面积 A_i = 0.4330（单个等边三角形面积 √3/4），则<\/p>\n<pre><code>Δx_i = (1/(2×0.4330)) × 1.1547 × Σ_j (x_j − x_i) = 1.333 Σ_j (x_j − x_i)<\/code><\/pre>\n<p>系数 1.333 = 4/3。这不是巧合：对正四面体（每个顶点 3 个邻居、3 个 60° 角），这个值使算子在该网格上精确对应&quot;球面&quot;的离散化。<\/p>\n<p><strong>混合面积<\/strong>（难度：进阶）。A_i 不是简单把一圈三角形面积加起来除以 3，而是&quot;每个三角形按其内角是否为钝角来分配&quot;：锐角三角形贡献整面积的 1/3；钝角三角形把面积按&quot;外心位置&quot;分给钝角顶点更多/更少。这一修正让算子在钝角网格上仍然收敛。工程实现里，粗略用&quot;一圈面积和 / 3&quot;也能跑，但收敛阶会降。<\/p>\n<p><strong>矩阵形式<\/strong>（难度：进阶）。把所有顶点排成向量 x，Δx = −L x，其中 L 是稀疏矩阵：对角元 L_ii = Σ_j w_ij/(2A_i)，非对角元 L_ij = −w_ij/(2A_i)。L 对称、行和为 0（所以常数向量在核里，平移不改变 Δx）。这两个性质让它成为各种最小二乘的天然矩阵，也是&quot;解 Laplace 方程&quot;能直接用 Cholesky 分解的原因。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;权重只与边长有关&quot;<\/strong>——实际上余切只与<strong>角度<\/strong>有关，边长变长角度不变时权重不变。这就是它对尺度不敏感、对形状敏感的原因。\n<\/li><li>\n<strong>别以为&quot;钝角三角形只是精度差一点&quot;<\/strong>——实际上钝角使权重为负，矩阵可能不再对角占优，求解会出现&quot;负扩散&quot;（相当于反向热传导），表现为光顺时局部鼓起。\n<\/li><li>\n<strong>别以为&quot;Δx 为零就是平面&quot;<\/strong>——实际上 Δx 为零只说明&quot;等于邻居平均&quot;，球面网格上也有近似为零的地方（顶点在局部近似平面上）。判定平面要看曲率，不看 Δx。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>1.3.2<\/td><td>离散微分几何<\/td><td>余切权重算子、平均曲率法向<\/td><\/tr><tr><td>2.4<\/td><td>曲面光顺<\/td><td>显式 Laplacian 光顺与 Taubin<\/td><\/tr><tr><td>3.1<\/td><td>调和参数化<\/td><td>内部顶点满足 Δu = 0<\/td><\/tr><tr><td>5.1.2<\/td><td>HKS<\/td><td>用 L 的特征值/特征向量构造签名<\/td><\/tr><tr><td>5.3<\/td><td>图割与随机游走<\/td><td>L 作为图的拉普拉斯<\/td><\/tr><tr><td>6.2<\/td><td>梯度域形变<\/td><td>解 L v&#x27; = b<\/td><\/tr><tr><td>7.1<\/td><td>投影动力学<\/td><td>∇²u = Gᵀ∇g 的系数矩阵<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：向量的点积、三角形面积、余切的定义\n<\/li><li>\n后续：离散高斯曲率（角度亏欠）、梯度域形变、HKS\n<\/li><li>\n对照：均匀权重（简单但不收敛）、重心权重（恒正，适合 Tutte 定理）\n<\/ul>", "kind": "concept", "title": "离散 Laplace 算子与余切权重"}, "c02": {"html": "<h1>离散高斯曲率与角度亏欠<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 1、2、4、5 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>顶点一圈三角形的内角和与 2π 的差，K_i = 2π − Σθ_i，就是该点的离散高斯曲率。<\/p>\n<h2>为什么重要<\/h2>\n<p>它提供了一个&quot;不需要拟合曲面、不需要估法向、只靠角度就能算曲率&quot;的量。第 4 章判断方向场奇异点的分布、第 5 章做曲率聚类分割，都依赖它。更重要的是，它满足<strong>离散高斯-博内定理<\/strong>（总和恒为 2πχ），这给了我们一个几乎零成本的网格拓扑体检指标。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[顶点 i 一圈三角形] --&gt; B[角度和 Σθ]\n    B --&gt; C[K_i = 2π − Σθ]\n    C --&gt; D{符号}\n    D --&gt;|正| E[像球面 凸]\n    D --&gt;|零| F[像平面或柱面 可展]\n    D --&gt;|负| G[像马鞍 凹]\n    C --&gt; H[全网格求和 = 2π·欧拉示性数]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：看符号就够了——正负直接告诉你局部像球、像平板、还是像马鞍。底下那条恒等式是校验用。<\/p>\n<h2>详解<\/h2>\n<p><strong>为什么角度和能代表曲率<\/strong>（难度：进阶）。在平面上绕一点一圈，角度和正好 2π，&quot;没有多也没有少&quot;。放到曲面上，绕一点一圈的角度和相对 2π 的差值，恰好对应&quot;这块曲面比平面多/少了多少面积&quot;——而面积盈余正是高斯曲率的积分。球面上三角形内角和大于 π（超出的部分叫角超，等于该三角形上的高斯曲率积分），所以绕球面一点一圈，角度和不足 2π，亏欠为正；马鞍处角度和超过 2π，亏欠为负。<\/p>\n<p><strong>数值例子<\/strong>（可手算）。正四面体（4 顶点、6 边、4 面，全等边）：<\/p>\n<ul><li>\n每个顶点周围 3 个 60° 角，Σθ = 180° = π；\n<\/li><li>\nK_i = 2π − π = π ≈ 3.1416；\n<\/li><li>\n4 个顶点总计 4π；\n<\/li><li>\n校验：V − E + F = 4 − 6 + 4 = 2，2πχ = 4π。一致。\n<\/ul>\n<p>再算一个圆柱侧面（可展曲面）：若用规则四边形网格（每个顶点 4 个 90° 角），Σθ = 2π，K = 0。这正符合&quot;柱面高斯曲率为零&quot;。但注意：<strong>柱面在三维空间里是弯的<\/strong>——它的平均曲率不为零。这就把&quot;高斯曲率&quot;（内在的）与&quot;平均曲率&quot;（外在的）区分开了。<\/p>\n<p><strong>离散高斯-博内定理<\/strong>（难度：进阶）。对任意闭合三角网格：<\/p>\n<pre><code>Σ_i K_i = 2π (V − E + F) = 2π χ<\/code><\/pre>\n<p>这条式子对任何剖分都成立，与三角形大小、形状无关。所以它是一个<strong>拓扑不变量<\/strong>，用途有三个：<\/p>\n<ol><li>\n<strong>体检<\/strong>：算出来的总和不对，说明网格有洞、有重复面、有非流形边；\n<\/li><li>\n<strong>约束<\/strong>：在第 4 章的四边形化里，奇异点的总指数必须与 χ 匹配，否则无解；\n<\/li><li>\n<strong>校验算法<\/strong>：任何曲率估计方法都应该在闭合网格上满足这条恒等式，不满足说明归一化写错了。\n<\/ol>\n<p><strong>与平均曲率的关系<\/strong>（难度：高难）。高斯曲率只依赖内在度量（可以只靠角度算出来），平均曲率依赖外在形状（法向怎么弯）。这就是为什么&quot;角度亏欠&quot;能给出 K，但要算 H 必须用第 1 章的平均曲率法向算子（含顶点位置）。记住这条分界线，可以避免在很多算法里用错量。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;离散曲率必须靠拟合曲面&quot;<\/strong>——实际上角度亏欠完全不需要拟合，也不需要用顶点坐标（它只用角度）。这是它最实用的地方。\n<\/li><li>\n<strong>别以为&quot;K 为 0 就是平面&quot;<\/strong>——实际上柱面、锥面（可展面）的 K 也是 0，但它们是弯的。K = 0 只说明&quot;内在平坦&quot;。\n<\/li><li>\n<strong>别以为&quot;单个顶点的 K 可以任意大&quot;<\/strong>——实际上 K_i 有上界 2π（当 Σθ = 0 时取到），下界取决于顶点价数（价越多，Σθ 可以越大，K 越负）。所以&quot;负曲率可以无限负&quot;是错的，它受局部拓扑限制。\n<\/li><li>\n<strong>别以为&quot;面积加权后的 K 更准确&quot;<\/strong>——实际上粗略的&quot;角度亏欠 / 混合面积&quot;会放大噪声，工程上常用&quot;角度亏欠直接当顶点曲率、再乘以面积当积分量&quot;的写法，两者用途不同。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>1.3.2<\/td><td>离散算子<\/td><td>角度亏欠 = 离散高斯曲率；Gauss-Bonnet<\/td><\/tr><tr><td>2.4<\/td><td>光顺/特征检测<\/td><td>用曲率区分特征与噪声<\/td><\/tr><tr><td>4.2<\/td><td>方向场奇异点<\/td><td>指数与曲率/拓扑的对应<\/td><\/tr><tr><td>5.1.2 / 5.3<\/td><td>描述子、分割<\/td><td>曲率作为局部特征与聚类输入<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：主曲率、高斯曲率、欧拉示性数\n<\/li><li>\n后续：平均曲率法向算子、方向场奇异点指数\n<\/li><li>\n对照：平均曲率（外在、需位置）、高斯曲率（内在、只需角度）\n<\/ul>", "kind": "concept", "title": "离散高斯曲率与角度亏欠"}, "c03": {"html": "<h1>样条家族：从三次样条到 NURBS<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 1、3 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>用多段低次多项式拼出光滑曲线的一套约定：连续阶、局部性、能否精确表示圆锥曲线，是三种样条（三次样条、Bézier/B-样条、有理样条）互相区别的三条坐标轴。<\/p>\n<h2>为什么重要<\/h2>\n<p>CAD 工业的标准表示是 NURBS，第 1 章把它作为&quot;参数曲面&quot;的代表；第 3 章的参数化（把网格摊开）在数学上是同一类&quot;参数映射&quot;，理解样条就理解了&quot;参数域 → 空间&quot;这个映射的基本性质（连续性、局部性、凸包性）。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    A[三次样条&lt;br/&gt;C2 全局] --&gt; B[埃尔米特&lt;br/&gt;C1 局部 需切向]\n    B --&gt; C[Bézier&lt;br/&gt;凸包 端点插值 全局]\n    C --&gt; D[B-样条&lt;br/&gt;局部支撑 不插端点]\n    D --&gt; E[有理 NURBS&lt;br/&gt;精确圆锥 投影不变]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：沿这条链看，每一步都在解决上一步的一个缺陷（不局部 → 局部；不插端点 → 可控；不能精确画圆 → 有理化）。<\/p>\n<h2>详解<\/h2>\n<p><strong>三次样条<\/strong>（难度：进阶）。n+1 个控制点、n 段三次多项式，要求接缝处函数值、一阶、二阶导连续。未知数 4n，方程 2n（插值）+ 2(n−1)（接缝）= 4n−2，缺 2 个，用边界条件（自然边界：首末二阶导为 0）补齐。解一个三对角线性系统，O(n)。<\/p>\n<p>优点：C² 光滑、插值所有控制点。 缺点：<strong>全局耦合<\/strong>，改一点要全部重算；且三次多项式在控制点之间可能产生不期望的振荡（虽然比高次多项式好得多）。<\/p>\n<p><strong>埃尔米特样条<\/strong>（难度：进阶）。给每点位置 + 切向，段内用四个基函数插值：<\/p>\n<pre><code>p(u) = p_k h00(u) + p_{k+1} h01(u) + d_k h10(u) + d_{k+1} h11(u)\nh00 = 2u³ − 3u² + 1, h01 = −2u³ + 3u²\nh10 = u³ − 2u² + u,  h11 = u³ − u²<\/code><\/pre>\n<p>完全局部（每段只依赖自己两端的数据）。检查一下基函数：u=0 时 h00=1、h10=0、h01=0、h11=0，所以 p(0)=p_k；对 u 求导在 u=0 时 h00&#x27;=0、h10&#x27;=1，所以 p&#x27;(0)=d_k。这就是&quot;插值位置和切向&quot;的含义。缺点是用户很难直接给出切向。<\/p>\n<p><strong>Bézier<\/strong>（难度：进阶）。p(u) = Σ p_k B_{k,m}(u)，B 是 Bernstein 多项式。三条性质必须记住：<\/p>\n<ul><li>\n<strong>端点插值<\/strong>：u=0 得 p_0，u=1 得 p_m；\n<\/li><li>\n<strong>凸包性<\/strong>：所有 B 非负且和为 1，所以曲线落在控制点凸包内（这保证不会乱跑，CAD 里非常重要）；\n<\/li><li>\n<strong>变差缩减<\/strong>：曲线与任意直线的交点个数不超过控制多边形的交点个数（不会比控制多边形更&quot;波动&quot;）。\n<\/ul>\n<p>数值上用 de Casteljau（反复取分点）而不是直接算幂，因为它数值稳定。<\/p>\n<p><strong>B-样条<\/strong>（难度：进阶）。把 Bernstein 基换成&quot;局部支撑&quot;的基函数（用节点向量定义），于是改变一个控制点只影响局部几段；代价是曲线不插端点（除非用重节点技巧）。B-样条是&quot;分段多项式空间&quot;的标准基，阶数 k 时连续性为 C^{k−2}。<\/p>\n<p><strong>NURBS<\/strong>（难度：高难）。p(u) = Σ w_k p_k B_k(u) / Σ w_k B_k(u)。两个决定性优势：<\/p>\n<ol><li>\n<strong>精确表示圆锥曲线<\/strong>：圆的有理表示是标准的（用权重 (1, √2/2, 1) 的三点二次有理 Bézier 可以精确画出 90° 圆弧）。这是多项式样条做不到的——多项式只能逼近圆，误差不可能为零。\n<\/li><li>\n<strong>投影不变<\/strong>：有理形式在透视投影下仍然是有理形式，所以 CAD 里&quot;透视视图与模型一致性&quot;能得到保证。\n<\/ol>\n<p>工业标准 IGES/STEP 都用 NURBS，原因就在这里。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;样条次数越高越光滑越好&quot;<\/strong>——实际上次数越高越容易振荡（龙格现象），工程上三次是最常用的折中。\n<\/li><li>\n<strong>别以为&quot;Bézier 曲线穿过所有控制点&quot;<\/strong>——实际上只穿过首末两点，中间点是&quot;吸引&quot;而非&quot;插值&quot;，这正是它易于交互设计的原因。\n<\/li><li>\n<strong>别以为&quot;B-样条是 Bézier 的简单推广，性质一样&quot;<\/strong>——实际上 B-样条牺牲了端点插值和凸包性的一部分（凸包变成局部凸包），换来了局部性。\n<\/li><li>\n<strong>别以为&quot;有理样条只是加了权重，没什么本质区别&quot;<\/strong>——实际上&quot;有理&quot;意味着它属于有理函数空间而非多项式空间，这正是它能精确表示圆、并在投影下封闭的根本原因。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>1.2.1<\/td><td>三次样条<\/td><td>C² 连续，全局耦合<\/td><\/tr><tr><td>1.2.2<\/td><td>Bézier<\/td><td>凸包性、de Casteljau<\/td><\/tr><tr><td>1.2.3<\/td><td>B-样条<\/td><td>局部支撑<\/td><\/tr><tr><td>1.2.4<\/td><td>有理样条<\/td><td>精确圆锥、投影不变<\/td><\/tr><tr><td>3.1<\/td><td>参数化<\/td><td>同属&quot;参数域→空间&quot;的映射<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：多项式、导数、凸包\n<\/li><li>\n后续：参数曲面、NURBS 曲面、网格参数化\n<\/li><li>\n对照：多边形网格（离散、任意拓扑）vs 样条（连续、受拓扑限制）\n<\/ul>", "kind": "concept", "title": "样条家族：从三次样条到 NURBS"}, "c04": {"html": "<h1>点云配准与 ICP<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 2、9 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>求一个变换把两片点云对齐；ICP 的做法是&quot;找最近点&quot;和&quot;解最优变换&quot;交替迭代，直到误差不再下降。<\/p>\n<h2>为什么重要<\/h2>\n<p>扫描、机器人定位、多视角拼接、非刚性注册（人体/表情）都以配准为第一步。它是第 2 章整条重建流水线的入口，也是第 9 章机器人建图（配准 + 回环）的核心。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[源点云 与 目标点云] --&gt; B[初值 粗配准&lt;br/&gt;特征匹配 / RANSAC]\n    B --&gt; C[找最近点对]\n    C --&gt; D[解最优刚性变换&lt;br/&gt;SVD 或四元数 闭式解]\n    D --&gt; E{误差变化小于阈值}\n    E --&gt;|否| C\n    E --&gt;|是| F[输出变换]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：注意那条回到 C 的箭头——ICP 的本质是一个循环，误差单调下降但不保证到全局最小。<\/p>\n<h2>详解<\/h2>\n<p><strong>刚性配准的闭式解<\/strong>（难度：进阶）。给定对应点对 {x_i} → {y_i}，目标是<\/p>\n<pre><code>min_{R,t} Σ |R x_i + t − y_i|²<\/code><\/pre>\n<p>分三步：<\/p>\n<ol><li>\n求质心 x̄、ȳ，把两边都平移到原点；\n<\/li><li>\n算协方差矩阵 H = Σ (x_i − x̄)(y_i − ȳ)ᵀ，做 SVD：H = U Σ Vᵀ，则 R = V Uᵀ（若 det R = −1，把 V 的最后一列取反再算）；\n<\/li><li>\nt = ȳ − R x̄。\n<\/ol>\n<p>这就是 Kabsch/Procrustes 方法，一步到位，不需要迭代。<\/p>\n<p><strong>ICP 的两步<\/strong>（难度：进阶）：<\/p>\n<ol><li>\n用当前 R、t 变换源点云，为每个点在目标点云里搜最近邻，构成对应；\n<\/li><li>\n用上面闭式解更新 R、t。\n<\/ol>\n<p><strong>为什么只收敛到局部最优<\/strong>（难度：进阶）。第一步的&quot;最近点&quot;在小变换下是可靠对应，在错误变换下会配错。一旦配错，第二步就把变换拉向&quot;迁就错误对应&quot;的方向，于是进了一个自洽的错误状态。数学上，ICP 每步都减少目标函数（因为两步分别是最优的），所以它一定收敛；但目标函数关于变换是<strong>非凸<\/strong>的（对应关系随变换变化，目标函数在对应切换处不连续），所以有多个局部极小。<\/p>\n<p><strong>改进方向<\/strong>（难度：进阶）：<\/p>\n<ul><li>\n<strong>初值<\/strong>：用特征（FPFH、SHOT）匹配 + RANSAC 找初值；或用 PCA 主轴对齐；或用上一帧的位姿（跟踪场景）。\n<\/li><li>\n<strong>度量<\/strong>：点到点 → 点到面（用目标点法向，收敛快）；或用 Chen 的&quot;法向交点&quot;作为对应。\n<\/li><li>\n<strong>鲁棒核<\/strong>：用 Huber/Tukey 核替代平方损失，抑制错误对应（扫描数据必然有局外点）。\n<\/li><li>\n<strong>采样<\/strong>：不取所有点，取法向变化大的点（信息量高）。\n<\/ul>\n<p><strong>非刚性配准<\/strong>（难度：高难）。三类典型：<\/p>\n<ol><li>\n<strong>TPS（薄板样条）<\/strong>：形变函数由&quot;弯曲能量最小&quot;约束，适合全局平滑的大形变；\n<\/li><li>\n<strong>锚点约束 + 局部形变<\/strong>：少量已知对应当锚点（硬约束），其余点由形变场拟合；\n<\/li><li>\n<strong>拟刚体（ARAP 类）<\/strong>：局部近似刚体，允许连接处拉伸，这是第 6 章 ARAP 的前身。\n<\/ol>\n<p><strong>数值例子<\/strong>（可手算）。目标点云三点：(0,0)、(2,0)、(0,2)。源点云是它们绕原点转 30° 后的位置：(0,0)、(1.732,1)、(−1,1.732)。<\/p>\n<ul><li>\n已知对应时，闭式解直接给出 R = 30°、t = 0，残差 0。\n<\/li><li>\n若初值是 0°，第一步最近点匹配会把源点 (1.732, 1) 配到目标 (2, 0)（距离 ≈ 1.03，比配到 (0,2) 的 1.9 更近），解出的旋转约 24°；下一步旋转被拉到约 30°。整个过程单调下降。\n<\/ul>\n<p>这个例子说明：小角度偏差能被纠正，但如果源点云整体转了 150°，最近点匹配会把左右关系配反，ICP 就卡在错误解上。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;ICP 收敛就说明答案对&quot;<\/strong>——实际上它只保证误差不再下降，可能是局部极小。工程上必须做误差验证（比如用 Held-out 点算残差）。\n<\/li><li>\n<strong>别以为&quot;点越多配得越准&quot;<\/strong>——实际上如果多出来的点是噪声或遮挡边缘，反而会拖坏结果。鲁棒核与采样策略比数量更重要。\n<\/li><li>\n<strong>别以为&quot;非刚性配准就是 ICP 加个形变项&quot;<\/strong>——实际上形变项必须带正则（否则所有点都能被单独拉过去，变成&quot;每个点一个答案&quot;），TPS/ARAP 都是在提供这种正则。\n<\/li><li>\n<strong>别以为&quot;配准和重建是两件事&quot;<\/strong>——实际上多视角拼接里，配准误差会直接累积成重建误差；做全局一致的配准（同时优化所有位姿）比两两配准再串起来稳得多。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>2.1.1<\/td><td>刚性配准<\/td><td>采样一致性 + ICP<\/td><\/tr><tr><td>2.1.2<\/td><td>非刚性配准<\/td><td>TPS、锚点约束、拟刚体<\/td><\/tr><tr><td>9.3.1<\/td><td>机器人扫描<\/td><td>位姿配准 + 回环<\/td><\/tr><tr><td>6.1<\/td><td>蒙皮/骨骼学习<\/td><td>同类&quot;对应—求解&quot;结构<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：SVD、旋转矩阵、最近邻搜索\n<\/li><li>\n后续：非刚性配准、ARAP、回环优化\n<\/li><li>\n对照：形状描述子匹配（无初值的粗配准）\n<\/ul>", "kind": "concept", "title": "点云配准与 ICP"}, "c05": {"html": "<h1>Voronoi / Delaunay 与 Crust 系列重建<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 1、2 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>用&quot;每个点的最近邻地盘&quot;（Voronoi）和它的对偶三角剖分（Delaunay），从点云里挑出真正属于曲面的三角形；Crust/Power Crust/Cocone 是这条路线上的三代算法。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是唯一能给&quot;理论保证&quot;的显式重建路线：采样足够密、噪声足够小时，输出与真实曲面同胚。理解它，就理解了&quot;为什么显式方法怕噪声&quot;这个结论的来历。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[点云 P] --&gt; B[Voronoi 图]\n    B --&gt; C[取极点 p+ p−&lt;br/&gt;离 p 最远的两个顶点]\n    C --&gt; D[P ∪ 极点 的 Delaunay]\n    D --&gt; E[只留三顶点都在 P 的三角形]\n    E --&gt; F[法向滤波 删锐边三角形]\n    F --&gt; G[重建曲面]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：核心动作是&quot;用极点把中轴附近的边挤走&quot;，剩下的边就贴着表面；法向滤波是最后的清理。<\/p>\n<h2>详解<\/h2>\n<p><strong>Delaunay 的四条性质<\/strong>（难度：进阶）：<\/p>\n<ol><li>\n二维下唯一（无四点共圆时）；\n<\/li><li>\n三角剖分的外边界是点集的凸包；\n<\/li><li>\n每个三角形的外接圆内不含采样点（空圆性质）；\n<\/li><li>\n最小角最大化（最接近正三角形）。\n<\/ol>\n<p>性质 4 是它在网格生成里不可替代的原因；性质 3 是 Crust 类算法能&quot;筛边&quot;的依据。<\/p>\n<p><strong>Crust 的直觉<\/strong>（难度：高难）。把 Voronoi 顶点加入采样集后重算 Delaunay：Voronoi 顶点位于中轴（到两个采样点等距的地方），它们&quot;抢走&quot;了那些穿过物体内部的边，于是剩下的边集中在表面附近。二维时这个论证是严格的（Amenta 等 1998）。<\/p>\n<p><strong>三维要加极点<\/strong>（难度：高难）。三维 Voronoi 单元形状复杂，靠全部 Voronoi 顶点不可靠。所以只取每个点的两个<strong>极点<\/strong>：Voronoi 单元里离 p 最远的两个顶点，它们通常分居表面两侧（一个在外、一个在内）。极点向量 (p⁺ − p) 近似垂直于表面——这就是能用它做<strong>法向滤波<\/strong>的原因：与极点方向差太多的三角形，说明它斜穿表面，丢掉。<\/p>\n<p><strong>Power Crust / Cocone<\/strong>（难度：高难）：<\/p>\n<ul><li>\n<strong>Power Crust<\/strong> 用带权 Voronoi（Power 图）处理<strong>采样密度不均<\/strong>：给每个点一个权重（半径），边界处的稀疏采样不会把曲面&quot;拉歪&quot;。\n<\/li><li>\n<strong>Cocone<\/strong> 用<strong>锥形条件<\/strong>：三角形的对偶 Voronoi 边必须落在以极点方向为轴、半角约 (π/2 − 采样角) 的锥内。这个条件直接保证&quot;输出是流形、法向收敛&quot;，是三代里理论最漂亮的。\n<\/ul>\n<p><strong>代价<\/strong>（难度：进阶）。三维 Delaunay 三角化的复杂度高（最坏 O(n²)，实际 O(n log n)—O(n^{4/3})），实现复杂（需要精确谓词处理退化情形）。而且对噪声敏感：噪声改变点位置 → 改变 Delaunay 结构 → 筛出的三角形错位。所以工程上&quot;高噪声数据&quot;通常直接跳过这条路线，用 Poisson（见另一篇概念页）。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;点越密越好&quot;<\/strong>——实际上理论保证要求&quot;局部特征尺度上的采样密度&quot;，薄壁两侧的点如果混在一起，Delaunay 会把两壁连成一片。\n<\/li><li>\n<strong>别以为&quot;Crust 不需要法向&quot;<\/strong>——实际上三维 Crust 一定要法向滤波，否则输出不是流形、会出现&quot;纸片&quot;。\n<\/li><li>\n<strong>别以为&quot;理论保证就意味着工程可用&quot;<\/strong>——实际上保证的前提（无噪声、无缺失、采样密度足够）在真实扫描里几乎不成立，所以显式方法主要用于&quot;高质量点云&quot;或&quot;理论分析&quot;。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>1.4.2<\/td><td>计算几何基础<\/td><td>Voronoi/Delaunay 定义与性质<\/td><\/tr><tr><td>2.2.1—2.2.4<\/td><td>显式重建<\/td><td>Crust/Power Crust/Cocone<\/td><\/tr><tr><td>2.3<\/td><td>与隐式方法对比<\/td><td>干净数据用显式，脏数据用隐式<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：Voronoi、Delaunay、中轴\n<\/li><li>\n后续：Poisson 重建（隐式路线）、重网格化（Delaunay 撒点）\n<\/li><li>\n对照：RBF/Poisson（隐式，不怕噪声）\n<\/ul>", "kind": "concept", "title": "Voronoi / Delaunay 与 Crust 系列重建"}, "c06": {"html": "<h1>Poisson 曲面重建<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 2 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>把&quot;曲面在哪&quot;变成&quot;求一个指示函数 f，使它的梯度尽量等于采样法向场&quot;，解出来就是 Poisson 方程 Δf = ∇·V，再挖它的等值面。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是工程上最稳的隐式重建方法：对噪声容忍度高、全局一致、能处理不均匀采样，是扫描数据重建的常用默认选择。它同时是&quot;梯度域&quot;思想在重建上的第一次出现，与第 6 章的形变、第 7 章的模拟共用同一套数学。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[点云 + 法向] --&gt; B[构造向量场 V&lt;br/&gt;采样法向]\n    B --&gt; C[八叉树分块&lt;br/&gt;节点基函数]\n    C --&gt; D[算散度 ∇·V]\n    D --&gt; E[解 Δf = ∇·V&lt;br/&gt;稀疏系统 多重网格]\n    E --&gt; F[取等值面&lt;br/&gt;Marching Cubes]\n    F --&gt; G[水密网格]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：整条链路的关键是&quot;不直接拟合距离，而拟合梯度&quot;。梯度对常数偏移不敏感，所以不需要知道精确距离。<\/p>\n<h2>详解<\/h2>\n<p><strong>为什么拟合梯度<\/strong>（难度：高难）。如果 f 是&quot;内部 1、外部 0&quot;的指示函数，那么 ∇f 在曲面处是指向内法向的脉冲，在别处为 0。反过来，已知法向场 V，要解<\/p>\n<pre><code>min_f  ʃ |∇f − V|²<\/code><\/pre>\n<p>正规方程（变分）就是 Δf = ∇·V。这有两个好处：<\/p>\n<ol><li>\n<strong>不需要符号距离<\/strong>：SDF 要求&quot;知道离曲面多远&quot;，这个量在噪声数据里很难估；梯度没有这个问题。\n<\/li><li>\n<strong>全局一致<\/strong>：所有采样点共同决定一个 f，噪声被平均，不会局部乱跳。\n<\/ol>\n<p><strong>离散实现<\/strong>（难度：高难）。关键是选基函数。Octree 每层用&quot;盒式滤波的 m 次卷积&quot;（即 B-样条基的近似），得到一个局部支撑、平滑的节点函数。于是：<\/p>\n<ul><li>\n每个采样点只影响它所在叶子节点及邻域（稀疏）；\n<\/li><li>\n散度向量稀疏，系统稀疏；\n<\/li><li>\n层次结构天然支持<strong>多重网格<\/strong>（粗层解完给细层当初值），解几百万未知量也可行。\n<\/ul>\n<p><strong>筛选 Poisson<\/strong>（难度：高难）。原版 Poisson 有一个偏差：它不是插值，而是最小二乘拟合梯度，所以曲面会偏离采样点（整体&quot;胀&quot;或&quot;缩&quot;）。Screened Poisson 加一项&quot;f 在采样点处要等于 0.5（或其他等值）&quot;：<\/p>\n<pre><code>min_f  ʃ |∇f − V|² + λ Σ_i (f(p_i) − c)²<\/code><\/pre>\n<p>这一项把细节拉回来，λ 小则平滑、大则贴合。这是工程上最常用的版本。<\/p>\n<p><strong>数值例子<\/strong>（一维，可手算）。设采样法向场在一维上为：内部区间的梯度为 +1（从 0 到 L），两端之外为 0。则散度 ∇·V 是两个脉冲（在 0 处 −1、在 L 处 +1）。解 Δf = ∇·V 得 f 是一个&quot;梯形&quot;：0 到 L 线性上升，两端平坦。取 f = 0.5 的等值点，正好落在 0 和 L——即曲面的位置。这个一维例子把&quot;梯度积分回位置&quot;讲清楚了。<\/p>\n<p><strong>局限<\/strong>（难度：进阶）：<\/p>\n<ul><li>\n会平滑掉小于最细八叉树层的细节（薄壁、细杆容易被糊掉）；\n<\/li><li>\n对法向质量高度敏感（法向错了，梯度就错了）；\n<\/li><li>\n非封闭、有遮挡的扫描会补出&quot;假面&quot;（因为 f 在缺口处没有约束，解会自己延伸）。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;Poisson 是最先进的重建，所以都该用它&quot;<\/strong>——实际上它牺牲细节换稳定；要求拓扑精确、特征尖锐时，Cocone 或&quot;稀疏选择重建&quot;（第 8 章）更合适。\n<\/li><li>\n<strong>别以为&quot;解 Poisson 一定要全局稠密矩阵&quot;<\/strong>——实际上八叉树基函数让它稀疏，配合多重网格可以处理千万级点云。\n<\/li><li>\n<strong>别以为&quot;结果一定是水密的&quot;<\/strong>——实际上只有采样覆盖完整才水密；有洞时 Marching Cubes 会在无约束区域自己补面，这既是优点（得到封闭体）也是缺点（补错）。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>2.3.3<\/td><td>隐式重建<\/td><td>八叉树基函数 + 多重网格<\/td><\/tr><tr><td>2.4<\/td><td>与光顺的关系<\/td><td>重建后再光顺，顺序不能反<\/td><\/tr><tr><td>6.2<\/td><td>梯度域形变<\/td><td>同一数学：∇f = V 的最小二乘<\/td><\/tr><tr><td>7.1<\/td><td>Projective Dynamics<\/td><td>∇²u = Gᵀ∇g 的同类结构<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：散度、Laplace 算子、稀疏线性系统\n<\/li><li>\n后续：筛选 Poisson、Marching Cubes\n<\/li><li>\n对照：RBF（稠密、插值）、SDF+MLS（局部的）\n<\/ul>", "kind": "concept", "title": "Poisson 曲面重建"}, "c07": {"html": "<h1>参数化：调和、共形与防翻转<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 3、4 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>给曲面上每个顶点一个平面坐标 (u, v)，要求这个映射是一一对应（不重叠、不撕裂、不翻转）；做法是解一个带约束的优化，从 Tutte 嵌入起步，再优化扭曲能量。<\/p>\n<h2>为什么重要<\/h2>\n<p>纹理贴图、曲面拟合、四边形化（第 4 章的全局参数化法）都以它为前提。它还是&quot;最小二乘 + 局部-全局迭代&quot;这套方法在二维的样板，第 6 章 ARAP 就是它的三维版本。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[网格 切开成圆盘片] --&gt; B[Tutte 嵌入&lt;br/&gt;边界→凸多边形 正权重]\n    B --&gt; C{扭曲太大?}\n    C --&gt;|是| D[优化扭曲能量&lt;br/&gt;ASAP / MIPS / ARAP]\n    D --&gt; E[防翻转&lt;br/&gt;障碍项 或 显式约束]\n    E --&gt; F{仍翻转?}\n    F --&gt;|是| G[加切缝 或 减小步长]\n    F --&gt;|否| H[输出 u v 坐标]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：Tutte 只保证&quot;不翻&quot;，不保证&quot;不扭&quot;；后面所有工作都是在&quot;减少扭曲但保持不翻&quot;之间走钢丝。<\/p>\n<h2>详解<\/h2>\n<p><strong>调和参数化<\/strong>（难度：进阶）。要求内部顶点满足 Δu = 0、Δv = 0（离散下就是&quot;坐标等于邻居加权平均&quot;）。写成方程组：<\/p>\n<pre><code>Σ_j w_ij (u_j − u_i) = 0,   w_ij = cot α_ij + cot β_ij<\/code><\/pre>\n<p>边界坐标固定，于是内部坐标是唯一解。<strong>Tutte 定理<\/strong>保证：边界凸 + 权重全正 → 映射是双射。注意余切权重可能为负（钝角），所以严格按 Tutte 用时得换成正权重（均匀权重或重心权重），代价是扭曲更大。<\/p>\n<p><strong>扭曲从哪来<\/strong>（难度：高难）。摊平必然扭曲，两类：<\/p>\n<ul><li>\n<strong>角度扭曲（共形）<\/strong>：三角形被&quot;剪歪&quot;但面积按比例缩放；\n<\/li><li>\n<strong>面积扭曲<\/strong>：角度保持但大小被改变。\n<\/ul>\n<p>数学上，映射的 Jacobian J 的奇异值 σ1、σ2 描述一切：σ1 = σ2 表示共形（相似变换），σ1 σ2 = 1 表示保面积，两者都满足就是等距（只有可展面能做到）。所以扭曲能量都是在惩罚&quot;σ1 与 σ2 的差异&quot;或&quot;σ1 σ2 偏离 1&quot;。<\/p>\n<p><strong>ASAP<\/strong>（难度：高难）。能量 E = Σ_t A_t |J_t − Z_t|²，其中 Z_t 是&quot;与 J_t 最接近的相似变换&quot;（把 J 做 SVD 后取 σ̄ = (σ1+σ2)/2 重构）。求解交替：<\/p>\n<ul><li>\n固定 Z，对顶点坐标解最小二乘（稀疏系统）；\n<\/li><li>\n固定坐标，对每个三角形重算 Z（SVD，逐三角形独立）。\n<\/ul>\n<p><strong>MIPS<\/strong>（难度：高难）。能量用 σ1/σ2（比值），比值趋于 ∞ 表示三角形退化。它的杀手级优点是：<strong>翻转时有向面积为负，能量趋于无穷<\/strong>，所以优化永远不会跨过翻转状态（自带防翻转）。代价是收敛慢、需要好的初值。<\/p>\n<p><strong>显式防翻转<\/strong>（难度：高难）。把&quot;每个三角形有向面积 &gt; 0&quot;当不等式约束，用内点法或障碍函数（如 log det）处理。好处是能配合任意能量；坏处是非凸、容易卡在局部解，且靠近边界时步长极小。<\/p>\n<p><strong>多片与切缝<\/strong>（难度：进阶）。复杂拓扑必须先切成圆盘。切缝选择的原则：沿曲率大的脊线切（切口藏在视觉不敏感处）、切缝总长度尽量短、避免穿过特征。<\/p>\n<p><strong>渐进参数化<\/strong>（难度：高难）。从 Tutte 起步时扭曲可能极大，而能量非凸。做法是构造一串&quot;中间参考三角形&quot;，使&quot;当前结果与参考之间&quot;的扭曲有界、参考逐步靠近原网格——把一个大跳跃拆成很多小步，避免一开始就陷在坏解里。<\/p>\n<p><strong>数值例子<\/strong>（可手算）。正方形网格，4 个角固定为 (0,0)、(1,0)、(1,1)、(0,1)，内部只有一个中心顶点，与四角相连，权重都取 1。中心顶点方程：<\/p>\n<pre><code>4 u_c − (0 + 1 + 1 + 0) = 0  →  u_c = 0.5\n4 v_c − (0 + 0 + 1 + 1) = 0  →  v_c = 0.5<\/code><\/pre>\n<p>中心落在正中。若把某个角的权重加大（模拟该处三角形更&quot;尖&quot;，余切更大），中心会被拉向那个角。这就是&quot;参数化结果依赖权重、权重依赖三角形状&quot;的最小例子。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;参数化就是投影&quot;<\/strong>——实际上投影在有回折的曲面上会重叠，不是双射；参数化必须解全局方程。\n<\/li><li>\n<strong>别以为&quot;Tutte 一定不翻转&quot;<\/strong>——实际上定理要求正权重 + 凸边界，余切权重在钝角处为负时会翻。\n<\/li><li>\n<strong>别以为&quot;保角和保面积能同时最优&quot;<\/strong>——实际上只有可展面能等距，一般曲面必须取舍。\n<\/li><li>\n<strong>别以为&quot;扭曲能量是凸的，所以一定能求全局最优&quot;<\/strong>——实际上含奇异值/比值的能量非凸，工程解法都依赖好的初值与渐进策略。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>3.1.1<\/td><td>单/多片参数化<\/td><td>Tutte 起步、切缝<\/td><\/tr><tr><td>3.1.2<\/td><td>局部防翻转<\/td><td>障碍函数、显式约束<\/td><\/tr><tr><td>3.1.3—3.1.4<\/td><td>局部到整体、渐进<\/td><td>分片缝合、渐进参考<\/td><\/tr><tr><td>4.2<\/td><td>四边形化<\/td><td>全局参数化 + 整数格点<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：离散 Laplace、SVD、Tutte 定理\n<\/li><li>\n后续：四边形化、纹理映射、ARAP\n<\/li><li>\n对照：调和（角度偏保）、LSCM（共形）、ARAP（局部刚体）\n<\/ul>", "kind": "concept", "title": "参数化：调和、共形与防翻转"}, "c08": {"html": "<h1>QEM 简化与渐进网格<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 3 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>用&quot;删掉这条边后新顶点到原来若干平面的距离平方和&quot;评估每次边坍缩的损失，选损失最小的先坍缩；把整个坍缩序列倒过来存，就是渐进网格。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是&quot;误差可累加&quot;的典范：一次坍缩的误差能被新顶点继承，所以整个简化过程的误差可以量化控制。第 3 章的多分辨率、第 8 章的粗化预处理都以它为基座。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[原始网格] --&gt; B[为每个顶点建二次型 Q]\n    B --&gt; C[对每条边算 (Qi+Qj) 的最小值]\n    C --&gt; D[优先队列取最小]\n    D --&gt; E[坍缩 更新邻域 Q = Qi+Qj]\n    E --&gt; F{达到目标边数?}\n    F --&gt;|否| C\n    F --&gt;|是| G[粗网格 + 坍缩记录]\n    G --&gt; H[反序执行 = 渐进网格]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：右边的&quot;反序执行&quot;是关键——简化过程本身就是可逆的多分辨率结构，不必另外建层次。<\/p>\n<h2>详解<\/h2>\n<p><strong>二次型<\/strong>（难度：进阶）。每个顶点维护<\/p>\n<pre><code>Q_i(x) = Σ_{p ∈ planes(i)} (n_pᵀ x + d_p)² = xᵀ A_i x + 2 b_iᵀ x + c_i<\/code><\/pre>\n<p>用齐次坐标写成 4×4 矩阵 Q_i，则&quot;点 x 的误差&quot;= xᵀ Q_i x（x 取齐次形式 (x, y, z, 1)）。这条式子的意思是&quot;点到与该顶点相关的所有平面的距离平方和&quot;——平面包括相邻三角形的支撑平面。<\/p>\n<p><strong>边坍缩的最优位置<\/strong>（难度：进阶）。把边 (i, j) 合成一个顶点，误差约等于 (Q_i + Q_j)(x̄)。对 x̄ 求极小：解 3×3 线性系统<\/p>\n<pre><code>(A_i + A_j) x̄ = −(b_i + b_j)<\/code><\/pre>\n<p>若矩阵奇异（退化情形），退回到&quot;取 i、j 或中点&quot;这几条候选，选误差最小者。算完得到该边的&quot;坍缩代价&quot;，放进优先队列。<\/p>\n<p><strong>为什么平面先被简化<\/strong>（难度：进阶）。平面上所有顶点都在同一组平面内，误差恒为 0。于是平面区域的边代价为 0，最先被坍缩；直到平面被压到只剩边界，代价才开始上升。而 90° 棱边上的顶点同时属于两个差异很大的平面，误差不为 0，被留到最后。<strong>这就是&quot;平面先塌、特征后动&quot;的机制<\/strong>，不是靠手工规则。<\/p>\n<p><strong>渐进网格 PM<\/strong>（难度：进阶）。把坍缩序列倒过来：每条坍缩记录包含&quot;被删的两个顶点编号、新顶点位置、受影响的三角形&quot;。从粗网格出发，逐条执行分裂（vsplit），就能得到任意精度的模型。<\/p>\n<ul><li>\n存储：粗网格 + k 条记录，比存多个 LOD 省；\n<\/li><li>\n任意分辨率：不是只支持 2—3 档，而是连续可调；\n<\/li><li>\n误差可控：每条记录都带误差值，可按预算停止。\n<\/ul>\n<p><strong>边界与属性<\/strong>（难度：进阶）。实际实现要处理：边界边（不能随便坍缩，否则轮廓变形）、属性（纹理坐标、法向要一起插值）、非流形（要保护）、自交（坍缩后要检查）。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;QEM 只是启发式，没有理论&quot;<\/strong>——实际上它是最小二乘近似下的最优位置选择，误差单调可加，是&quot;贪心但可控&quot;的典型。\n<\/li><li>\n<strong>别以为&quot;误差为 0 的边可以无限坍缩&quot;<\/strong>——实际上平面区域确实会被压到极小，但要保留至少一个三角形（否则拓扑丢失）；实现里要加&quot;不产生非流形/不删光面&quot;的保护。\n<\/li><li>\n<strong>别以为&quot;简化到很低面数还能保住细节&quot;<\/strong>——实际上 QEM 保的是&quot;到平面族的距离&quot;，对尖锐特征（棱、尖角）只能保住位置，保不住细节形状（那需要特征保持的变体，如加特征边约束）。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>3.2.1<\/td><td>网格简化<\/td><td>QEM 边坍缩<\/td><\/tr><tr><td>3.2.2<\/td><td>多分辨率<\/td><td>渐进网格 PM<\/td><\/tr><tr><td>3.3.4—3.3.6<\/td><td>压缩<\/td><td>渐进编码、序列编码<\/td><\/tr><tr><td>8.2<\/td><td>学习型处理<\/td><td>常以简化网格为输入<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：最小二乘、优先队列、平面方程\n<\/li><li>\n后续：渐进网格、渐进压缩、LOD 渲染\n<\/li><li>\n对照：重网格化（换采样而非减顶点）\n<\/ul>", "kind": "concept", "title": "QEM 简化与渐进网格"}, "c09": {"html": "<h1>方向场、周期跳跃与奇异点<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 4 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>在每个顶点给出 4 个等价的正交切向（交叉场），它规定四边形网格往哪铺；跨块时需要&quot;旋转 90° 的整数倍&quot;来对齐，转不回来的点就是奇异点。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是四边形化从&quot;艺术&quot;变成&quot;可计算&quot;的关键：把&quot;网格怎么铺&quot;变成一个可以全局优化、可以证明约束的场。奇异点的分布直接决定四边形网格的质量。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[输入曲面] --&gt; B[求交叉场&lt;br/&gt;4 个等价方向]\n    B --&gt; C[跨边的整数跳跃 k]\n    C --&gt; D[优化能量 + 约束]\n    D --&gt; E[奇异点 由 k 的绕数决定]\n    E --&gt; F[按场抽取四边形网格]\n    F --&gt; G[3价 5价 顶点出现在奇异点处]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：奇异点不是缺陷，而是场的拓扑必然产物；网格的&quot;五星点&quot;就是它的可视化。<\/p>\n<h2>详解<\/h2>\n<p><strong>为什么需要 4 个等价方向<\/strong>（难度：进阶）。四边形网格的一个单元有两族平行边，方向 ±u 与 ±v 都给同一族边。所以场是&quot;无朝向&quot;的：把 u 换成 −u、或把 (u, v) 换成 (v, u)，铺出来的网格一样。这就是 C4 对称（4 阶循环）的来源。<\/p>\n<p><strong>两种表示<\/strong>（难度：高难）：<\/p>\n<ol><li>\n<strong>带整数跳跃的表示<\/strong>。在每条边 e 上记整数 k_e，表示&quot;跨过 e 时方向编号要循环移 k 步&quot;。优化时 k_e 是离散变量，问题变成混合整数规划。\n<\/li><li>\n<strong>三角函数表示<\/strong>。把角度乘 4：ξ = (cos 4θ, sin 4θ)。旋转 90° 对应 θ + π/2，乘 4 后是 +2π，三角函数值不变——<strong>整数变量自动消失<\/strong>，优化变成连续问题。\n<\/ol>\n<p>第二种是主流，因为它把一个离散组合问题变成了普通的向量场光滑问题（最小化 Dirichlet 能量 ʃ|∇ξ|²）。<\/p>\n<p><strong>奇异点怎么产生<\/strong>（难度：高难）。绕顶点走一圈，场必须回到原值。在乘 4 的表示里，&quot;回到原值&quot;要求累积转角是 2π 的整数倍。如果累积转角是 2π×m 且 m 非零，这个点就有非零指数。换算回四边形网格，优雅的记账方式是用价 n：<\/p>\n<pre><code>index = (4 − n) / 4      3 价 → +1/4，5 价 → −1/4<\/code><\/pre>\n<p>而<strong>Poincaré-Hopf 定理<\/strong>要求闭合曲面上 Σ index = χ。球面 χ = 2，所以至少需要 8 个 +1/4（即 8 个 3 价顶点），或等价的组合。这就是&quot;四边形球面不可能没有奇异点&quot;的严格理由。<\/p>\n<p><strong>整数约束的求解<\/strong>（难度：高难）。带整数变量的能量常用&quot;松弛—取整&quot;策略：先把 k 当连续变量解二次规划，再把最接近整数的固定，优化剩余，反复迭代。书里强调：<strong>一次性全部取整会得到奇异点过多、非常不光顺的场<\/strong>，逐步取整才有效。<\/p>\n<p><strong>特征对齐与度量定制<\/strong>（难度：高难）：<\/p>\n<ul><li>\n<strong>对齐<\/strong>：在特征边上，要求场的方向与该边一致（或成 45°）；边界处要求方向沿边界。\n<\/li><li>\n<strong>密度<\/strong>：用 2×2 对称正定矩阵 g（度量张量）替代欧氏度量，其特征向量给方向、特征值给密度。约束 g 正定很麻烦，技巧是写 g = exp(G)（G 任意对称），指数映射保证正定，把不等式约束变成无约束。\n<\/ul>\n<p><strong>数值例子<\/strong>（可验证）。平面上取&quot;径向 + 切向&quot;场：绕一圈，方向转 360°，而 4 个等价方向只认 90° 的整数倍，360° = 4×90° → 整数，无奇异点（指数 0）。<\/p>\n<p>把场改成一个常数 45° 方向并带一次&quot;扭转&quot;：绕一圈累积 360°，但 45° 不在 4 个等价方向的集合里，累积不是 90° 的整数倍 → 中心必须有奇异点，指数 +1/4（3 价）。<strong>这个对比用一张纸就能画出，是理解周期跳跃的最快方式。<\/strong><\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;奇异点是算法缺陷，应该消除&quot;<\/strong>——实际上它们的总指数受拓扑下界约束，能做的只有&quot;放到合适的位置、均匀分布&quot;。\n<\/li><li>\n<strong>别以为&quot;乘 4 的表示只是换元，结果一样&quot;<\/strong>——实际上它改变了优化问题的性质（连续 vs 混合整数），这是可行与不可行的区别。\n<\/li><li>\n<strong>别以为&quot;方向场光滑了网格就好看&quot;<\/strong>——实际上网格质量还取决于奇异点位置与密度场；奇异点挤在一起会导致局部三角形畸变。\n<\/li><li>\n<strong>别以为&quot;整数取整可以最后一次性做&quot;<\/strong>——实际上取整顺序影响解的质量，逐步取整才能得到少奇异点的场。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>4.2.1<\/td><td>方向场驱动四边形化<\/td><td>周期跳跃、整数相容<\/td><\/tr><tr><td>4.2.2<\/td><td>Morse-Smale<\/td><td>用标量场替代方向场<\/td><\/tr><tr><td>4.3.2<\/td><td>标架场<\/td><td>三维推广（对称标架的 9 维表示）<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：向量场、绕数、欧拉示性数、混合整数优化\n<\/li><li>\n后续：四边形抽取、标架场、六面体\n<\/li><li>\n对照：Morse-Smale（用标量场切块）\n<\/ul>", "kind": "concept", "title": "方向场、周期跳跃与奇异点"}, "c10": {"html": "<h1>标架场与六面体重网格化<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 4 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>在每个点给出 3 个互相垂直的方向（标架），用它约束体参数化，再抽整数等值面就得到六面体网格；难在标架有 24 种对称、奇异结构是线而不是点。<\/p>\n<h2>为什么重要<\/h2>\n<p>六面体网格是有限元最想要的单元（精度与收敛速度都好），但自动生成极其困难。标架场路线是&quot;用场约束全局结构&quot;这一思路在三维的代表。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[输入网格] --&gt; B[求对称标架场&lt;br/&gt;每点3个正交方向]\n    B --&gt; C[奇异结构&lt;br/&gt;奇异线]\n    C --&gt; D[体参数化&lt;br/&gt;映射到整数格]\n    D --&gt; E[抽整数等值面]\n    E --&gt; F[六面体网格]\n    A --&gt; G[另一路线 多立方体&lt;br/&gt;积木近似 + 映射]\n    G --&gt; F<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：两条路线的区别在于&quot;全局结构从哪来&quot;——一条从场求解，一条从积木形状强制。<\/p>\n<h2>详解<\/h2>\n<p><strong>对称性带来的表示难题<\/strong>（难度：高难）。3 个正交方向，但：<\/p>\n<ul><li>\n三个方向的<strong>顺序<\/strong>可以任意排列（6 种）；\n<\/li><li>\n每个方向的正负不重要（8 种）；\n<\/li><li>\n但&quot;右手系&quot;约束会限制一部分。\n<\/ul>\n<p>总共 24 种等价表示（立方体的旋转群）。所以不能简单存 3 个向量再去插值——插值出来的往往不是正交标架。<\/p>\n<p><strong>9 维表示<\/strong>（难度：高难）。经典做法是用<strong>球面调和函数<\/strong>把对称性编码：把标架展开成 l=0 与 l=4 的球面调和的组合（因为 3 个方向与其相反方向构成的多项式在旋转下不变），得到一个 9 维向量（1 + 4 + 4 或等价的分量数）。在这个空间里：<\/p>\n<ul><li>\n距离可定义（R⁹ 中的欧氏距离），\n<\/li><li>\n光顺就是最小化相邻标架在 9 维空间中的差，\n<\/li><li>\n奇异结构从&quot;向量不连续&quot;变成&quot;9 维向量场的拓扑缺陷&quot;。\n<\/ul>\n<p><strong>奇异结构是线<\/strong>（难度：高难）。四边形网格的奇异点是孤立点（3 价/5 价顶点），六面体网格的奇异结构是<strong>线<\/strong>：沿一条线走，周围的六面体拓扑&quot;转不回来&quot;，整条线的邻域都受影响。这导致整数约束的组合爆炸（每条奇异线都是一组约束），求解难度比二维高一档。<\/p>\n<p><strong>多立方体路线<\/strong>（难度：进阶）。先用轴对齐的立方体拼出模型（像乐高），得到极其规整的结构，再把这个&quot;积木模型&quot;光滑映射回原形状。优点：<\/p>\n<ul><li>\n全局结构自动规整（每块都是标准六面体）；\n<\/li><li>\n奇异结构只出现在积木的拐角上，位置可控；\n<\/li><li>\n求解简单（映射是分段线性的、可用调和映射优化）。\n<\/ul>\n<p>缺点：<\/p>\n<ul><li>\n积木近似会丢失细节（细杆、薄片、弯曲大的部位）；\n<\/li><li>\n形状与积木差异大时映射扭曲严重；\n<\/li><li>\n拼装本身是一个组合优化问题。\n<\/ul>\n<p><strong>晶格与八叉树路线<\/strong>（难度：进阶）。直接撒规则格子或八叉树格子，边界处裁成贴合体。快，但<strong>边界单元质量差<\/strong>——有限元在边界处最需要好单元，这是它的结构性缺陷。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;六面体只是四边形加一维&quot;<\/strong>——实际上三维的奇异结构从点变成线，整数约束的组合复杂度完全不同。\n<\/li><li>\n<strong>别以为&quot;标架场平滑了就一定生成好网格&quot;<\/strong>——实际上还要求积分性（场可积、能抽出一致的格点），不可积的场会导致抽取失败或单元错位。\n<\/li><li>\n<strong>别以为&quot;多立方体是偷懒做法，质量一定差&quot;<\/strong>——实际上对建筑类、机械类块状模型它非常合适，代价只出现在细长/薄壁结构上。\n<\/li><li>\n<strong>别以为&quot;八叉树够用&quot;<\/strong>——实际上边界单元质量是结构性问题，不是调参能解决的。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>4.3.1<\/td><td>基于局部拓扑操作<\/td><td>从四边形网格挤出、局部修正<\/td><\/tr><tr><td>4.3.2<\/td><td>三维标架场<\/td><td>球面调和 9 维表示、奇异线<\/td><\/tr><tr><td>4.3.3<\/td><td>多立方体结构<\/td><td>积木近似 + 映射<\/td><\/tr><tr><td>4.3.4<\/td><td>闭形式多立方体<\/td><td>用闭 1-形式保证可积<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：方向场与周期跳跃、球面调和、体参数化\n<\/li><li>\n后续：六面体网格质量优化、有限元\n<\/li><li>\n对照：晶格/八叉树（简单但边界差）、多立方体（规整但近似粗）\n<\/ul>", "kind": "concept", "title": "标架场与六面体重网格化"}, "c11": {"html": "<h1>形状描述子与谱签名（HKS / WKS）<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 5、8 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>把形状（或形状的局部）压成一个向量/曲线，让&quot;像不像&quot;可计算；谱签名是用 Laplace 算子的特征值/特征向量构造的、与坐标无关的局部签名。<\/p>\n<h2>为什么重要<\/h2>\n<p>检索、对应、分类、配准的粗筛全都依赖它。HKS 的&quot;等距不变&quot;是几何处理里最漂亮的性质之一：它让人体的不同姿势仍能对应上同一部位。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[网格] --&gt; B[离散 Laplace 矩阵 L]\n    B --&gt; C[特征分解&lt;br/&gt;λi 与 φi]\n    C --&gt; D1[HKS&lt;br/&gt;Σ exp −λt φ²]\n    C --&gt; D2[WKS&lt;br/&gt;Σ gaussian λ φ²]\n    D1 --&gt; E[局部签名曲线]\n    D2 --&gt; E\n    E --&gt; F[匹配 / 检索 / 分割]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：同一个特征分解，换一种&quot;对特征值的加权方式&quot;就得到不同签名（热的核 vs 波的核）。<\/p>\n<h2>详解<\/h2>\n<p><strong>HKS 的定义与含义<\/strong>（难度：高难）：<\/p>\n<pre><code>HKS(x, t) = Σ_i exp(−λ_i t) φ_i(x)²<\/code><\/pre>\n<p>它等于&quot;在 x 放一滴单位热量，t 时刻在 x 处剩余的热量&quot;（热核的对角元）。两点性质：<\/p>\n<ul><li>\n<strong>等距不变<\/strong>：热扩散只依赖内在度量（沿曲面距离），弯曲纸面不改变它；\n<\/li><li>\n<strong>多尺度<\/strong>：t 小看局部（近似与曲率有关），t 大看全局（趋于常数）。\n<\/ul>\n<p><strong>WKS<\/strong>（难度：高难）。把 exp 换成对 log 特征值的 Gaussian 窗（g(λ)）= exp(−(log λ − log λ_c)²/(2σ²)），相当于&quot;在某个频段上做滤波&quot;。好处是对尺度差异更稳、且能量集中在指定频段。<\/p>\n<p><strong>球面的可算例子<\/strong>（难度：进阶）。单位球面：λ_l = l(l+1)，重数 2l+1，φ 均匀 → φ_i(x)² 平均为 1/(4π)。于是<\/p>\n<pre><code>HKS(t) = Σ_l (2l+1)/(4π) exp(−l(l+1)t)<\/code><\/pre>\n<p>t=1 时：l=0 项 0.0796、l=1 项 0.0323、l=2 项 0.001、更高阶可忽略，合计约 0.113。t=10 时只剩 0.0796（几乎为常数）。<strong>这说明&quot;单一 t 值没有信息，必须用一条曲线&quot;。<\/strong><\/p>\n<p><strong>其他描述子<\/strong>（难度：进阶）：<\/p>\n<ul><li>\n<strong>D2<\/strong>：随机采样点对的距离分布。对旋转不敏感，但丢空间信息；\n<\/li><li>\n<strong>球谐<\/strong>：把形状展开到球面频率基；要求先球参数化；\n<\/li><li>\n<strong>Spin Image<\/strong>：以法向为轴的圆柱坐标投影直方图，对法向误差敏感；\n<\/li><li>\n<strong>学习型<\/strong>：把上述人工特征输入小网络，学出更判别性的向量（第 5 章 EdgeNet、第 8 章 PointNet）。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;HKS 旋转不变就万能&quot;<\/strong>——实际上是等距不变，分不开镜像（左右手），也分不开&quot;凸起&quot;与&quot;凹陷&quot;。\n<\/li><li>\n<strong>别以为&quot;描述子维度越高越好&quot;<\/strong>——实际上高维特征在数据少时更容易过拟合、对噪声更敏感；粗筛阶段低维反而稳。\n<\/li><li>\n<strong>别以为&quot;谱签名计算很贵，不实用
